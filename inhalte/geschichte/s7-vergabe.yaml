belege: [v24:hb-1.3, v24:hb-1.4, v24:hb-1.6, v24:hb-3.1, v24:hb-5, v24:tlb-5, k3.2-t1]
lage: |
  März 2027, Mitwirkung bei der Vergabe. Die Angebote für den Holzbau liegen 0,9 Mio. € über dem Kostenansatz. Das ist kein Risiko mehr – es ist eingetreten.

  Und Holger Stein, der Kostenplaner der Projektsteuerung, fällt für Wochen aus. Früher hätte das bedeutet – die Excel-Dateien liegen auf seinem Rechner. Heute übernimmt eine Kollegin aus seinem Team: Datenstand, Register und Vorlagen liegen in der Software der GML.
lage-folgen: { kosten: 0.9 }
bericht:
  titel: Bericht der Projektsteuerung · März 2027
  zeilen:
    - Submission Holzbau am 2. März – günstigstes wertbares Angebot 0,9 Mio. € über dem Kostenansatz; geführt als Problem PRB-007.
    - Vertretung für Holger Stein übernimmt ab 8. März aus dem Bestand – keine Übergabelücke.
    - text: Maßnahme vorgezogene Vergabe wirksam – Liefertermin vertraglich gesichert; Risiko Lieferzeit herabgestuft.
      wenn: s3=A
    - text: Risiko Lieferzeit tritt ein – die Holzbauelemente kommen später; der Puffer ist aufgebraucht.
      wenn: s3=B
    - text: Brandschutz – Auflage umgesetzt, Behörde hat die geänderten Pläne bestätigt; Problem geschlossen.
      wenn: s6=A
    - text: Brandschutz – Gutachten liegt vor, Behörde hat die schlankere Lösung abgelehnt; Auflage wird umgesetzt.
      wenn: s6=K
    - Der Einsatz der Risikoreserve braucht Ihre Freigabe.
  reaktion: Bitte entscheiden Sie, ob die Reserve für den Holzbau freigegeben wird.
