      begruendung: 50.000 → 5; Gesamtschule rund acht Wochen später → 2; volle Funktion ab Einzug → 5; bestelltes, sparsamstes Gerät → 5
  saetze:
    # R76: ohne „gute Luft“ – A liegt auch vorn, wenn Luft „weniger wichtig“ ist, aber nie ohne Schulstart ≥ „wichtig“ (81 Stellungen gerechnet)
    A: "Das Ersatzgerät liegt vorn – mit diesen Gewichten zählt, dass alle Kinder pünktlich einziehen."
    B: Die Leihgeräte liegen vorn – aber nur, weil gute Luft im Unterricht hier kaum zählt. Passt das zu Ihrer Schule?
    C: "Der spätere Einzug liegt vorn: Wenn Geld oder Strombedarf so viel zählen wie der Schulstart, lohnt sich das Warten."
    gleichauf: Gleichauf – jetzt entscheidet das fachliche Urteil der Bürgermeisterin, nicht die Punktzahl.
  empfehlung: |
    **Empfehlung:** das Ersatzgerät. Es kostet am meisten, aber nur damit ziehen alle Kinder pünktlich in Räume mit guter Luft – das Ziel der Bürgermeisterin. Der Vorsprung ist klein: Wären Strombedarf und Betrieb „wichtig“, läge der spätere Einzug gleichauf.
  wer: |
    **Wer entscheidet:** die Bürgermeisterin – mehr als 100.000 Euro, und das Geld käme aus der Reserve. Der Lenkungskreis berät. Sie muss bis Ende Mai entscheiden – danach käme sogar das Ersatzgerät zu spät.

frage: Die Vorlage geht an die Bürgermeisterin. Was legen Sie ihr vor?

antworten:
  - wertung: falle
    text: Nur das Ersatzgerät, mit Preis und Liefertermin – je kürzer die Vorlage, desto schneller kann sie entscheiden.
    balken: { geld: -2, zeit: 1, vertrauen: -2 }
    bild: rednerpult
    folge: |
      Die Bürgermeisterin unterschreibt noch am selben Tag – es eilt ja. Die Haustechnikfirma bestellt zu dem Preis, den sie verlangt; verglichen hat ihn niemand. Dann fragt jemand im Stadtrat, ob es keinen günstigeren Weg gab, und die Bürgermeisterin hört zum ersten Mal von den Leihgeräten und vom späteren Einzug.

      „Ich habe entschieden, ohne zu wissen, dass ich eine Wahl hatte“, sagt sie. „Das darf nicht noch einmal passieren.“ Clara Faden legt den Vergleich nachträglich vor; am Ergebnis ändert sich nichts: Es bleibt beim Ersatzgerät.
  - wertung: gut
    text: Alle drei Wege, den Vergleich und die Empfehlung fürs Ersatzgerät – samt Hinweis, wann der spätere Einzug vorn läge.
    balken: { geld: -1, zeit: 1, vertrauen: 1 }
    bild: stempel
    folge: |
      Im Lenkungskreis beraten die Finanzabteilung und das Schulamt. Die Bürgermeisterin stellt nur eine Frage: „Wenn mir Strombedarf und Betrieb wichtiger würden – bliebe es beim Ersatzgerät?“ Clara Faden: „Schon bei ‚wichtig‘ läge der spätere Einzug gleichauf; dann zählt Ihr Urteil.“

      Die Bürgermeisterin entscheidet: Ersatzgerät, das Geld kommt aus der Reserve. Clara Faden hält den Beschluss fest, mit Datum und einer Auflage, also einer Bedingung: Das Gerät muss vor dem Schulstart eingebaut und eingestellt sein. Hanna Klingel atmet hörbar aus.
    folge-kurz: |
      Die Bürgermeisterin stellt nur eine Frage: „Wenn mir Strombedarf und Betrieb wichtiger würden – bliebe es beim Ersatzgerät?“ Clara Faden: „Schon bei ‚wichtig‘ läge der spätere Einzug gleichauf.“

      Die Bürgermeisterin entscheidet: Ersatzgerät, das Geld kommt aus der Reserve. Clara Faden hält den Beschluss fest, mit Datum und einer Auflage, also einer Bedingung: Das Gerät muss vor dem Schulstart eingebaut und eingestellt sein.
  - wertung: vertretbar
    text: Alle drei Wege mit Vergleich, dazu die Empfehlung der Projektsteuerin – und Ihre eigene für den späteren Einzug, weil er am wenigsten kostet.
    balken: { geld: -1, zeit: -1, vertrauen: 0 }
    bild: stoppuhr
    folge: |
      Die Bürgermeisterin liest beide Empfehlungen und dann den Vergleich. „Sie empfehlen das Günstigste. Aber mein Ziel war der Schulstart.“

      Sie vertagt um eine Woche, hört die Schule an und entscheidet dann: Ersatzgerät, aus der Reserve. Ihre Empfehlung war ehrlich begründet – sie passte nur nicht zu dem Ziel, das die Bürgermeisterin gesetzt hatte. Die Woche fehlt dem Einbau am Ende.

gut: |
  Soll der Bauherr entscheiden, bekommt er eine Vorlage mit mindestens zwei zulässigen Wegen, einem Punktevergleich mit vorher abgestimmten Gewichten und einer begründeten Empfehlung. Dazu gehört der Hinweis, bei welchen anderen Gewichten sich die Rangfolge umdreht. Entscheiden darf nur die zuständige Person – hier die Bürgermeisterin –, und ihr Beschluss wird getrennt festgehalten: Empfehlung und Punktzahl sind noch keine Entscheidung.

gut-kurz: |
  Soll der Bauherr entscheiden, bekommt er eine Vorlage mit mindestens zwei zulässigen Wegen, einem Punktevergleich und einer begründeten Empfehlung – samt Hinweis, bei welchen anderen Gewichten sich die Rangfolge umdreht. Entscheiden darf nur die zuständige Person; ihr Beschluss wird getrennt festgehalten: Empfehlung und Punktzahl sind noch keine Entscheidung.

dahinter: Der gewichtete Vergleich nimmt niemandem die Entscheidung ab; er zeigt, welcher Weg zu den festgelegten Zielen passt und wie stark das Ergebnis von den Gewichten abhängt.

regie:
  notiz: "Die Gewichte gemeinsam mit der Runde einstellen – die Leinwand ordnet die drei Wege sofort um; danach mit „Abgestimmte Gewichte“ zurück, bevor gewählt wird. Kern: Der Vergleich nimmt niemandem die Entscheidung ab; er zeigt, welcher Weg zu den gesetzten Zielen passt und wie sehr das Ergebnis an den Gewichten hängt."
  leitfragen:
    - Was ist Ihnen wichtiger – Schulstart oder Geld?
    - Ändert sich Ihre Wahl, wenn Sie die Gewichte anders setzen?
