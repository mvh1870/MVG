  posten:
    - { text: "Risiko „angekündigte Mehrkosten“, verbunden mit der Prüfung der Vergabestelle.", von: z1, nach: [z2], loesung: stimmt, erklaerung: "Zusammengehörige Einträge werden verbunden, damit man den Weg vom Hinweis bis zur Klärung sieht." }
    - { text: "Dieselben Mehrkosten stehen als Risiko mit Spanne und noch einmal in der Prognose, der Vorhersage der Gesamtkosten.", von: z1, nach: [z3], loesung: doppelt, erklaerung: "Was schon in der Prognose steht, wird kenntlich gemacht und nicht noch einmal dazugerechnet." }
    - { text: "Frühwarnung „Holz“, verbunden mit dem Risiko „Lieferzeit“ und dem früheren Holz.", von: z4, nach: [z5, z6], loesung: stimmt, erklaerung: "Beim Übergang verweist der Folgeeintrag auf den ersten; die Herkunft geht nicht verloren." }
    - { text: "Änderung „Mensa erweiterbar“: Kosten und Termin bewertet, erkannte Risiken der Änderung nicht verbunden.", von: z7, nach: [], loesung: nachfordern, erklaerung: "Risiken, die eine Änderung selbst mit sich bringt, werden für sich bewertet und mit ihr verbunden." }
    - { text: "Kapselung: als Problem geführt und mit derselben Summe noch einmal als Risiko.", von: z9, nach: [z10], loesung: doppelt, erklaerung: "Ein eingetretener Zustand ist ein Problem; seine Kosten stehen nicht zusätzlich als Risiko in der Rechnung." }

dahinter: "Zwei Einschätzungen sind kein Fehler, solange jede ihren Grund und ihr Datum trägt – die Mitte hat keines von beiden."

vertiefung:
  form: nachdenken
  titel: Warum nicht die Mitte?
  text:
    - "Zwei Gutachter sollen schätzen, was die Reparatur eines Daches kostet; beide haben die Fläche gemessen und sind sich über die Ziegel einig. Die eine sagt 40.000 Euro, der andere 80.000. Der Bauausschuss tagt am Donnerstag, wünscht sich eine einzige Zahl und rechnet mit 60.000 Euro, der Mitte. Niemand kann erklären, woher sie kommt."
    - "Warum hilft die Mitte hier nicht, und was wäre besser?"
  antwort:
    - "Die Mitte hat keinen Grund und kein Datum. Die erste Schätzung geht vielleicht davon aus, dass nur die Ziegel ersetzt werden; die zweite rechnet den morschen Dachstuhl ein. Das sind zwei verschiedene Fragen, keine zwei Ungenauigkeiten derselben."
    - "Besser: Beide Schätzungen werden mit ihrer Begründung nebeneinander festgehalten. Dazu kommt ein Datum für den Stand, auf dem der Ausschuss entscheidet. Die unsichere Hälfte steht als Risiko mit Spanne daneben. Dann sieht jeder, was feststeht und was nicht. Wenn sich später zeigt, dass der Dachstuhl gesund ist, fällt das Risiko weg, und es ist klar, warum."
    - "Zwei Zahlen sind unbequem, aber ehrlich. Eine Mitte ist bequem, doch niemand kann sie verteidigen, wenn der Rechnungsprüfer nachfragt."

regie:
  notiz: "Kern: Es gibt einen maßgeblichen Stand der Zahlen, jede Zahl mit Datum und Begründung; unterschiedliche Einschätzungen werden erklärt, nicht gemittelt, Unsicheres steht als Risiko mit Spanne daneben."
  leitfragen:
    - Welche Zahl würde Ihre Bürgermeisterin, Ihr Vorstand oder Ihre Geschäftsführung heute nennen – und woher käme sie?
    - Wie gehen Sie mit zwei Zahlen um, die nicht zusammenpassen?
