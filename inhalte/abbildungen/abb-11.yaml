id: abb-11
quelle: bilder/image11.jpeg
titel: Der Weg der Beratung von der Reifegradanalyse bis zum Regelbetrieb
alt: >-
  Die Abbildung zeigt den Weg der Beratung in fünf Schritten – Reifegradanalyse, Konzeption, Pilotierung und
  Kalibrierung, Befähigung und Übergabe, Regelbetrieb – und darunter die Sonderform MVG-Neuinitialisierung für laufende
  Projekte, die sich nicht mehr gut steuern lassen. Aus der Reifegradanalyse führt eine Linie zur unteren Reihe mit
  Neuinitialisierung, Bewertung und Stabilisierung; ein gestrichelter Doppelpfeil verbindet Stabilisierung und
  Regelbetrieb.
