<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- L-429: feste Systemschrift der Browserprüfung unter Linux (werkzeuge/oberflaeche.mjs setzt FONTCONFIG_FILE).
     Seit O-64 bettet die Seite keine Textschrift mehr ein; „system-ui“ und „sans-serif“ lagen in der Cloud bei Inter,
     auf dem GitHub-Rechner bei DejaVu Sans – gleiche Seite, verschiedene Umbrüche. Hier gilt überall DejaVu Sans,
     die breiteste der üblichen Systemschriften: was mit ihr passt, passt mit Segoe UI, San Francisco und Inter erst recht. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <selectfont><rejectfont><glob>*/Inter*</glob><pattern><patelt name="family"><string>Inter</string></patelt></pattern><pattern><patelt name="family"><string>Inter Display</string></patelt></pattern></rejectfont></selectfont>
  <alias binding="strong"><family>system-ui</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="strong"><family>sans-serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
</fontconfig>
