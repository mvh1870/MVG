id: abb-14
quelle: bilder/image14.jpeg
titel: Anwendungssituationen nach Bauherrentyp und Projektstand
alt: >-
  Vier Felder um einen Kreis, aus jedem führt ein Pfeil zum Kreis; dazwischen zwei Brückenmotive. Oben links
  „Öffentliche Bauherren“: Nachweisfestigkeit, Gremienlogik, Vergabeanbindung. Oben rechts „Private /
  Institutionelle“: Geschwindigkeit, Zielkonflikte, Entscheidungssicherheit. Unten links „Energie /
  Infrastruktur“: Priorisierung, Komponenten mit langer Lieferzeit, Freigabereife. Unten rechts „Driftende
  Projekte“ als Pfeilkette: Lagebild ordnen, Mandate klären, MVG-Neuinitialisierung. Im Kreis
  „Governance-Kern“: Entscheidungsvorlage, darunter Freigabelogik und Eskalationspfad.
