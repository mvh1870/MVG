id: abb-6
quelle: bilder/image6.png
titel: Sechs Verantwortungsfelder des Bauherrn
alt: >-
  Mittig steht der „MVG-Kern“ mit „ausübbar“, „prüfbar“, „gestaltbar“, „nachweisfähig“. Ringsum im Uhrzeigersinn ab oben
  links sechs Karten mit je vier Zeilen, etwa: „Ziel“ (Zielsystem, Abwägungsregeln, Freigabelogik), „Mandat“
  (Mandatsmodell, Schwellen, Eskalation), „Entscheidung“ (Entscheidungs-IDs, Entscheidungsreife, Entscheidungsfrage),
  „Risikoannahme“ (Verknüpfungen, Restrisiko, Risikominderung), „Freigabe“
  (Freigabemodell LPH 0–9, Datenstandsbezug), „Datenstand & Nachweis“ (Beschlusslage,
  Nachweiskette, Betriebshandbuch, teils verdeckt). Dazu Haftnotizen.
