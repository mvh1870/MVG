id: abb-3
quelle: bilder/image3.png
titel: Wie Druck von außen zu unklarer Verantwortung führt
alt: >-
  Die Abbildung zeigt, wie drei Belastungen – schwankende Märkte, Nachhaltigkeitsziele und die Abhängigkeit von wenigen
  Personen – ohne klare Regeln zu unklarer Verantwortung führen. Von oben nach unten: Drei Karten münden in das Band
  „Entscheidungsdruck“, darunter ein Feld zu fehlenden Regeln für Entscheidung, Freigabe, Dokumentation und Gremium.
  Gestrichelte Pfeile führen zu fünf Karten mit typischen Folgen, zum Beispiel „Rollen ohne Mandat“ und „Parallele
  Datenstände“; sie münden in ein Band zur unklaren Verantwortung.
