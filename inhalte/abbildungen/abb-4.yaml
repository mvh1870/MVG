id: abb-4
quelle: bilder/image4.png
titel: Delegierbare Arbeit, Mandatsschwelle und Bauherrenverantwortung
alt: >-
  Drei Spalten. Links unter dem Kopf „Delegierbare Arbeit“ sechs Kacheln: Analyse, Vorbereitung,
  Berichterstattung, Koordination, Dokumentation, Befähigung. In der Mitte eine schmale Spalte „Mandatsschwelle“,
  oben „Vorbereitung endet“, unten „Entscheidung beginnt“, dazwischen ein Schild mit Schloss; je ein Pfeil führt
  von links hinein und nach rechts hinaus, dahinter blasse Brücken- und Tormotive. Rechts unter dem Kopf
  „Bauherrenverantwortung“ sechs Kacheln: Zielpriorität, Mandat, Entscheidung, Freigabe, Datenstand, Nachweis.
angeglichen: []
abweichungen:
  - text: 'Die rechte Spalte zeigt sechs Kacheln – Zielpriorität, Mandat, Entscheidung, Freigabe, Datenstand, Nachweis – ohne Risikoannahme; der Text nennt als sechs Verantwortungsfelder Ziel, Mandat, wesentliche Entscheidung, Risikoannahme, Freigabe sowie Datenstand und Nachweis.'
    beleg: k3.1-p2
  - text: 'Der rechte Kopf heißt nur „Bauherrenverantwortung“; der Text stellt der delegierbaren Arbeit die nichtdelegierbare Bauherrenverantwortung gegenüber, seine Tabelle überschreibt diese Spalte mit „Nicht delegierbar“.'
    beleg: k3-p1 k3.2-t1
