# 1 · Wer darf was entscheiden? (Drehbuch Abschnitt 4, Kapitel 1)
# Mandat projektbezogen zweistufig (L-225): Sie bis 100.000 Euro ohne Reserve, darüber die Bürgermeisterin; der Lenkungskreis berät.
