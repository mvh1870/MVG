titel: MVG als Bauherren-Führungsmodell
alt: >-
  Die Abbildung zeigt die fünf Bausteine des Führungsmodells von links nach rechts: Zielsystem, Rollen und Mandate,
  Freigabelogik, Steuerung (im Bild mit Kennzahlen, Managementberichten, Datenstand und Nachverfolgung) sowie
  Betriebshandbuch mit aktiver Entscheidungsführung. Eine Leiste unten nennt: Mindeststandard, Auswirkung,
  Entscheidungsreife, Nachweis und Prüfbarkeit.
