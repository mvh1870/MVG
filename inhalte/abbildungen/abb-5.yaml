id: abb-5
quelle: bilder/image5.jpeg
titel: Die Verantwortungspyramide – Arbeitsebene, Mandatsebene und Letztverantwortung
alt: >-
  Die Pyramide zeigt drei Ebenen: unten die Arbeit, die andere vorbereiten, in der Mitte die Befugnisse, die der Bauherr
  nur begrenzt übertragen kann, oben die Verantwortung, die immer beim Bauherrn bleibt (Ziel, Grundsatzentscheidung,
  Freigabe, Risikoannahme, Nachweis, Beschlusslage). Der Sockel „MVG“ trägt alle Ebenen. Seitlich stehen Tafeln mit
  „Dritte bereiten vor“.
