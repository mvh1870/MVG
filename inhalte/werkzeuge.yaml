      gruende: { betrag: mehr als 100.000 Euro, reserve: Geld aus der Reserve, risiko: die Annahme eines großen Risikos, freigabe: die Freigabe am Ende einer Leistungsphase, ziele: die Ziele und ihre Rangfolge }
      beraet: { buergermeisterin: "Lassen Sie richtigstellen: Der Lenkungskreis berät nur; im Beispielprojekt entscheidet darüber die Bürgermeisterin.", sie: "Lassen Sie richtigstellen: Der Lenkungskreis berät nur; im Beispielprojekt entscheiden darüber Sie.", unbestimmt: "Lassen Sie richtigstellen: Der Lenkungskreis berät nur; wer entscheidet, hängt von Betrag und Herkunft des Geldes ab." }
