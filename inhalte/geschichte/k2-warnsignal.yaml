  # Reihenfolge der Sätze bewusst gemischt (R73): nicht in der Reihenfolge der Knöpfe, damit sich die Lösung nicht durch die Stellung verrät
  posten:
    - { text: "Eine Pumpe wird aufgestellt und die Baugrube abgesperrt, bis sie wieder trocken ist.", bild: absperrband, loesung: massnahme, erklaerung: "Eine gezielte Handlung, die einen Zustand verbessert. Ob sie wirkt, wird nachgeprüft." }
    - { text: "Die Schule wünscht sich eine größere Mensa.", bild: mensateller, loesung: aenderung, erklaerung: "Etwas, das bisher gilt, soll bewusst anders werden. Das braucht eine Entscheidung." }
    - { text: "Ein Hersteller erwähnt nebenbei am Telefon, Holz werde vielleicht knapp. Genaues weiß er nicht.", bild: telefon, loesung: fruehwarnung, erklaerung: "Ein Hinweis, bei dem noch nicht geklärt ist, ob etwas dran ist. Erst einmal wird das geprüft." }
    - { text: "Der Architekt schätzt bis Freitag die Kosten für den Fahrradkeller.", bild: kostenzettel, loesung: aufgabe, erklaerung: "Eine geplante Arbeit mit Ergebnis, Namen und Termin." }
    - { text: "Nach dem Starkregen steht die Baugrube unter Wasser.", bild: warnschild, loesung: problem, erklaerung: "Das ist schon passiert. Jetzt geht es um die Folgen und die Lösung, nicht mehr um die Wahrscheinlichkeit." }
    - { text: "Drei Hersteller bestätigen schriftlich ein halbes Jahr Lieferzeit für die Holzelemente. Ob der Holzbau dadurch später beginnt, ist noch offen.", bild: lieferwagen, loesung: risiko, erklaerung: "Geklärt: Etwas Nachteiliges kann eintreten, ist aber noch nicht passiert. Das wird bewertet." }

dahinter: Nicht jeder Hinweis wird zum Risiko – aber jeder wird geklärt, bis feststeht, ob daraus ein Risiko, ein Problem oder eine Aufgabe wird oder ob er begründet geschlossen werden kann.

regie:
  notiz: "Kern: Ein unklarer Hinweis ist eine Frühwarnung – Herkunft, Prüffrage, Name und Termin; bewertet wird erst, wenn die Antwort da ist. Die Mini-Aufgabe gemeinsam lösen: erst die Runde raten lassen, dann je Satz die Zuordnung setzen oder am Ende auflösen."
  leitfragen:
    - Wo landen bei Ihnen Hinweise, die „nur am Rande“ fallen?
    - Wer fragt bei Ihnen nach – und bis wann?
