# 5 · Zwei Zahlen, zwei Wahrheiten (Drehbuch Abschnitt 4, Kapitel 5)
# Die angekündigten Mehrkosten sind ein Risiko, keine Kosten in der Prognose; die Vergabestelle prüft die Forderung.
nr: 5
titel: Zwei Zahlen, zwei Wahrheiten
zeit: Oktober 2026
campus: { stufe: 3, jahreszeit: herbst, licht: abend }
bruecke: "Im Herbst nennt die Bürgermeisterin dem Stadtrat eine begründete Kostenzahl; die angekündigten Mehrkosten der Haustechnik führt sie getrennt als Risiko auf. Später erweist sich die Forderung als unberechtigt."
thema: verantwortung
werkzeuge: [{ id: risiko-grenzen, beispiel: ris-014 }, { id: monatsbericht, beispiel: oktober }]
belege: [v24:hb-2, v24:hb-3, v24:hb-5, v24:tlb-3, v24:hb-1.5, k4.6-p1, k4.6-p2, k2.4-p2]
bild-szene: zahlenzettel
bild-frage: rednerpult

einstieg: |
  Oktober 2026. Der Kran hebt die ersten Holzelemente an die Gesamtschule, die Linden leuchten gelb. Nächste Woche will die Bürgermeisterin dem Stadtrat sagen, wo das Projekt beim Geld steht. Auf ihrem Schreibtisch liegen zwei Papiere, beide mit einer Gesamtsumme unten rechts – und die Summen sind nicht dieselben.

szene:
  - { figur: grundstein, text: "Die Finanzabteilung rechnet damit, dass wir am Ende eine Million über dem Budget landen. Der Architekt rechnet mit zwei Millionen. Was stimmt denn nun?" }
  - { figur: schwung, text: "Meine Zahl. Die Haustechnikfirma – zuständig für Heizung, Lüftung und Elektro – hat Mehrkosten angekündigt, gut eine Million. Die habe ich schon eingerechnet. Ich rechne lieber zu viel als zu wenig." }
  - { figur: grundstein, text: "Und warum steht davon nichts in der Berechnung der Finanzabteilung?" }
  - { figur: faden, text: "Erstens: Ich habe beide Berechnungen angefordert und Zeile für Zeile verglichen. Zweitens: Der Unterschied ist genau diese Ankündigung. Und drittens: Angekündigt heißt nicht berechtigt – die Vergabestelle, die bei der Stadt die Aufträge und Verträge betreut, prüft gerade, ob die Firma das überhaupt extra berechnen darf." }
  - { figur: grundstein, text: "Ich brauche eine Zahl, die ich im Stadtrat vertreten kann. Nicht zwei." }
  - { figur: faden, text: "Beide Zahlen würde die Reserve noch abdecken. Aber welche Sie der Bürgermeisterin geben, sollten Sie begründen können – nicht raten." }

frage: Beide Zahlen haben einen Grund. Nur eine kann in den Stadtrat. Welche Zahl geben Sie der Bürgermeisterin?

antworten:
  - wertung: vertretbar
    text: Die höhere Zahl des Architekten – lieber dem Stadtrat eine zu hohe Zahl nennen als später nachlegen.
    balken: { geld: -1, zeit: -1, vertrauen: 0 }
    bild: kostenzettel
    folge: |
      Der Stadtrat erschrickt über zwei Millionen und verlangt eine Liste, wo man sparen könnte; die Planung wartet vier Wochen auf die Antwort.

      Dann ist die Prüfung fertig: Die Leistungen gehören schon zum bestehenden Vertrag, die Zahl sinkt wieder. Aber die Firma hat erfahren, dass die Stadt ihre Forderung schon in die Kosten eingerechnet hatte, als wäre sie berechtigt – und verhandelt jetzt bei jeder Kleinigkeit härter.
  - wertung: falle
    text: "Die Mitte aus beiden, anderthalb Millionen – damit nehmen Sie Finanzabteilung und Architekt gleichermaßen ernst."
    balken: { geld: -1, zeit: 0, vertrauen: -2 }
    bild: lupe
    folge: |
      Anderthalb Millionen stehen in keiner Berechnung. Als ein Stadtrat fragt, woher die Zahl kommt, bleibt nur die Antwort: aus der Mitte. Clara Faden legt danach beide Berechnungen nebeneinander und zeigt den Unterschied. Die Prüfung ergibt: Die Leistungen gehören schon zum bestehenden Vertrag. Aber die Firma verhandelt jetzt härter, denn die Stadt hatte ihre Forderung zur Hälfte als berechtigt eingerechnet.
  - wertung: gut
    text: "Eine Million über dem Budget, mit Datum und Begründung – die angekündigten Mehrkosten führen Sie getrennt als Risiko auf."
    balken: { geld: 1, zeit: 0, vertrauen: 2 }
    bild: waage
    folge: |
      Die Bürgermeisterin nennt im Stadtrat eine Zahl und einen Satz dazu: was in der Zahl enthalten ist, was nicht und was gerade geprüft wird. Zum ersten Mal fragt niemand nach einer zweiten Zahl.

      Vier Wochen später ist die Prüfung fertig: Die Leistungen gehören schon zum Vertrag der Haustechnikfirma, extra berechnen darf sie nichts. Clara Faden schließt das Risiko – mit Begründung –, und das Geld, das in der Reserve dafür zurückgehalten war, ist wieder frei. Die Bürgermeisterin sagt nach der Sitzung nur: „So möchte ich das jedes Mal.“

gut: |
  Es gibt eine verbindliche Zahlengrundlage, auf die sich alle beziehen, und jede Zahl darin hat ein Datum und eine Begründung. Unterschiedliche Einschätzungen werden nebeneinander erklärt, nicht zu einem Mittelwert verrechnet. Was noch unsicher ist, steht als Risiko daneben, mit der Spanne, in der es liegen kann – und fließt nicht zusätzlich in die Hauptzahl ein, damit nichts doppelt zählt.

dahinter: Eine Entscheidung ist nur so gut wie die Zahlen, auf denen sie steht – deshalb sorgt der Bauherr dafür, dass es eine verlässliche Zahlengrundlage gibt, auch wenn er sie nicht selbst erstellt.

regie:
  notiz: "Kern: Es gibt einen maßgeblichen Stand der Zahlen, jede Zahl mit Datum und Begründung; unterschiedliche Einschätzungen werden erklärt, nicht gemittelt, Unsicheres steht als Risiko mit Spanne daneben."
  leitfragen:
    - Welche Zahl würde Ihre Bürgermeisterin, Ihr Vorstand oder Ihre Geschäftsführung heute nennen – und woher käme sie?
    - Wie gehen Sie mit zwei Zahlen um, die nicht zusammenpassen?
