<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Hostseite (Test der Einbettung)</title>
<style>body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#ffffff}main{max-width:1040px;margin:0 auto;padding:24px}</style></head>
<body>
<!-- Testseite für das Szenario „einbettung“ (P10.6, P12): bettet dist/mvg.html mit dem Schnipsel aus
     docs/ANLEITUNGEN.md ein und sammelt die Nachrichten. -->
<main>
<h1>Hostseite</h1>
<p>Text der Hostseite vor dem Rahmen.</p>
<!-- MVG interaktiv – Einbau (docs/ANLEITUNGEN.md, Abschnitt 3) -->
<iframe id="mvg" title="MVG interaktiv" src="../../dist/mvg.html?einbettung-hintergrund=ffffff#start"
        style="display:block;width:100%;height:720px;border:0;transition:height .35s ease"></iframe>
<script>
(function () {
  var rahmen = document.getElementById('mvg');
  var ruhig = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (ruhig) rahmen.style.transition = 'none';
  var fest = function () { return Math.round(Math.max(640, Math.min(900, window.innerHeight * 0.9))); };
  var ort = '';
  // Fensterhöhe melden (begrenzt vergrößerte Abbildungen); ?ohne-fenster prüft den Fall ohne Meldung
  var ohneFenster = /[?&]ohne-fenster\b/.test(location.search);
  var melde = function () { if (!ohneFenster) rahmen.contentWindow.postMessage({ mvg: 'einbettung', art: 'fenster', hoehe: window.innerHeight }, '*'); };
  window.addEventListener('resize', melde);
  window.addEventListener('message', function (e) {
    if (e.source !== rahmen.contentWindow) return;
    var d = e.data;
    if (!d || d.mvg !== 'einbettung') return;
    if (d.art === 'bereit') melde();
    if (d.art === 'hoehe') rahmen.style.height = (d.px === null ? fest() : Math.max(320, d.px)) + 'px';
    if (d.art === 'ort') {
      // neue Seite (Fläche oder Kapitel): an den Anfang des Rahmens, falls er aus dem Bild ist
      var neu = String(d.hash).split('/').slice(0, 2).join('/');
      var r = rahmen.getBoundingClientRect();
      // weit weg: ohne Animation (sonst kurz leere Fläche, während der Rahmen schrumpft); Story: ganz ins Bild
      var weit = r.top < -window.innerHeight;
      if (ort !== '' && neu !== ort && (r.top < 0 || (d.flaeche === 'story' && r.bottom > window.innerHeight))) rahmen.scrollIntoView({ behavior: (ruhig || weit) ? 'auto' : 'smooth', block: 'start' });
      ort = neu;
    }
    // Sprungziel im Rahmen (z. B. ein Absatz): die Hostseite rollt dorthin
    if (d.art === 'ziel') {
      // die Höhe sofort (ohne Übergang) setzen, sonst reicht die Seite noch nicht bis zum Ziel
      rahmen.style.transition = 'none';
      void rahmen.offsetHeight;
      window.scrollTo({ top: rahmen.getBoundingClientRect().top + window.scrollY + d.y - 16, behavior: ruhig ? 'auto' : 'smooth' });
      if (!ruhig) window.requestAnimationFrame(function () { rahmen.style.transition = 'height .35s ease'; });
    }
  });
})();
</script>
<p>Text der Hostseite nach dem Rahmen.</p>
</main>
<script>
  window.nachrichten = [];
  window.addEventListener('message', (e) => { if (e.source === document.getElementById('mvg').contentWindow) window.nachrichten.push(e.data); });
  window.schicke = (n) => document.getElementById('mvg').contentWindow.postMessage(n, '*');
</script>
</body>
</html>
