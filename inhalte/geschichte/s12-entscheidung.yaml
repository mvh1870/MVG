einstieg: |
  Mai 2027. Gesamtschule und Sporthalle sind außen fertig, daneben wächst die Grundschule. Morgens fällt das Licht schräg über den künftigen Schulhof. Bis zum Schulstart sind es noch fünfzehn Monate, und zum ersten Mal fühlt sich das gar nicht mehr so lang an. Dann kommt eine Nachricht, die niemand hören will.

einstieg-kurz: |
  Mai 2027, noch fünfzehn Monate bis zum Schulstart.

szene:
  - { figur: schwung, text: "Ich sag's lieber gleich: Der Hersteller der Lüftungsanlage für die Gesamtschule liefert vier Monate später als geplant." }
  - { figur: lot, kurzfassung: false, text: "Vier Monate. Dann bauen wir die Anlage ein, wenn die Kinder schon da sein sollen." }
  - { figur: faden, text: "Ich habe drei Wege ausgearbeitet, alle drei zulässig, also fachlich möglich: ein Ersatzgerät eines anderen Herstellers; Leihgeräte in den Klassenräumen, bis die bestellte Anlage kommt; oder die Gesamtschule zieht erst nach den Herbstferien ein – einen Teil der vier Monate fängt der Zeitpuffer auf." }
  - { figur: klingel, kurzfassung: false, text: "Leihgeräte in jedem Klassenraum? Die brummen. Und nach den Herbstferien … das erkläre ich den Eltern nicht gern." }
  - { figur: grundstein, text: "Zeigen Sie mir alle drei Wege und was Sie empfehlen. Die Entscheidung treffe ich." }

vergleich:
  einleitung: |
    Die Projektsteuerin vergleicht die drei Wege nach vier Gesichtspunkten und vergibt dafür Punkte. Wie wichtig jeder Gesichtspunkt ist, hat sie vorher mit Ihnen abgestimmt, nach dem Ziel der Bürgermeisterin: zuerst der Schulstart, dann das Geld. Mehr Punkte heißt: Der Weg passt besser – beim Geld also: Er ist günstiger.
  # Gewicht: 5 sehr wichtig · 3 wichtig · 1 weniger wichtig (abgestimmte Ausgangsstellung)
  kriterien:
    - { id: geld, titel: Geld, im-satz: das Geld, gewicht: 3 }
    - { id: schulstart, titel: Schulstart, im-satz: der Schulstart, gewicht: 5 }
    - { id: luft, titel: Gute Luft im Unterricht, im-satz: gute Luft im Unterricht, gewicht: 3 }
