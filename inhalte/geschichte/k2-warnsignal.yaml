# 2 · Ein erstes Warnsignal (Drehbuch Abschnitt 4, Kapitel 2)
# Mini-Aufgabe: v24:hb-1 (Tabelle der Sachverhalte), v24:hb-1.1 bis v24:hb-1.6
nr: 2
titel: Ein erstes Warnsignal
zeit: März 2026
campus: { stufe: 0, jahreszeit: fruehling, licht: tag }
bruecke: "Im März erwähnt der Architekt beiläufig, Holz könnte knapp werden, und die Projektsteuerin hält es als Frühwarnung fest: was zu prüfen ist (die Prüffrage), wer nachfragt, bis wann."
thema: arbeitsweise
werkzeuge: [{ id: wegweiser, beispiel: messe }]
belege: [v24:hb-1, v24:hb-1.1, v24:hb-1.2, v24:hb-1.3, v24:hb-1.4, v24:hb-1.5, v24:hb-1.6, v24:hb-2, v24:hb-4, v24:tlb-2, v24:tlb-3]
bild-szene: holzstapel
bild-frage: notizzettel

einstieg: |
  März 2026. Der Schnee ist weg, der Bauzaun steht, und an der Baustraße blühen die ersten Krokusse. Im Büro des Architekten wird jetzt die Ausführung geplant – Wand für Wand, Holzbauteil für Holzbauteil.

  Clara Faden geht jede Woche alle offenen Vorgänge durch: Aufgaben, Termine, Fragen ohne Antwort. Heute sitzt sie mit dem Architekten und dem Bauleiter im Container, um die nächsten Wochen abzustimmen.

szene:
  - { figur: schwung, text: "Übrigens, nur am Rande: Ein Holzbauer hat erzählt, dass die Lieferzeiten für Holzelemente gerade länger werden." }
  - { figur: faden, text: "Wie viel länger? Und bei welchen Herstellern?" }
  - { figur: schwung, text: "Weiß ich nicht genau. Das war nur ein Gespräch auf einer Messe. Das pendelt sich ein, glauben Sie mir." }
  - { figur: lot, text: "Holz kommt, wenn es kommt. Ich hab noch keinen Bau erlebt, wo's nicht irgendwann kam." }
  - { figur: lot, text: "Und überhaupt: Ich bau, ich schreib nicht. Listen sind Ihr Job." }
  # R76: die letzte Zeile nennt das Problem, nicht die Lösung – sonst verriete sie die gute Antwort; „Frühwarnung“ erklärt die Folge
  - { figur: faden, text: "Kann sein. Aber wenn das Holz diesmal nicht kommt, sollten wir es früh wissen." }

frage: Noch ist nichts passiert, und niemand weiß, ob überhaupt etwas passieren wird. Alle schauen Sie an. Was sagen Sie?

antworten:
  - wertung: gut
    text: "Halten wir es als Frühwarnung fest: was zu prüfen ist und wer bis wann nachfragt."
    balken: { geld: 0, zeit: 1, vertrauen: 1 }
    bild: kalender
    folge: |
      „So einen Hinweis halte ich als Frühwarnung fest“, sagt Clara Faden und schreibt drei Zeilen: Hinweis des Architekten aus einem Gespräch auf einer Messe. Prüffrage: Wie lang sind die Lieferzeiten bei den Herstellern, die für uns infrage kommen? Konrad Schwung fragt bis Ende des Monats nach.

      Mehr braucht es noch nicht – in zwei Wochen gibt es eine Antwort. Theo Lot zuckt mit den Schultern: „Papierkram.“ Clara Faden lächelt nur.
  - wertung: falle
    text: Das hat Zeit bis zum Monatstermin. Bis dahin weiß der Architekt sicher Genaueres.
    balken: { geld: 0, zeit: -1, vertrauen: -1 }
    bild: stoppuhr
    folge: |
      Clara Faden hält den Hinweis trotzdem vollständig fest: Prüffrage, der Architekt fragt bis Ende des Monats nach. Aber Konrad Schwung hat Ihren Satz gehört – es hat ja Zeit. Der Monat vergeht ohne Nachfrage; bei ihrer Wochendurchsicht meldet Clara Faden die Prüffrage als überfällig, und erst drei Wochen später als nötig fragt er bei den Herstellern nach.
  - wertung: vertretbar
    text: Tragen wir es gleich als Risiko ein – lieber zu früh als zu spät.
    balken: { geld: 0, zeit: 1, vertrauen: 0 }
    bild: lupe
    folge: |
      Clara Faden trägt ein Risiko ein – aber ohne Zahl: „Eine Zahl ohne Grundlage schreibe ich nicht hin.“ Daneben steht: Bewertung vorläufig, Antwort der Hersteller abwarten.

      Weil der Eintrag schon als Risiko im Bericht steht, fragt die Kämmerei – die Finanzabteilung der Stadt – nach, bevor jemand weiß, ob da überhaupt etwas ist. Immerhin fragt der Architekt bis Ende des Monats bei den Herstellern nach.

gut: |
  Ein unklarer Hinweis wird gleich als Frühwarnung festgehalten, spätestens bei der nächsten Wochendurchsicht – mit seiner Herkunft, einer klaren Prüffrage, einem Namen und einem Termin. Bewertet wird erst, wenn die Antwort da ist; bis dahin bleibt er offen und wird jede Woche angeschaut.

