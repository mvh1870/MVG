id: s7
nr: 7
titel: Vergabe Holzbau und die Reserve
kurztitel: Vergabe
datum: März 2027
monat: 15
lph: 7
kurzfassung: false
# Rechnung (inhalte/fall.md, „Kosten und Reserve“): Mehrbetrag 0,9 Mio. € gegen den Kostenansatz Holzbau; 0,6 davon stehen
# seit s5 in der Prognose (kenntlich in RIS-005, nicht doppelt gezählt, v24:hb-2) – die Lage bringt nur die neuen 0,3.
# Freigabe der Reserve nicht delegierbar (k3.2-t1). Option C spart in noch nicht vergebenen Leistungen.
belege: [v24:hb-1.3, v24:hb-1.4, v24:hb-1.6, v24:hb-2, v24:hb-3.1, v24:hb-5, v24:tlb-5, k3.2-t1]
lage: |
  März 2027, Mitwirkung bei der Vergabe. Für den Holzbau liegt das günstigste wertbare Angebot 0,9 Mio. € über dem ursprünglichen Kostenansatz. 0,6 Mio. € davon stehen seit Mai 2026 als Marktpreise in der Prognose, neu sind 0,3 Mio. €. Das Preisrisiko ist eingetreten.

  Und Holger Stein, der Kostenplaner der Projektsteuerung, fällt für Wochen aus. In vielen Projekten hieße das: Die Tabellen liegen auf seinem Rechner. Hier übernimmt eine Kollegin aus seinem Team – Datenstand, Register und Vorlagen liegen in der Software der GML.
lage-folgen: { kosten: 0.3 }
bericht:
  titel: Monatsbericht · März 2027
  zeilen:
    - Submission Holzbau am 2. März – günstigstes wertbares Angebot 0,9 Mio. € über dem Kostenansatz, davon 0,6 Mio. € schon in der Prognose; geführt als Problem PRB-007.
    - text: Holzbauelemente seit Juli 2026 bestellt (MAS-007); vergeben werden jetzt Montage und Ausbau. Der Mehrbetrag gilt für beide Vergaben zusammen.
      wenn: s3=A
    - text: RIS-009 eingetreten – weitergeführt als Problem PRB-008. Lieferzeit im Angebot 21 Wochen, Montagebeginn rund 35 Tage später; im Terminpuffer seit März 2026 berücksichtigt.
      wenn: s3=B
    - text: Holzbau für Gesamt- und Grundschule; mit der Sporthalle in Stahlbeton passt die Lieferzeit zum Montagebeginn – RIS-009 geschlossen.
      wenn: s3=C
    - RIS-014 geschlossen – die GML hat geprüft, die angekündigten Mehrleistungen gehören zum Planungsvertrag; kein Nachtrag.
    - Vertretung für Holger Stein ab 8. März aus dem Bestand – keine Übergabelücke.
    - text: Brandschutz – die Behörde hat die geänderten Pläne bestätigt; PRB-002 geschlossen.
      wenn: s6=A
    - text: Brandschutz – die Behörde hat die Lösung mit Gutachten abgelehnt; die Auflage ist umgesetzt wie vorläufig geplant (MAS-011), die 0,4 Mio. € standen schon in der Prognose; PRB-002 geschlossen.
      wenn: s6=K
    - text: Risikoreserve – seit Mai 2026 für die bekannten Mehrkosten vorgesehen; freigegeben ist noch nichts.
      wenn: s5=B
    - text: Einsparpaket aus dem Mai 2026 umgesetzt – 1,5 Mio. € weniger für Ausstattung und Außenanlagen; die Reserve ist unberührt.
      wenn: s5=A
    - text: Neufestlegung der Projektbasis – der Stadtrat hat sie bis zum Abschluss der Hauptvergaben zurückgestellt; es gilt die bisherige Basis, die Reserve ist unberührt.
      wenn: s5=C
    - Der Einsatz der Risikoreserve braucht die Freigabe des Bauherrn.
  reaktion: Bitte entscheiden Sie, ob die Reserve für den Holzbau freigegeben wird.
vorgaenge:
  - art: problem
    kennung: PRB-007
    titel: Angebote Holzbau über Kostenansatz
    text: Eingetreten – günstigstes wertbares Angebot 0,9 Mio. € über dem Ansatz, davon 0,6 Mio. € seit Mai 2026 in der Prognose. Bindefrist der Angebote bis 31. März.
    verantwortlich: Projektsteuerung; Prüfung der Angebote durch die Generalplanung
    termin: 31. März
    stand: Vorlage liegt vor
  - art: risiko
    kennung: RIS-005
    titel: Baupreissteigerung Holzbau
    text: Eingetreten und als Problem PRB-007 weitergeführt; das Risiko ist geschlossen, die Herkunft bleibt verknüpft.
    verantwortlich: Projektsteuerung
    termin: 2. März
    stand: geschlossen → PRB-007
  - art: problem
    kennung: PRB-008
    titel: Holzbauelemente kommen später
    text: Eingetreten – Lieferzeit 21 Wochen. Folge – Montagebeginn rund 35 Tage später; Herkunft RIS-009.
    verantwortlich: Projektsteuerung; Fachbeitrag Generalplanung
    termin: 31. März
    stand: in Bearbeitung
    wenn: s3=B
  - art: risiko
    kennung: RIS-014
    titel: Nachtrag der Haustechnikplanung
    text: Geschlossen – die Eintrittsmöglichkeit ist entfallen; die Mehrleistungen gehören laut Prüfung der GML zum Planungsvertrag.
    verantwortlich: Projektsteuerung mit Controlling
    termin: 19. Februar
    stand: geschlossen
vorlage:
  art: optionen
  frage: Wird die Risikoreserve für den Holzbau freigegeben?
  grund: |
    Den Einsatz der Risikoreserve gibt nur der Bauherr frei – das ist nicht delegierbar. Die Projektsteuerung bereitet die Freigabe vor; die Prüfung der Angebote liefert die Generalplanung. Nachtragsverhandlungen und rechtliche Prüfungen gehören nicht zum Auftrag der Projektsteuerung.
  stelle: Bauherr – Dr. Miriam Olbers
  termin: 24. März 2027 (vor Ablauf der Bindefrist)
  verzug: Läuft die Bindefrist ab, müsste neu ausgeschrieben werden.
  muss: Alle Optionen sind vergaberechtlich zulässig.
  optionen:
    - id: A
      titel: Reserve freigeben und beauftragen
      text: 0,9 Mio. € aus der Risikoreserve; der Auftrag geht an das günstigste wertbare Angebot.
      punkte:
        kosten: [3, "0,9 Mio. € aus der Reserve"]
        termin: [5, "kein Verzug"]
        qualitaet: [4, "wie geplant"]
        klima: [4, "Holzbau wie geplant"]
      folgen: {}
      konsequenz: Der Auftrag geht raus. Die Projektsteuerung dokumentiert die Freigabe mit Betrag und Bedingungen und führt im Datenstand, wie viel Reserve noch frei ist.
    - id: B
      titel: Neu ausschreiben
      text: Die Ausschreibung wird aufgehoben und mit geänderten Losen neu durchgeführt.
      punkte:
        kosten: [4, "rund −0,3 Mio. € erwartet, unsicher"]
        termin: [1, "rund 42 Tage Verzug"]
        qualitaet: [4, "wie geplant"]
        klima: [4, "Holzbau wie geplant"]
      folgen: { kosten: -0.3, puffer: -42, offen: 1 }
      konsequenz: Die Projektsteuerung bereitet die neue Ausschreibung mit der Generalplanung vor und führt das Terminrisiko neu im Register.
    - id: C
      titel: Beauftragen und an anderer Stelle sparen
      text: Der Auftrag geht an das günstigste wertbare Angebot. Bodenbeläge und Einbaumöbel, noch nicht vergeben, werden einfacher ausgeführt – rund 0,5 Mio. €; aus der Reserve kommen nur 0,4 Mio. €.
      punkte:
        kosten: [4, "−0,5 Mio. € im Ausbau"]
        termin: [4, "rund 7 Tage Umplanung"]
        qualitaet: [3, "einfachere Ausstattung"]
        klima: [4, "Holzbau wie geplant"]
      folgen: { kosten: -0.5, puffer: -7 }
      konsequenz: Der Auftrag geht raus. Die Projektsteuerung legt die Änderung im Ausbau an, verfolgt die Umplanung und dokumentiert die Freigabe von 0,4 Mio. € aus der Reserve.
  empfehlung:
    option: A
    text: Die Projektsteuerung empfiehlt, die Reserve freizugeben – dafür ist sie da. Nachteil – Spielraum bleibt danach nur bis 61,3 Mio. € (Basis plus Reserve), und bis zur Fertigstellung ist noch viel offen. C liegt dicht dahinter; mit „Kosten vor Termin“ trennt beide ein Punkt.
folge: |
  Eine Freigabe zum Einsatz der Reserve ist kein Auftrag und keine Bestellung. Die Beauftragung läuft über den Vergabeweg; die Projektsteuerung verfolgt ihn und dokumentiert beides getrennt.
so-laeuft-es-oft: |
  Der Kostenplaner fällt aus, und mit ihm das Wissen: Welcher Stand ist der richtige? Die Reserve wird nebenbei verbraucht, ohne dass der Bauherr je ausdrücklich zugestimmt hat.
einwand:
  frage: „Die Reserve ist doch dafür da – warum muss ich das freigeben?“
  antwort: Genau deshalb. Die Reserve ist Geld des Bauherrn für Unvorhergesehenes. Wer sie ohne Freigabe verbraucht, nimmt Ihnen die Entscheidung, wofür sie da ist.
theorie: verantwortung
regie:
  notiz: Zwei Themen – Ausfall Holger Stein (kein Problem, weil alles in der Software liegt) und die nicht delegierbare Reserve. Auf dem empfohlenen Weg steht die Prognose nach der Lage bei 61,1 Mio. € – 0,2 Mio. € unter Basis plus Reserve.
  leitfragen:
    - Was passiert in Ihrem Projekt, wenn der Kostenplaner morgen ausfällt?
