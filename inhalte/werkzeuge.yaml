  # Regie-Material (nur im Regie-Teil, nie auf der Leinwand; E-9, Konzept A.9)
  regie:
    notiz: |
      Erst das Beispiel „Lüftungsanlage – nur das Ersatzgerät“ zeigen und raten lassen, was fehlt; dann zu „Lüftungsanlage – alle drei Wege“ wechseln. Die Pfeiltasten gehen erst durch die fünf Prüfschritte, danach zum Ergebnis und erst dann zum nächsten Werkzeug.
    leitfragen:
      - Welche dieser Fragen beantworten Ihre Vorlagen heute?
      - Wer entscheidet bei Ihnen, ob eine Vorlage vollständig ist?

wegweiser:
  titel: Vorgangs-Wegweiser
  kurz: Sie beschreiben eine Situation; mit wenigen Fragen finden Sie heraus, welche Art Vorgang daraus wird.
  vorspann:
    wozu: "Sie haben eine Situation auf dem Tisch und wissen nicht, was für ein Vorgang daraus wird? Der Wegweiser fragt nach und nennt am Ende die passende Art von Vorgang."
    eingabe: "Wählen Sie ein Beispiel oder beschreiben Sie Ihre eigene Situation in eigenen Worten. Beantworten Sie dann die Fragen mit Ja oder Nein (bei zwei Fragen auch mit „Weiß ich nicht“). Ihr eigener Text wird nicht ausgewertet; er erscheint nur im Ausdruck."
    ergebnis: "Am Ende steht, um welche Art von Vorgang es geht, was als Nächstes zu tun ist, was festgehalten wird und womit man diese Art häufig verwechselt. Das Ergebnis hängt nur von Ihren Antworten ab."
  belege: [v24:hb-1, v24:hb-1.1, v24:hb-1.2, v24:hb-1.3, v24:hb-1.4, v24:hb-1.5, v24:hb-1.6, v24:hb-5]
  text: |
    Mit wenigen Fragen finden Sie heraus, welche Art Vorgang zu einer Situation passt. Am Ende steht, was als Nächstes zu tun ist, was festgehalten wird und womit man diese Art häufig verwechselt. Erfasst und bearbeitet wird der Vorgang von der Projektsteuerung in der Projektsoftware des Bauherrn.
  fragen:
    - { id: dringlich, frage: "Muss es sofort gemeldet werden – etwa bei akuter Gefahr für die Sicherheit?", belege: [v24:hb-3, v24:hb-4] }
    - { id: handlung, frage: "Geht es um etwas, das man tun soll, um einen schon erfassten Vorgang zu klären, abzumildern oder zu beheben – oder um einen Beschluss umzusetzen?", belege: [v24:hb-1, v24:hb-1.6] }
    - { id: eingetreten, frage: "Ist schon etwas Nachteiliges passiert?", belege: [v24:hb-1.4, v24:hb-1.2] }
    - { id: anpassen, frage: "Soll etwas, das bisher gilt, bewusst anders werden – Umfang, Planung, Material, Ausführung oder Termin?", belege: [v24:hb-1.5] }
    - { id: moeglich, frage: "Könnte etwas Nachteiliges eintreten, oder ist etwas unsicher, das Kosten, Termine oder Qualität treffen kann?", belege: [v24:hb-1.3, v24:hb-1.2, v24:hb-2] }
    - { id: arbeit, frage: "Ist es eine geplante Arbeit mit vereinbartem Ergebnis, Verantwortlichen und Termin?", belege: [v24:hb-1.1, v24:hb-1, v24:hb-1.2] }
    - { id: entscheidung, frage: "Muss der Bauherr etwas entscheiden – etwa über Ziele, wichtige Abweichungen, Geld, die Übernahme eines Risikos oder eine Freigabe?", belege: [v24:hb-1, v24:hb-3.1, v24:hb-1.3, k4.4-p1] }
  ergebnisse:
    - { art: fruehwarnung, schritt: "Die Herkunft des Hinweises sichern, die Frage formulieren, die geklärt werden soll, und festlegen, wer bis wann prüft.", festhalten: "Woher der Hinweis kommt und seit wann; was zu klären ist; wer klärt; wann wieder darauf geschaut wird.", belege: [v24:hb-1.2, v24:hb-5] }
    - { art: risiko, schritt: "Ursache, mögliche Folgen und Zeitraum beschreiben, das Risiko bewerten und mit den Fachleuten Gegenmaßnahmen entwickeln.", festhalten: "Der Auslöser und was daran unsicher ist; die möglichen Folgen und wann sie drohen; die Bewertung mit Begründung und dem Stand der Zahlen; die Gegenmaßnahmen und was danach bleibt.", belege: [v24:hb-1.3, v24:hb-2, v24:hb-5] }
    - { art: problem, schritt: "Klären, was geschehen ist und welche Folgen feststehen; Lösung und Zwischenmaßnahmen abstimmen.", festhalten: "Was passiert ist und was daraus schon folgt; was geklärt wurde; was vorläufig hilft; wie das Problem gelöst wird; der Nachweis dafür.", belege: [v24:hb-1.4, v24:hb-5] }
    - { art: aenderung, schritt: "Anlass, Antragsteller, bisherige Grundlage und Wunsch aufnehmen; die Auswirkungen ermitteln lassen.", festhalten: "Warum und von wem die Änderung gewünscht wird; was bisher gilt und was künftig gelten soll; die geprüften Folgen; die Vorlage und der Beschluss mit Auflagen; der Stand der Umsetzung.", belege: [v24:hb-1.5, v24:hb-5] }
    - { art: massnahme, schritt: "Bezug, Ziel, Verantwortliche und Termin nennen; vorher klären, ob die Maßnahme zum Auftrag gehört und in den Befugnissen liegt.", festhalten: "Wozu sie gehört und was sie bewirken soll; wer sie bis wann umsetzt; welche Freigabe sie braucht; danach, dass sie umgesetzt ist und ob sie wirkt.", belege: [v24:hb-1.6, v24:hb-5] }
    - { art: aufgabe, schritt: "Ergebnis, Verantwortliche, Termin und Abhängigkeiten festlegen.", festhalten: "Was am Ende vorliegen soll; wer es bis wann liefert; wovon es abhängt.", belege: [v24:hb-1.1, v24:hb-5] }
  zusaetze:
    sofort: { titel: Sofort melden, text: "Es wird sofort über den vereinbarten Meldeweg gemeldet, die unmittelbare Reaktion wird gesichert, und noch am selben Arbeitstag wird der Vorgang festgehalten. Der Monatsbericht ersetzt das nicht.", belege: [v24:hb-4, v24:hb-3] }
    unklar: { titel: Noch nicht geklärt, text: "Lässt sich die Situation nicht einordnen, ist sie noch nicht genug geklärt. Dafür gibt es die Frühwarnung.", belege: [v24:hb-1.2] }
    keinVorgang: { titel: Vermutlich kein Vorgang, text: "Ist doch eine Beeinträchtigung denkbar, wird der Hinweis als Frühwarnung festgehalten; ein Hinweis ohne Grundlage kann mit nachvollziehbarer Begründung geschlossen werden.", belege: [v24:hb-1, v24:hb-1.2] }
    nichtSchaetzen: { titel: Keine Wahrscheinlichkeit mehr, text: "Es ist schon passiert; deshalb schätzt niemand mehr eine Wahrscheinlichkeit.", belege: [v24:hb-1.4] }
    bisherGilt: { titel: Bis zur Freigabe gilt das Bisherige, text: "Bis zur Freigabe gilt die bisherige Grundlage.", belege: [v24:hb-1.5] }
    entscheidung: { titel: Entscheidung vorbereiten, text: "Dazu gehören mindestens zwei zulässige Wege, ein gewichteter Vergleich, eine Empfehlung und ein Termin. Den Beschluss trifft die befugte Stelle (die Stelle, die dafür zuständig ist).", belege: [v24:hb-1, v24:hb-3.1] }
    bewerten: { titel: Als Nächstes bewerten, text: "Als Nächstes wird das Risiko bewertet.", belege: [v24:hb-1.3] }
    verknuepfen: { titel: Verknüpfen, text: "Zusammengehörige Einträge werden verknüpft; die Herkunft geht nicht verloren.", belege: [v24:hb-1, v24:hb-1.2] }
  verwechslungen:
    - { id: zu-frueh-risiko, art: fruehwarnung, text: "„Gleich als Risiko eintragen“ – erst klären; eine Bewertung ohne Grundlage braucht es nicht.", belege: [v24:hb-1.2, v24:hb-2] }
    - { id: bis-zum-termin, art: fruehwarnung, text: "„Das hat Zeit bis zum Monatstermin“ – in aktiven Zeiten wird ein neuer Hinweis spätestens bei der nächsten Wochendurchsicht festgehalten, in vereinbarten Ruhezeiten binnen fünf Arbeitstagen.", belege: [v24:hb-4] }
    - { id: geplant-senkt, art: risiko, text: "„Die Maßnahme ist geplant, also ist das Risiko kleiner“ – die Bewertung sinkt erst, wenn Umsetzung und Wirkung belegt sind.", belege: [v24:hb-3] }
    - { id: selten-also-egal, art: risiko, text: "„Unwahrscheinlich, also egal“ – eine schwere Folge wird trotzdem geklärt.", belege: [v24:hb-3] }
    - { id: wahrscheinlichkeit-problem, art: problem, text: "„Wie wahrscheinlich ist das?“ – es ist schon passiert; jetzt zählen Folgen und Lösung.", belege: [v24:hb-1.4] }
    - { id: eile-freigabe, art: problem, text: "„Es eilt, also ist es freigegeben“ – Dringlichkeit ersetzt keine Freigabe.", belege: [v24:hb-1.4] }
    - { id: zusage-beschluss, art: aenderung, text: "„Das wurde doch zugesagt“ – eine Zusage am Rand ist kein Beschluss; bis zur Freigabe gilt die bisherige Planung.", belege: [v24:hb-1.5, v24:hb-3.1] }
    - { id: freigabe-nachtrag, art: aenderung, text: "„Freigegeben heißt bestellt“ – die Freigabe im Projekt ist noch keine Vertragsänderung oder Bestellung.", belege: [v24:hb-1.5] }
    - { id: umgesetzt-wirksam, art: massnahme, text: "„Erledigt“ – getan heißt noch nicht, dass es hilft; das zeigt erst die Prüfung danach.", belege: [v24:hb-1.6] }
    - { id: termin-statt-grund, art: aufgabe, text: "„Neuer Termin, Thema erledigt“ – wer verschiebt, sagt auch, warum es später wird.", belege: [v24:hb-1.1] }
    - { id: jede-aufgabe-beschluss, art: aufgabe, text: "„Dafür braucht es einen Beschluss“ – eine offene Aufgabe zieht nicht von selbst eine Bewertung oder einen Beschluss nach sich.", belege: [v24:hb-1.1] }
  beispiele:
    - { id: messe, quelle: s2, titel: "Hinweis von der Messe: Holz wird knapp", text: "März 2026: Der Architekt hat auf einer Messe gehört, dass die Lieferzeiten für Holzelemente länger werden.", antworten: { dringlich: nein, handlung: nein, eingetreten: nein, anpassen: nein, moeglich: unklar, entscheidung: nein }, erwartet: { art: fruehwarnung } }
    - { id: hersteller, quelle: s3, titel: Drei Hersteller brauchen länger, text: "April 2026: Drei von vier Herstellern brauchen ein halbes Jahr statt vier Monate; ob der Holzbau später beginnt, ist offen.", antworten: { dringlich: nein, handlung: nein, eingetreten: nein, anpassen: nein, moeglich: ja, entscheidung: ja }, erwartet: { art: risiko, entscheidung: true } }
    - { id: ausschreiben, quelle: s3, titel: Holzelemente früher ausschreiben, text: "April 2026: Die Holzelemente werden auf Beschluss der Bürgermeisterin früher ausgeschrieben.", antworten: { dringlich: nein, handlung: ja, entscheidung: nein }, erwartet: { art: massnahme } }
    - { id: auflage, quelle: s4, titel: Auflage zum Brandschutz, text: "Mai 2026: Die Genehmigung für den Holzbau kommt mit einer Auflage: Die Holzbauteile in den Fluren der Gesamtschule müssen gekapselt werden, das kostet rund 400.000 Euro mehr.", antworten: { dringlich: nein, handlung: nein, eingetreten: ja, entscheidung: ja }, erwartet: { art: problem, entscheidung: true } }
    - { id: mensa, quelle: s5, titel: Größere Mensa gewünscht, text: "Juni 2026: Die Schulleitung wünscht eine Mensa für 450 statt 300 Essen.", antworten: { dringlich: nein, handlung: nein, eingetreten: nein, anpassen: ja, entscheidung: ja }, erwartet: { art: aenderung, entscheidung: true } }
    - { id: mehrkosten, quelle: s8, titel: Angekündigte Mehrkosten, text: "Oktober 2026: Die Haustechnikfirma kündigt Mehrkosten von gut einer Million an; die Stelle, die Aufträge vergibt (Vergabestelle), prüft zuerst, ob die Mehrkosten berechtigt sind.", antworten: { dringlich: nein, handlung: nein, eingetreten: nein, anpassen: nein, moeglich: ja, entscheidung: nein }, erwartet: { art: risiko, entscheidung: false } }
    - { id: geruest, quelle: s10, titel: Lose Gerüstanker nach dem Sturm, text: "Februar 2027: Nach dem Sturm sind zwei Gerüstanker an der Sporthalle lose.", antworten: { dringlich: ja, handlung: nein, eingetreten: ja, entscheidung: nein }, erwartet: { art: problem, dringlich: true } }
    - { id: verzug, quelle: s11, titel: Hersteller deutet Verzug an, text: "April 2027: Der Hersteller der Lüftungsanlage deutet Verzug an, nennt aber keinen Termin.", antworten: { dringlich: nein, handlung: nein, eingetreten: nein, anpassen: nein, moeglich: unklar, entscheidung: nein }, erwartet: { art: fruehwarnung } }
    - { id: lueftung, quelle: s12, titel: Lüftungsanlage kommt später, text: "Mai 2027: Der Hersteller der Lüftungsanlage für die Gesamtschule liefert vier Monate später.", antworten: { dringlich: nein, handlung: nein, eingetreten: ja, entscheidung: ja }, erwartet: { art: problem, entscheidung: true } }
    - { id: haushalt, quelle: fall, titel: Kostenübersicht für den Haushalt, text: "Die Kostenübersicht für den Haushalt 2027 geht bis Freitag an die Finanzabteilung der Stadt (Kämmerei).", antworten: { dringlich: nein, handlung: nein, eingetreten: nein, anpassen: nein, moeglich: nein, arbeit: ja, entscheidung: nein }, erwartet: { art: aufgabe } }

  # Regie-Material (nur im Regie-Teil, nie auf der Leinwand; Konzept B.10)
  regie:
    notiz: |
      Erst raten lassen, dann die Antwort setzen: „Schritt weiter“ beantwortet die nächste Frage mit der Antwort des Beispiels. Bei „Weiß ich nicht“ zeigen, warum daraus eine Frühwarnung wird und noch keine Bewertung.
    leitfragen:
      - Welche Art landet bei Ihnen am häufigsten in der falschen Liste?
      - Wer bei Ihnen hält fest, woher ein Hinweis stammt?

risikogrenzen:
  titel: Risiko-Bewerter
  kurz: Bewerten Sie ein Risiko mit den Grenzen, die der Bauherr für sein Projekt festgelegt hat – auch wenn noch nicht alles bekannt ist.
  vorspann:
    wozu: "Hier bewerten Sie ein Risiko nach den Grenzen, die der Bauherr für sein Projekt festgelegt hat – auch wenn noch nicht alles bekannt ist."
    eingabe: "Die Grenzen für Wahrscheinlichkeit, Kosten und Verzug sind mit Beispielwerten vorbelegt; Sie können sie ändern. Tragen Sie dann ein, was Sie über das Risiko wissen. Was noch niemand beziffern kann, geben Sie als „unbekannt“ an; das zählt nicht als null."
    ergebnis: "Sie sehen das Feld in der Risikomatrix und die Stufe: beobachten, gezielt bearbeiten oder vorrangig bearbeiten. Ist noch etwas unbekannt, gilt die Bewertung als vorläufig."
  belege: [v24:hb-2, v24:hb-3, v24:hb-projektblatt, v24:hb-1.3]
  text: |
    Der Bauherr legt fest, ab wann ein Risiko in die nächste Stufe fällt: bei welcher Wahrscheinlichkeit, bei welchem Geldbetrag und bei wie vielen Tagen Verzug. Nach diesen Grenzen wird jedes Risiko gleich eingestuft. Was noch niemand beziffern kann, bleibt „unbekannt“; es zählt nicht als null.

    Die Stufen und ihre Texte sind dieselben wie in der Risikomatrix (5 × 5 Felder). Zu den Warnanlässen zählen etwa Sicherheit, Genehmigung, eine fehlende Befugnis oder die Gefahr, eine Möglichkeit zu handeln zu verlieren; sie werden unabhängig vom Matrixfeld behandelt, also nicht nur nach dem Feld.
  grenzen:
    wahrscheinlichkeit: [10, 30, 50, 70]       # Prozent – Beispielwerte, L-253 (E-1)
    kosten: [100000, 500000, 1500000, 3000000]  # Euro – Fall
    termin: [14, 28, 42, 70]                    # Kalendertage – Fall
  zustaende:
    fest: Bewertung fest
    vorlaeufig: vorläufige Bewertung
    offen: Bewertung offen
  warnanlaesse:
    - { id: sicherheit, titel: Sicherheit }
    - { id: genehmigung, titel: Genehmigung }
    - { id: befugnis, titel: fehlende Befugnis }
    - { id: option, titel: "droht, nicht mehr handeln zu können" }
  grenzfehler:
    anzahl: In jeder Zeile brauchen Sie genau vier Grenzen.
    nicht-positiv: Jede Grenze muss größer als null sein.
    nicht-steigend: Die Grenzen müssen von links nach rechts größer werden.
    ueber-100: Eine Wahrscheinlichkeits-Grenze muss unter 100 Prozent liegen.
  saetze:
    fehler: { text: "Dieser Wert passt nicht zu den Grenzen; die Zeile wird so behandelt, als wäre sie „unbekannt“.", belege: [v24:hb-2] }
    grenze: { text: "Genau auf der Grenze – das ist noch Stufe {n}.", belege: [v24:hb-2, v24:hb-projektblatt] }
    offen: { text: "Ohne Wahrscheinlichkeit oder ohne bekannte Auswirkung ist die Einstufung offen.", belege: [v24:hb-2] }
    vorlaeufig: { text: "Eine Auswirkung ist noch unbekannt: Die Einstufung ist vorläufig, und das Unbekannte zählt nicht als null.", belege: [v24:hb-2, v24:hb-projektblatt] }
    schwereFolge: { text: "Auch wenn noch nichts belegt ist, wird geklärt, ob eine schwere Folge droht.", belege: [v24:hb-2] }
    spanne: { text: "Man hält die Spanne (von … bis …) fest und was noch geprüft werden muss.", belege: [v24:hb-2] }
    warnanlass: { text: "Hier zählt nicht das Matrixfeld: Ein solcher Anlass wird unabhängig davon behandelt; ist er dringlich, wird er sofort über den vereinbarten Meldeweg gemeldet.", belege: [v24:hb-3, v24:hb-4] }
    wesentlich: { text: "Es braucht verlässliche Von-bis-Werte für Kosten und Termin – oder die Angabe, wer welche Frage klärt.", belege: [v24:hb-3, v24:hb-1.3] }
    annahme: { text: "Ob der Bauherr ein wesentliches Risiko selbst übernimmt, entscheidet die befugte Stelle; die Projektsteuerung bereitet das vor.", belege: [v24:hb-1.3, k4.4-p1] }
    annahmeBeispiel: { text: "Ob der Bauherr ein wesentliches Risiko selbst übernimmt, entscheidet im Beispielprojekt die Bürgermeisterin; die Projektsteuerung bereitet das vor.", belege: [v24:hb-1.3, k4.4-p1, fall] }
    selten: { text: "Selten heißt nicht harmlos: Die schwere Folge bleibt im Blick und wird geklärt.", belege: [v24:hb-3] }
    geplant: { text: "Solange die Maßnahme nur geplant ist, bleibt das Feld, wo es ist.", belege: [v24:hb-3] }
    belegt: { text: "Erst wenn die Maßnahme umgesetzt ist und ihre Wirkung nachgewiesen ist, wird die Bewertung angepasst, mit Begründung.", belege: [v24:hb-3, v24:hb-1.3] }
    prognose: { text: "Ist ein Betrag schon in der Kostenprognose (der erwarteten Gesamtsumme) enthalten, steht das im Eintrag, und er wird hier nicht noch einmal mitgerechnet.", belege: [v24:hb-2, v24:hb-1] }
    puffer: { text: "Maßgeblich ist, um wie viele Tage sich der Zieltermin verschiebt – nicht, wie viel später eine einzelne Arbeit fertig wird.", belege: [v24:hb-2] }
    vorrangA5: { text: "Vorrangig wegen Auswirkung 5: Diese Stufe gilt immer, egal wie das Ergebnis aus Wahrscheinlichkeit mal Auswirkung ausfällt.", belege: [v24:hb-2, v24:hb-3] }
    nachObenOffen: { text: "nach oben offen (es kann mehr werden)", belege: [v24:hb-2] }
  beispiele:
    - id: ris-009
      kennung: RIS-009
      titel: Holzbauelemente kommen zu spät
      quelle: s3
      w: { stufe: 4 }
      kosten: unbekannt
      termin: { von: 0, bis: 70 }   # „bis zu zehn Wochen“ (Story 3)
      qualitaet: { stufe: 4 }
      massnahme: geplant
      schwelle: true
      waswaere:                     # nur Annahmen, sichtbar mit „Angenommen: …“
        - { id: t70, titel: "Angenommen: Die zehn Wochen schlagen voll auf den Schulstart durch – 70 Tage", termin: { wert: 70 } }
        - { id: t71, titel: "Angenommen: ein Tag mehr – 71 Tage", termin: { wert: 71 } }
        - { id: w1, titel: "Angenommen: Wahrscheinlichkeit sehr gering", w: { stufe: 1 } }
        - { id: belegt, titel: "Angenommen: Die Maßnahme ist umgesetzt und wirkt", massnahme: belegt }
      erwartet: { feld: 16, zustand: vorlaeufig, nachObenOffen: true, prioritaet: vorrangig }
    - id: ris-014
      kennung: RIS-014
      titel: Angekündigte Mehrkosten der Haustechnikfirma
      quelle: s8
      w: { stufe: 3 }
      kosten: { von: 1000000, bis: 1200000 }
      termin: entfaellt
      qualitaet: entfaellt
      prognose: nein
      schwelle: true
      erwartet: { feld: 9, zustand: fest, nachObenOffen: false, prioritaet: gezielt }
    - id: ris-021
      kennung: RIS-021
      titel: Kampfmittelverdacht im Baufeld der Sporthalle
      quelle: matrix
      w: { stufe: 1 }
      kosten: unbekannt
      termin: unbekannt
      qualitaet: { stufe: 5 }
      warn: [sicherheit]
      erwartet: { feld: 5, zustand: vorlaeufig, nachObenOffen: false, prioritaet: vorrangig, vorrangWegenA5: true }

  # Regie-Material (nur im Regie-Teil, nie auf der Leinwand; Konzept C.8)
  regie:
    notiz: |
      Mit 70 und 71 Tagen zeigen, dass ein einziger Tag die Stufe kippt; dann „Wahrscheinlichkeit sehr gering“ dazunehmen – selten, aber trotzdem vorrangig. Und zeigen, warum „unbekannt“ nicht „null“ ist.
    leitfragen:
      - Wer legt bei Ihnen die Grenzen fest – und stehen sie irgendwo?
      - Was tun Sie mit einer Auswirkung, die noch niemand beziffern kann?

monatsbericht:
  titel: Monatsbericht
  kurz: Ein Bericht auf einer Seite für den Bauherrn. Steht eine Ampel auf Gelb oder Rot, sagt das Werkzeug, was noch fehlt, damit der Bauherr weiß, was er tun soll.
  vorspann:
    wozu: "Der Monatsbericht ist eine Seite, die dem Bauherrn sagt: Was hat sich verändert, was klemmt, was ist zu entscheiden, und welche Reaktion wird von ihm gebraucht?"
    eingabe: "Wählen Sie ein Beispiel oder starten Sie ohne Beispiel. Füllen Sie die Felder aus: Monat, Datenstand (Stand der Zahlen), die Lage in einem Satz, die drei Ampeln für Kosten, Termine und Qualität und die Einträge. Daneben sehen Sie die Seite, wie sie entsteht, und ob alles darauf passt."
    ergebnis: "Im Ergebnis zeigt eine Ampel den Zustand des Berichts: vollständig, mit offenen Hinweisen oder noch nicht fertig. Steht bei Kosten, Termine oder Qualität Gelb oder Rot, braucht der Bauherr dazu eine Entscheidung oder eine Reaktion; fehlt sie, weist das Werkzeug darauf hin."
  belege: [v24:hb-4, v24:as-2, k2.4-p2, v24:hb-5]
  text: |
    Der Monatsbericht fasst auf höchstens einer Seite zusammen, was sich verändert hat, was blockiert ist und welche Entscheidungen offen sind – und welche Reaktion er vom Bauherrn braucht, etwa eine Entscheidung oder eine Auskunft. Er verweist auf die Einträge in der Projektsoftware und ersetzt sie nicht. Was jede Woche, jeden Monat und sofort geschieht, zeigt das Werkzeug Takt der Projektsteuerung.
  ampel:
    gruen: Bericht vollständig
    gelb: Bericht mit offenen Hinweisen
    rot: Bericht noch nicht fertig
  ampeln:
    - { id: kosten, titel: Kosten }
    - { id: termine, titel: Termine }
    - { id: qualitaet, titel: Qualität }
  farben: { gruen: grün, gelb: gelb, rot: rot }
  abschnitte:                 # Reihenfolge und Höchstzahl (Bedienregel); „Leer beginnen“ belegt jeden mit „keine“ vor
    - { id: veraenderungen, titel: Wichtige Veränderungen, max: 4 }
    - { id: blockiert, titel: Blockierte Aufgaben, max: 3 }
    - { id: massnahmen, titel: Kritische Maßnahmen, max: 3 }
    - { id: fruehwarnungen, titel: Ungeklärte Frühwarnungen, max: 3 }
    - { id: probleme, titel: Wichtige Probleme und Änderungen, max: 4 }
  entscheidungen: { titel: Offene Entscheidungen, max: 3 }
  reaktion: Reaktion, die vom Bauherrn gebraucht wird (zum Beispiel Entscheidung oder Auskunft)
  projekt: Schulcampus Lindenhall-Süd   # Kopf des Berichts, solange ein Beispiel zugrunde liegt (Konzept D.6)
  fuss: { text: "Die vollständigen Einträge stehen in der Projektsoftware des Bauherrn.", belege: [v24:hb-4] }
  saetze:
    ampelOhneFrage: { text: "Gelb oder Rot allein sagt dem Bauherrn nicht, was zu tun ist. Es fehlt entweder die anstehende Entscheidung (mit Stelle und Termin) oder die Reaktion, die gebraucht wird.", belege: [k2.4-p2, v24:hb-4] }
    entscheidungOhneWerBisWann: { text: "Zu jeder offenen Entscheidung gehören die Frage, wer entscheidet und bis wann.", belege: [v24:hb-5, v24:hb-3.1] }
    ohneKennung: { text: "Jeder Eintrag nennt die Nummer seines Vorgangs in der Projektsoftware. Der Bericht ist keine zweite Liste.", belege: [v24:hb-4, v24:tlb-2] }
    leerStattKeine: { text: "Hier fehlt noch etwas: Tragen Sie einen Eintrag ein oder das Wort „keine“.", belege: [v24:hb-4, v24:hb-2] }
    zuViele: { text: "Hier sind mehr Einträge, als auf eine Seite passen. Fassen Sie Einträge zusammen.", belege: [v24:hb-4] }
    dringlich: { text: "Dringendes wird sofort gemeldet; der Bericht ersetzt diese Meldung nicht.", belege: [v24:hb-4] }
    umgesetztNichtWirksam: { text: "Umgesetzt heißt noch nicht wirksam – ist die Wirkung schon belegt?", belege: [v24:hb-1.6] }
    berichtUnvollstaendig: { text: "Noch fehlt etwas: Monat, Datenstand, die Lage in einem Satz, die Erklärung zu den drei Ampeln oder die Reaktion, die vom Bauherrn gebraucht wird. Der Bericht ist erst vollständig, wenn alles eingetragen ist. Auch „keine“ ist eine Angabe.", belege: [v24:hb-4] }
    zuLang: { text: "Der Bericht passt nicht mehr auf eine Seite. Kürzen Sie ihn oder fassen Sie Einträge zusammen.", belege: [v24:hb-4, v24:as-2] }
  beispiele:
    - id: oktober
      quelle: s8
      titel: Monatsbericht Oktober 2026
      monat: Oktober 2026
      datenstand: Einträge vom 30. Oktober 2026
      lage: "Die Kostenprognose (die erwartete Gesamtsumme) liegt bei rund 59,4 Millionen Euro, rund eine Million über dem Budget, aber innerhalb der Reserve. Die angekündigten Mehrkosten der Haustechnikfirma stehen als Risiko daneben."
      ampeln:
        kosten: { farbe: gelb, satz: "Rund eine Million über dem Budget, innerhalb der Reserve.", reaktion: "Die Bürgermeisterin nennt dem Stadtrat diese Zahl mit Begründung, die angekündigten Mehrkosten als Risiko daneben." }
        termine: { farbe: gruen, satz: "Die ersten Holzelemente werden montiert." }
        qualitaet: { farbe: gruen, satz: "Keine Einschränkung bekannt." }
      eintraege:
        veraenderungen: [{ text: "Zwei Kostenrechnungen verglichen; Unterschied: Mehrkosten", kennung: RIS-014 }, { text: Erste Holzelemente montiert, kennung: MAS-007 }]
        blockiert: keine
        massnahmen: keine
        fruehwarnungen: keine
        probleme: [{ text: "Mensa, die wachsen kann: beschlossen, Umsetzung läuft", kennung: AEN-012 }]
      entscheidungen: keine
      reaktion: "Zur Kenntnis nehmen; Zahl für den Stadtrat wie oben. Die Vergabestelle prüft die Mehrkosten, Ergebnis in rund vier Wochen."
      erwartet: gruen
    - id: dezember
      quelle: s9
      titel: Monatsbericht Dezember 2026
      monat: Dezember 2026
      datenstand: Stand der Wochendurchsicht im Dezember
      lage: "Die Kostenprognose liegt unverändert bei rund 59,4 Millionen Euro, rund eine Million über dem Budget, aber innerhalb der Reserve. Der Planstand der Fassade ist überfällig; der Netzanschluss kommt erst im März statt im Januar."
      ampeln:
        kosten: { farbe: gelb, satz: "Unverändert rund eine Million über dem Budget, innerhalb der Reserve.", reaktion: "Zur Kenntnis nehmen; die Zahl ist gegenüber dem letzten Bericht unverändert." }
        termine: { farbe: gelb, satz: "Planstand der Fassade überfällig: Der Fensterbauer änderte die Maße zweimal; die Anschlüsse werden mit dem Statiker abgestimmt.", reaktion: "Der Architekt nennt mit Grund, bis wann die Fassadenpläne vorliegen." }
        qualitaet: { farbe: gruen, satz: "Keine Einschränkung bekannt." }
      eintraege:
        veraenderungen: [{ text: "Haustechnik-Mehrkosten: Risiko seit November geschlossen", kennung: RIS-014 }]
        blockiert: [{ text: "Fassadenpläne fehlen: Planstand überfällig", kennung: AUF-031 }]
        massnahmen: keine
        fruehwarnungen: keine
        probleme: [{ text: "Netzanschluss erst im März, bis dahin Baustrom", kennung: PRO-013 }]
      entscheidungen: keine
      reaktion: "Zur Kenntnis nehmen; keine Entscheidung offen. Der Architekt nennt bis zum nächsten Termin, wann die Fassadenpläne vorliegen."
      erwartet: gruen
  # Regie-Material (nur im Regie-Teil, nie auf der Leinwand; Konzept D.8)
  regie:
    notiz: |
      Erst den sauberen Bericht zeigen, dann beim Schalter „Kosten-Ampel ohne Entscheidungsfrage“ die Verknüpfung lösen – die Warnung erscheint.
    leitfragen:
      - Wie viele Seiten hat Ihr Monatsbericht heute?
      - Welche Ampel in Ihrem letzten Bericht hatte eine Entscheidungsfrage?
