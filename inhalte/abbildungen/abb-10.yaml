abweichungen:
  - text: 'Ein gestrichelter Pfeil „Indicator“ führt vom Risiko zurück zur Frühwarnung; der Text schließt diese Richtung aus: CTC- oder Schwellenwertverletzungen erzeugen neue Frühwarnungen als neue Signale, nicht als Rückrichtung aus einem bestehenden Risiko.'
    beleg: k6.4.3-p2
  - text: 'Vom Band „Schwellenwert löst Frühwarnung aus“ zeigt ein gestrichelter Pfeil in „CTC / Prognose“ hinein; im Text sind CTC- oder Schwellenwertverletzungen der Ausgangspunkt, aus dem neue Frühwarnungen entstehen.'
    beleg: k6.4.3-p2
  - text: 'Von der Maßnahme führt keine Kante zum Managementbericht, sondern eine gestrichelte Rückkante zum Risiko; den Managementbericht erreicht nur die gestrichelte Berichtskante aus der Freigabe. Der kanonische Fluss im Text lautet: „EW (unbewertetes Signal) → bestätigt → Risiko → Entscheidung → Freigabe → Maßnahme → Managementbericht“.'
    beleg: k6.4.3-p1
  - text: 'Die Rückkante von der Maßnahme zum Risiko heißt „Risikominderung (Regelkreis schließt)“; einen Regelkreis kennt der Text nicht. Er nennt die Risikominderung als nächsten Schritt im Risikoregister („Risikominderung oder Entscheidung“), nicht als Kante von der Maßnahme zurück zum Risiko.'
    beleg: k6.4.4-t1
  - text: 'Vom Problem führt nur „eskaliert“ ins Entscheidungsregister, keine Kante zur Maßnahme; der Text nennt als nächsten Schritt im Problemregister „Maßnahme, ggf. Entscheidung“.'
    beleg: k6.4.4-t1
  - text: 'Die Zusätze an den Knoten weichen von der Register-Abgrenzung ab: „schwaches Signal“ (Text: unbewertetes Signal), „bewertet (P-A)“ (bewertetes mögliches Ereignis), „akutes Problem“ (eingetretenes Problem), „Änderungsantrag“ (gewollte Änderung), „Gremienbericht“ (aggregierter Gremienbericht).'
    beleg: k6.4.4-t1
  - text: 'Die Maßnahme trägt den Zusatz „Maßnahme mit Frist“ und entsteht im Bild neben den „Auflagen“ der Freigabe auch direkt aus der Entscheidungsvorlage („erzeugt“); im Text werden Beschlüsse als Maßnahmen mit einer verantwortlichen Rolle und einer Frist nachverfolgt.'
    beleg: k6.4.3-p2
  - text: 'Der Knoten heißt „CTC / Prognose – Kostenprognose“; der Text führt „CTC und Prognose“ und bezeichnet die CTC als Restkostenprognose.'
    beleg: k6.4.2-t1 k13-t1
