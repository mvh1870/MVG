titel: Leistungspakete von der Reifegradanalyse bis zum Regelbetrieb
alt: 'Fünf Spalten mit Pfeilen: „Reifegradanalyse“ (Lagebild, Mandate, Datenstand, 30/60/90 Plan), „MVG-Konzeption“ (Zielsystem, Freigabe-Set, Entscheidungs-IDs, Betriebshandbuch), „Pilotierung und Kalibrierung“ (echte Entscheidungen, Schwellen, Managementbericht), „Befähigung & Übergabe“ (Rollenkarten, Routinen, Abnahme) und grün „Regelbetrieb“ (Steuerbarkeit, Nachweis, Betriebsverantwortung). Aus der Reifegradanalyse führt eine Linie zur unteren Reihe „MVG-Neuinitialisierung“, „Bewertung“, „Stabilisierung“; ein gestrichelter Doppelpfeil verbindet Stabilisierung und Regelbetrieb.'
