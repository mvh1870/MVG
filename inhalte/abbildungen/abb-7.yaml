titel: MVG als Bauherren-Führungsmodell
alt: 'Fünf Spalten mit Pfeilen: „Zielsystem“ (Zielsystem, Prioritäten, Datenstand, Dokumentierte Optionen), „Rollen & Mandate“ (Rollen, Verantwortung, Mandate, Mandatskarte), „Freigabelogik“ (Freigabe, Entscheidungsvorlagen, Auswirkungsbewertung, Nachverfolgung), „Steuerungslogik“ (KPIs, Managementberichte, Datenstand, Nachverfolgung), „Betriebshandbuch & Aktive Führung“ („Betriebshandbuch“: Input – Entscheidung – Umsetzung, Governance-Routinen; „Aktive Entscheidungsführung“: vier abgehakte Punkte). Leiste unten (Minimum first, Auswirkung, Entscheidungsreife, Nachweis, Auditierbarkeit).'
