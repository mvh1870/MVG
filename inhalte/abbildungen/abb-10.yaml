id: abb-10
quelle: bilder/image10.jpeg
titel: Wie aus einem Hinweis eine Entscheidung und eine Maßnahme wird
alt: >-
  Die Abbildung zeigt, wie aus Hinweisen, Risiken, Problemen und Änderungen Entscheidungen und Maßnahmen werden: Ein
  wesentliches Risiko, ein Problem oder eine Änderung kommt auf die Liste der offenen Entscheidungen
  (Entscheidungsregister). Daraus wird eine reife Entscheidungsvorlage, daraus die Freigabe (LPH 0–9); Auflagen der
  Freigabe führen zu Maßnahmen, Maßnahmen mindern das Risiko. Ein überschrittener Grenzwert löst eine neue Frühwarnung
  aus. Die Freigabe geht in den Managementbericht.
