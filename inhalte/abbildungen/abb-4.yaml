id: abb-4
quelle: bilder/image4.png
titel: Wo Vorbereitung endet und eigene Entscheidung beginnt
alt: >-
  Die Abbildung zeigt die Grenze zwischen dem, was andere vorbereiten (links: Analyse, Vorbereitung, Berichterstattung,
  Koordination, Dokumentation, Befähigung als Schulung), und dem, was der Bauherr selbst verantwortet (rechts:
  Zielpriorität, Mandat, Entscheidung, Freigabe, Datenstand, Nachweis). In der Mitte steht die Grenze, an der die
  Vorbereitung endet und die Entscheidung beginnt.
