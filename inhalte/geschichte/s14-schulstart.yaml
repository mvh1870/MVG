# 14 · Schulstart (Drehbuch v2, Akt III, Station 14; alt k8) – danach das Ende im August (rahmen.yaml, `ende`)
# Freigabe am Ende der Bauzeit (intern Abschluss LPH 8, mit der Freigabe Beginn 9); sichtbar ohne Phasennummer. Offenes geht an das Gebäudemanagement.
# Regie: Die Freigabe erfolgt mit Auflagen; die zwei Punkte gehen als offene Punkte mit Termin und Namen an das Gebäudemanagement. Schließen ist keine Abnahme.
# Echo E10 (Quelle Station 10) steht im Ende (Lots Zeile), nicht in dieser Szene; diese Station erzeugt kein Echo.
# Belege (intern):
#  - Freigabe erteilt der Bauherr selbst (Freigabe, keine Freigabe, Freigabe mit Auflagen); Lenkungskreis berät; Projektsteuerung bereitet vor: k9.3-p3, k6.4.4-p1, k4.5-p1, v24:hb-1, v24:va-4.1
#  - Offenes wird mit Frist und Nachfolger übergeben, nie als erledigt ausgegeben; ein Vorgang verschwindet nicht durch die Übergabe: v24:hb-5 (Abs. 5–6), v24:tlb-2, v24:va-10.1, v24:va-10.2
#  - Risiko nur mit nachgewiesenem Grund schließen; Problem erst, wenn die Lösung umgesetzt und fachlich bestätigt ist: v24:hb-5 (Abs. 4), v24:hb-1.4, v24:hb-1.6
#  - Schließen ist keine Abnahme und kein Verzicht auf Ansprüche (nur Vertiefung): v24:hb-5 (Abs. 6), k9.3-t1 (LPH 8, 9)
#  - Wochendurchsicht läuft, die Bürgermeisterin nur bei Überschreitung ihrer Grenzen (Erzählbrücke): v24:hb-4 (Abs. 2), k4.2-p2, v24:hb-projektblatt
#  - Die Freigabe erlaubt den nächsten Schritt (Übergabe, Regelbetrieb): k4.5-p1, k9.3-t1
