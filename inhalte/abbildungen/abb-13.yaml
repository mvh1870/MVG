id: abb-13
quelle: bilder/image13.jpeg
titel: Die sechs Schritte der Einführung von der Einrichtung bis zum Regelbetrieb
alt: >-
  Die Abbildung zeigt die sechs Schritte der Einführung – Einrichtung, Diagnose, Konzeption, Pilotierung, Befähigung,
  Übergabe – und wie sie in den Regelbetrieb münden. Jeder Schritt nennt seine Ergebnisse, zum Beispiel bei der Diagnose
  Lücken, Bewertungsmatrix und Entscheidungsliste, bei der Konzeption Zielsystem, Mandatsmodell, Freigabemodell,
  Entscheidungs-IDs und Regeln für den Stand der Unterlagen. Pfeil und gestrichelte Linie führen zum Regelbetrieb
  (abnahmefähig, Betriebsstart).
