einstieg: |
  März 2026. Der Schnee ist weg, an der Baustraße blühen die ersten Krokusse. Im Büro des Architekten wird jetzt die Ausführung geplant – Wand für Wand, Holzbauteil für Holzbauteil.

  Clara Faden geht jede Woche alles Offene durch: Aufgaben, Termine, Fragen ohne Antwort. Heute sitzt sie mit dem Architekten und dem Bauleiter im Container.

szene:
  - { figur: schwung, text: "Übrigens, nur am Rande: Ein Holzbauer hat erzählt, dass die Lieferzeiten für Holzelemente gerade länger werden." }
  - { figur: faden, text: "Wie viel länger? Und bei welchen Herstellern?" }
  - { figur: schwung, text: "Weiß ich nicht genau. Das war nur ein Gespräch auf einer Messe. Das pendelt sich ein, glauben Sie mir." }
  - { figur: lot, text: "Holz kommt, wenn es kommt. Ich hab noch keinen Bau erlebt, wo's nicht irgendwann kam." }
  - { figur: lot, text: "Und überhaupt: Ich bau, ich schreib nicht. Listen sind Ihr Job." }
  # R76: die letzte Zeile nennt das Problem, nicht die Lösung – „Frühwarnung“ erklärt erst die Folge
  - { figur: faden, text: "Kann sein. Aber wenn das Holz diesmal nicht kommt, sollten wir es früh wissen – ich schlafe nachts besser, wenn nichts im Kopf liegen bleibt." }

frage: Noch ist nichts passiert, und niemand weiß, ob überhaupt etwas passieren wird. Was sagen Sie?

antworten:
  - wertung: gut
    text: "Sie lassen es als Frühwarnung festhalten: was zu prüfen ist und wer bis wann nachfragt."
    balken: { geld: 0, zeit: 1, vertrauen: 1 }
    bild: kalender
    folge: |
      „So einen Hinweis halte ich als Frühwarnung fest“, sagt Clara Faden und schreibt drei Zeilen: Hinweis des Architekten aus einem Gespräch auf einer Messe. Prüffrage: Wie lang sind die Lieferzeiten bei den infrage kommenden Herstellern? Konrad Schwung fragt bis Ende des Monats nach.

      Theo Lot zuckt mit den Schultern: „Papierkram.“ Clara Faden lächelt nur. So bleibt Zeit zum Reagieren.
  - wertung: falle
    text: "Das hat Zeit bis zum Monatstermin, der Besprechung einmal im Monat. Bis dahin weiß der Architekt sicher Genaueres."
    balken: { geld: 0, zeit: -1, vertrauen: -1 }
    bild: stoppuhr
    folge: |
      Clara Faden hält den Hinweis trotzdem vollständig fest: Als Prüffrage notiert sie, dass der Architekt bis Ende des Monats nachfragt. Aber Konrad Schwung hat Ihren Satz gehört: Es hat ja Zeit. Der Monat vergeht, niemand fragt nach. Bei der Wochendurchsicht meldet Clara Faden die Prüffrage als überfällig. Erst danach fragt Konrad Schwung bei den Herstellern nach.
  - wertung: vertretbar
    text: "Sie lassen es gleich als Risiko eintragen – lieber zu früh als zu spät."
    balken: { geld: 0, zeit: 1, vertrauen: 0 }
    bild: lupe
    folge: |
      Clara Faden trägt ein Risiko ein – aber ohne Zahlen zu Wahrscheinlichkeit und Schaden: „Eine Zahl ohne Grundlage schreibe ich nicht hin.“ Daneben steht: Bewertung vorläufig, Antwort der Hersteller abwarten.

      Weil der Eintrag schon als Risiko in der Risikoliste steht, fragt die Finanzabteilung der Stadt nach, bevor jemand weiß, ob da überhaupt etwas ist. Immerhin fragt der Architekt bis Ende des Monats bei den Herstellern nach.

gut: |
  Ein unklarer Hinweis wird gleich als Frühwarnung festgehalten, spätestens bei der nächsten Wochendurchsicht – mit seiner Herkunft, einer klaren Prüffrage, einem Namen und einem Termin. Eine Bewertung gibt es erst, wenn die Antwort da ist; bis dahin bleibt der Hinweis offen und wird jede Woche angeschaut.

