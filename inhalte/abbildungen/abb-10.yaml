id: abb-10
quelle: bilder/image10.jpeg
titel: Verknüpfungen zwischen Frühwarnung, Risiko, Entscheidung, Freigabe und Maßnahme
alt: >-
  Legende „Lebenszyklus / ‚wird zu‘“: Risiko (wesentlich) → Entscheidungsregister (ausarbeiten) →
  Entscheidungsvorlage (reif) → Freigabe (LPH 0–9, Freigabeentscheidung); Frühwarnung (unbewertetes Signal, wird zu) → Risiko; Problem
  (eskaliert), Änderung (erfordert) → Register; Vorlage (führt zu) → Änderung (beeinflusst) → CTC / Prognose;
  Vorlage (erzeugt), Freigabe (Auflagen) → Maßnahme. „Überwachung / Indikator“: „Schwellenwert löst
  Frühwarnung aus“ → Frühwarnung, CTC; Maßnahme (Risikominderung, Regelkreis schließt) →
  Risiko. „Bericht in den Managementbericht“: Freigabe → Managementbericht.
