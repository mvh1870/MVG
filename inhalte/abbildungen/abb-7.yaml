abweichungen:
  - text: 'Die Abbildung gliedert das Modell in fünf Spalten, darunter „Steuerungslogik“; der Text nennt acht Bausteine. „System der Entscheidungs-IDs“, „Risiko-/Änderungs-/Maßnahmenverknüpfung“ und „Befähigung“ fehlen, die „Datenstands- und Nachweislogik“ erscheint nur als Kachel „Datenstand“.'
    beleg: k5.2-t1
  - text: 'Die Leiste unten nennt „Minimum first“, „Auswirkungsbewertung“, „Entscheidungsreife“, „Evidenz“ und „Auditierbarkeit“; der Text beschreibt MVG als Bauherren-Führungsmodell, das Verantwortung in entscheidbare, mandatsfähige und nachweisbare Strukturen übersetzt.'
    beleg: k5-p1
  - text: 'Die dritte Spalte heißt „Freigaben & Files“; der Baustein im Text heißt „Freigabelogik“ und verknüpft Projektfortschritt mit Entscheidungsvorbereitung und Freigabereife.'
    beleg: k5.2-t1
  - text: 'Die Spalte „Betriebshandbuch & Aktive Führung“ zeigt einen Ablauf Input – Entscheidung – Umsetzung, Governance-Routinen und eine „Aktive Entscheidungsführung“; im Text beschreibt das Betriebshandbuch den Regelbetrieb mit Taktung, Rollen, Routinen, Eskalation und Verantwortlichkeiten.'
    beleg: k5.2-t1
  - text: '„Datenstand“ und „Nachverfolgung“ stehen in mehreren Spalten; im Text gehören die geltenden Versionen und Annahmen zur „Datenstands- und Nachweislogik“, die Nachverfolgungslogik zum „System der Entscheidungs-IDs“.'
    beleg: k5.2-t1
