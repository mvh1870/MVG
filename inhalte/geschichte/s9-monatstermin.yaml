# 9 · Der Monatstermin (Drehbuch docs/drehbuch-v2/02-akt-2.md, Station 9)
# Kern: Der Bauherr bekommt jeden Monat eine Seite und prüft sie auf Nachvollziehbarkeit: Wer, was, bis wann? Ein grüner Punkt ersetzt
# keine Erklärung, ein neuer Termin auch nicht (v24:hb-4, v24:hb-1.1, v24:tlb-4, k2.4-p2).
# Der Netzanschluss (März statt Januar, bis dahin Baustrom) ist eine erfundene Tatsache des Falls, keine Fachregel; er steht auf jedem
# Weg im Bericht. Der Planstand der Fassade ist auf jedem Weg im Prüfvermerk der Wochendurchsicht als überfällig vermerkt.
# Station 9 erzeugt das Echo E9 (Station 9 → 11, Szene der Vertretung); ankommend kein Echo.
# Mini-Aufgabe (bericht) steht VOR der Frage (nach der Szene), Mehrfachauswahl; Belege je Zeile: 1 v24:hb-4 · 2 v24:hb-4, v24:hb-1.1, k2.4-p2 ·
# 3 v24:hb-1.4 · 4 v24:hb-4, v24:hb-3.1, k2.4-p2 · 5 v24:hb-1.6, v24:hb-1.4 · 6 v24:hb-4
nr: 9
titel: Der Monatstermin
zeit: Dezember 2026
campus: { stufe: 3.5, jahreszeit: winter, licht: abend, wetter: schnee }
bruecke: "Dezember: Sie lesen den Monatsbericht mit Blick auf offene Entscheidungen."
thema: takt
werkzeuge: [{ id: monatsbericht, beispiel: dezember }]
belege: [v24:hb-4, v24:hb-1.1, v24:hb-1.4, v24:hb-1.6, v24:hb-3.1, v24:va-5.1, v24:va-5.2, v24:va-5.3, v24:tlb-3, v24:tlb-4, k2.4-p2]
bild-szene: berichtsblatt
bild-frage: stoppuhr

einstieg: |
  Dezember 2026. Auf dem Dach liegt leichter Schnee, am Baucontainer hängt eine Lichterkette. Heute ist der Monatstermin, eine Stunde online. Vorher hat Clara Faden bei der Wochendurchsicht alles Offene geprüft; den Entwurf des Berichts hat sie am Wochenende geschrieben: eine Seite, drei grüne Punkte.

szene:
  - { figur: faden, zusatz: legt das Blatt vor, text: "Mein Vermerk von heute früh: Bei der Wochendurchsicht ist der Planstand der Fassade überfällig geworden – die fertigen Fassadenpläne fehlen. Im Entwurf vom Wochenende steht das noch nicht." }
  - { figur: schwung, text: "Kommt nächste Woche, versprochen." }
  - { figur: lot, zusatz: am Telefon, text: "Der Netzbetreiber hat angerufen: Der Stromanschluss ans Netz kommt erst im März, nicht im Januar. Ohne Strom keine Säge." }
  - { figur: faden, text: "Das ist ein Problem, kein Risiko: Es ist eingetreten. Als Zwischenlösung gibt es Baustrom, für den Schulstart ändert sich nichts. Es gehört in den Bericht." }
  - { figur: grundstein, text: "Eine Seite, so lese ich das gern. Was genau soll ich entscheiden – und bis wann?" }

frage: Der Entwurf liegt vor Ihnen, alle Punkte sind grün, die Bürgermeisterin wartet auf den Bericht. Was tun Sie?

antworten:
  - wertung: falle
    text: "Sie nehmen den grünen Bericht an. Konrad Schwung nennt einen neuen Termin – das genügt."
    balken: { geld: -1, zeit: -1, vertrauen: -2 }
    bild: warnschild
    folge: |
      Die Ampeln bleiben grün, der Bericht geht mit dem Netzanschluss als Problem an die Bürgermeisterin. Der neue Termin für den Planstand verstreicht, die Fassadenfirma wartet eine Woche.

      Clara Fadens Vermerk ist längst im Haus: „Der Planstand ist überfällig.“ Die Bürgermeisterin legt ihn neben den grünen Bericht. „Warum stand das nicht drin?“ Der Bericht wird mit dem Planstand neu verteilt, doch die grüne Fassung haben da schon alle gelesen.
  - wertung: vertretbar
    text: "Sie lassen den Bericht, wie er ist, und fragen Konrad Schwung persönlich nach dem Planstand."
    balken: { geld: 0, zeit: 0, vertrauen: 0 }
    bild: telefon
    folge: |
      Auf Ihre Nachfrage erklärt Konrad Schwung den Planstand, am Telefon, freundlich und ausführlich. Der Bericht geht grün zur Bürgermeisterin, mit dem Netzanschluss als Problem, aber ohne die Fassade. Die Bürgermeisterin liest ihn und fragt nicht nach.

      Erst bei einem Rundgang mit Theo Lot hört sie vom Planstand. Clara Faden trägt ihn im Prüfvermerk als überfällig ein; im Bericht steht die Erklärung nirgends.
  - wertung: gut
    text: "Sie lassen den Bericht um den überfälligen Planstand ergänzen und verlangen vom Architekten eine Erklärung, nicht nur einen neuen Termin."
    balken: { geld: 0, zeit: 1, vertrauen: 1 }
    bild: berichtsblatt
    folge: |
      Konrad Schwung erklärt es: Der Fensterbauer hat seine Maße zweimal geändert, die Anschlüsse müssen noch mit dem Statiker abgestimmt werden, der die Tragfähigkeit berechnet. Clara Faden nimmt die fehlenden Pläne als überfällige Aufgabe mit Grund und Termin in den Bericht auf, außerdem den Netzanschluss als Problem mit dem Baustrom als Zwischenlösung.

      Die Bürgermeisterin liest die Seite einmal und sagt: „So sehe ich, wo es hakt.“ Weil der Plan früh geklärt ist, bleibt Zeitpuffer im Zeitplan.

gut: |
  Jede Woche wird alles Offene geprüft. Einmal im Monat gibt es einen Termin von höchstens einer Stunde und einen Bericht von höchstens einer Seite. Sie prüfen den Bericht darauf, ob man ihn nachvollziehen kann, nicht darauf, wie viele Felder er hat: Wer macht was bis wann? Ein neuer Termin ersetzt keine Erklärung.

mini:
  art: bericht
  stelle: vor-frage
  titel: Was fehlt im Bericht?
  aufgabe: "Der Entwurf, nach dem Anruf des Netzbetreibers ergänzt: sechs Zeilen. Bei welchen fordern Sie nach?"
  bild: berichtsblatt
  schluss: "Drei Zeilen wurden nachgefordert."
  posten:
    - { text: "Kosten: unverändert rund eine Million über dem Budget; die Mehrkosten der Haustechnik sind seit November als Risiko geschlossen.", loesung: ok, erklaerung: "Ein Stand, mit Datum und Verweis auf die Einträge; eine zweite Liste ist nicht nötig." }
    - { text: "Termine: alle Ampeln grün.", loesung: nachfordern, erklaerung: "Die Fassade fehlt. Eine überfällige Aufgabe gehört mit Grund und nächstem Schritt in den Bericht; Grün ist keine Erklärung." }
    - { text: "Netzanschluss: erst im März statt im Januar, bis dahin Baustrom. Für den Schulstart ändert sich nichts.", loesung: ok, erklaerung: "Ein eingetretenes Problem mit Zwischenlösung und Folge für das Ziel – mehr braucht eine Seite nicht." }
    - { text: "Offene Entscheidungen: –", loesung: nachfordern, erklaerung: "Der Bericht zeigt offene Entscheidungen und die benötigte Reaktion. Hier steht nichts dazu, obwohl der Planstand überfällig ist." }
    - { text: "Kapselung der Flure: eingebaut, damit erledigt.", loesung: nachfordern, erklaerung: "Eingebaut ist nicht wirksam. Geschlossen wird, wenn die Behörde die Wirkung bestätigt hat." }
    - { text: "Dringliches: seit dem letzten Bericht keine Meldung.", loesung: ok, erklaerung: "Dringliches wartet nicht auf den Bericht; kam nichts, darf das so dastehen." }

dahinter: "Der Bericht darf eine Seite sein, weil er auf denselben Stand zeigt wie die Einträge. Eine Seite ohne Entscheidungsfrage ist aber nur Beobachtung, und Grün ohne Erklärung verbirgt, was offen ist. Wo wenig geschieht, genügt wenig: In vereinbarten ruhigen Zeiten findet der Termin nur bei konkretem Bedarf statt, der Bericht bleibt."

vertiefung:
  form: nachdenken
  titel: Was gehört auf eine Seite?
  text:
    - "Der Leiter einer Kita bekommt jeden Monat den Bericht des Hausmeisters, früher hat er ihn aufmerksam gelesen: drei Seiten mit allem, was repariert wurde, seit dem ersten Tag. Gelesen hat ihn zuletzt niemand mehr. Im November fehlte darin ein Satz über den Heizungsausfall im Gruppenraum, der seit zwei Wochen anhält."
    - "Was gehört auf eine einzige Seite, und was kann draußen bleiben?"
  antwort:
    - "Hinein gehört, was sich verändert hat und was jemand entscheiden oder wissen muss: der Heizungsausfall, was dagegen geschieht und bis wann, eine Frage, die der Leiter beantworten muss, und ein Verweis auf den vollständigen Eintrag. Draußen bleibt, was unverändert ist und schon an anderer Stelle steht."
    - "Dann ist die Seite kurz und trotzdem vollständig, weil sie nicht noch einmal alles erzählt, sondern zeigt, wo man nachsieht. Hinein gehört auch, was auffällt: Fällt die Heizung seit zwei Wochen aus und steht nichts im Bericht, ist das die wichtigste Zeile, die es nicht gibt."
    - "Und sie bleibt ehrlich: Ein grüner Punkt ohne Satz darüber, was dahintersteckt, sagt dem Leiter nichts, was er nicht schon hoffte."

regie:
  notiz: "Kern: Der Bauherr bekommt jeden Monat eine Seite und prüft sie auf Nachvollziehbarkeit: Wer, was, bis wann? Ein grüner Punkt ersetzt keine Erklärung, ein neuer Termin auch nicht."
  leitfragen:
    - Was steht auf der einen Seite, die Sie jeden Monat bekommen – und was fehlt?
    - Woran sehen Sie, ob ein grüner Punkt stimmt?
