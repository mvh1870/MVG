  # Regie-Material (nur im Regie-Teil, nie auf der Leinwand; E-9, Konzept A.9)

wegweiser:
  titel: Vorgangs-Wegweiser
  kurz: Sie beschreiben eine Situation; mit wenigen Fragen finden Sie heraus, welche Art Vorgang daraus wird.
  vorspann:
    wozu: "Sie haben eine Situation auf dem Tisch und wissen nicht, was für ein Vorgang daraus wird? Der Wegweiser fragt nach und nennt am Ende die passende Art von Vorgang."
    eingabe: "Wählen Sie ein Beispiel oder beschreiben Sie Ihre eigene Situation in eigenen Worten. Beantworten Sie dann die Fragen mit Ja oder Nein (bei zwei Fragen auch mit „Weiß ich nicht“). Ihr eigener Text wird nicht ausgewertet; er erscheint nur im Ausdruck."
    ergebnis: "Am Ende steht, um welche Art von Vorgang es geht, was als Nächstes zu tun ist, was festgehalten wird und womit man diese Art häufig verwechselt. Das Ergebnis hängt nur von Ihren Antworten ab."
  belege: [v24:hb-1, v24:hb-1.1, v24:hb-1.2, v24:hb-1.3, v24:hb-1.4, v24:hb-1.5, v24:hb-1.6, v24:hb-5]
  text: |
    Mit wenigen Fragen finden Sie heraus, welche Art Vorgang zu einer Situation passt. Am Ende steht, was als Nächstes zu tun ist, was festgehalten wird und womit man diese Art häufig verwechselt. Erfasst und bearbeitet wird der Vorgang von der Projektsteuerung in der Projektsoftware des Bauherrn.
  fragen:
    - { id: dringlich, frage: "Muss es sofort gemeldet werden – etwa bei akuter Gefahr für die Sicherheit?", belege: [v24:hb-3, v24:hb-4] }
    - { id: handlung, frage: "Geht es um etwas, das man tun soll, um einen schon erfassten Vorgang zu klären, abzumildern oder zu beheben – oder um einen Beschluss umzusetzen?", belege: [v24:hb-1, v24:hb-1.6] }
    - { id: eingetreten, frage: "Ist schon etwas Nachteiliges passiert?", belege: [v24:hb-1.4, v24:hb-1.2] }
    - { id: anpassen, frage: "Soll etwas, das bisher gilt, bewusst anders werden – Umfang, Planung, Material, Ausführung oder Termin?", belege: [v24:hb-1.5] }
    - { id: moeglich, frage: "Könnte etwas Nachteiliges eintreten, oder ist etwas unsicher, das Kosten, Termine oder Qualität treffen kann?", belege: [v24:hb-1.3, v24:hb-1.2, v24:hb-2] }
    - { id: arbeit, frage: "Ist es eine geplante Arbeit mit vereinbartem Ergebnis, Verantwortlichen und Termin?", belege: [v24:hb-1.1, v24:hb-1, v24:hb-1.2] }
    - { id: entscheidung, frage: "Muss der Bauherr etwas entscheiden – etwa über Ziele, wichtige Abweichungen, Geld, die Übernahme eines Risikos oder eine Freigabe?", belege: [v24:hb-1, v24:hb-3.1, v24:hb-1.3, k4.4-p1] }
  ergebnisse:
    - { art: fruehwarnung, schritt: "Die Herkunft des Hinweises sichern, die Frage formulieren, die geklärt werden soll, und festlegen, wer bis wann prüft.", festhalten: "Woher der Hinweis kommt und seit wann; was zu klären ist; wer klärt; wann wieder darauf geschaut wird.", belege: [v24:hb-1.2, v24:hb-5] }
    - { art: risiko, schritt: "Ursache, mögliche Folgen und Zeitraum beschreiben, das Risiko bewerten und mit den Fachleuten Gegenmaßnahmen entwickeln.", festhalten: "Der Auslöser und was daran unsicher ist; die möglichen Folgen und wann sie drohen; die Bewertung mit Begründung und dem Stand der Zahlen; die Gegenmaßnahmen und was danach bleibt.", belege: [v24:hb-1.3, v24:hb-2, v24:hb-5] }
    - { art: problem, schritt: "Klären, was geschehen ist und welche Folgen feststehen; Lösung und Zwischenmaßnahmen abstimmen.", festhalten: "Was passiert ist und was daraus schon folgt; was geklärt wurde; was vorläufig hilft; wie das Problem gelöst wird; der Nachweis dafür.", belege: [v24:hb-1.4, v24:hb-5] }
    - { art: aenderung, schritt: "Anlass, Antragsteller, bisherige Grundlage und Wunsch aufnehmen; die Auswirkungen ermitteln lassen.", festhalten: "Warum und von wem die Änderung gewünscht wird; was bisher gilt und was künftig gelten soll; die geprüften Folgen; die Vorlage und der Beschluss mit Auflagen; der Stand der Umsetzung.", belege: [v24:hb-1.5, v24:hb-5] }
    - { art: massnahme, schritt: "Bezug, Ziel, Verantwortliche und Termin nennen; vorher klären, ob die Maßnahme zum Auftrag gehört und in den Befugnissen liegt.", festhalten: "Wozu sie gehört und was sie bewirken soll; wer sie bis wann umsetzt; welche Freigabe sie braucht; danach, dass sie umgesetzt ist und ob sie wirkt.", belege: [v24:hb-1.6, v24:hb-5] }
    - { art: aufgabe, schritt: "Ergebnis, Verantwortliche, Termin und Abhängigkeiten festlegen.", festhalten: "Was am Ende vorliegen soll; wer es bis wann liefert; wovon es abhängt.", belege: [v24:hb-1.1, v24:hb-5] }
  zusaetze:
    sofort: { titel: Sofort melden, text: "Es wird sofort über den vereinbarten Meldeweg gemeldet, die unmittelbare Reaktion wird gesichert, und noch am selben Arbeitstag wird der Vorgang festgehalten. Der Monatsbericht ersetzt das nicht.", belege: [v24:hb-4, v24:hb-3] }
    unklar: { titel: Noch nicht geklärt, text: "Lässt sich die Situation nicht einordnen, ist sie noch nicht genug geklärt. Dafür gibt es die Frühwarnung.", belege: [v24:hb-1.2] }
    keinVorgang: { titel: Vermutlich kein Vorgang, text: "Ist doch eine Beeinträchtigung denkbar, wird der Hinweis als Frühwarnung festgehalten; ein Hinweis ohne Grundlage kann mit nachvollziehbarer Begründung geschlossen werden.", belege: [v24:hb-1, v24:hb-1.2] }
    nichtSchaetzen: { titel: Keine Wahrscheinlichkeit mehr, text: "Es ist schon passiert; deshalb schätzt niemand mehr eine Wahrscheinlichkeit.", belege: [v24:hb-1.4] }
    bisherGilt: { titel: Bis zur Freigabe gilt das Bisherige, text: "Bis zur Freigabe gilt die bisherige Grundlage.", belege: [v24:hb-1.5] }
    schonEingetreten: { titel: Schon eingetreten?, text: "Ist das, was die Maßnahme verhindern oder mindern sollte, inzwischen eingetreten, wird es als eigenes Problem bearbeitet und mit dem Ausgangsvorgang verknüpft; noch unsichere weitere Folgen bleiben getrennt sichtbar. Die Maßnahme ersetzt diesen Eintrag nicht.", belege: [v24:hb-1.6, v24:hb-1.3, v24:hb-1.2, v24:hb-5] }
    entscheidung: { titel: Entscheidung vorbereiten, text: "Dazu gehören mindestens zwei zulässige Wege, ein gewichteter Vergleich, eine Empfehlung und ein Termin. Den Beschluss trifft die befugte Stelle (die Stelle, die dafür zuständig ist).", belege: [v24:hb-1, v24:hb-3.1] }
    bewerten: { titel: Als Nächstes bewerten, text: "Als Nächstes wird das Risiko bewertet.", belege: [v24:hb-1.3] }
    verknuepfen: { titel: Verknüpfen, text: "Zusammengehörige Einträge werden verknüpft; die Herkunft geht nicht verloren.", belege: [v24:hb-1, v24:hb-1.2] }
  verwechslungen:
    - { id: zu-frueh-risiko, art: fruehwarnung, text: "„Gleich als Risiko eintragen“ – erst klären; eine Bewertung ohne Grundlage braucht es nicht.", belege: [v24:hb-1.2, v24:hb-2] }
    - { id: bis-zum-termin, art: fruehwarnung, text: "„Das hat Zeit bis zum Monatstermin“ – in aktiven Zeiten wird ein neuer Hinweis spätestens bei der nächsten Wochendurchsicht festgehalten, in vereinbarten Ruhezeiten binnen fünf Arbeitstagen.", belege: [v24:hb-4] }
    - { id: geplant-senkt, art: risiko, text: "„Die Maßnahme ist geplant, also ist das Risiko kleiner“ – die Bewertung sinkt erst, wenn Umsetzung und Wirkung belegt sind.", belege: [v24:hb-3] }
    - { id: selten-also-egal, art: risiko, text: "„Unwahrscheinlich, also egal“ – eine schwere Folge wird trotzdem geklärt.", belege: [v24:hb-3] }
    - { id: wahrscheinlichkeit-problem, art: problem, text: "„Wie wahrscheinlich ist das?“ – es ist schon passiert; jetzt zählen Folgen und Lösung.", belege: [v24:hb-1.4] }
    - { id: eile-freigabe, art: problem, text: "„Es eilt, also ist es freigegeben“ – Dringlichkeit ersetzt keine Freigabe.", belege: [v24:hb-1.4] }
    - { id: zusage-beschluss, art: aenderung, text: "„Das wurde doch zugesagt“ – eine Zusage am Rand ist kein Beschluss; bis zur Freigabe gilt die bisherige Planung.", belege: [v24:hb-1.5, v24:hb-3.1] }
    - { id: freigabe-nachtrag, art: aenderung, text: "„Freigegeben heißt bestellt“ – die Freigabe im Projekt ist noch keine Vertragsänderung oder Bestellung.", belege: [v24:hb-1.5] }
    - { id: umgesetzt-wirksam, art: massnahme, text: "„Erledigt“ – getan heißt noch nicht, dass es hilft; das zeigt erst die Prüfung danach.", belege: [v24:hb-1.6] }
    - { id: termin-statt-grund, art: aufgabe, text: "„Neuer Termin, Thema erledigt“ – wer verschiebt, sagt auch, warum es später wird.", belege: [v24:hb-1.1] }
    - { id: jede-aufgabe-beschluss, art: aufgabe, text: "„Dafür braucht es einen Beschluss“ – eine offene Aufgabe zieht nicht von selbst eine Bewertung oder einen Beschluss nach sich.", belege: [v24:hb-1.1] }
  beispiele:
    - { id: messe, quelle: s2, titel: "Hinweis von der Messe: Holz wird knapp", text: "März 2026: Der Architekt hat auf einer Messe gehört, dass die Lieferzeiten für Holzelemente länger werden.", antworten: { dringlich: nein, handlung: nein, eingetreten: nein, anpassen: nein, moeglich: unklar, entscheidung: nein }, erwartet: { art: fruehwarnung } }
    - { id: hersteller, quelle: s3, titel: Drei Hersteller brauchen länger, text: "April 2026: Drei von vier Herstellern brauchen ein halbes Jahr statt vier Monate; ob der Holzbau später beginnt, ist offen.", antworten: { dringlich: nein, handlung: nein, eingetreten: nein, anpassen: nein, moeglich: ja, entscheidung: ja }, erwartet: { art: risiko, entscheidung: true } }
    - { id: ausschreiben, quelle: s3, titel: Holzelemente früher ausschreiben, text: "April 2026: Die Holzelemente werden auf Beschluss der Bürgermeisterin früher ausgeschrieben.", antworten: { dringlich: nein, handlung: ja, entscheidung: nein }, erwartet: { art: massnahme } }
    - { id: auflage, quelle: s4, titel: Auflage zum Brandschutz, text: "Mai 2026: Die Genehmigung für den Holzbau kommt mit einer Auflage: Die Holzbauteile in den Fluren der Gesamtschule müssen gekapselt werden, das kostet rund 400.000 Euro mehr.", antworten: { dringlich: nein, handlung: nein, eingetreten: ja, entscheidung: ja }, erwartet: { art: problem, entscheidung: true } }
    - { id: mensa, quelle: s5, titel: Größere Mensa gewünscht, text: "Juni 2026: Die Schulleitung wünscht eine Mensa für 450 statt 300 Essen.", antworten: { dringlich: nein, handlung: nein, eingetreten: nein, anpassen: ja, entscheidung: ja }, erwartet: { art: aenderung, entscheidung: true } }
    - { id: mehrkosten, quelle: s8, titel: Angekündigte Mehrkosten, text: "Oktober 2026: Die Haustechnikfirma kündigt Mehrkosten von gut einer Million an; die Stelle, die Aufträge vergibt (Vergabestelle), prüft zuerst, ob die Mehrkosten berechtigt sind.", antworten: { dringlich: nein, handlung: nein, eingetreten: nein, anpassen: nein, moeglich: ja, entscheidung: nein }, erwartet: { art: risiko, entscheidung: false } }
    - { id: geruest, quelle: s10, titel: Lose Gerüstanker nach dem Sturm, text: "Februar 2027: Nach dem Sturm sind zwei Gerüstanker an der Sporthalle lose.", antworten: { dringlich: ja, handlung: nein, eingetreten: ja, entscheidung: nein }, erwartet: { art: problem, dringlich: true } }
    - { id: verzug, quelle: s11, titel: Hersteller deutet Verzug an, text: "April 2027: Der Hersteller der Lüftungsanlage deutet Verzug an, nennt aber keinen Termin.", antworten: { dringlich: nein, handlung: nein, eingetreten: nein, anpassen: nein, moeglich: unklar, entscheidung: nein }, erwartet: { art: fruehwarnung } }
    - { id: lueftung, quelle: s12, titel: Lüftungsanlage kommt später, text: "Mai 2027: Der Hersteller der Lüftungsanlage für die Gesamtschule liefert vier Monate später.", antworten: { dringlich: nein, handlung: nein, eingetreten: ja, entscheidung: ja }, erwartet: { art: problem, entscheidung: true } }
    - { id: haushalt, quelle: fall, titel: Kostenübersicht für den Haushalt, text: "Die Kostenübersicht für den Haushalt 2027 geht bis Freitag an die Finanzabteilung der Stadt (Kämmerei).", antworten: { dringlich: nein, handlung: nein, eingetreten: nein, anpassen: nein, moeglich: nein, arbeit: ja, entscheidung: nein }, erwartet: { art: aufgabe } }

  # Regie-Material (nur im Regie-Teil, nie auf der Leinwand; Konzept B.10)

risikogrenzen:
  titel: Risiko-Bewerter
  kurz: Bewerten Sie ein Risiko mit den Grenzen, die der Bauherr für sein Projekt festgelegt hat – auch wenn noch nicht alles bekannt ist.
  vorspann:
    wozu: "Hier bewerten Sie ein Risiko nach den Grenzen, die der Bauherr für sein Projekt festgelegt hat – auch wenn noch nicht alles bekannt ist."
    eingabe: "Die Grenzen für Wahrscheinlichkeit, Kosten und Verzug sind mit Beispielwerten vorbelegt; Sie können sie ändern. Tragen Sie dann ein, was Sie über das Risiko wissen. Was noch niemand beziffern kann, geben Sie als „unbekannt“ an; das zählt nicht als null."
    ergebnis: "Sie sehen das Feld in der Risikomatrix und die Stufe: beobachten, gezielt bearbeiten oder vorrangig bearbeiten. Ist noch etwas unbekannt, gilt die Bewertung als vorläufig."
  belege: [v24:hb-2, v24:hb-3, v24:hb-projektblatt, v24:hb-1.3]
  text: |
    Der Bauherr legt fest, ab wann ein Risiko in die nächste Stufe fällt: bei welcher Wahrscheinlichkeit, bei welchem Geldbetrag und bei wie vielen Tagen Verzug. Nach diesen Grenzen wird jedes Risiko gleich eingestuft. Was noch niemand beziffern kann, bleibt „unbekannt“; es zählt nicht als null.

    Die Stufen und ihre Texte sind dieselben wie in der Risikomatrix (5 × 5 Felder). Zu den Warnanlässen zählen etwa Sicherheit, Genehmigung, eine fehlende Befugnis oder die Gefahr, eine Möglichkeit zu handeln zu verlieren; sie werden unabhängig vom Matrixfeld behandelt, also nicht nur nach dem Feld.
  grenzen:
    wahrscheinlichkeit: [10, 30, 50, 70]       # Prozent – Beispielwerte, L-253 (E-1)
    kosten: [100000, 500000, 1500000, 3000000]  # Euro – Fall
    termin: [14, 28, 42, 70]                    # Kalendertage – Fall
  zustaende:
    fest: Bewertung fest
    vorlaeufig: vorläufige Bewertung
    offen: Bewertung offen
  warnanlaesse:
    - { id: sicherheit, titel: Sicherheit }
    - { id: genehmigung, titel: Genehmigung }
    - { id: befugnis, titel: fehlende Befugnis }
    - { id: option, titel: "droht, nicht mehr handeln zu können" }
  grenzfehler:
    anzahl: In jeder Zeile brauchen Sie genau vier Grenzen.
    nicht-positiv: Jede Grenze muss größer als null sein.
    nicht-steigend: Die Grenzen müssen von links nach rechts größer werden.
    ueber-100: Eine Wahrscheinlichkeits-Grenze muss unter 100 Prozent liegen.
  saetze:
    fehler: { text: "Dieser Wert passt nicht zu den Grenzen; die Zeile wird so behandelt, als wäre sie „unbekannt“.", belege: [v24:hb-2] }
    grenze: { text: "Genau auf der Grenze – das ist noch Stufe {n}.", belege: [v24:hb-2, v24:hb-projektblatt] }
    offen: { text: "Ohne Wahrscheinlichkeit oder ohne bekannte Auswirkung ist die Einstufung offen.", belege: [v24:hb-2] }
    vorlaeufig: { text: "Eine Auswirkung ist noch unbekannt: Die Einstufung ist vorläufig, und das Unbekannte zählt nicht als null.", belege: [v24:hb-2, v24:hb-projektblatt] }
    schwereFolge: { text: "Auch wenn noch nichts belegt ist, wird geklärt, ob eine schwere Folge droht.", belege: [v24:hb-2] }
    spanne: { text: "Man hält die Spanne (von … bis …) fest und was noch geprüft werden muss.", belege: [v24:hb-2] }
    warnanlass: { text: "Hier zählt nicht das Matrixfeld: Ein solcher Anlass wird unabhängig davon behandelt; ist er dringlich, wird er sofort über den vereinbarten Meldeweg gemeldet.", belege: [v24:hb-3, v24:hb-4] }
    wesentlich: { text: "Es braucht verlässliche Von-bis-Werte für Kosten und Termin – oder die Angabe, wer welche Frage klärt.", belege: [v24:hb-3, v24:hb-1.3] }
    annahme: { text: "Ob der Bauherr ein wesentliches Risiko selbst übernimmt, entscheidet die befugte Stelle; die Projektsteuerung bereitet das vor.", belege: [v24:hb-1.3, k4.4-p1] }
    annahmeBeispiel: { text: "Ob der Bauherr ein wesentliches Risiko selbst übernimmt, entscheidet im Beispielprojekt die Bürgermeisterin; die Projektsteuerung bereitet das vor.", belege: [v24:hb-1.3, k4.4-p1, fall] }
    selten: { text: "Selten heißt nicht harmlos: Die schwere Folge bleibt im Blick und wird geklärt.", belege: [v24:hb-3] }
    geplant: { text: "Solange die Maßnahme nur geplant ist, bleibt das Feld, wo es ist.", belege: [v24:hb-3] }
    belegt: { text: "Erst wenn die Maßnahme umgesetzt ist und ihre Wirkung nachgewiesen ist, wird die Bewertung angepasst, mit Begründung.", belege: [v24:hb-3, v24:hb-1.3] }
    prognose: { text: "Ist ein Betrag schon in der Kostenprognose (der erwarteten Gesamtsumme) enthalten, steht das im Eintrag, und er wird hier nicht noch einmal mitgerechnet.", belege: [v24:hb-2, v24:hb-1] }
    puffer: { text: "Maßgeblich ist, um wie viele Tage sich der Zieltermin verschiebt – nicht, wie viel später eine einzelne Arbeit fertig wird.", belege: [v24:hb-2] }
    vorrangA5: { text: "Vorrangig wegen Auswirkung 5: Diese Stufe gilt immer, egal wie das Ergebnis aus Wahrscheinlichkeit mal Auswirkung ausfällt.", belege: [v24:hb-2, v24:hb-3] }
    nachObenOffen: { text: "nach oben offen (es kann mehr werden)", belege: [v24:hb-2] }
  beispiele:
    - id: ris-009
      kennung: RIS-009
      titel: Holzbauelemente kommen zu spät
      quelle: s3
      w: { stufe: 4 }
      kosten: unbekannt
      termin: { von: 0, bis: 70 }   # „bis zu zehn Wochen“ (Story 3)
      qualitaet: { stufe: 4 }
      massnahme: geplant
      schwelle: true
      waswaere:                     # nur Annahmen, sichtbar mit „Angenommen: …“
        - { id: t70, titel: "Angenommen: Die zehn Wochen schlagen voll auf den Schulstart durch – 70 Tage", termin: { wert: 70 } }
        - { id: t71, titel: "Angenommen: ein Tag mehr – 71 Tage", termin: { wert: 71 } }
        - { id: w1, titel: "Angenommen: Wahrscheinlichkeit sehr gering", w: { stufe: 1 } }
        - { id: belegt, titel: "Angenommen: Die Maßnahme ist umgesetzt und wirkt", massnahme: belegt }
      erwartet: { feld: 16, zustand: vorlaeufig, nachObenOffen: true, prioritaet: vorrangig }
    - id: ris-014
      kennung: RIS-014
      titel: Angekündigte Mehrkosten der Haustechnikfirma
      quelle: s8
      w: { stufe: 3 }
      kosten: { von: 1000000, bis: 1200000 }
      termin: entfaellt
      qualitaet: entfaellt
      prognose: nein
      schwelle: true
      erwartet: { feld: 9, zustand: fest, nachObenOffen: false, prioritaet: gezielt }
    - id: ris-021
      kennung: RIS-021
      titel: Kampfmittelverdacht im Baufeld der Sporthalle
      quelle: matrix
      w: { stufe: 1 }
      kosten: unbekannt
      termin: unbekannt
      qualitaet: { stufe: 5 }
      warn: [sicherheit]
      erwartet: { feld: 5, zustand: vorlaeufig, nachObenOffen: false, prioritaet: vorrangig, vorrangWegenA5: true }

  # Regie-Material (nur im Regie-Teil, nie auf der Leinwand; Konzept C.8)

monatsbericht:
  titel: Monatsbericht
  kurz: Ein Bericht auf einer Seite für den Bauherrn. Steht eine Ampel auf Gelb oder Rot, sagt das Werkzeug, was noch fehlt, damit der Bauherr weiß, was er tun soll.
  vorspann:
    wozu: "Der Monatsbericht ist eine Seite, die dem Bauherrn sagt: Was hat sich verändert, was klemmt, was ist zu entscheiden, und welche Reaktion wird von ihm gebraucht?"
    eingabe: "Wählen Sie ein Beispiel oder starten Sie ohne Beispiel. Füllen Sie die Felder aus: Monat, Datenstand (Stand der Zahlen), die Lage in einem Satz, die drei Ampeln für Kosten, Termine und Qualität und die Einträge. Daneben sehen Sie die Seite, wie sie entsteht, und ob alles darauf passt."
    ergebnis: "Im Ergebnis zeigt eine Ampel den Zustand des Berichts: vollständig, mit offenen Hinweisen oder noch nicht fertig. „Vollständig“ heißt unter anderem: Die Felder sind ausgefüllt, jede gelbe oder rote Ampel ist mit einer Entscheidung oder Reaktion verknüpft, jede Entscheidung hat Stelle und Termin, nichts Dringliches ist offen, und alles passt auf eine Seite. Ob Zahlen, Ampeln und Einträge stimmen, prüft das Werkzeug nicht. Steht eine der Ampeln Kosten, Termine oder Qualität auf Gelb oder Rot, braucht der Bauherr dazu eine Entscheidung oder eine Reaktion; fehlt sie, weist das Werkzeug darauf hin."
  belege: [v24:hb-4, v24:as-2, k2.4-p2, v24:hb-5]
  text: |
    Der Monatsbericht fasst auf höchstens einer Seite zusammen, was sich verändert hat, was blockiert ist und welche Entscheidungen offen sind – und welche Reaktion er vom Bauherrn braucht, etwa eine Entscheidung oder eine Auskunft. Er verweist auf die Einträge in der Projektsoftware und ersetzt sie nicht. Was jede Woche, jeden Monat und sofort geschieht, zeigt das Werkzeug Takt der Projektsteuerung.
  ampel:
    gruen: Bericht vollständig
    gelb: Bericht mit offenen Hinweisen
    rot: Bericht noch nicht fertig
  ampeln:
    - { id: kosten, titel: Kosten }
    - { id: termine, titel: Termine }
    - { id: qualitaet, titel: Qualität }
  farben: { gruen: grün, gelb: gelb, rot: rot }
  abschnitte:                 # Reihenfolge und Höchstzahl (Bedienregel); „Leer beginnen“ belegt jeden mit „keine“ vor
    - { id: veraenderungen, titel: Wichtige Veränderungen, max: 4 }
    - { id: blockiert, titel: Blockierte Aufgaben, max: 3 }
    - { id: massnahmen, titel: Kritische Maßnahmen, max: 3 }
    - { id: fruehwarnungen, titel: Ungeklärte Frühwarnungen, max: 3 }
    - { id: probleme, titel: Wichtige Probleme und Änderungen, max: 4 }
  entscheidungen: { titel: Offene Entscheidungen, max: 3 }
  reaktion: Reaktion, die vom Bauherrn gebraucht wird (zum Beispiel Entscheidung oder Auskunft)
  projekt: Schulcampus Lindenhall-Süd   # Kopf des Berichts, solange ein Beispiel zugrunde liegt (Konzept D.6)
  fuss: { text: "Die vollständigen Einträge stehen in der Projektsoftware des Bauherrn.", belege: [v24:hb-4] }
  saetze:
    ampelOhneFrage: { text: "Gelb oder Rot allein sagt dem Bauherrn nicht, was zu tun ist. Es fehlt entweder die anstehende Entscheidung (mit Stelle und Termin) oder die Reaktion, die gebraucht wird.", belege: [k2.4-p2, v24:hb-4] }
    entscheidungOhneWerBisWann: { text: "Zu jeder offenen Entscheidung gehören die Frage, wer entscheidet und bis wann.", belege: [v24:hb-5, v24:hb-3.1] }
    ohneKennung: { text: "Jeder Eintrag nennt die Nummer seines Vorgangs in der Projektsoftware. Der Bericht ist keine zweite Liste.", belege: [v24:hb-4, v24:tlb-2] }
    leerStattKeine: { text: "Hier fehlt noch etwas: Tragen Sie einen Eintrag ein oder das Wort „keine“.", belege: [v24:hb-4, v24:hb-2] }
    zuViele: { text: "Hier sind mehr Einträge, als auf eine Seite passen. Fassen Sie Einträge zusammen.", belege: [v24:hb-4] }
    dringlich: { text: "Dringendes wird sofort gemeldet; der Bericht ersetzt diese Meldung nicht.", belege: [v24:hb-4] }
    umgesetztNichtWirksam: { text: "Umgesetzt heißt noch nicht wirksam – ist die Wirkung schon belegt?", belege: [v24:hb-1.6] }
    berichtUnvollstaendig: { text: "Noch fehlt etwas: Monat, Datenstand, die Lage in einem Satz, die Erklärung zu den drei Ampeln oder die Reaktion, die vom Bauherrn gebraucht wird. Der Bericht ist erst vollständig, wenn alles eingetragen ist. Auch „keine“ ist eine Angabe.", belege: [v24:hb-4] }
    zuLang: { text: "Der Bericht passt nicht mehr auf eine Seite. Kürzen Sie ihn oder fassen Sie Einträge zusammen.", belege: [v24:hb-4, v24:as-2] }
  beispiele:
    - id: oktober
      quelle: s8
      titel: Monatsbericht Oktober 2026
      monat: Oktober 2026
      datenstand: Einträge vom 30. Oktober 2026
      lage: "Die Kostenprognose (die erwartete Gesamtsumme) liegt bei rund 59,4 Millionen Euro, rund eine Million über dem Budget, aber innerhalb der Reserve. Die angekündigten Mehrkosten der Haustechnikfirma stehen als Risiko daneben."
      ampeln:
        kosten: { farbe: gelb, satz: "Rund eine Million über dem Budget, innerhalb der Reserve.", reaktion: "Die Bürgermeisterin nennt dem Stadtrat diese Zahl mit Begründung, die angekündigten Mehrkosten als Risiko daneben." }
        termine: { farbe: gruen, satz: "Die ersten Holzelemente werden montiert." }
        qualitaet: { farbe: gruen, satz: "Keine Einschränkung bekannt." }
      eintraege:
        veraenderungen: [{ text: "Zwei Kostenrechnungen verglichen; Unterschied: Mehrkosten", kennung: RIS-014 }, { text: Erste Holzelemente montiert, kennung: MAS-007 }]
        blockiert: keine
        massnahmen: keine
        fruehwarnungen: keine
        probleme: [{ text: "Kapselung (Auflage): Wirkung noch nicht bestätigt", kennung: PRB-002 }, { text: "Mensa, die wachsen kann: beschlossen, Umsetzung läuft", kennung: AEN-012 }]
      entscheidungen: keine
      reaktion: "Zur Kenntnis nehmen; Zahl für den Stadtrat wie oben. Die Vergabestelle prüft die Mehrkosten, Ergebnis in rund vier Wochen."
      erwartet: gruen
    - id: dezember
      quelle: s9
      titel: Monatsbericht Dezember 2026
      monat: Dezember 2026
      datenstand: Stand der Wochendurchsicht im Dezember
      lage: "Die Kostenprognose liegt unverändert bei rund 59,4 Millionen Euro, rund eine Million über dem Budget, aber innerhalb der Reserve. Der Planstand der Fassade ist überfällig; der Netzanschluss kommt erst im März statt im Januar."
      ampeln:
        kosten: { farbe: gelb, satz: "Unverändert rund eine Million über dem Budget, innerhalb der Reserve.", reaktion: "Zur Kenntnis nehmen; die Zahl ist gegenüber dem letzten Bericht unverändert." }
        termine: { farbe: gelb, satz: "Planstand der Fassade überfällig: Der Fensterbauer änderte die Maße zweimal; die Anschlüsse werden mit dem Statiker abgestimmt.", reaktion: "Der Architekt nennt mit Grund, bis wann die Fassadenpläne vorliegen." }
        qualitaet: { farbe: gruen, satz: "Keine Einschränkung bekannt." }
      eintraege:
        veraenderungen: [{ text: "Haustechnik-Mehrkosten: Risiko seit November geschlossen", kennung: RIS-014 }]
        blockiert: [{ text: "Fassadenpläne fehlen: Planstand überfällig", kennung: AUF-031 }]
        massnahmen: keine
        fruehwarnungen: keine
        probleme: [{ text: "Netzanschluss erst im März, bis dahin Baustrom", kennung: PRB-013 }, { text: "Kapselung (Auflage): eingebaut, Wirkung nicht bestätigt", kennung: PRB-002 }]
      entscheidungen: keine
      reaktion: "Zur Kenntnis nehmen; keine Entscheidung offen. Der Architekt nennt bis zum nächsten Termin, wann die Fassadenpläne vorliegen."
      erwartet: gruen
  # Regie-Material (nur im Regie-Teil, nie auf der Leinwand; Konzept D.8)

# ------------------------------------------------------------------------------------------------------------------
# Register-Zusammenspiel (Werkzeug E, Owner im Chat 2026-10-09; Rechenkern src/werkzeuge/register.ts). Form des Graphen
# (Stationen, Pfeile, Wege der Fälle) steht im Kern; hier stehen nur die Texte, je Station und je Pfeil über die Kennung des
# Kerns. Der Titel „Register-Zusammenspiel“ gilt, bis der Owner den Namen vergibt. Belege intern, nie sichtbar (O-38).
# Rollen überall neutral: Bauherr, Lenkungskreis, Projektsteuerung (Owner-Entscheid im Chat).
register:
  titel: Register-Zusammenspiel
  kurz: Wie die Register zusammenspielen – vom ersten Hinweis bis zur Freigabe und zur Maßnahme – und wer in jedem Schritt zuständig ist.
  vorspann:
    wozu: "Hier sehen Sie, wie die Register zusammenspielen. Register sind die Listen, in denen die Projektsteuerung Vorgänge festhält und verfolgt. Aus einem Hinweis kann ein Risiko werden; aus Risiko, Problem oder Änderung kann ein offener Entscheidungsbedarf entstehen, daraus eine Entscheidungsvorlage, ein Beschluss und eine Maßnahme. An jeder Station sehen Sie, wer zuständig ist."
    eingabe: "Sie wählen einen Beispielfall und eine Ansicht: zuschauen, den Fall erzählt lesen, selbst durchprobieren oder die Grafik erkunden. Über der Grafik wechseln Sie die Frage: Wer macht das? Wann? Ab wann? Was entsteht? Was fehlt, wenn es fehlt?"
    ergebnis: "Sie sehen, welche Station als Nächstes kommt, was dort entsteht und wer zuständig ist. Die Grafik zeigt das Zusammenspiel der Register und keinen vorgeschriebenen Ablauf: Nicht jeder Vorgang durchläuft alle Stationen. Maßnahmen entstehen auch ohne Beschluss, zum Beispiel um ein Risiko zu mindern oder bei einem Problem vorläufig zu helfen."
  belege: [v24:hb-1, v24:hb-1.3, v24:hb-1.4, v24:hb-1.6, v24:hb-3.1, v24:hb-4, k6.4.3-p2, k6.4.4-t1]
  text: |
    Die Register hängen zusammen. Ein Hinweis wird zuerst als Frühwarnung festgehalten und geklärt: Er wird zum Risiko, zum Problem oder zur Aufgabe, oder er wird mit Begründung geschlossen. Aus Risiken, Problemen und Änderungen kann ein Entscheidungsbedarf entstehen. Dafür arbeitet die Projektsteuerung eine Entscheidungsvorlage aus; beschließen und freigeben darf nur die befugte Stelle des Bauherrn. Aus dem Beschluss folgen Maßnahmen, deren Wirkung geprüft wird. Der Managementbericht fasst das für den Bauherrn zusammen.
  rollen:
    - { id: bauherr, titel: Bauherr, text: "Über Ziele, wesentliche Abweichungen, Mittel, die Annahme von Risiken und Freigaben entscheidet der Bauherr. Jede Freigabe am Ende einer Leistungsphase erteilt er selbst. Welche Stelle bei ihm sonst entscheiden darf, legt sein Mandat fest.", belege: [v24:hb-1, k6.4.5-t1, k4.2-p1] }
    - { id: lenkungskreis, titel: Lenkungskreis, text: "Der Lenkungskreis berät den Bauherrn, vor allem bei Freigaben, und bereitet sie vor. Beschließt der Bauherr im Lenkungskreis, bleibt er der Entscheider.", belege: [k4.2-p2, k6.4.5-t1, k9.3-p1] }
    - { id: projektsteuerung, titel: Projektsteuerung, text: "Die Projektsteuerung kümmert sich um Aufgaben, Maßnahmen, Frühwarnungen, Risiken, Probleme und Änderungen. Sie klärt die Sachverhalte und bereitet nötige Entscheidungen so vor, dass sie getroffen werden können. Selbst entscheiden, genehmigen oder bestätigen darf sie nicht.", belege: [v24:hb-1, v24:hb-3] }
  schwelle:
    titel: Schwellenwert löst Frühwarnung aus
    text: "Überschreitet die Restkostenprognose oder ein anderer Schwellenwert die festgelegte Grenze, entsteht eine neue Frühwarnung. Sie ist ein neues Signal und entsteht nicht aus einem bestehenden Risiko."
    wer: { fuehrt: bauherr, text: "Die Entscheidungsschwellen legt der Bauherr im Mandat fest. Die Projektsteuerung wertet die Unterlagen aus und hält eine neue Frühwarnung fest, wenn eine Schwelle erreicht ist.", beteiligt: [{ rolle: projektsteuerung, text: "Sie wertet die Unterlagen aus und erfasst die neue Frühwarnung." }] }
    belege: [k6.4.3-p2, v24:hb-3, v24:hb-1.2]
  knoten:
    fruehwarnung:
      titel: Frühwarnung
      unter: schwaches Signal
      text: "Ein Hinweis, dass etwas das Projekt beeinträchtigen könnte, der aber noch nicht genug geklärt ist. Die Projektsteuerung hält Quelle, Eingangsdatum, mögliche Bedeutung, Prüffrage und Wiedervorlage fest. Nach der Klärung wird daraus ein Risiko, ein Problem oder eine Aufgabe, oder der Hinweis wird mit Begründung geschlossen."
      wer: { fuehrt: projektsteuerung, text: "Die Projektsteuerung erfasst den Hinweis und klärt ihn mit den zuständigen Fachleuten.", beteiligt: [] }
      wann: { kurz: "sofort, wenn dringend", text: "Dringliche Hinweise meldet die Projektsteuerung sofort und hält sie noch am selben Arbeitstag fest, sobald die unmittelbare Reaktion gesichert ist. Neue Hinweise, die nicht eilen, trägt sie spätestens bei der nächsten wöchentlichen Durchsicht ein." }
      schwelle: { kurz: "auch ohne Bewertung", text: "Die erste Meldung braucht keine vollständige Bewertung abzuwarten. Auch ein überschrittener Schwellenwert löst eine neue Frühwarnung aus." }
      ergebnis: { kurz: "Ergebnis der Klärung", text: "Das Ergebnis der Klärung, der Grund für die Schließung oder der Verweis auf den Folgeeintrag. Beim Übergang bleibt die Herkunft erhalten." }
      stoerung: "Fehlt die Frühwarnung, hat der Hinweis keine festgehaltene Quelle, keine Prüffrage und keine Wiedervorlage. Ob daraus ein Risiko, ein Problem oder eine Aufgabe wird, bleibt dann offen."
      belege: [v24:hb-1.2, v24:hb-4, k6.4.3-p2, v24:hb-5]
    risiko:
      titel: Risiko
      unter: bewertet
      text: "Etwas Nachteiliges könnte eintreten, oder eine wichtige Größe ist noch unsicher. Die Projektsteuerung beschreibt Ursache, mögliche Folgen und Zeitraum, bewertet nach Wahrscheinlichkeit und Auswirkung, entwickelt mit den Fachleuten Gegenmaßnahmen und verfolgt die verbleibende Unsicherheit."
      wer: { fuehrt: projektsteuerung, text: "Die Projektsteuerung bewertet und verfolgt das Risiko. Ob der Bauherr ein wesentliches verbleibendes Risiko tragen will, bereitet sie als Entscheidung vor; sie nimmt es nicht selbst für ihn an.", beteiligt: [{ rolle: bauherr, text: "Er entscheidet über die Annahme eines wesentlichen Risikos." }] }
      wann: { kurz: "jede Woche durchgesehen", text: "Die Projektsteuerung geht jede Woche alle offenen Einträge kurz durch. Die Bewertung wird begründet fortgeschrieben, wenn sich Grundlagen oder die Wirkung von Maßnahmen ändern." }
      schwelle: { kurz: "wesentlich: Entscheidung", text: "Wesentlich ist ein Risiko, wenn die Risikomatrix es als vorrangig einstuft, wenn es eine Entscheidungsschwelle des Bauherrn erreicht oder wenn ein besonderer Warnanlass vorliegt, zum Beispiel bei Sicherheit oder Genehmigung. Bleibt ein wesentliches Risiko bestehen, bringt die Projektsteuerung es der befugten Stelle des Bauherrn zur Entscheidung." }
      ergebnis: { kurz: "Bewertung mit Datenstand", text: "Eine begründete Bewertung mit Datenstand, die Maßnahmen und das verbleibende Risiko oder der offene Prüfbedarf." }
      stoerung: "Ohne bewertetes Risiko fehlt die Grundlage, ein wesentliches verbleibendes Risiko der befugten Stelle vorzulegen. Probleme, Änderungen und Aufgaben werden trotzdem bearbeitet: Sie brauchen nicht erst ein Risiko."
      belege: [v24:hb-1.3, v24:hb-1, v24:hb-3, v24:hb-4, v24:hb-5]
    problem:
      titel: Problem
      unter: eingetreten
      text: "Etwas Nachteiliges ist schon eingetreten, zum Beispiel ein bestätigter Mangel oder ein ausgefallener Liefertermin. Die Projektsteuerung klärt, was geschehen ist und welche Folgen feststehen, organisiert die Lösung und weist ihr Ergebnis nach. Eine Eintrittswahrscheinlichkeit wird nicht mehr geschätzt."
      wer: { fuehrt: projektsteuerung, text: "Die Projektsteuerung lässt die Ursache fachlich klären und bereitet die Lösung vor. Sind dafür eine Änderung oder eine Entscheidung nötig, bereitet sie auch diese vor. Dass etwas eilt, ersetzt keinen Beschluss.", beteiligt: [] }
      wann: { kurz: "sofort, wenn dringend", text: "Dringliche Sachverhalte meldet die Projektsteuerung sofort und dokumentiert sie am selben Arbeitstag, sobald die unmittelbare Reaktion gesichert ist. Offene Probleme sieht sie jede Woche durch." }
      schwelle: { kurz: "Entscheidung nötig?", text: "Braucht die Lösung eine Änderung oder eine Entscheidung des Bauherrn, entsteht Entscheidungsbedarf. Dringlichkeit allein ersetzt keinen Beschluss." }
      ergebnis: { kurz: "Lösung mit Nachweis", text: "Der eingetretene Zustand mit bekannten Folgen, die fachliche Klärung, Zwischenmaßnahmen, der Lösungsweg und der Nachweis des Ergebnisses. Unsichere weitere Folgen werden gesondert verknüpft." }
      stoerung: "Ohne Problemeintrag gibt es für den eingetretenen Zustand keine geklärten Folgen, keine organisierte Lösung und keinen Nachweis, dass die Lösung umgesetzt und fachlich bestätigt ist. Ein Problem wird auch bearbeitet, wenn vorher kein Risiko erfasst war."
      belege: [v24:hb-1.4, v24:hb-1, v24:hb-4, v24:hb-5, k6.4.3-p2]
    aenderung:
      titel: Änderung
      unter: gewollte Änderung
      text: "Eine geltende Vorgabe wird bewusst verändert, zum Beispiel beim Umfang, bei Planung, Material, Ausführung oder Termin. Die Projektsteuerung hält fest, was der Anlass ist, wer die Änderung beantragt, was bisher galt und was gewünscht wird. Sie lässt ermitteln, was das für Kosten, Termine, Qualität, Funktion, Genehmigungen und Verträge bedeutet."
      wer: { fuehrt: projektsteuerung, text: "Die Projektsteuerung bereitet die Änderung vor, führt die Beiträge zu einer Beurteilung zusammen und verfolgt nach dem Beschluss die Umsetzung.", beteiligt: [{ rolle: bauherr, text: "Er beschließt." }] }
      wann: { kurz: "jede Woche durchgesehen", text: "Offene Änderungen sieht die Projektsteuerung jede Woche durch. Solange der Beschluss nicht wirksam ist, gilt die bisherige Grundlage weiter." }
      schwelle: { kurz: "Entscheidung nötig?", text: "Ist eine Entscheidung des Bauherrn erforderlich, arbeitet die Projektsteuerung mindestens zwei ernsthafte, zulässige Optionen aus und vergleicht sie mit einem gewichteten Vergleich." }
      ergebnis: { kurz: "Auswirkungen, Vorlage", text: "Die geprüften Auswirkungen, die Entscheidungsvorlage, ein Verweis auf den Beschluss, Auflagen und der Stand der Umsetzung. Wird ein Antrag abgelehnt oder zurückgezogen, bleibt er samt Begründung nachvollziehbar." }
      stoerung: "Ohne Änderungseintrag werden die Auswirkungen nicht gegen den geltenden Stand aufbereitet, und es fehlt der Nachweis, was beschlossen und umgesetzt wurde. Bis der Beschluss wirksam ist, gilt ohnehin die bisherige Grundlage."
      belege: [v24:hb-1.5, v24:hb-4, v24:hb-5, k6.4.4-t1]
    prognose:
      titel: CTC / Prognose
      unter: Restkostenprognose
      text: "Die Restkostenprognose (CTC) zeigt die Kosten, die bis zum Projektabschluss noch erwartet werden. Was schon in der Prognose steht, wird gekennzeichnet; dieselben Beträge zählen nicht noch einmal."
      wer: { fuehrt: projektsteuerung, text: "Die Projektsteuerung wertet die Prognose aus und macht Beträge kenntlich, die schon in der Prognose stehen.", beteiligt: [] }
      wann: { kurz: "monatlich", text: "Die Restkostenprognose wird monatlich fortgeschrieben, zusammen mit dem Managementbericht." }
      schwelle: { kurz: "Schwelle: Frühwarnung", text: "Verletzt die Restkostenprognose eine festgelegte Grenze, entsteht eine neue Frühwarnung – ein neues Signal, das nicht aus einem bestehenden Risiko entsteht." }
      ergebnis: { kurz: "erwartete Restkosten", text: "Die erwarteten noch anfallenden Kosten bis zum Projektabschluss." }
      stoerung: "Ohne Prognose gäbe es keine Verletzung der Restkostenprognose, die eine neue Frühwarnung auslösen könnte. Auch ließe sich nicht kenntlich machen, was schon in der Prognose steht; dieselbe Kostenwirkung könnte mehrfach gezählt werden."
      belege: [v24:hb-1, v24:hb-2, k6.4.3-p2, k6.4.5-t1, k6.4.2-t1, v24:hb-1.5]
    register:
      titel: Entscheidungsregister
      unter: offener Entscheidungsbedarf
      text: "Hier steht, wofür der Bauherr noch entscheiden muss. Die Projektsteuerung stellt die konkrete Frage, begründet, warum eine Entscheidung nötig ist, und hält fest, bis wann entschieden sein muss, was eine Verzögerung bewirkt und welche Stelle befugt ist. Eine Routineaufgabe oder ein bloßer Prüfauftrag ist nicht von selbst eine Entscheidung dieser Art."
      wer: { fuehrt: bauherr, text: "Das Entscheidungsregister zeigt, wo der Bauherr noch entscheiden muss; er verantwortet die offenen Entscheidungen. Die Einträge formuliert, pflegt und dokumentiert die Projektsteuerung.", beteiligt: [{ rolle: projektsteuerung, text: "Sie formuliert Frage, Termin und befugte Stelle, pflegt die Einträge und bereitet die Entscheidung vor." }] }
      wann: { kurz: "jede Woche durchgesehen", text: "Die Projektsteuerung sieht die offenen Entscheidungen jede Woche durch und bespricht die relevanten Vorgänge im monatlichen Termin mit dem Bauherrn." }
      schwelle: { kurz: "Entscheidung über Handlung", text: "Ein Eintrag entsteht, wenn der Bauherr über eine Handlung entscheiden muss: wenn er ein wesentliches verbleibendes Risiko tragen soll, wenn die Lösung eines Problems eine Entscheidung braucht oder wenn eine Änderung sie erfordert. Wer entscheiden darf, richtet sich nach dem Mandat, das der Bauherr festgelegt hat." }
      ergebnis: { kurz: "Frage, Termin, Stelle", text: "Die konkrete Frage mit Entscheidungstermin, den Folgen einer Verzögerung und der befugten Stelle des Bauherrn. Daraus wird die Entscheidungsvorlage." }
      stoerung: "Fehlt der Eintrag, ist nicht sichtbar, wo der Bauherr noch entscheiden muss, bis wann, mit welcher Folge einer Verzögerung und durch welche Stelle. Den Entscheidungsbedarf zu klären ist der erste Schritt des Arbeitsablaufs."
      belege: [v24:hb-3.1, v24:hb-5, k6.4.4-t1, k6.4.3-p2, k6.4.5-t1, k6.4.2-t1, v24:hb-4, k4.2-p1]
    vorlage:
      titel: Entscheidungsvorlage
      unter: entscheidungsreif
      text: "Die Vorlage bündelt Frage, Datenstand, Optionen, Bewertung und Empfehlung. Mindestens zwei zulässige Optionen werden ausgearbeitet und mit einem gewichteten Vergleich (MCDA) bewertet; die Empfehlung nennt Nachteile, Unsicherheiten und Voraussetzungen."
      wer: { fuehrt: projektsteuerung, text: "Die Projektsteuerung erarbeitet die Vorlage. Die Entscheidung bereitet sie nur vor; treffen, genehmigen oder bestätigen darf sie nicht.", beteiligt: [] }
      wann: { kurz: "mit Entscheidungstermin", text: "Die Vorlage wird fristgerecht abgelegt, passend zum Entscheidungstermin. Dringliche Meldungen und notwendige Schutzmaßnahmen warten nicht auf den fertigen Vergleich." }
      schwelle: { kurz: "mindestens zwei Optionen", text: "Reif ist die Vorlage, wenn mindestens zwei zulässige Optionen und die übrigen wesentlichen Grundlagen vorliegen. Fehlt etwas, wird sie als nicht vollständig gekennzeichnet." }
      ergebnis: { kurz: "Vorlage mit Empfehlung", text: "Die Vorlage mit Datenstand, Quellen und Verknüpfung zum auslösenden Vorgang, dem Vergleich der Optionen und der begründeten Empfehlung." }
      stoerung: "Ohne Vorlage hat der Bauherr keine ausgearbeiteten Optionen, keinen Vergleich und keine begründete Empfehlung, auf die er seine Entscheidung stützen kann. Fehlt nur die zweite zulässige Option, ist die Vorlage unvollständig: Die Projektsteuerung sagt das ausdrücklich und füllt die Lücke nicht mit einer Scheinlösung."
      belege: [v24:hb-3.1, v24:hb-3, k6.4.3-p2, k6.4.5-t1]
    freigabe:
      titel: Freigabe
      unter: Beschluss, LPH 0–9
      text: "Die Entscheidung des Bauherrn am Abschluss einer Leistungsphase LPH 0–9, ob die nächste beginnen darf. Das Ergebnis lautet Freigabe, keine Freigabe oder Freigabe mit Auflagen. Einen tatsächlich vorliegenden Beschluss dokumentiert die Projektsteuerung getrennt mit Quelle, Datum und Bedingungen. Auch andere Handlungsentscheidungen trifft die befugte Stelle des Bauherrn; die Projektsteuerung dokumentiert sie als Beschluss."
      wer: { fuehrt: bauherr, text: "Der Bauherr erteilt jede Freigabe selbst, auch wenn er sie in einem Gremium beschließt.", beteiligt: [{ rolle: lenkungskreis, text: "Er berät und bereitet vor." }, { rolle: projektsteuerung, text: "Sie bereitet die Entscheidung vor und dokumentiert den Beschluss; eine Freigabe erteilt sie nicht." }] }
      wann: { kurz: "je Leistungsphase", text: "Jede Leistungsphase LPH 0–9 schließt mit einer Freigabe ab. Bleibt die Entscheidung aus, benennt die Projektsteuerung einen neuen Klärungstermin." }
      schwelle: { kurz: "Mandat des Bauherrn", text: "Wer entscheiden darf und in welchem Rahmen, legt der Bauherr im Mandat fest. Die Projektsteuerung erhält keine zusätzlichen Entscheidungs- oder Freigabebefugnisse." }
      ergebnis: { kurz: "mit oder ohne Auflagen", text: "Das Ergebnis: Freigabe, keine Freigabe oder Freigabe mit Auflagen, dokumentiert mit Quelle, Datum und Bedingungen. Auflagen sind Bedingungen, die mit der Freigabe verbunden sind; aus ihnen werden Maßnahmen." }
      stoerung: "Ohne Beschluss gibt es nichts, woraus Maßnahmen folgen. Weder Schweigen noch die Empfehlung der Projektsteuerung noch ein Status in der Projektsoftware ersetzen einen Beschluss. Die Projektsteuerung setzt einen neuen Termin zur Klärung an und nennt, was die Verzögerung bedeutet."
      belege: [k6.4.4-t1, k6.4.4-p1, k6.4.5-t1, k9.3-p1, v24:hb-3.1, v24:hb-1, k4.2-p1]
    massnahme:
      titel: Maßnahme
      unter: mit Frist
      text: "Eine gezielte Handlung, um einen Zustand zu klären oder zu verbessern, ein Risiko zu mindern, ein Problem zu beheben oder einen Beschluss umzusetzen. Zu jeder Maßnahme gehören Handlung, Verantwortlicher, Termin und erwartete Wirkung."
      wer: { fuehrt: projektsteuerung, text: "Die Projektsteuerung nennt Bezug, Ziel, Verantwortlichen und Termin, verfolgt die Umsetzung und prüft mit den Fachleuten die Wirkung. Die technische Ausführung übernimmt sie dadurch nicht.", beteiligt: [{ rolle: bauherr, text: "Zusätzliche Mittel, Leistungsänderungen und vorbehaltene Freigaben werden ihm vorher vorgelegt." }] }
      wann: { kurz: "Termin je Maßnahme", text: "Jede Maßnahme hat einen Termin. In der wöchentlichen Durchsicht schaut die Projektsteuerung darauf, ob Maßnahmen wirken und ob Freigaben oder Auflagen noch ausstehen." }
      schwelle: { kurz: "im Auftrag und Mandat?", text: "Bevor eine Maßnahme beginnt, prüft die Projektsteuerung, ob sie vom bestehenden Auftrag gedeckt ist und mit den vorhandenen Befugnissen ausgeführt werden darf. Braucht sie zusätzliche Mittel, ändert sie Leistungen oder ist eine Freigabe vorbehalten, geht das vorher zur Vorlage an den Bauherrn." }
      ergebnis: { kurz: "Umsetzung und Wirkung", text: "Der Nachweis der Umsetzung und das Ergebnis der Wirksamkeitsprüfung. Umgesetzt und wirksam sind nicht dasselbe." }
      stoerung: "Ohne Maßnahme wird kein Beschluss umgesetzt und keine Wirkung geprüft. Eine Maßnahme, die nur geplant ist, mindert das Risiko in der aktuellen Bewertung noch nicht; erst wenn Umsetzung und Wirkung belegt sind, wird die Bewertung angepasst. Wirkt sie nicht oder kommt sie zu spät, bereitet die Projektsteuerung eine Anpassung oder erneut eine Entscheidung vor."
      belege: [v24:hb-1.6, v24:hb-1, v24:hb-3, v24:hb-4, v24:hb-5]
    bericht:
      titel: Managementbericht
      unter: als Monatsbericht
      text: "Der Managementbericht geht jeden Monat als Zusammenfassung auf höchstens einer Seite an den Bauherrn (Monatsbericht). Darin steht, was sich bei Aufgaben, Maßnahmen, Frühwarnungen, Risiken, Problemen und Änderungen wesentlich verändert hat, was blockiert oder kritisch ist, welche Entscheidungen offen sind und welche Reaktion gebraucht wird."
      wer: { fuehrt: projektsteuerung, text: "Die Projektsteuerung erstellt die Zusammenfassung aus demselben Informationsstand wie die Projektsoftware und verweist auf die betreffenden Einträge.", beteiligt: [{ rolle: bauherr, text: "Er erhält sie jeden Monat und bespricht die Vorgänge im Online-Termin." }] }
      wann: { kurz: "monatlich, eine Seite", text: "Jeden Monat, zusammen mit einem Online-Termin von bis zu 60 Minuten. Der Bericht bleibt auch in vereinbarten Ruhezeiten vorgesehen." }
      schwelle: { kurz: "wesentliche Veränderungen", text: "Im Bericht stehen die wesentlichen Veränderungen, die kritischen Maßnahmen und die offenen Entscheidungen mit der benötigten Reaktion." }
      ergebnis: { kurz: "höchstens eine Seite", text: "Eine Zusammenfassung von höchstens einer Seite, die auf die Einträge verweist. Eine zweite Liste ist nicht nötig." }
      stoerung: "Ohne den Bericht fehlt dem Bauherrn die monatliche Übersicht über wesentliche Veränderungen, offene Entscheidungen und die benötigte Reaktion. Dringliches wartet nicht auf den Bericht: Es wird sofort gemeldet."
      belege: [v24:hb-4, k6.4.4-t1, k6.4.5-t1, k6.4.3-p1]
  kanten:
    prognose-schwelle: { text: "überschreitet", erklaerung: "Verletzt die Restkostenprognose eine festgelegte Grenze, ist das der Anlass für eine neue Frühwarnung.", belege: [k6.4.3-p2] }
    schwelle-fruehwarnung: { text: "löst aus", erklaerung: "Ein überschrittener Schwellenwert erzeugt eine neue Frühwarnung – ein neues Signal, das nicht aus einem bestehenden Risiko entsteht.", belege: [k6.4.3-p2, v24:hb-1.2] }
    fruehwarnung-risiko: { text: "als Risiko bewertet", erklaerung: "Nach der Klärung wird ein mögliches Ereignis als Risiko bewertet.", belege: [v24:hb-1.2, k6.4.4-t1] }
    fruehwarnung-problem: { text: "eingetreten", erklaerung: "Zeigt die Klärung, dass der Zustand schon eingetreten ist, wird er als Problem bearbeitet.", belege: [v24:hb-1.2] }
    risiko-register: { text: "wesentlich", erklaerung: "Ob der Bauherr ein wesentliches verbleibendes Risiko tragen will oder ob eine Gegenmaßnahme eine Entscheidung braucht, bereitet die Projektsteuerung als offenen Entscheidungsbedarf vor.", belege: [k6.4.3-p2, v24:hb-3, v24:hb-1.3, v24:hb-1.6] }
    problem-register: { text: "braucht Entscheidung", erklaerung: "Braucht die Lösung eines Problems eine Entscheidung, entsteht ein offener Entscheidungsbedarf. Die Dringlichkeit allein ersetzt keinen Beschluss.", belege: [k6.4.3-p2, v24:hb-1.4] }
    aenderung-register: { text: "erfordert", erklaerung: "Erfordert eine Änderung eine Entscheidung des Bauherrn, entsteht ein offener Entscheidungsbedarf.", belege: [k6.4.3-p2, v24:hb-1.5] }
    aenderung-prognose: { text: "Kosten verknüpfen", erklaerung: "Die ermittelte Kostenwirkung einer Änderung wird mit der Kostenprognose verknüpft; was dort schon steht, wird kenntlich gemacht und nicht noch einmal gezählt.", belege: [v24:hb-1.5, v24:hb-1, v24:hb-2] }
    register-vorlage: { text: "ausarbeiten", erklaerung: "Aus dem offenen Entscheidungsbedarf arbeitet die Projektsteuerung die Entscheidungsvorlage aus: mindestens zwei zulässige Optionen, gewichteter Vergleich, Empfehlung.", belege: [v24:hb-3.1, k6.4.4-t1] }
    vorlage-freigabe: { text: "reif", erklaerung: "Ist die Vorlage entscheidungsreif, kann der Bauherr beschließen und freigeben. Das darf nur die befugte Stelle des Bauherrn; die Vorlage ersetzt es nicht.", belege: [v24:hb-3.1, k6.4.5-t1] }
    freigabe-massnahme: { text: "Auflagen", erklaerung: "Aus dem Beschluss und seinen Auflagen folgen Maßnahmen mit verantwortlicher Rolle und Frist; die Projektsteuerung verfolgt sie.", belege: [k6.4.3-p2, v24:hb-3.1, v24:hb-1.6] }
    freigabe-bericht: { text: "Bericht", erklaerung: "Wesentliche Veränderungen und offene Entscheidungen stehen im Managementbericht, der jeden Monat an den Bauherrn geht – unabhängig davon, ob gerade eine Freigabe ansteht.", belege: [k6.4.3-p1, v24:hb-4] }
    massnahme-risiko: { text: "mindert das Risiko", erklaerung: "Eine umgesetzte und wirksame Maßnahme mindert das Risiko; erst dann wird die Bewertung des betroffenen Risikos angepasst. So schließt sich der Kreis aus Maßnahme, Wirkung und neuer Bewertung.", belege: [v24:hb-3, v24:hb-1.6] }
  anlaesse:
    - id: hinweis
      titel: Hinweis zur Lieferzeit
      kurz: Ein Hinweis wird zum Risiko, zur Entscheidung und zur Maßnahme.
      start: fruehwarnung
      einstieg: "Der Architekt hat auf einer Messe gehört, dass die Lieferzeiten für Holzelemente länger werden. Beim Schulcampus Lindenhall-Süd wird die Vergabe der Holzbauelemente gerade vorbereitet."
      schritte:
        - { kante: fruehwarnung-risiko, text: "Die Projektsteuerung hält den Hinweis als Frühwarnung fest (FRW-002) und fragt bei den Herstellern nach. Die Antwort: Die Lieferzeit ist tatsächlich länger. Aus der Frühwarnung wird ein Risiko: Die Lieferzeit gefährdet Montagebeginn und Inbetriebnahme (RIS-009)." }
        - { kante: risiko-register, text: "Die Projektsteuerung bewertet das Risiko nach Wahrscheinlichkeit und Auswirkung. Es ist wesentlich, weil es in der Risikomatrix vorrangig ist. Die Gegenmaßnahme kostet zusätzlich Geld aus der Reserve, und ob das Restrisiko getragen wird, entscheidet der Bauherr. Also kommt es als offener Entscheidungsbedarf ins Entscheidungsregister." }
        - { kante: register-vorlage, text: "Die Projektsteuerung formuliert die Frage, nennt Entscheidungstermin und befugte Stelle und arbeitet zwei zulässige Wege aus: die Holzbauelemente früher auszuschreiben oder abzuwarten. Sie vergleicht beide mit gewichteten Gesichtspunkten und empfiehlt einen Weg." }
        - { kante: vorlage-freigabe, text: "Die Vorlage ist entscheidungsreif. Der Lenkungskreis berät, und der Bauherr entscheidet selbst: Er beschließt, die Holzbauelemente früher auszuschreiben, mit der Auflage, die Lieferzeit schriftlich bestätigen zu lassen." }
        - { kante: freigabe-massnahme, text: "Aus dem Beschluss und der Auflage wird eine Maßnahme mit verantwortlicher Rolle und Frist (MAS-007, vorgezogene Vergabe der Holzbauelemente). Die Projektsteuerung verfolgt die Umsetzung." }
        - { kante: freigabe-bericht, text: "Der Stand von Beschluss und Maßnahme steht im nächsten Managementbericht, der auf die Einträge verweist." }
        - { kante: massnahme-risiko, text: "Ist die Vergabe umgesetzt und die Lieferzeit bestätigt, prüft die Projektsteuerung die Wirkung. Erst dann wird die Risikobewertung angepasst: Der Kreis schließt sich." }
      ende: "Nicht jeder Hinweis durchläuft alle diese Stationen: Viele werden nach der Klärung mit Begründung geschlossen."
      belege: [v24:hb-1.2, v24:hb-1.3, v24:hb-3.1, v24:hb-1.6, k6.4.3-p1]
    - id: problem
      titel: Lüftungsanlage kommt später
      kurz: Ein Problem ist eingetreten und braucht eine Entscheidung.
      start: fruehwarnung
      einstieg: "Im April deutet der Hersteller der Lüftungsanlage für die Gesamtschule einen Verzug an, nennt aber keinen Termin."
      schritte:
        - { kante: fruehwarnung-problem, text: "Die Projektsteuerung hält den Hinweis als Frühwarnung fest und fragt nach. Im Mai steht fest: Die Anlage kommt vier Monate später. Der Zustand ist eingetreten, aus der Frühwarnung wird ein Problem." }
        - { kante: problem-register, text: "Die Projektsteuerung klärt die Folgen und bereitet Lösungen vor. Für eine Lösung braucht der Bauherr eine Entscheidung, also wird ein offener Entscheidungsbedarf eingetragen. Dringlichkeit allein ersetzt keinen Beschluss." }
        - { kante: register-vorlage, text: "Die Projektsteuerung arbeitet zwei zulässige Wege aus – ein Ersatzgerät einsetzen oder später einziehen – und vergleicht sie mit gewichteten Gesichtspunkten." }
        - { kante: vorlage-freigabe, text: "Der Lenkungskreis berät. Der Bauherr entscheidet nach seinem Mandat." }
        - { kante: freigabe-massnahme, text: "Der Beschluss wird als Maßnahme mit Verantwortlichem und Frist umgesetzt. Die Projektsteuerung verfolgt Umsetzung und Wirkung." }
        - { kante: freigabe-bericht, text: "Beschluss und Stand der Maßnahme stehen im nächsten Managementbericht." }
      ende: "Das Problem ist schon eingetreten: Eine Wahrscheinlichkeit wird nicht mehr geschätzt."
      belege: [v24:hb-1.2, v24:hb-1.4, v24:hb-3.1, k6.4.3-p2]
    - id: aenderung
      titel: Größere Mensa
      kurz: Eine gewollte Änderung wirkt auf die Kosten und braucht eine Entscheidung.
      start: aenderung
      einstieg: "Die Schulleitung wünscht eine größere Mensa (AEN-012). Die geltende Vorgabe soll bewusst geändert werden."
      schritte:
        - { kante: aenderung-prognose, text: "Die Projektsteuerung erfasst Anlass, Antragsteller und bisherige Grundlage und lässt die Auswirkungen auf Kosten, Termine und Genehmigungen ermitteln. Die ermittelte Kostenwirkung wird mit der Kostenprognose verknüpft; was dort schon steht, wird nicht noch einmal gezählt." }
        - { kante: aenderung-register, text: "Für die Änderung braucht der Bauherr eine Entscheidung. Sie kommt als offener Entscheidungsbedarf ins Entscheidungsregister. Bis der Beschluss wirksam ist, gilt weiter die bisherige Grundlage." }
        - { kante: register-vorlage, text: "Die Projektsteuerung arbeitet zwei zulässige Wege aus: die größere Mensa oder eine Mensa, die später wachsen kann. Sie vergleicht beide mit gewichteten Gesichtspunkten." }
        - { kante: vorlage-freigabe, text: "Der Lenkungskreis berät, und der Bauherr entscheidet für die Mensa, die später wachsen kann." }
        - { kante: freigabe-massnahme, text: "Der Beschluss wird umgesetzt: Die Projektsteuerung informiert die Beteiligten, veranlasst die Anpassung der Unterlagen und verfolgt die Umsetzung." }
        - { kante: freigabe-bericht, text: "Der Beschluss steht im nächsten Managementbericht." }
      ende: "Eine Änderung muss nicht aus einem Risiko entstehen: Sie wird auch ohne Risikoeintrag bearbeitet. Wird ein Antrag abgelehnt, bleibt er mit Begründung festgehalten."
      belege: [v24:hb-1.5, v24:hb-1, v24:hb-3.1, k6.4.3-p2]
