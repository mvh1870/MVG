# Explore-Werkzeuge (P16.8, O-46; vier neue Werkzeuge P18.3/P18.4, O-59, Konzept docs/WERKZEUGE-P18.md). Belege intern, nie sichtbar (O-38). Beispielprojekt: Schulcampus Lindenhall-Süd (O-50).
einleitung: |
  Neun Werkzeuge zum Ausprobieren – alle am fiktiven Schulcampus Lindenhall-Süd.
mcda:
  titel: MCDA-Rechner
  kurz: Ein gewichteter Vergleich nach mehreren Kriterien – und sehen, wann sich die Spitze dreht.
  belege: [v24:hb-3.1, v24:hb-3.2]
  text: |
    MCDA steht für Multikriterien-Entscheidungsanalyse, auf Deutsch: ein gewichteter Vergleich nach mehreren Kriterien. Die Projektsteuerung vergleicht mindestens zwei zulässige Optionen anhand derselben gewichteten Kriterien. Gewichte und Punkte liegen je zwischen 1 und 5; Gewicht mal Punkt ergibt je Kriterium ein Produkt, die Summe die Gesamtpunktzahl. Kriterien und Gewichte werden vor der Bewertung mit dem Bauherrn abgestimmt.
  hinweis: |
    Eine hohe Punktzahl ersetzt kein fachliches Urteil. Zwingende Anforderungen an Sicherheit, Genehmigung und Funktion werden vor dem Vergleich geprüft – eine unzulässige Option gewinnt nicht durch Punkte.
matrix:
  titel: Risikomatrix 5×5
  kurz: Wahrscheinlichkeit mal Auswirkung – und was daraus für die Bearbeitung folgt.
  belege: [v24:hb-2, v24:hb-3]
  text: |
    Die Matrix gilt nur für Risiken. Wahrscheinlichkeit 1 bis 5 mal die höchste belegte Auswirkung 1 bis 5 ergibt die Bearbeitungspriorität. Die Einzelbewertungen für Kosten, Termine und Qualität bleiben daneben sichtbar.
  stufen:
    - { id: beobachten, titel: Beobachten, von: 1, bis: 4, text: "Verantwortliche Person, nächster Prüftermin und die Veränderungen, die eine neue Bewertung auslösen, werden benannt." }
    - { id: gezielt, titel: Gezielt bearbeiten, von: 5, bis: 9, text: "Die Projektsteuerung schlägt eine Maßnahme vor, klärt Verantwortung und Termin und verfolgt die Umsetzung." }
    - { id: vorrangig, titel: Vorrangig bearbeiten, von: 10, bis: 25, text: "Die Projektsteuerung holt die fachliche Einschätzung ein, informiert den Bauherrn und bereitet notwendige Handlungen oder Entscheidungen rechtzeitig vor." }
  regel: Auswirkung 5 ist immer vorrangig. Die Punkte sind keine Geldwerte und keine Freigabe.
  sonder: Fragen zur Sicherheit oder Genehmigung, fehlende Befugnisse und der drohende Verlust einer Handlungsoption werden unabhängig von der Matrix behandelt.
  wahrscheinlichkeit: [sehr gering, gering, mittel, hoch, sehr hoch]
  qualitaet:
    - Eine geringe Abweichung schränkt die Nutzung nicht ein.
    - Nacharbeit ist erforderlich; die vorgesehene Nutzung bleibt möglich.
    - Die Nutzung ist vorübergehend eingeschränkt.
    - Eine wichtige Teilfunktion bleibt erheblich eingeschränkt.
    - Eine wesentliche Funktion oder die vorgesehene Hauptnutzung fällt aus.
  beispiele:
    - { kennung: RIS-005, titel: Baupreissteigerung Holzbau, w: 3, a: 3 }
    - { kennung: RIS-009, titel: Holzbauelemente kommen zu spät (Auswirkung auf den Schulbetrieb), w: 4, a: 4 }
    - { kennung: RIS-014, titel: Angekündigte Mehrkosten der Haustechnikfirma, w: 3, a: 3 }
    - { kennung: RIS-021, titel: Kampfmittelverdacht im Baufeld der Sporthalle, w: 1, a: 5 }
    - { kennung: RIS-022, titel: Verzögerte Möbellieferung Mensa, w: 2, a: 2 }
vorgaenge:
  titel: Vorgangsarten und Wege
  kurz: Sechs Arten von Vorgängen – und wohin ein Vorgang als Nächstes führt.
  belege: [v24:hb-1, v24:hb-1.1, v24:hb-1.2, v24:hb-1.3, v24:hb-1.4, v24:hb-1.5, v24:hb-1.6, v24:hb-5]
  text: |
    Die Projektsteuerung erfasst und bearbeitet alle Vorgänge; der Bauherr pflegt keine Liste. Nicht jeder Hinweis wird zum Risiko, und nicht jeder Vorgang durchläuft alle Arten. Zusammengehörige Einträge werden verknüpft – die Herkunft geht nicht verloren.
  arten:
    - id: aufgabe
      titel: Aufgabe
      text: Geplante Arbeit mit vereinbartem Ergebnis, verantwortlicher Person und Termin.
      beispiel: AUF-001 – Kostenübersicht für den Haushaltsansatz 2027 an die Kämmerei bis Freitag.
      abschluss: Das vereinbarte Ergebnis liegt vor und ist verwendbar.
      wege: [risiko, problem, entscheidung]
    - id: fruehwarnung
      titel: Frühwarnung
      text: Ein Hinweis ist noch nicht ausreichend geklärt. Quelle sichern, Prüffrage und Wiedervorlage festlegen.
      beispiel: FRW-002 – ein Holzbauer erwähnt gegenüber der Generalplanung, dass die Lieferzeiten für Holzelemente länger werden; Prüffrage an die Hersteller.
      abschluss: Ein Klärungsergebnis liegt vor – oder der Hinweis wird mit Begründung geschlossen.
      wege: [risiko, problem, aufgabe]
    - id: risiko
      titel: Risiko
      text: Ein mögliches nachteiliges Ereignis oder eine unsichere Größe kann Projektziele beeinträchtigen. Bewerten, Gegenmaßnahmen verfolgen, verbleibende Unsicherheit sichtbar halten.
      beispiel: RIS-009 – die Lieferzeit der Holzbauelemente gefährdet Montagebeginn und Inbetriebnahme.
      abschluss: Das Ereignis ist eingetreten (weiter als Problem), die Eintrittsmöglichkeit ist entfallen oder die Wirkung ist nachweisbar beseitigt.
      wege: [massnahme, problem, entscheidung]
    - id: problem
      titel: Problem
      text: Ein nachteiliger Zustand ist bereits eingetreten. Folgen klären, Lösung organisieren, Ergebnis nachweisen – eine Wahrscheinlichkeit gibt es nicht mehr.
      beispiel: PRB-002 – Brandschutzauflagen zum Holzbau aus der Baugenehmigung.
      abschluss: Die vereinbarte Lösung ist umgesetzt und fachlich bestätigt, oder die weitere Bearbeitung ist ausdrücklich übernommen; offene Folgen bleiben sichtbar.
      wege: [massnahme, aenderung, risiko, entscheidung]
    - id: aenderung
      titel: Änderung
      text: Eine geltende Vorgabe soll bewusst angepasst werden. Ausgangsstand und Auswirkungen vergleichen; bis zur Freigabe gilt die bisherige Grundlage.
      beispiel: AEN-012 – die Schulleitung wünscht eine größere Mensa.
      abschluss: Der beschlossene neue Stand ist umgesetzt; abgelehnte Anträge bleiben mit Begründung nachvollziehbar.
      wege: [entscheidung, massnahme, risiko, problem]
    - id: massnahme
      titel: Maßnahme
      text: Gezielte Handlung, um einen Zustand zu klären, zu verbessern oder einen Beschluss umzusetzen. Umgesetzt und wirksam sind nicht dasselbe.
      beispiel: MAS-007 – vorgezogene Vergabe der Holzbauelemente.
      abschluss: Umsetzungs- und Wirkungsstand sind belegt; wirkt sie nicht, folgt eine Anpassung.
      wege: [aufgabe, entscheidung]
  entscheidung:
    titel: Entscheidung vorbereiten
    text: Mindestens zwei zulässige Optionen, gewichteter Vergleich, Empfehlung und Entscheidungstermin. Der Beschluss bleibt davon getrennt – er liegt bei der befugten Stelle des Bauherrn.
takt:
  titel: Takt
  kurz: Was jede Woche, jeden Monat und sofort geschieht.
  belege: [v24:hb-4]
  text: |
    In aktiven Zeiten von Planung und Ausführung gilt der Wochentakt; für ausdrücklich vereinbarte Ruhezeiten gilt ein eigener Rhythmus. Die regelmäßige Prüfung ersetzt keine dringliche Meldung.
  stufen:
    - id: sofort
      titel: Sofort
      wer: Projektsteuerung
      text: Dringliches wird sofort über den vereinbarten Meldeweg gemeldet und noch am selben Arbeitstag dokumentiert, sobald die unmittelbare Reaktion gesichert ist.
      beispiel: Zwei lose Gerüstanker an der Sporthalle nach dem Sturm – der Bauleiter sperrt sofort, die Projektsteuerung meldet über den vereinbarten Weg und dokumentiert am selben Tag.
    - id: woche
      titel: Jede Woche
      wer: Projektsteuerung
      text: Alle offenen Vorgänge kurz prüfen – neue Informationen, fehlende Rückmeldungen, überfällige Ergebnisse, Wirkung von Maßnahmen, ausstehende Freigaben. Vertieft wird, was sich verändert hat oder besonders klärungsbedürftig ist; ein Prüfvermerk mit Datum dokumentiert den Durchgang.
      beispiel: Montag – 46 offene Vorgänge durchgesehen, drei verändert, eine Frühwarnung neu.
    - id: monat
      titel: Jeden Monat
      wer: Bauherr und Projektsteuerung
      text: Ein Online-Termin von höchstens 60 Minuten und eine Zusammenfassung von höchstens einer Seite – wesentliche Veränderungen, blockierte Aufgaben, kritische Maßnahmen, ungeklärte Frühwarnungen, wesentliche Probleme und Änderungen, offene Entscheidungen und die benötigte Reaktion.
      beispiel: Monatstermin mit der Stadt – zwei offene Entscheidungen und die benötigte Reaktion besprochen; der Bericht verweist auf die Einträge in der Software.
    - id: ruhe
      titel: In Ruhezeiten
      wer: Projektsteuerung
      text: Wenn ausdrücklich vereinbart – monatliche Gesamtprüfung, neue nicht dringliche Hinweise binnen fünf Arbeitstagen, Termin nur bei Bedarf; der Kurzbericht bleibt.
      beispiel: In der vereinbarten Nachlaufzeit nach der Übergabe wird monatlich geprüft; der Monatsbericht kommt trotzdem.
glossar:
  titel: Glossar
  kurz: Die Begriffe der Minimum Viable Governance (MVG) auf einen Blick.

# ------------------------------------------------------------------------------------------------------------------
# Vier neue Werkzeuge (O-59, P18.3/P18.4). Regeln und Zahlen der Rechnung stehen in src/werkzeuge/, hier nur Texte und
# Beispiele. Jeder Satz mit Regelgehalt trägt `belege` (intern, nie sichtbar). Leser: der Vorlagen-Check spricht den
# Bauherrn an („Sie“), Wegweiser, Risiko-Bewerter und Monatsbericht sind unpersönlich (L-254). `erwartet` ist die
# Selbstprobe: der Übersetzer rechnet jedes Beispiel mit dem Kern nach.
vorlagencheck:
  titel: Vorlagen-Check
  kurz: Ist die Entscheidungsvorlage entscheidungsreif? Schritt für Schritt geprüft.
  belege: [v24:hb-3, v24:hb-3.1, v24:hb-5, v24:tlb-2.1, k9.4-l1, k6.4.1-p3]
  text: |
    Eine Entscheidungsvorlage ist entscheidungsreif, wenn die befugte Stelle mit ihr wirklich zwischen Wegen wählen kann. Die Projektsteuerung bereitet sie vor; Sie prüfen, ob alles darin steht, und lassen ergänzen, was fehlt.
  ampel:
    gruen: entscheidungsreif
    gelb: noch nicht entscheidungsreif
    rot: nicht vollständig
  schritte:
    - id: rahmen
      titel: Frage und Rahmen
      punkte:
        - { id: a1, muss: true, kurz: Frage als Wahl zwischen Wegen, frage: "Steht die Frage so da, dass sie mit der Wahl eines Wegs beantwortet wird?", schliessen: "Lassen Sie die Frage so fassen, dass die Antwort die Wahl eines Wegs ist.", belege: [v24:hb-3.1, k9.4-l1, k5.1-p2] }
        - { id: a2, muss: false, kurz: Warum der Bauherr entscheidet, frage: "Ist gesagt, warum der Bauherr entscheiden muss – und dass es keine Routinearbeit und kein reiner Prüfauftrag ist?", schliessen: "Lassen Sie in einem Satz ergänzen, warum das eine Entscheidung des Bauherrn ist, etwa weil Geld aus der Reserve gebraucht oder ein großes Risiko getragen würde.", belege: [v24:hb-3.1, v24:hb-1, v24:hb-1.1] }
        - { id: a3, muss: true, kurz: Befugte Stelle mit ihrem Rahmen, frage: "Ist die Stelle genannt, die entscheiden darf, mit ihrem Rahmen?", schliessen: "Lassen Sie die Stelle nennen, die nach dem Rahmen des Projekts entscheiden darf.", belege: [v24:hb-3.1, k9.4-l1] }
        - { id: a4, muss: true, kurz: Entscheidungstermin, frage: "Ist ein Entscheidungstermin genannt?", schliessen: "Lassen Sie das Datum nennen, bis zu dem entschieden sein muss – rechtzeitig, etwa vor dem Auftrag, der davon abhängt.", belege: [v24:hb-3.1, v24:hb-3.2, v24:va-3.5, v24:hb-5] }
        - { id: a5, muss: false, kurz: Folge einer späteren Entscheidung, frage: "Steht da, was passiert, wenn später entschieden wird?", schliessen: "Lassen Sie ergänzen, was eine spätere Entscheidung kostet oder verschiebt.", belege: [v24:hb-3.1] }
    - id: wege
      titel: Wege
      punkte:
        - { id: b1, muss: true, art: zaehlung, mindestens: 2, kurz: Mindestens zwei zulässige Wege, frage: "Gibt es mindestens zwei ernsthafte, zulässige Wege?", schliessen: "Fordern Sie einen zweiten Weg an, der wirklich zulässig ist – auch das bisherige Vorgehen zählt, wenn es zulässig ist. Bis dahin trägt die Vorlage den Vermerk „nicht vollständig“ und nennt, was noch geklärt wird.", belege: [v24:hb-3.1, v24:hb-1.5, v24:tlb-2.1] }
        - { id: b2, muss: false, kurz: Jeder Weg beschrieben, frage: "Sind für jeden Weg Vorgehen, Kosten, Zeit, Qualität und Nutzung, verbleibende Risiken, Annahmen und nötige Freigaben beschrieben?", schliessen: "Lassen Sie je Weg ergänzen, was er kostet, wie viel Zeit er braucht, was er für die Nutzung bedeutet, welches Risiko bleibt und welche Freigabe er braucht.", belege: [v24:hb-3.1, k9.4-l1, v24:va-3.2] }
        - { id: b3, muss: false, kurz: Zwingende Anforderungen vorab geprüft, frage: "Wurden Sicherheit, Genehmigung und Funktion vor dem Punktevergleich geprüft?", schliessen: "Lassen Sie die zwingenden Anforderungen vorab prüfen; ein Weg, der sie nicht erfüllt, kommt nicht in den Vergleich.", belege: [v24:hb-3.1] }
    - id: vergleich
      titel: Gewichteter Vergleich
      punkte:
        - { id: c1, muss: true, kurz: Gesichtspunkte und Gewichte vorher abgestimmt, frage: "Wurden Gesichtspunkte, Gewichte und Punktestufen vorher mit dem Bauherrn abgestimmt oder aus einer vorhandenen Festlegung übernommen – abgeleitet aus den Zielen des Projekts?", schliessen: "Fordern Sie an, dass Gesichtspunkte und Gewichte vor der Bewertung mit Ihnen abgestimmt oder aus einer vorhandenen Festlegung übernommen werden, abgeleitet aus den Zielen des Projekts.", belege: [v24:hb-3.1] }
        - { id: c2, muss: true, kurz: Punktwerte begründet, frage: "Hat jeder Punktwert einen Grund und einen Nachweis, und ist beschrieben, was jede Stufe bedeutet?", schliessen: "Lassen Sie zu jedem Punktwert Grund und Nachweis ergänzen und beschreiben, was jede Stufe bedeutet.", belege: [v24:hb-3.1] }
        - { id: c3, muss: false, kurz: "Euro, Tage und offene Fragen daneben", frage: "Stehen Euro, Tage und offene Fragen neben den Punkten – und ist nichts Fehlendes als null gezählt?", schliessen: "Lassen Sie Beträge und Tage neben die Punkte stellen und Fehlendes als offen markieren statt mit null.", belege: [v24:hb-3.1] }
        - { id: c4, muss: false, kurz: Andere Gewichte geprüft, frage: "Ist geprüft, ob andere vertretbare Gewichte die Rangfolge ändern?", schliessen: "Lassen Sie zeigen, bei welchem Gewicht ein anderer Weg vorn läge.", belege: [v24:hb-3.1, v24:hb-3.2, v24:tlb-2.1] }
    - id: empfehlung
      titel: Empfehlung
      punkte:
        - { id: d1, muss: true, kurz: Empfehlung begründet, frage: "Ist die Empfehlung begründet, mit Nachteilen, Unsicherheiten und Voraussetzungen?", schliessen: "Lassen Sie die Empfehlung begründen und auch ihre Nachteile und Voraussetzungen nennen.", belege: [v24:hb-3.1] }
        - { id: d2, muss: false, kurz: Empfehlung trägt fachlich, frage: "Trägt die Empfehlung auch fachlich – nicht nur über die Punktzahl?", schliessen: "Lassen Sie ergänzen, warum der Weg fachlich trägt; eine hohe Punktzahl allein ist noch kein Urteil.", belege: [v24:hb-3.1] }
        - { id: d3, muss: true, kurz: Beschluss bleibt offen, frage: "Bleibt der Beschluss offen – ohne dass Empfehlung, Schweigen oder ein Status in der Software als Beschluss gelten?", schliessen: "Achten Sie darauf, dass der Beschluss offen bleibt; er wird erst nach der Entscheidung der befugten Stelle mit Datum und Bedingungen festgehalten.", belege: [v24:hb-3.1, v24:va-4.2, k9.4-l1] }
    - id: grundlagen
      titel: Grundlagen
      punkte:
        - { id: e1, muss: true, kurz: Datenstand und Herkunft der Zahlen, frage: "Sind Datenstand und Quellen genannt?", schliessen: "Lassen Sie nennen, auf welchem Stand von Zahlen und Plänen die Vorlage beruht.", belege: [v24:hb-3.1, k9.4-l1, k4.6-p2, k5.1-p2] }
        - { id: e2, muss: false, kurz: Verweis auf den Vorgang, frage: "Verweist die Vorlage auf den Vorgang, aus dem sie entsteht?", schliessen: "Lassen Sie auf den Eintrag verweisen, aus dem die Entscheidung entsteht – etwa das Risiko, das Problem oder die Änderung.", belege: [v24:hb-3.1, v24:hb-5] }
        - { id: e3, muss: false, kurz: Ablage bei allen Vorgängen, frage: "Liegt die Vorlage dort, wo alle Vorgänge stehen, oder ist eindeutig darauf verwiesen?", schliessen: "Fordern Sie an, dass die Vorlage in der Software des Bauherrn abgelegt oder dort eindeutig auf sie verwiesen wird.", belege: [v24:hb-3.1, v24:hb-5] }
  stellen:
    - { id: sie, titel: "Sie (Projektleitung des Bauherrn)" }
    - { id: buergermeisterin, titel: Bürgermeisterin, ohneBeispiel: andere befugte Stelle des Bauherrn }
    - { id: lenkungskreis, titel: Lenkungskreis, ohneBeispiel: beratendes Gremium (berät nur), satz: "Ein beratendes Gremium berät nur; entscheiden darf die befugte Stelle des Bauherrn.", belege: [v24:hb-1, v24:hb-3.1] }
    - { id: projektsteuerung, titel: Projektsteuerung, satz: "Die Projektsteuerung bereitet vor und empfiehlt; entscheiden darf sie nicht.", belege: [v24:hb-3, v24:hb-3.1, v24:tlb-2.1, v24:va-4.1] }
    - { id: offen, titel: noch offen }
  wegzustaende:
    - { id: zulaessig, titel: zulässig }
    - { id: unzulaessig, titel: unzulässig, satz: "Ein unzulässiger Weg kann auch mit vielen Punkten nicht gewinnen.", belege: [v24:hb-3.1] }
    - { id: schein, titel: nur zum Schein, satz: "Ein Weg nur zum Schein zählt nicht als zweiter Weg.", belege: [v24:hb-3.1, v24:hb-1.5] }
    - { id: offen, titel: Zulässigkeit offen, satz: "Lassen Sie die Zulässigkeit fachlich bestätigen, bevor verglichen wird.", belege: [v24:hb-3.1] }
  dringlich: { frage: "Ist die Sache dringlich?", satz: "Dringliches wird gemeldet und gesichert, bevor die Vorlage fertig ist.", belege: [v24:hb-3.1, v24:hb-3, v24:hb-4] }
  gegenstaende:
    - { id: geld, titel: Geld }
    - { id: risiko, titel: Annahme eines großen Risikos }
    - { id: freigabe, titel: Freigabe am Ende einer Leistungsphase }
    - { id: ziele, titel: Ziele oder ihre Rangfolge }
  mandat:                     # nur bei geladenem Beispiel (O-46: nicht einstellbar), A-R5; Fall „Wer entscheidet was“
    belege: [fall, k4.2-p3, k9.3-p3, v24:hb-1, v24:hb-3, v24:hb-projektblatt]
    bis: 100000
    darueber: buergermeisterin
    reserve: buergermeisterin
    immer: { risiko: buergermeisterin, freigabe: buergermeisterin, ziele: buergermeisterin }
    beraet: [lenkungskreis]
    saetze:
      falsch: "Im Beispielprojekt entscheidet darüber die Bürgermeisterin: {grund}."
      gruende: { betrag: mehr als 100.000 Euro, reserve: Geld aus der Reserve, risiko: die Annahme eines großen Risikos, freigabe: die Freigabe am Ende einer Leistungsphase, ziele: die Ziele und ihre Rangfolge }
      beraet: { buergermeisterin: "Der Lenkungskreis berät nur; im Beispielprojekt entscheidet darüber die Bürgermeisterin.", sie: "Der Lenkungskreis berät nur; im Beispielprojekt entscheiden darüber Sie.", unbestimmt: "Der Lenkungskreis berät nur; wer entscheidet, hängt von Betrag und Herkunft des Geldes ab." }
      unbestimmt: "Lassen Sie Betrag und Herkunft des Geldes klären – davon hängt ab, wer entscheidet."
      selbst: "Im Beispielprojekt dürften Sie das selbst entscheiden: bis 100.000 Euro, ohne Reserve."
  beispiele:
    - id: lueftung-kurz
      titel: "Lüftungsanlage – nur das Ersatzgerät"
      lage: "Mai 2027: Der Hersteller der Lüftungsanlage für die Gesamtschule liefert vier Monate später. Die Vorlage nennt nur das Ersatzgerät, mit Preis und Liefertermin."
      quelle: k7
      gegenstand: geld
      stelle: buergermeisterin
      betrag: 400000
      reserve: true
      wege: [{ titel: Ersatzgerät, zustand: zulaessig }]
      antworten: { a1: teilweise, a2: teilweise, a3: ja, a4: nein, a5: nein, b2: teilweise, b3: ja, c1: nein, c2: nein, c3: nein, c4: nein, d1: teilweise, d2: nein, d3: ja, e1: teilweise, e2: nein, e3: ja }
      erwartet: rot
    - id: lueftung-voll
      titel: "Lüftungsanlage – alle drei Wege"
      lage: "Mai 2027: Dieselbe Lage. Die Vorlage vergleicht drei zulässige Wege – Ersatzgerät, Leihgeräte, späterer Einzug – nach vorher abgestimmten Gewichten; entscheiden muss die Bürgermeisterin bis Ende Mai."
      quelle: k7
      gegenstand: geld
      stelle: buergermeisterin
      betrag: 400000
      reserve: true
      wege: [{ titel: Ersatzgerät, zustand: zulaessig }, { titel: Leihgeräte, zustand: zulaessig }, { titel: Später einziehen, zustand: zulaessig }]
      antworten: { a1: ja, a2: ja, a3: ja, a4: ja, a5: ja, b2: ja, b3: ja, c1: ja, c2: ja, c3: ja, c4: ja, d1: ja, d2: ja, d3: ja, e1: ja, e2: ja, e3: ja }
      erwartet: gruen
    - id: mensa
      titel: Mensa für 450 statt 300 Essen
