id: s8
nr: 8
titel: Das Lüftungsgerät kommt später
kurztitel: Lüftungsgerät
datum: Januar 2028
monat: 25
lph: 8
kurzfassung: true
# Beträge und Tage wie im fiktiven Beispiel des Standards (L-193): 80.000 € / 7 Tage gegen 20.000 € / 28 Tage. Punkte nach den
# Skalen des Projektblatts (s1): Kosten 80 TEUR → 3, 20 TEUR → 5; Termin 7 Tage → 5, 28 Tage → 2.
# Dringliches sofort melden, am selben Arbeitstag dokumentieren (v24:hb-4); ein eingetretener Zustand ist ein Problem (v24:hb-1.4).
# Die Prognose liegt in s8 auf jedem Weg über der Projektbasis (Lage ≥ 58,83): Mehrkosten gehen zulasten der Risikoreserve, deren Einsatz
# nur der Bauherr freigibt (k3.2-t1; benötigte Freigaben in der Vorlage, v24:hb-3.1, v24:hb-3.2) – allgemeine Regel aus s1, wie in s3, s4, s6.
# Liegt die Prognose schon über Basis plus Reserve, deckt die Reserve nichts mehr; darüber braucht es die Neufestlegung der Projektbasis
# (k13-t1). Grund und Optionen sind deshalb wegneutral gefasst. Sachentscheidung im Mandat der PL (k4.2-p3).
belege: [v24:hb-1.4, v24:hb-3, v24:hb-3.1, v24:hb-3.2, v24:hb-4, k3.2-t1, k4.2-p3]
lage: |
  Das zentrale Lüftungsgerät der Gesamtschule kommt vier Wochen später; ein gleichwertiges Ersatzgerät wäre in einer Woche lieferbar.

  In derselben Woche ist ein Gerüstfeld an der Sporthalle nicht gesichert. Die Projektsteuerung meldet es sofort an Bauleitung und Sicherheitskoordination und informiert Sie; eine Stunde später ist das Feld gesperrt, dokumentiert am selben Tag.
# Die Neuausschreibung (s7 = B) war vertagt (offen +1); der Bericht meldet den Zuschlag. Die in s7 nötig gewordene Neufestlegung
# (s4 = A, s5 = B, offen +1) entfällt, wo die Prognose nach der Lage mit Spielraum für das Ersatzgerät wieder unter Basis plus Reserve
# liegt (Lage höchstens 61,22) – genau auf diesen Wegen (nachgerechnet, tests/geschichte.test.ts); sonst bleibt sie offen, wie bei s5 = C.
# R70: Bei s3 = A, s6 = A, s7 = B liegt die Lage bei 61,28 – nur knapp darunter; die Vorlage bleibt beim Lenkungskreis (offen bleibt 1),
# damit das Ende über 61,3 nach dem Ersatzgerät nicht ohne offene Neufestlegung dasteht. Der Bericht sagt es jeweils.
lage-folgen-bedingt:
  - { wenn: "s7=B", folgen: { offen: -1 } }
  - { wenn: "s4=A & s5=B & s7=C", folgen: { offen: -1 } }
  - { wenn: "s4=A & s5=B & s7=B & s3=B", folgen: { offen: -1 } }
bericht:
  titel: Monatsbericht · Januar 2028
  zeilen:
    - Dringliche Meldung am 11. Januar – Gerüstfeld gesperrt, Problem PRB-018.
    - Neues Problem PRB-019 – Lüftungsgerät vier Wochen später; Entscheidung bis 19. Januar.
    - text: Seit Mai 2026 – Brandschutzauflage umgesetzt (0,4 Mio. €, 7 Tage); Vergabe Holzbau 0,3 Mio. € über der Prognose; Freigaben zum Abschluss von LPH 5 bis 7 erteilt.
      wenn: kurz
    - text: Seit März 2027 – Lieferzeit Holzbau mit der Vergabe geklärt, 21 Wochen; der Montagebeginn liegt rund 35 Tage später (PRB-008). Die vertagte Entscheidung ist erledigt.
      wenn: kurz & s3=B
    - text: Freigabe zum Abschluss von LPH 7 im Mai 2027 vom Bauherrn erteilt.
      wenn: lang
    # R70: bei s7 = A ist die Lage in s8 die Lage in s7 – darüber deckte die Reserve den Mehrbetrag nur teilweise
    - text: Risikoreserve – 0,9 Mio. € für den Holzbau freigegeben; über 61,3 Mio. € hinaus deckt sie nichts.
      wenn: s7=A & kosten<=61.3
    - text: Risikoreserve – für den Holzbau freigegeben, soweit sie reichte; über 61,3 Mio. € hinaus deckt sie nichts.
      wenn: s7=A & kosten>61.3
    - text: Neuausschreibung Holzbau – Zuschlag im Mai 2027, rund 0,3 Mio. € unter dem ersten Angebot; der Montagebeginn liegt rund 42 Tage später, wie seit März 2027 im Terminpuffer. PRB-007 geschlossen, die vertagte Entscheidung erledigt.
      wenn: s7=B & s3!=B
    # R71: bei s3 = B lag der Montagebeginn schon rund 35 Tage später (PRB-008); der Puffer zählt beides
    - text: Neuausschreibung Holzbau – Zuschlag im Mai 2027, rund 0,3 Mio. € unter dem ersten Angebot; der Montagebeginn verschiebt sich um weitere rund 42 Tage, zusammen mit PRB-008 rund 77 Tage, wie seit März 2027 im Terminpuffer. PRB-007 geschlossen, die vertagte Entscheidung erledigt.
      wenn: s7=B & s3=B
    - text: Risikoreserve – 0,4 Mio. € für den Holzbau freigegeben; Bodenbeläge und Einbaumöbel einfacher vergeben, rund 0,5 Mio. € weniger. PRB-007 geschlossen.
      wenn: s7=C & s3!=A
    - text: Risikoreserve – für den Holzbau bleibt es bei den 0,6 Mio. € für den Elementzuschlag (Juli 2026); Montage und Ausbau brauchten keine weitere Freigabe, weil Bodenbeläge und Einbaumöbel rund 0,5 Mio. € günstiger vergeben wurden. PRB-007 geschlossen.
      wenn: s7=C & s3=A
    - text: Neufestlegung der Projektbasis – seit Mai 2026 offen. Die Hauptvergaben sind abgeschlossen, die Vorlage liegt beim Lenkungskreis; der Beschluss des Bauherrn und die Bestätigung durch den Stadtrat stehen noch aus.
      wenn: s5=C
    # Grenze Basis plus Reserve: über den Status der Lage (Statusbedingung), nicht über Wahlen – nachgerechnet über alle Wege.
    - text: Die Prognose liegt über Basis plus Reserve (61,3 Mio. €) – die Reserve reicht nicht mehr.
      wenn: s5=C & kosten>61.3
    - text: Die Prognose liegt wieder unter Basis plus Reserve (61,3 Mio. €); der Spielraum ist klein.
      wenn: s4=A & s5=C & kosten<=61.3
    - text: Neufestlegung der Projektbasis – nötig, weil die Prognose über Basis plus Reserve (61,3 Mio. €) liegt; die Vorlage liegt beim Lenkungskreis, der Beschluss des Bauherrn steht noch aus.
      wenn: s5=B & kosten>61.3
    - text: Die Prognose liegt wieder unter Basis plus Reserve (61,3 Mio. €) – die Neufestlegung der Projektbasis ist nicht mehr nötig, die Vorlage zurückgezogen. Der Spielraum ist klein.
      wenn: s4=A & s5=B & kosten<=61.22
    - text: Die Prognose liegt wieder unter Basis plus Reserve (61,3 Mio. €), aber nur knapp. Die Vorlage zur Neufestlegung der Projektbasis bleibt deshalb beim Lenkungskreis; der Beschluss des Bauherrn steht noch aus.
      wenn: s4=A & s5=B & kosten>61.22 & kosten<=61.3
    # Erst das Ersatzgerät (+0,08) höbe die Prognose über die Grenze: Lage über 61,22 und höchstens 61,3.
    - text: Achtung – mit dem Ersatzgerät (+0,08 Mio. €) läge die Prognose über Basis plus Reserve (61,3 Mio. €); dann reicht die Reserve nicht mehr.
      wenn: kosten>61.22 & kosten<=61.3
    - text: Terminpuffer überschritten – die Inbetriebnahme zum Schuljahr 2028/29 ist nach heutigem Stand nicht zu halten, die Förderfrist gefährdet.
      wenn: puffer<0
  reaktion: Bitte entscheiden Sie zwischen Ersatzgerät und Abwarten.
vorgaenge:
  - art: problem
    kennung: PRB-018
    titel: Gerüstfeld Sporthalle nicht gesichert
    text: Sofort an Bauleitung und Sicherheitskoordination gemeldet, Feld gesperrt, am selben Arbeitstag dokumentiert. Geschlossen, als die Bauleitung die Sicherung bestätigt hat.
    verantwortlich: Bauleitung; Meldung und Dokumentation Projektsteuerung
    termin: 11. Januar
    stand: geschlossen
  - art: problem
    kennung: PRB-019
    titel: Lüftungsgerät vier Wochen später
    text: Neuer Liefertermin des Herstellers. Ohne Gegenmaßnahme verschieben sich Inbetriebnahme der Lüftung und Abnahme der Gesamtschule um rund 28 Tage.
    verantwortlich: Projektsteuerung; Fachbeitrag Haustechnikplanung
    termin: 19. Januar
    stand: Vorlage liegt vor
vorlage:
  art: optionen
  frage: Ersatzgerät oder Lieferung abwarten?
  grund: |
    Beide Wege sind gleichwertig, bestätigt von der Haustechnikplanung; es geht um Geld gegen Zeit. Mehrkosten gehen zulasten der Risikoreserve, soweit sie reicht; darüber hinaus braucht es die Neufestlegung der Projektbasis durch den Bauherrn.
  stelle: Sie als Bauherren-PL – im Mandat bis 100 TEUR; Mehrkosten aus der Reserve gibt der Bauherr frei
  termin: 19. Januar 2028
  verzug: Nach dem 19. Januar ist das Ersatzgerät nicht mehr in einer Woche lieferbar.
  muss: Beide Optionen erfüllen Funktion, Brandschutz und Hygieneanforderungen.
  optionen:
    - id: A
      titel: Ersatzgerät
      text: Das gleichwertige Gerät eines anderen Herstellers wird bestellt.
      punkte:
        kosten: [3, "+0,08 Mio. €"]
        termin: [5, "rund 7 Tage Verzug"]
        qualitaet: [5, "volle Funktion"]
        klima: [4, "gleiche Effizienz"]
      folgen: { kosten: 0.08, puffer: -7 }
      konsequenz: Die Projektsteuerung legt die Freigabe der 0,08 Mio. € noch am selben Tag Dr. Olbers vor – aus der Reserve, soweit sie reicht, sonst als Teil der Neufestlegung der Projektbasis – und dokumentiert sie getrennt vom Beschluss. Bestellt wird über den Vertragsweg der Haustechnik; die Projektsteuerung verfolgt Lieferung und Einbau.
    - id: B
      titel: Abwarten
      text: Die ursprüngliche Lieferung wird abgewartet.
      punkte:
        kosten: [5, "+0,02 Mio. € Vorhaltekosten"]
        termin: [2, "rund 28 Tage Verzug"]
        qualitaet: [5, "volle Funktion"]
        klima: [4, "gleiche Effizienz"]
      folgen: { kosten: 0.02, puffer: -28 }
      konsequenz: Die Baustelle stellt um; die 0,02 Mio. € Vorhaltekosten gibt der Bauherr frei – aus der Reserve, soweit sie reicht, sonst als Teil der Neufestlegung der Projektbasis. Die Projektsteuerung führt das Terminrisiko für den Schulstart im Register und legt es im nächsten Monatstermin vor.
  empfehlung:
    option: A
    text: Die Projektsteuerung empfiehlt das Ersatzgerät – mit „Termin vor Kosten“ 57 zu 48, mit „Ausgewogen“ 59 zu 55. Achtung – bei „Kosten vor Termin“ dreht sich die Rangfolge knapp (53 zu 54).
folge: |
  Eine hohe Punktzahl ersetzt kein Urteil. Deshalb nennt die Empfehlung, bei welchen Gewichten sie kippt.
so-laeuft-es-oft: |
  Die Lieferverzögerung wird auf der Baustelle gelöst – irgendwie; der Bauherr erfährt davon, wenn die Abnahme platzt. Vom ungesicherten Gerüstfeld erfährt der Bauherr erst aus dem Bautagebuch.
einwand:
  frage: „So eine Entscheidung trifft doch die Bauleitung.“
  antwort: Die Bauleitung sagt, was technisch geht. Ob rund 60.000 € mehr drei Wochen Vorsprung wert sind, entscheidet der Bauherr – im Mandat Sie. Die Projektsteuerung legt es rechtzeitig und vollständig vor.
theorie: entscheidungsvorlage
regie:
  notiz: In der Gegenprobe Kosten auf 5 und Termin auf 3 stellen („Kosten vor Termin“) – die Rangfolge dreht sich knapp (53 zu 54). Die dringliche Meldung zeigt, dass Sicherheit nicht auf eine Vorlage wartet; der Vorgang ist ein Problem, weil der Zustand schon eingetreten war.
  leitfragen:
    - Welche Rangfolge hätten Sie hier gewählt?
