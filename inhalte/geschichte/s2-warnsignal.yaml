dahinter: "Nicht jeder Hinweis wird zum Risiko – aber jeder wird geklärt, bis feststeht, was daraus wird. Wer ihn liegen lässt, erfährt vom Holz erst, wenn es fehlt; wer jeden Hinweis gleich zum Risiko macht, setzt Zahlen in die Welt, die niemand belegen kann."

vertiefung:
  form: nachdenken
  titel: Wann wird aus einem Hinweis ein Risiko?
  text:
    - "Ein Hinweis steht seit drei Wochen auf der Liste: Die Frage ist offen, niemand hat geantwortet. Ist das schon ein Risiko? Und was sollte jetzt geschehen?"
  antwort:
    - "Noch nicht. Solange nicht geklärt ist, ob etwas dran ist, bleibt der Hinweis eine Frühwarnung, mit einer Frage, einer Person und einem Termin. Bleibt die Grundlage offen, bleibt auch die Frühwarnung offen; jede Woche wird sie neu angeschaut."
    - "Nach der Klärung gibt es vier Wege. Kann etwas eintreten, wird ein Risiko daraus und jetzt erst bewertet. Ist es schon passiert, wird es ein Problem. Ist es eine konkrete Arbeit, wird es eine Aufgabe. Stellt sich der Hinweis als unbegründet heraus, wird er geschlossen, und der Grund steht dabei."
    - "Warum so früh eine Frage und kein Urteil? Ein Gespräch auf einer Messe ist keine Quelle, auf die man eine Zahl stützen kann. Die Prüffrage sagt ehrlich, was fehlt: Wie lang sind die Lieferzeiten wirklich? Erst die Antwort macht aus der Vermutung etwas, das man bewerten kann."
    - "Wichtig ist die Herkunft: Wer später fragt, woher das Risiko kommt, findet den ersten Hinweis. Bei den Holzelementen wäre ohne ihn nur noch eine Zahl übrig geblieben."
