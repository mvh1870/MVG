# Station 1 (P16.7a). Belege intern, nie sichtbar (O-38).
id: s1
nr: 1
titel: Übernahme mit Projektblatt
kurztitel: Übernahme
datum: Januar 2026
monat: 1
lph: 4
kurzfassung: true
belege: [v24:hb-1, v24:hb-3.1, v24:hb-4, v24:hb-projektblatt, v24:tlb-2, k4.2-p3, k4.6-p2]
lage: |
  Ihr erster Tag. Ihre Vorgängerin ist schon weg, die Unterlagen liegen in drei Ablagen. Die Kämmerei braucht bis Freitag den Haushaltsansatz 2027 und fragt, ob Baupreissteigerungen eingepreist sind. Aus dem Stadtrat kommt die Frage, ob die Zahl des Ratsbeschlusses noch gilt.

  Um zehn Uhr sitzt Jonas Brenner von der Projektsteuerung bei Ihnen. Er bringt keinen Ordner mit, sondern einen Entwurf des Projektblatts – und eine Liste dessen, was er schon angelegt hat.
bericht:
  titel: Auftakt · Januar 2026
  zeilen:
    - Alle Vorgänge stehen ab heute in der Projektsoftware der GML – eine Ablage statt drei.
    - Erster abgestimmter Bestand bis 30. Januar.
    - Haushaltsansatz 2027 für die Kämmerei bis Freitag, aus der Kostenprognose 2026-01 · Version 1.
    - Offen ist die Annahme zur Baupreissteigerung; das Controlling klärt sie bis 20. Januar.
  reaktion: Bitte legen Sie fest, nach welchen Zielen künftige Vorlagen abgewogen werden.
vorgaenge:
  - art: aufgabe
    kennung: AUF-001
    titel: Haushaltsansatz 2027 für die Kämmerei
    text: Mittelabfluss je Jahr und Gesamtkosten aus dem benannten Datenstand.
    verantwortlich: Projektsteuerung
    termin: Freitag, 9. Januar
    stand: in Arbeit
  - art: fruehwarnung
    kennung: FRW-001
    titel: Baupreissteigerung nicht belegt
    text: Die Kostenberechnung rechnet mit einer Annahme zur Baupreissteigerung, die niemand mehr belegen kann. Prüffrage an das Controlling, Wiedervorlage am 20. Januar.
    verantwortlich: Aylin Kaya, Controlling
    termin: 20. Januar
    stand: offen
  - art: aufgabe
    kennung: AUF-002
    titel: Erster abgestimmter Bestand
    text: Unterlagen aus drei Ablagen sichten, Lücken benennen, alle offenen Punkte als Vorgänge erfassen.
    verantwortlich: Projektsteuerung
    termin: 30. Januar
    stand: in Arbeit
vorlage:
  art: gewichte
  frage: Nach welchen Zielen werden künftige Vorlagen abgewogen?
  grund: |
    Ohne festgelegte Rangfolge wird jede Abwägung zum Streit über die Gewichte. Deshalb stimmt die Projektsteuerung Kriterien und Gewichte vorab mit Ihnen ab – bevor eine einzige Option bewertet wird. Spätere Vorlagen nutzen diese Gewichte und sagen offen, ob andere vertretbare Gewichte die Rangfolge ändern würden.
  stelle: Sie, Projektleitung der GML; bestätigt im Lenkungskreis
  termin: 30. Januar 2026
  verzug: Ohne Festlegung muss jede Vorlage ihre Gewichte selbst begründen – und jede Entscheidung wird angreifbar.
  optionen:
    - id: A
      titel: Termin vor Kosten
      text: Die Förderfrist zählt am meisten. Gewichte Kosten 3, Termin 5, Qualität und Funktion 3, Klima und Betrieb 2.
      gewichte: { kosten: 3, termin: 5, qualitaet: 3, klima: 2 }
      folgen: {}
      konsequenz: Der Termin wiegt am schwersten. Wer später teurer, aber pünktlich ist, hat einen Vorteil – die Vorlagen machen das sichtbar.
    - id: B
      titel: Kosten vor Termin
      text: Die Zahl des Ratsbeschlusses zählt am meisten. Gewichte Kosten 5, Termin 3, Qualität und Funktion 3, Klima und Betrieb 2.
      gewichte: { kosten: 5, termin: 3, qualitaet: 3, klima: 2 }
      folgen: {}
      konsequenz: Die Kosten wiegen am schwersten. Optionen, die Geld sparen und Zeit kosten, rücken nach vorn – die Vorlagen zeigen, wann das die Förderfrist gefährdet.
    - id: C
      titel: Ausgewogen
      text: Kosten und Termin gleich wichtig. Gewichte Kosten 4, Termin 4, Qualität und Funktion 3, Klima und Betrieb 3.
      gewichte: { kosten: 4, termin: 4, qualitaet: 3, klima: 3 }
      folgen: {}
      konsequenz: Kosten und Termin wiegen gleich. Viele Vorlagen werden knapp ausgehen – umso wichtiger ist, dass die Projektsteuerung sagt, wann eine kleine Verschiebung der Gewichte die Rangfolge kippt.
  empfehlung:
    option: A
    text: Die Projektsteuerung empfiehlt „Termin vor Kosten“, weil der Förderbescheid die Inbetriebnahme zum Schuljahr 2028/29 verlangt. Nachteil – teurere Wege werden leichter akzeptiert; das Kostenziel bleibt deshalb mit Gewicht 3 im Spiel.
folge: |
  Die Projektsteuerung trägt die Gewichte ins Projektblatt ein. Zusammen mit den Bewertungsgrenzen für Wahrscheinlichkeit, Kosten und Termin und den Entscheidungsschwellen des Mandats gilt das Projektblatt für alle weiteren Vorlagen.
so-laeuft-es-oft: |
  Die Ziele stehen irgendwo im Projekthandbuch: Kosten, Termine, Qualität, Nachhaltigkeit – ohne Rangfolge. Erst wenn zwei Ziele kollidieren, wird verhandelt, und dann gewinnt, wer am lautesten ist oder zuletzt im Raum war.
einwand:
  frage: „Gewichte vorab festlegen? Das hängt doch vom Einzelfall ab.“
  antwort: Deshalb prüft jede Vorlage, ob andere vertretbare Gewichte die Rangfolge ändern würden, und sagt es offen. Die festgelegten Gewichte verhindern nur, dass man sie nachträglich an die gewünschte Option anpasst.
theorie: entscheidungsvorlage
regie:
  notiz: Hier wird der Rahmen gesetzt. Den Regler ruhig zeigen – er gilt ab jetzt für jede Vorlage. Betonen, dass der Bauherr keine Liste pflegt.
  leitfragen:
    - Wie würden Sie die Ziele Ihres aktuellen Projekts gewichten?
    - Wer entscheidet bei Ihnen heute, wenn Kosten und Termin kollidieren?
