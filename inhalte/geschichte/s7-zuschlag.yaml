# 7 · Der Zuschlag (Drehbuch docs/drehbuch-v2/02-akt-2.md, Station 7)
# Kern: Die Freigabe der Bürgermeisterin erlaubt den nächsten Schritt; bestellt wird über die Vergabestelle (v24:va-4.2, v24:tlb-5).
# Eine Mappe zeigt Frage und Termin, mindestens zwei Wege und die Frist des Angebots (v24:hb-3.1); eine Chance steht für sich (v24:hb-3).
# Szene Zeile 2 ist das Echo E3 (Quelle Station 3). Station 7 erzeugt kein Echo.
# Auf jedem Weg: Zuschlag im September, Preisnachlass als Chance geführt, bestellt über die Vergabestelle; nirgends ein Hinweis,
# man könne den Hersteller nachträglich wechseln (k5.5-p1: keine Vergaberechtsprüfung).
# Mini-Aufgabe (mappe), Belege je Karte: 1 v24:hb-3.1 · 2 v24:hb-3.1, v24:tlb-3 · 3 k10.5-t1 · 4 v24:hb-3 · 5 v24:va-4.2, v24:tlb-5
