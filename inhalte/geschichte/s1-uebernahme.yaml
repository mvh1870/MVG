# Station 1 (P16.7a). Belege intern, nie sichtbar (O-38).
# Projektblatt vor der Ausschreibung von der befugten Stelle des Auftraggebers festgelegt, mit Grenzen und Schwellen
# (v24:hb-projektblatt, v24:va-7.1); Kriterien und Gewichte vor der Bewertung mit dem Auftraggeber abgestimmt (v24:hb-3.1).
id: s1
nr: 1
titel: Übernahme mit Projektblatt
kurztitel: Übernahme
datum: Januar 2026
monat: 1
lph: 4
kurzfassung: true
belege: [v24:hb-1, v24:hb-3.1, v24:hb-4, v24:hb-projektblatt, v24:va-7.1, v24:tlb-2, k4.2-p3, k4.6-p2]
lage: |
  Ihr erster Tag. Die Vorgängerin ist weg, die Unterlagen liegen in drei Ablagen, die Kämmerei braucht bis Freitag den Haushaltsansatz 2027.

  Jonas Brenner von der Projektsteuerung bringt das Projektblatt mit, das die GML vor seiner Beauftragung festgelegt hat – mit Bewertungsgrenzen und Entscheidungsschwellen. Offen sind nur die Gewichte für den Vergleich von Optionen.
bericht:
  titel: Monatsbericht · Januar 2026 (Auftakt)
  zeilen:
    - Alle Vorgänge stehen ab heute in der Software der GML – eine Ablage statt drei.
    - Erster abgestimmter Bestand bis 30. Januar.
    - Haushaltsansatz 2027 bis Freitag, aus der Kostenprognose 2026-01 · Version 1.
    - Die Annahme zur Baupreissteigerung klärt das Controlling bis 20. Januar.
  reaktion: Bitte legen Sie die Gewichte für künftige Vorlagen fest.
vorgaenge:
  - art: aufgabe
    kennung: AUF-001
    titel: Haushaltsansatz 2027 für die Kämmerei
    text: Mittelabfluss je Jahr und Gesamtkosten aus dem benannten Datenstand.
    verantwortlich: Projektsteuerung
    termin: Freitag, 9. Januar
    stand: in Arbeit
  - art: fruehwarnung
    kennung: FRW-001
    titel: Baupreissteigerung nicht belegt
    text: Die Annahme zur Baupreissteigerung in der Kostenberechnung kann niemand mehr belegen. Prüffrage an das Controlling.
    verantwortlich: Aylin Kaya, Controlling
    termin: 20. Januar
    stand: offen
  - art: aufgabe
    kennung: AUF-002
    titel: Erster abgestimmter Bestand
    text: Drei Ablagen sichten, Lücken benennen, offene Punkte als Vorgänge erfassen.
    verantwortlich: Projektsteuerung
    termin: 30. Januar
    stand: in Arbeit
vorlage:
  art: gewichte
  frage: Nach welchen Zielen werden künftige Vorlagen abgewogen?
  grund: |
    Kriterien und Gewichte stimmt die Projektsteuerung mit dem Bauherrn ab, bevor sie eine Option bewertet. Grenzen und Schwellen stehen schon im Projektblatt. Jede spätere Vorlage sagt, ob andere vertretbare Gewichte die Rangfolge ändern würden.
  stelle: GML – Sie als Bauherren-PL
  termin: 30. Januar 2026
  verzug: Ohne Festlegung begründet jede Vorlage ihre Gewichte selbst – und wird angreifbar.
  optionen:
    - id: A
      titel: Termin vor Kosten
      text: Die Förderfrist zählt am meisten. Gewichte Kosten 3, Termin 5, Qualität und Funktion 3, Klima und Betrieb 2.
      gewichte: { kosten: 3, termin: 5, qualitaet: 3, klima: 2 }
      folgen: {}
      konsequenz: Der Termin wiegt am schwersten. Wer teurer, aber pünktlich ist, hat einen Vorteil – die Vorlagen zeigen es.
    - id: B
      titel: Kosten vor Termin
      text: Die Zahl des Ratsbeschlusses zählt am meisten. Gewichte Kosten 5, Termin 3, Qualität und Funktion 3, Klima und Betrieb 2.
      gewichte: { kosten: 5, termin: 3, qualitaet: 3, klima: 2 }
      folgen: {}
      konsequenz: Die Kosten wiegen am schwersten. Optionen, die Geld sparen und Zeit kosten, rücken nach vorn – die Vorlagen zeigen, wann das die Förderfrist gefährdet.
    - id: C
      titel: Ausgewogen
      text: Kosten und Termin gleich wichtig. Gewichte Kosten 4, Termin 4, Qualität und Funktion 3, Klima und Betrieb 3.
      gewichte: { kosten: 4, termin: 4, qualitaet: 3, klima: 3 }
      folgen: {}
      konsequenz: Kosten und Termin wiegen gleich. Viele Vorlagen gehen knapp aus – umso wichtiger, dass die Projektsteuerung sagt, wann eine kleine Verschiebung die Rangfolge kippt.
  empfehlung:
    option: A
    text: Die Projektsteuerung empfiehlt „Termin vor Kosten“ – der Förderbescheid verlangt die Inbetriebnahme zum Schuljahr 2028/29. Nachteil – teurere Wege werden leichter akzeptiert; die Kosten bleiben mit Gewicht 3 im Spiel.
folge: |
  Die Projektsteuerung dokumentiert die festgelegten Gewichte in der Software. Mit den Grenzen und Schwellen des Projektblatts gelten sie für alle weiteren Vorlagen.
so-laeuft-es-oft: |
  Die Ziele stehen im Projekthandbuch, ohne Rangfolge. Erst wenn zwei kollidieren, wird verhandelt – und oft setzt sich die Sicht durch, die gerade am Tisch sitzt.
einwand:
  frage: „Gewichte vorab festlegen? Das hängt doch vom Einzelfall ab.“
  antwort: Deshalb sagt jede Vorlage offen, ob andere vertretbare Gewichte die Rangfolge ändern würden. Feste Gewichte verhindern nur, dass man sie nachträglich der gewünschten Option anpasst.
theorie: entscheidungsvorlage
regie:
  notiz: Hier wird der Rahmen gesetzt. Das Projektblatt mit Grenzen und Schwellen hat die GML vor der Beauftragung der Projektsteuerung festgelegt; die Projektsteuerung bringt nur die Gewichte zur Abstimmung. Den Regler ruhig zeigen – er gilt ab jetzt für jede Vorlage. Betonen, dass der Bauherr keine Liste pflegt.
  leitfragen:
    - Wie würden Sie die Ziele Ihres aktuellen Projekts gewichten?
    - Wer entscheidet bei Ihnen heute, wenn Kosten und Termin kollidieren?
