id: abb-14
quelle: bilder/image14.jpeg
titel: Wo MVG je nach Bauherr und Projektlage ansetzt
alt: >-
  Die Abbildung zeigt, wo MVG je nach Bauherr ansetzt: bei öffentlichen Bauherren, bei privaten und institutionellen
  Bauherren, bei Energie- und Infrastrukturträgern und bei Projekten, die langsam die Kontrolle verlieren. Vier Felder
  mit Pfeilen führen zu einem Kreis, in dessen Mitte die Entscheidungsvorlage steht, dazu Freigabelogik und der Weg nach
  oben.
