prolog:
  titel: Sie vertreten den Bauherrn
  text: |
    Die Stadt Lindenhall baut einen Schulcampus: Gesamtschule, Grundschule, Dreifeldsporthalle, als Holzhybridbau. Projektbasis 58,4 Mio. € brutto, dazu 2,9 Mio. € Risikoreserve, die nur der Bauherr freigibt. Der Förderbescheid verlangt die Inbetriebnahme zum Schuljahr 2028/29.

    Sie übernehmen im Januar 2026 die Projektleitung auf Bauherrenseite (Bauherren-PL) bei der Gebäudemanagement Lindenhall GmbH (GML). Listen pflegen Sie nicht – das macht die Projektsteuerung um Jonas Brenner: Sie erfasst jeden Vorgang, prüft jede Woche den offenen Bestand und bereitet jede erforderliche Entscheidung als Vorlage vor, mit mindestens zwei Optionen und gewichtetem Vergleich.

    Sie entscheiden – oder tragen die Vorlage mit Ihrer Empfehlung zur befugten Stelle: zum Bauherrn (Dr. Miriam Olbers, im Lenkungskreis) oder ins Änderungsgremium. Hier folgt sie Ihrer Empfehlung.
  takt: |
    Dringliches meldet die Projektsteuerung sofort. Monatlich: ein Online-Termin von höchstens 60 Minuten, ein Bericht von höchstens einer Seite.
ende:
  titel: Schulstart
  text: |
    August 2028 – das Schuljahr 2028/29 beginnt. Jede Frage, jede Option, jeder Beschluss steht mit Datum in der Software der GML – und was daraus geworden ist. Ihr Aufwand: ein Termin im Monat, eine Seite Bericht, die Vorlagen.
  puffer-gut: Der Schulstart zum Schuljahr 2028/29 ist gehalten – die Schulleitung bekommt die Schlüssel.
  puffer-knapp: Der Schulstart ist gehalten, mit kaum noch Puffer – die Schulleitung bekommt die Schlüssel.
  puffer-schlecht: Die Inbetriebnahme zum Schuljahr 2028/29 ist nicht zu halten; die Förderfrist ist gefährdet.
