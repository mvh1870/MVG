einstieg: |
  Juni 2026, früher Abend. Die Bodenplatte der Gesamtschule ist gegossen, ein gelber Kran dreht sich über den ersten Wänden. Hanna Klingel kommt mit roten Wangen in den Container, in der Hand neue Zahlen für den Ganztag.

einstieg-kurz: |
  Juni 2026. Nach dem Schulfest bringt Hanna Klingel neue Zahlen für den Ganztag.

szene:
  - { figur: klingel, text: "Ich habe wunderbare Nachrichten: Der Ganztag wächst! Wir brauchen eine größere Mensa – für 450 Essen statt 300." }
  # Zeile 2: lange Fassung „vor allen Eltern“ (stützt Echo E6), Kurzfassung die alte Zeile (text-kurz)
  - figur: schwung
    text: "Hab ich ihr beim Schulfest schon gesagt, vor allen Eltern: Das kriegen wir hin."
    text-kurz: "Hab ich ihr beim Schulfest schon gesagt: Das kriegen wir hin."
  - { figur: faden, text: "Eine größere Mensa kostet rund 600.000 Euro mehr und vier Wochen Umplanung. Es gibt einen zweiten Weg: die Mensa jetzt so bauen, dass sie später wachsen kann. Das kostet etwa 150.000 Euro mehr." }
  - { figur: klingel, kurzfassung: false, text: "Ich weiß: Die Glocke läutet erst im neuen Haus. Aber meine Kinder essen im Stehen auf dem Flur – später ist immer zu spät." }
  # R76: bleibt in der Kurzfassung – die gute und die vertretbare Folge greifen die Fundamente auf (L-234)
  - { figur: lot, text: "Wenn umgeplant wird, dann bevor ich die Fundamente der Mensa gieße – nicht danach." }

frage: Die Schule hat gute Gründe, das Budget hat Grenzen, und der Architekt hat schon „Das kriegen wir hin“ gesagt. Was tun Sie?

antworten:
  - wertung: falle
    text: "Die Zusage vom Schulfest gilt – die Kinder brauchen die Mensa. Der Architekt soll gleich umplanen, das spart Zeit."
    balken: { geld: -2, zeit: -1, vertrauen: -2 }
    bild: wegweiser
    folge: |
      Konrad Schwung fängt sofort an, die große Mensa zu planen. Clara Faden nimmt den Wunsch als Änderung auf und meldet der Bürgermeisterin noch in derselben Woche: Hier wird ohne Beschluss umgeplant. Die Bürgermeisterin fragt, wer das beschlossen hat – niemand. Eine Zusage am Rand eines Schulfests ist kein Beschluss.

      Die Projektsteuerin legt beide Wege vor, der Lenkungskreis berät, und die Bürgermeisterin entscheidet für die Mensa, die später wachsen kann. Die Planung, die umsonst war, hat Wochen an Arbeit gekostet.

      Gisela Grundstein sagt: „{echo: E1}“
  - wertung: gut
    text: "Die Projektsteuerin legt den Wunsch als Änderung mit beiden Wegen der Bürgermeisterin vor. Bis dahin gilt die bisherige Planung."
    balken: { geld: -1, zeit: 0, vertrauen: 2 }
    bild: stempel
    # Die Zeilen über Antrag, Lenkungskreis und „Ich weiß, woran ich bin“ stehen nur auf dem ganzen Weg; die Echo-Zeile steht auf beiden
    folge:
      - { text: "Clara Faden schreibt den Antrag auf und vergleicht beide Wege nach den abgestimmten Gesichtspunkten. Im Lenkungskreis hört die Bürgermeisterin die Schule und die Finanzabteilung der Stadt.", kurzfassung: false }
      - "Die Bürgermeisterin entscheidet: Die Mensa wird so gebaut, dass sie später wachsen kann; das Geld kommt aus der Reserve."
      - "Gisela Grundstein sagt: „{echo: E1}“"
      - { text: "Und: „Zwei Wege, klare Zahlen – ich weiß, woran ich bin.“", kurzfassung: false }
      - "Hanna Klingel ist nicht ganz zufrieden – und Theo Lot gießt die Fundamente so, dass die Mensa später wachsen kann."
  - wertung: vertretbar
    text: "Erst die Anmeldezahlen für den Ganztag abwarten – dann weiß man, wie groß der Bedarf wirklich ist."
    balken: { geld: -1, zeit: -1, vertrauen: 0 }
    bild: kalender
    folge: |
      Clara Faden hat den Antrag aufgenommen und warnt: Die Fundamente der Mensa werden bald gegossen. Aber die Anmeldezahlen kommen erst Ende Juni. Bis dahin ruht die Planung der Mensa, und Theo Lot muss mit dem Beton warten.

      Dann bestätigen die Zahlen den Bedarf. Die Bürgermeisterin entscheidet noch im Juni, nachdem der Lenkungskreis beraten hat: Die Mensa wird so gebaut, dass sie später wachsen kann, das Geld kommt aus der Reserve. Die Schule hat bis zuletzt auf diese Antwort gewartet.

      Gisela Grundstein sagt: „{echo: E1}“

gut: |
  Ein Wunsch, der den geltenden Stand ändert, wird als Änderung aufgenommen – mit Anlass, bisheriger Planung, Kosten und Zeit.

  Er wird mit mindestens zwei Wegen der Stelle vorgelegt, die entscheiden darf. Bis dahin gilt die bisherige Planung; eine beiläufige Zusage ersetzt keinen Beschluss.

mini:
  art: zuordnen
  titel: Wer entscheidet das?
  aufgabe: "Sechs Fragen, drei Möglichkeiten. Wer entscheidet?"
  bild: kaertchen
  wahlen:
    - { id: sie, titel: Sie, figur: sie }
    - { id: buergermeisterin, titel: Bürgermeisterin, figur: grundstein }
    - { id: projektsteuerin, titel: Projektsteuerin, figur: faden, falsch: "Die Projektsteuerin bereitet das vor und empfiehlt – entscheiden darf sie es nicht." }
  posten:
    - { text: "Eine kleine Planänderung im Lehrerzimmer für 30.000 Euro, die das Budget ohne Reserve trägt", bild: grundriss, loesung: sie, erklaerung: "Das liegt in Ihrem Rahmen: bis 100.000 Euro, ohne Einsatz der Reserve." }
    - { text: "Die größere Mensa für 600.000 Euro", bild: mensateller, loesung: buergermeisterin, erklaerung: "Mehr als 100.000 Euro, und das Geld käme aus der Reserve. Der Lenkungskreis berät sie." }
    - { text: "150.000 Euro aus der Reserve für die früher ausgeschriebenen Holzelemente", bild: holzstapel, loesung: buergermeisterin, erklaerung: "Mehr als 100.000 Euro, und das Geld kommt aus der Reserve. Über die Reserve entscheidet die Bürgermeisterin immer – auch bei kleinen Beträgen." }
    - { text: "Die Freigabe der fertigen Baupläne", bild: stempel, loesung: buergermeisterin, erklaerung: "Jede Freigabe am Ende eines großen Abschnitts erteilt die Stadt selbst, also die Bürgermeisterin. Der Lenkungskreis berät nur." }
    - { text: "Ob die Stadt längere Lieferzeiten in Kauf nimmt, die den Schulstart gefährden", bild: lieferwagen, loesung: buergermeisterin, erklaerung: "Ein großes Risiko bewusst zu tragen, ist eine Entscheidung der Bürgermeisterin." }
    - { text: "Welche von zwei gleich teuren Farben die Fassadenplatten bekommen", bild: kostenzettel, loesung: sie, erklaerung: "Kein Mehrbetrag, kein Risiko, keine Freigabe – das entscheiden Sie." }

dahinter:
  - "Eine Änderung braucht einen sauberen Weg vom Antrag bis zum Beschluss – sonst entscheiden Gespräche am Rand über Geld, über das niemand entschieden hat."
  - { text: "Wer nur abwartet, lässt den Wunsch liegen, bis die Fundamente stehen.", kurzfassung: false }

vertiefung:
  form: zweiter-fall
  titel: Ein zweiter Wunsch der Schule
  # Kein Ereignis der Geschichte, wirkt weder auf Balken noch auf das Entscheidungsbuch; ein zweiter Fall in anderer Lage (andere Stadt)
  text:
    - "In einer anderen Stadt, deren Projektleitung dieselben Entscheidungsgrenzen hat, bittet eine Schulleiterin zwei Wochen nach einer großen Entscheidung um einen überdachten Fahrradstand, etwa 25.000 Euro. Er ist nicht geplant, liegt aber in diesen Grenzen: bis 100.000 Euro, ohne Reserve. Ist das trotzdem eine Änderung, und wer entscheidet?"
  antwort:
    - "Ja, es ist eine Änderung, denn etwas, das bisher gilt, soll bewusst anders werden. Clara Faden hält fest, wer den Wunsch stellt, was bisher gilt und was sich ändern würde. Bis zur Entscheidung gilt die bisherige Planung."
    - "Entscheiden dürfen Sie selbst, weil der Betrag in Ihrem Rahmen liegt und keine Reserve gebraucht wird. Trotzdem gibt es einen Antrag, eine Entscheidung mit Datum und ein Ergebnis, das jede und jeder nachlesen kann. Der Weg ist kurz, aber er ist derselbe."
    - "Anders wäre es, wenn der Fahrradstand 150.000 Euro kostete: Dann entscheidet die Bürgermeisterin."
    - "Zwei Wege heißt nicht: ja oder nein. Der zweite Weg kann auch sein, bei der bisherigen Planung zu bleiben – wenn das zulässig ist. Wer nur einen Weg vorlegt, lässt keine Wahl; wer einen zweiten Weg nur zum Schein dazuerfindet, lässt nur scheinbar wählen."
    - "Ist der Wunsch eilig, ändert das nur den Termin, nicht den Weg: Auch eine eilige Änderung wird entschieden, bevor sie gilt."

regie:
  notiz: "Kern: Ein Wunsch, der den geltenden Stand ändert, ist eine Änderung – mit mindestens zwei Wegen bei der Stelle, die entscheiden darf; bis dahin gilt die bisherige Planung. Die Mini-Aufgabe „Wer entscheidet das?“ greift das Kärtchen „Wer entscheidet was“ auf."
  leitfragen:
    - Was gilt bei Ihnen eine Zusage, die am Rand eines Termins fällt?
    - Was gilt bei Ihnen, solange über eine Änderung nicht entschieden ist?
