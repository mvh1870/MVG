titel: LPH 0 als früher Wirkungsraum
alt: >-
  Die Abbildung zeigt, was in LPH 0, der Bedarfsplanung, schon angelegt werden kann: Ziele, Rollen und Befugnisse,
  Freigaben, Risiken, Änderungen und Kennzahlen. In der Mitte steht LPH 0, ringsum sechs Karten: Zielsystem, RACI mit
  Mandaten und Freigaben, Governance, Freigabe, Risikoliste mit Änderungssteuerung und Frühwarnung sowie ein
  Kennzahlen-System.
