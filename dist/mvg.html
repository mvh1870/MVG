<p>Kennungen in Welt B (docs/BEGRIFFE.md): <code>ENT-</code> Entscheidung, <code>AEN-</code> Änderung, <code>RIS-</code> Risiko, <code>FRW-</code> Frühwarnung, <code>PRB-</code> Problem, <code>MAS-</code> Maßnahme, <code>NAC-</code> Nachweis. Freigaben tragen kein Kürzel, sondern heißen „Freigabe LPH 5“. Bekannt aus B3: <code>ENT-017</code>, <code>AEN-022</code>, <code>RIS-014</code>, <code>FRW-003</code>; Datenstand „Kostenprognose 2026-05 · Version 3“. Vergeben im Drehbuch: <code>FRW-001</code> und <code>RIS-009</code> (Lieferzeit Holzbau, B2), <code>AEN-012</code> (Mensa, B2), <code>AEN-031</code> (Brandschutzauflagen, B4), <code>PRB-004</code> (Nachtrag der TGA-Fachplanung, B5); in den Rollenszenen der Planung zusätzlich <code>AEN-036</code> (B5) und <code>AEN-041</code> (B6).</p>

<p>Sechs Figuren tragen die sechs Rollen (O-4); vier weitere treten auf. Die Bauherren-PL ist die Spielerrolle (Name frei wählbar, Vorgabe „Sie“). Wer eine andere Rolle spielt, sieht die Bauherren-PL als Figur „Bauherren-PL“.</p>`,figuren:{brenner:{farbe:"#146878",felder:{kurzbeschreibung:"<p>Externer Projektsteuerer, gründlich und immer etwas in Eile. Seine Mails haben Anhänge und Betreffzeilen mit „bitte kurzfristig“.</p>",stimme:"<p>Sachlich, knapp, lieber eine Mail als ein Anruf.</p>"},funktion:"Projektsteuerung, extern",id:"brenner",name:"Jonas Brenner",rolle:"ps",spieler:!1},deppe:{farbe:"#6A4CA5",felder:{kurzbeschreibung:"<p>Geschäftsführer der GML. Hat viele Projekte zugleich im Blick und nimmt Themen gern in den Lenkungskreis mit.</p>",stimme:"<p>Verbindlich, zuversichtlich, kurze Sätze.</p>"},funktion:"Geschäftsführung GML",id:"deppe",name:"Frank Deppe",rolle:"gf",spieler:!1},hoffmeister:{farbe:"#D9822B",felder:{kurzbeschreibung:"<p>Leitet die Generalplanung. Denkt in Varianten und hat oft schon etwas durchgerechnet, bevor jemand fragt.</p>",stimme:"<p>Lösungsfreudig, ruft lieber an, als zu schreiben.</p>"},funktion:"Generalplanung",id:"hoffmeister",name:"Lena Hoffmeister",rolle:"planung",spieler:!1},kaya:{farbe:"#A8823C",felder:{kurzbeschreibung:"<p>Rechnet für die GML die Restkostenprognose (CTC). Hat meistens eine eigene Zahl – und fragt, welche gilt.</p>",stimme:"<p>Präzise, ungeduldig mit Versionsnummern, schreibt im Chat.</p>"},funktion:"Controlling der GML",id:"kaya",name:"Aylin Kaya",rolle:"controlling",spieler:!1},kowalski:{farbe:"#4A5568",felder:{kurzbeschreibung:"<p>Ratsmitglied und Vorsitzender des Bauausschusses. Will wissen, worüber der Ausschuss eigentlich entscheiden soll.</p>",stimme:"<p>Trocken, höflich, fragt zweimal nach.</p>"},funktion:"Vorsitzender des Bauausschusses",id:"kowalski",name:"Bernd Kowalski",rolle:null,spieler:!1},olbers:{farbe:"#1D3258",felder:{kurzbeschreibung:"<p>Dezernentin der Stadt Lindenhall und für das Projekt die Stimme des Bauherrn. Sie steht Stadtrat und Bauausschuss Rede und Antwort.</p>",stimme:"<p>Ruhig; fragt zuerst nach der Entscheidungsfrage, dann nach den Details.</p>"},funktion:"Dezernentin, Bauherr",id:"olbers",name:"Dr. Miriam Olbers",rolle:"bauherr",spieler:!1},petersen:{farbe:"#7A5C3E",felder:{kurzbeschreibung:"<p>In Welt A schreibt sie Protokolle und sucht Anhänge. In Welt B pflegt sie als PMO Maßnahmen, Probleme, Governance-Kalender und Protokolle.</p>",stimme:"<p>Freundlich, organisiert, fragt nach der Version.</p>"},funktion:"Projektassistenz der GML, in Welt B PMO",id:"petersen",name:"Nora Petersen",rolle:null,spieler:!1},roth:{farbe:"#B04A5A",felder:{kurzbeschreibung:"<p>Spricht für die künftigen Nutzer. Ihr Anliegen in Monat 3: eine größere Mensa für den Ganztag.</p>",stimme:"<p>Herzlich und hartnäckig; sagt „die Kinder“, wenn sie „der Bedarf“ meint.</p>"},funktion:"Nutzervertretung, künftige Schulleiterin der Gesamtschule",id:"roth",name:"Sabine Roth",rolle:null,spieler:!1},sie:{farbe:"#3866A8",felder:{kurzbeschreibung:"<p>Die Spielerrolle: Sie leiten das Projekt seit Monat 0 auf Bauherrenseite, zwischen Stadt, GML, Planung, Projektsteuerung und Controlling.</p>",stimme:"<p>Ihre eigene.</p>"},funktion:"Bauherren-PL",id:"sie",name:"Sie",rolle:"pl",spieler:!0},stein:{farbe:"#5B6770",felder:{kurzbeschreibung:"<p>Kennt jede Zeile der Kostenprognose, weil er sie gebaut hat. In Welt A liegt das Wissen in seinen Excel-Dateien; in Monat 11 fällt er für Wochen aus.</p>",stimme:"<p>Leise, genau, spricht in Zellbezügen.</p>"},funktion:"Kostenplaner im Team der Projektsteuerung",id:"stein",name:"Holger Stein",rolle:null,spieler:!1}},gremien:["Stadtrat","Bauausschuss","Lenkungskreis","Änderungsgremium (Welt B)"],hinweis:"Fiktiver Fall. Stadt, Gesellschaft, Projekt und Personen sind erfunden.",lphStand:{"0":4,"1":4,"2":5,"3":5,"4":5,"5":5,"6":5,"7":5,"8":5,"9":5,"10":5,"11":5,"12":5},monat0:"2025-12",projekt:"Schulcampus Lindenhall-Süd",projektbasis:"58,4 Mio. € brutto",projektbasisMio:58.4,stadt:"Lindenhall",vertretung:"Gebäudemanagement Lindenhall GmbH",vertretungKurz:"GML"},glossar:{"g-30-60-90-tage-plan":{begriff:"30/60/90-Tage-Plan",definition:"Orientierungsrahmen nach der MVG-Reifegradanalyse und im Rahmen einer MVG-Neuinitialisierung, der die ersten Wirkungen priorisiert; kein allgemeiner Einführungsrhythmus. Bis Tag 90 ist das Modell in Anwendung und der Entwurf des Betriebshandbuchs liegt vor; die Übergabe schließt an.",id:"g-30-60-90-tage-plan"},"g-bauherr":{begriff:"Bauherr",definition:"Organisation oder Person, die ein Bau- oder Infrastrukturvorhaben veranlasst, legitimiert und wesentliche Entscheidungen trägt.",id:"g-bauherr"},"g-bauherren-fuehrungsmodell":{begriff:"Bauherren-Führungsmodell",definition:"Das Zusammenspiel aus Zielsystem, Rollen und Mandaten, Freigaben, Entscheidungs-IDs, Datenstands- und Nachweislogik, Risiko-/Änderungs-/Maßnahmenverknüpfung, Restkostenprognose (CTC), Leistungskennzahlen (KPI), Eskalation, Betriebshandbuch und Befähigung zu einer durchgängigen Steuerungsarchitektur – das Führungsmodell, mit dem ein Bauherr ein komplexes Vorhaben steuerbar hält.",id:"g-bauherren-fuehrungsmodell"},"g-bauherrenorganisation":{begriff:"Bauherrenorganisation",definition:"Die Gesamtheit der bauherrenseitigen Rollen, Gremien, Entscheidungswege, Mandate und Unterstützungsfunktionen.",id:"g-bauherrenorganisation"},"g-befaehigung":{begriff:"Befähigung",definition:"Verankerung von MVG in Schlüsselrollen, damit die Bauherrenorganisation das Modell selbst anwenden kann.",id:"g-befaehigung"},"g-betriebshandbuch":{begriff:"Betriebshandbuch",definition:"Betriebslogik für den Regelbetrieb von MVG mit Rollen, Routinen, Taktung, Eskalation und Prüfmechanismen.",id:"g-betriebshandbuch"},"g-business-case":{begriff:"Business Case",definition:"Wirtschaftliche und strategische Entscheidungsgrundlage, die Nutzen, Aufwand, Risiken und Rahmenbedingungen eines Vorhabens oder einer Variante zusammenführt.",id:"g-business-case"},"g-ctc":{begriff:"CTC",definition:"Cost to Complete; im Whitepaper als Restkostenprognose verwendet. Bezeichnet die erwarteten noch anfallenden Kosten bis zum Projektabschluss.",id:"g-ctc"},"g-datenstand":{begriff:"Datenstand",definition:"Benannte und versionierte Grundlage, auf der eine Entscheidung getroffen wird.",id:"g-datenstand"},"g-entscheidungs-id":{begriff:"Entscheidungs-ID",definition:"Eindeutige Kennung für eine wesentliche Bauherrenentscheidung. Sie schafft Nachverfolgbarkeit und Referenzlogik.",id:"g-entscheidungs-id"},"g-entscheidungsreife":{begriff:"Entscheidungsreife",definition:"Zustand, in dem eine Entscheidung ausreichend vorbereitet ist, um auf der zuständigen Mandatsebene getroffen zu werden.",id:"g-entscheidungsreife"},"g-entscheidungsvorlage":{begriff:"Entscheidungsvorlage",definition:"Nachweislogik für eine wesentliche Entscheidung mit Entscheidungsfrage, Bezug zur Freigabe und zum Mandat, Datenstand, Optionen, Annahmen, Auswirkungen, Empfehlung, Freigabeprozess, Beschlusslage und Nachverfolgung.",id:"g-entscheidungsvorlage"},"g-esg":{begriff:"ESG",definition:"Umwelt-, Sozial- und Governance-Aspekte, die als Entscheidungsdimension in Zielsystem, Varianten und Freigaben berücksichtigt werden können.",id:"g-esg"},"g-finale-investitionsentscheidung-fid":{begriff:"Finale Investitionsentscheidung (FID)",definition:"Investitionsentscheidung zum Abschluss von LPH 3 auf Basis der Kostenberechnung; sie bestätigt die in LPH 2 getroffene Variantenwahl mit Business Case und legitimiert die weitere Projektverfolgung.",id:"g-finale-investitionsentscheidung-fid"},"g-freigabe":{begriff:"Freigabe",definition:"Entscheidung des Bauherrn am Abschluss einer Leistungsphase (LPH 0–9). Die Freigabe gibt die nächste Leistungsphase frei und verbindet Freigabereife, Mandat, Datenstand und Nachweis. Die Freigabe erteilt der Bauherr selbst – nicht Projektsteuerung oder Lenkungskreis.",id:"g-freigabe"},"g-fruehwarnung":{begriff:"Frühwarnung",definition:"Unbewertetes Signal und strikte Vorstufe eines Risikos. Erst nach Bestätigung und Bewertung wird daraus ein Risiko; CTC- oder Schwellenwertverletzungen erzeugen neue Frühwarnungen als neue Signale.",id:"g-fruehwarnung"},"g-governance":{begriff:"Governance",definition:"Ordnungs- und Führungsrahmen, der Rollen, Mandate, Entscheidungswege, Freigaben und Nachweise verbindlich miteinander verknüpft.",id:"g-governance"},"g-kpi":{begriff:"KPI",definition:"Key Performance Indicator; im Whitepaper als Leistungskennzahl verwendet. Dient der verdichteten Beurteilung von Leistung und Steuerungsbedarf.",id:"g-kpi"},"g-lcc":{begriff:"LCC",definition:"Lebenszykluskosten; Kostenbetrachtung über Errichtung, Betrieb, Instandhaltung und Nutzung hinweg als Entscheidungsdimension.",id:"g-lcc"},"g-leistungsphasen-und-freigabemodell-lph-0-9":{begriff:"Leistungsphasen- und Freigabemodell LPH 0–9",definition:"Zehn HOAI-Leistungsphasen mit einer Freigabe des Bauherrn am jeweiligen Abschluss: LPH 0 · Bedarfsplanung; LPH 1 · Grundlagenermittlung; LPH 2 · Vorplanung; LPH 3 · Entwurfsplanung; LPH 4 · Genehmigungsplanung; LPH 5 · Ausführungsplanung; LPH 6 · Vorbereitung Vergabe; LPH 7 · Vergabe; LPH 8 · Ausführung; LPH 9 · Übergabe. Der Regelbetrieb folgt nach der Freigabe zum Abschluss von LPH 9.",id:"g-leistungsphasen-und-freigabemodell-lph-0-9"},"g-mandat":{begriff:"Mandat",definition:"Klar zugewiesene Entscheidungs- und Eskalationsbefugnis einer Rolle oder eines Gremiums, verbunden mit Schwellen, Stellvertretung und Freigabeweg.",id:"g-mandat"},"g-minimum-viable-governance-mvg":{begriff:"Minimum Viable Governance (MVG)",definition:"Kleinster funktionsfähiger Governance-Standard, mit dem Bauherrenverantwortung entscheidungsfähig, nachweisbar und operabel wird.",id:"g-minimum-viable-governance-mvg"},"g-mvg-companion":{begriff:"MVG Companion",definition:"Optionales, lokal lauffähiges und browserbasiertes Arbeitsmittel, das die Anwendung von Minimum Viable Governance unterstützt; kein Ersatz für Bauherrenentscheidungen oder verbindliche Systeme.",id:"g-mvg-companion"},"g-mvg-neuinitialisierung":{begriff:"MVG-Neuinitialisierung",definition:"Sonderformat außerhalb der regulären Freigabereihe zur gezielten Neuordnung der Steuerungs- und Entscheidungslogik in laufenden Projekten mit eingeschränkter Steuerbarkeit.",id:"g-mvg-neuinitialisierung"},"g-nachweiskette":{begriff:"Nachweiskette",definition:"Nachvollziehbare Kette von Entscheidungsgrundlagen, Annahmen, Freigaben, Beschlüssen und Nachverfolgung.",id:"g-nachweiskette"},"g-neufestlegung-der-projektbasis":{begriff:"Neufestlegung der Projektbasis",definition:"Sonderformat außerhalb der regulären Freigabereihe zur erneuten Legitimation von Kosten-, Termin-, Projektumfangs- oder Risikogrundlagen. Es wird über eine Entscheidungsvorlage vorbereitet und durch den Bauherrn im Lenkungskreis beschlossen; betroffene Freigaben können anschließend nachgeholt oder wiederholt werden.",id:"g-neufestlegung-der-projektbasis"},"g-nichtdelegierbare-bauherrenverantwortung":{begriff:"Nichtdelegierbare Bauherrenverantwortung",definition:"Governance-bezogener Begriff für Verantwortungen, bei denen der Bauherr Ziel, Mandat, wesentliche Entscheidung, Risikoannahme, Freigabe, Datenstand und Nachweis selbst legitimieren muss.",id:"g-nichtdelegierbare-bauherrenverantwortung"},"g-pmo":{begriff:"PMO",definition:"Projektmanagementbüro; unterstützt unter anderem Koordination, Berichterstattung, Gremienarbeit, Datenpflege und Nachverfolgung.",id:"g-pmo"},"g-raci":{begriff:"RACI",definition:"Rollen- und Zuständigkeitsmatrix mit ausführungsverantwortlichen, letztverantwortlichen, konsultierten und informierten Rollen.",id:"g-raci"},"g-saas":{begriff:"SaaS",definition:"Software as a Service, also die Bereitstellung von Software als internetbasierter Dienst. Der MVG Companion ist ausdrücklich keine SaaS-Leistung.",id:"g-saas"},"g-uebergabe":{begriff:"Übergabe",definition:"Die Übergabe des Vorhabens ist in LPH 9 verankert. Die Übergabe des Bauherren-Führungsmodells ist dagegen ein Befähigungsschritt ohne Zuordnung zu einer Freigabe im Leistungsphasen- und Freigabemodell und überführt Rollen, Routinen und Betriebshandbuch in den Eigenbetrieb.",id:"g-uebergabe"},"g-whitepaper":{begriff:"Whitepaper",definition:"Fachliches Grundlagendokument, das Position, Methodik, Leistungslogik und Anwendungsrahmen von Bauherr Mentoren nachvollziehbar darstellt.",id:"g-whitepaper"}},interessen:[{html:"",id:"kosten",titel:"Kosten und Prognosen"},{html:"",id:"organisation",titel:"Rollen und Mandate"},{html:"",id:"risiko",titel:"Risiken und Frühwarnungen"},{html:"",id:"freigaben",titel:"Freigaben und Nachweise"}],quellen:{"k2.4-p1":{abschnitt:"2.4",abschnittTitel:"Warum Berichterstattung das Kernproblem nicht löst",html:'<p class="mvg-original" data-absatz="k2.4-p1">Die naheliegende Reaktion auf Projektprobleme lautet oft: mehr Berichterstattung, mehr Abstimmung, mehr Gremienvorlagen, mehr Eskalationsrunden. Das kann in einzelnen Situationen helfen. Es löst aber nicht automatisch die Frage, wer was auf welcher Grundlage entscheiden darf und muss.</p>',id:"k2.4-p1"},"k2.4-p2":{abschnitt:"2.4",abschnittTitel:"Warum Berichterstattung das Kernproblem nicht löst",html:'<p class="mvg-original" data-absatz="k2.4-p2">Berichterstattung erzeugt Information. Führung entsteht erst, wenn Information mit Mandat, Entscheidung, Schwelle, Risikoannahme, Datenstand, Freigabe und Nachweis verbunden wird. Ein Ampelbericht ohne Entscheidungsfrage bleibt Beobachtung. Ein Änderungsregister ohne Schwellenlogik bleibt Verwaltung. Eine Risikoübersicht ohne Risikoannahme bleibt Warnsignal. Eine Gremienvorlage ohne klare Entscheidungssituation bleibt Beschlussformalismus.</p>',id:"k2.4-p2"},"k4.2-p3":{abschnitt:"4.2",abschnittTitel:"Mandat",html:'<p class="mvg-original" data-absatz="k4.2-p3">Als Muster-Mandatsleiter gilt: Die Bauherren-PL gibt bis einschließlich 100 TEUR eigenständig frei; oberhalb von 100 TEUR bis einschließlich 5 Mio. EUR entscheidet das Änderungsgremium; darüber erfolgt die Beschlussfassung durch den Bauherrn im Lenkungskreis.</p>',id:"k4.2-p3"},"k4.6-p2":{abschnitt:"4.6",abschnittTitel:"Datenstand und Nachweis",html:'<p class="mvg-original" data-absatz="k4.6-p2">MVG verlangt deshalb eine klare Datenstandslogik: Welche Version gilt? Welche Annahmen sind offen? Welche Änderungen wurden seit der letzten Freigabe aufgenommen? Welche Beschlusslage besteht? Wo wird die Nachweiskette geführt? Der Bauherr muss nicht alle Daten selbst pflegen, aber er muss sicherstellen, dass Entscheidungen auf belastbaren, benannten und reproduzierbaren Grundlagen beruhen. Damit sind die sechs Felder benannt, in denen der Bauherr entscheidungsfähig bleiben muss. Wie daraus ein funktionsfähiges Bauherren-Führungsmodell wird, zeigt das folgende Kapitel; die zugehörigen Ergebnisobjekte – vom Mandatsmodell bis zum Betriebshandbuch – bündelt Kapitel 9.</p>',id:"k4.6-p2"},"k6.4.3-p1":{abschnitt:"6.4.3",abschnittTitel:"Kanonischer Governance-Fluss",html:'<p class="mvg-original fett" data-absatz="k6.4.3-p1"><strong>EW (unbewertetes Signal) → bestätigt → Risiko → Entscheidung → Freigabe → Maßnahme → Managementbericht</strong></p>',id:"k6.4.3-p1"},"k6.4.3-p2":{abschnitt:"6.4.3",abschnittTitel:"Kanonischer Governance-Fluss",html:'<p class="mvg-original" data-absatz="k6.4.3-p2">Eine Frühwarnung (EW) ist ein unbewertetes Signal. Wird sie bestätigt, wird daraus ein bewertetes Risiko. Aus Risiken, Änderungen oder Problemen kann Entscheidungsbedarf entstehen; CTC- oder Schwellenwertverletzungen erzeugen neue Frühwarnungen als neue Signale, nicht als Rückrichtung aus einem bestehenden Risiko. Die Entscheidungsvorlage bündelt Frage, Datenstand, Optionen, Bewertung und Empfehlung. Beschlüsse werden anschließend als Maßnahmen mit einer verantwortlichen Rolle und einer Frist nachverfolgt.</p>',id:"k6.4.3-p2"},"k6.4.4-t1":{abschnitt:"6.4.4",abschnittTitel:"Register-Abgrenzung",html:'<table class="mvg-original" data-absatz="k6.4.4-t1"><thead><tr><th>Register</th><th>Bedeutung</th><th>Nächster Schritt</th></tr></thead><tbody><tr><td>Frühwarnung</td><td>unbewertetes Signal</td><td>bestätigen; bei Bestätigung Risiko</td></tr><tr><td>Risikoregister</td><td>bewertetes mögliches Ereignis</td><td>Risikominderung oder Entscheidung</td></tr><tr><td>Problemregister</td><td>eingetretenes Problem</td><td>Maßnahme, ggf. Entscheidung</td></tr><tr><td>Änderungsregister</td><td>gewollte Änderung</td><td>Auswirkung, Freigabeweg</td></tr><tr><td>Entscheidungsregister</td><td>offener Entscheidungsbedarf</td><td>Entscheidungsvorlage</td></tr><tr><td>Freigabe</td><td>Entscheidung des Bauherrn am Abschluss der Leistungsphase</td><td>Status und Freigabeentscheidung dokumentieren</td></tr><tr><td>Managementbericht</td><td>aggregierter Gremienbericht</td><td>Information und Beschlussvorbereitung</td></tr></tbody></table>',id:"k6.4.4-t1"},"k9.4-l1":{abschnitt:"9.4",abschnittTitel:"Standard für Entscheidungsvorlagen als Nachweislogik",html:'<ul class="mvg-original" data-absatz="k9.4-l1"><li>eindeutige Entscheidungs-ID</li><li>Entscheidungsfrage</li><li>betroffene Freigabe</li><li>Verantwortungsfeld</li><li>Mandat und letztverantwortliche Rolle</li><li>Datenstand und zentrale Annahmen</li><li>Optionen und Konsequenzen</li><li>Wirkung auf Kosten, Termin, Qualität, Projektumfang, Risiko und ESG/LCC</li><li>Empfehlung</li><li>Freigabe- oder Eskalationsweg</li><li>Freigabeprozess (sechsstufig, jede Stufe wird signiert): offen → in Prüfung → vorbereitet → freigegeben → beschlossen | abgelehnt</li><li>Beschlusslage</li><li>Nachverfolgung</li></ul>',id:"k9.4-l1"}},regie:{"A3/pl":{leitfragen:["Welche Zahl hätte bei Ihnen im Ausschuss gelegen?","Wer legt bei Ihnen fest, welche Prognose gilt?","Ab welcher Summe muss bei Ihnen jemand anderes entscheiden – und wer?"],notiz:"<p>Erst die Lage wirken lassen: zwei Zahlen, vier Randnotizen, kein Weg. Die Wahl nicht kommentieren – in Welt A ist jede Option nachvollziehbar. Wer „Weitere Informationen anfordern“ wählt, kauft Klarheit mit Zeit: das Terminrisiko steigt.</p>"},"B3/pl":{leitfragen:["Gibt es bei Ihnen eine Schwelle, ab der eine Änderung in ein Gremium muss?","Welcher Punkt der Checkliste fehlt in Ihren Vorlagen am häufigsten?","Wer legt bei Ihnen fest, welcher Datenstand gilt?"],notiz:"<p>Die sechs Teile in Ruhe durchgehen. Beim Mandat beide Optionen zeigen: Das Mandat hängt von der Option ab. Bei <code>ENT-017</code> das Gegenüber selbst urteilen lassen, erst dann die Rückmeldung zeigen. Zum Schluss den Rückbezug auf die eigene Wahl in Welt A vorlesen.</p>"}},rollen:{bauherr:{farbe:"#1D3258",felder:{delegierbar:`<ul>

<li>Koordination, Berichterstattung und Dokumentation (Kap. 3.2)</li>
</ul>`,linse:"<p>Was muss ich selbst entscheiden, und auf welcher Grundlage? Was sage ich dem Bauausschuss?</p>",nichtDelegierbar:`<ul>

<li>Jede Freigabe zum Abschluss einer Leistungsphase LPH 0–9 (Kap. 9.3)</li>
</ul>`,text:"<p>Dr. Miriam Olbers vertritt als Dezernentin die Stadt Lindenhall, die Eigentümerin. Sie trägt die Letztverantwortung – und die Rückkopplung zu Stadtrat und Bauausschuss.</p>"},figur:"olbers",id:"bauherr",kurztitel:"Bauherr",quelle:"inhalte/rollen/bauherr.md",spielbar:!1,textfarbe:null,titel:"Bauherr (Dezernentin der Stadt)",whitepaper:["k3.2-t1","k9.3-p3"]},controlling:{farbe:"#A8823C",felder:{delegierbar:`<ul>
<li>Berichterstattung, Prognoseerstellung, CTC-Berechnung und Datenaufbereitung (Kap. 3.2)</li>

ll},{art:"text",bloecke:[{art:"vorlage",felder:{frage:"<p>„Wie wird die Kostenabweichung aufgefangen?“</p>"},id:"ENT-017",kennungen:["ENT-017"],kinder:[],kopf:{datenstand:"Kostenprognose 2026-05 · Version 3",titel:"Entscheidungsvorlage"},liste:[{html:'eindeutige <span class="mvg-glossar" data-glossar="g-entscheidungs-id" data-begriff="Entscheidungs-ID">Entscheidungs-ID</span>',id:null,stand:"erfuellt"},{html:"Entscheidungsfrage",id:null,stand:"erfuellt"},{html:"betroffene Freigabe · hier LPH 5",id:null,stand:"erfuellt"},{html:"Verantwortungsfeld",id:null,stand:"erfuellt"},{html:"Mandat und letztverantwortliche Rolle · hängt von der Option ab",id:null,stand:"offen"},{html:"Datenstand und zentrale Annahmen",id:null,stand:"erfuellt"},{html:"Optionen und Konsequenzen",id:null,stand:"erfuellt"},{html:"Wirkung auf Kosten, Termin, Qualität, Projektumfang, Risiko und ESG/LCC · hier fehlen Termin und Risiko zu Option 2",id:null,stand:"fehlt"},{html:"Empfehlung",id:null,stand:"fehlt"},{html:"Freigabe- oder Eskalationsweg",id:null,stand:"offen"},{html:"Freigabeprozess (sechsstufig, jede Stufe wird signiert): offen → in Prüfung → vorbereitet → freigegeben → beschlossen | abgelehnt",id:null,stand:"offen"},{html:"Beschlusslage",id:null,stand:"offen"},{html:"Nachverfolgung",id:null,stand:"offen"}]}],felder:{},gruppe:"Welt B · Monat 5 · derselbe Montag",id:"vorlage",kopf:{},kurz:"ENT-017",titel:"ENT-017",uhr:null},{art:"text",bloecke:[{art:"fluss",felder:{text:"<p><code>ENT-017</code> steht bei „Entscheidung“.</p>"},id:null,kennungen:[],kinder:[],kopf:{position:"entscheidung"},liste:null}],felder:{},gruppe:"Welt B · Monat 5 · derselbe Montag",id:"fluss",kopf:{},kurz:"Fluss",titel:"Governance-Fluss",uhr:null},{art:"rueckbezug",bloecke:[],felder:{},gruppe:"Welt B · Monat 5 · derselbe Montag",id:"rueckbezug",kopf:{},kurz:"Rückbezug",titel:"Rückbezug",uhr:null},{art:"ebenen",bloecke:[],felder:{},gruppe:null,id:"ebenen",kopf:{},kurz:"Tiefer gehen",titel:"Vier Ebenen – vom Satz zum Nachweis",uhr:null}],standpunkte:[],statusStart:[{art:"setze",hinweis:null,schluessel:"entscheidungsfaehigkeit",wert:4},{art:"setze",hinweis:null,schluessel:"kostenunsicherheit",wert:"mittel"},{art:"setze",hinweis:"1 neu bewertet",schluessel:"offeneRisiken",wert:7},{art:"setze",hinweis:"ENT-017, mit Frist",schluessel:"ungeklaerteEntscheidungen",wert:1},{art:"setze",hinweis:null,schluessel:"terminrisiko",wert:"mittel"}],szenen:{pl:{entscheidung:null,fragen:[{antworten:[{html:"",id:"ja",praefix:"Vorsicht:",symbol:"haken",titel:"Ja, vorlegen"},{html:"",id:"nein",praefix:"Genau:",symbol:"vorlage",titel:"Nein, ergänzen lassen"}],felder:{frage:'<p>Ist <code>ENT-017</code> <span class="mvg-glossar" data-glossar="g-entscheidungsreife" data-begriff="Entscheidungsreife">entscheidungsreif</span>?</p>',rueckmeldung:"<p>Noch nicht entscheidungsreif: Ohne Wirkung auf Termin und Risiko und ohne Empfehlung kann auf der zuständigen Mandatsebene nicht auf belastbarer Grundlage entschieden werden – welche das ist, hängt von der Option ab. Ergänzung bis in 10 Tagen, verantwortlich: Projektsteuerung.</p>"},id:"reife",schritt:"vorlage"}],quelle:"inhalte/story/B3/pl.md",rolle:"pl",rueckbezug:{auf:"A3/pl",ohne:"<p>In Welt A lag an diesem Montag dieselbe Prognose auf dem Tisch – mit zwei Zahlen und ohne festen Weg. In Welt B hat das Signal eine Nummer, der Datenstand einen Namen und die Entscheidung ein Mandat.</p>",texte:{A:"<p>In Welt A haben Sie ‚Weiterarbeiten‘ gewählt. In Welt B hätte das keine informelle Umplanung erlaubt: Die Fassadenänderung steht als <code>AEN-022</code> im Änderungsregister, und bei 4,7 Mio. € entscheidet das Änderungsgremium.</p>",B:"<p>In Welt A haben Sie ‚Entscheidungsvorlage verlangen‘ gewählt. In Welt B hätte niemand zurückfragen müssen: Hier gibt es einen Standard für Entscheidungsvorlagen; <code>ENT-017</code> hat eine Frage, Optionen und eine Frist.</p>",C:"<p>In Welt A haben Sie ‚Eskalation auslösen‘ gewählt. In Welt B wäre das Thema nicht ohne Optionen oben angekommen: Hier wird mit einer Entscheidungsfrage entlang der Mandatsleiter eskaliert, nicht mit einem Statusbericht.</p>",D:"<p>In Welt A haben Sie ‚Prognose aktualisieren lassen‘ gewählt. In Welt B lägen im Ausschuss nicht zwei Zahlen: Hier gilt ein benannter Datenstand; eine neue Prognose wird Version 4 und ersetzt Version 3 nachvollziehbar.</p>"}},station:"B3"}},titel:"Kosten +8 %",uhr:"derselbe Montag",vergleich:null,weiter:[],welt:"B",whitepaper:["k2.4-p2","k4.2-p3","k6.4.3-p1","k6.4.3-p2","k6.4.4-t1","k9.4-l1"]},prolog:{art:"prolog",ebenen:null,einleitung:"",ende:!1,id:"prolog",infos:[],kurztitel:"Prolog",lph:null,monat:0,partner:null,quelle:"inhalte/story/prolog/station.md",schaltetFrei:[],schritte:[{art:"text",bloecke:[{art:"hinweis",felder:{text:"<p>Fiktiver Fall. Stadt, Gesellschaft, Projekt und Personen sind erfunden.</p>"},id:null,kennungen:[],kinder:[],kopf:{},liste:null}],felder:{text:`<p>Die Stadt Lindenhall baut den Schulcampus Lindenhall-Süd: Gesamtschule, Grundschule und Dreifeldsporthalle, als Holzhybridbau, Projektbasis 58,4 Mio. € brutto. Als Bauherr wird sie von der Gebäudemanagement Lindenhall GmbH (GML) vertreten.</p>
<p>Sie übernehmen das Projekt. Zuerst erleben Sie es in <strong>Welt A</strong>, ohne <span class="mvg-glossar" data-glossar="g-minimum-viable-governance-mvg" data-begriff="Minimum Viable Governance (MVG)">Minimum Viable Governance</span>. Später spielen Sie dieselben Momente in <strong>Welt B</strong>, mit MVG. Die Geschichte merkt sich, wie Sie entschieden haben.</p>`},gruppe:null,id:"uebernahme",kopf:{},kurz:"Übernahme",titel:"Zwei Welten. Ein Schulcampus.",uhr:null},{art:"rollenwahl",bloecke:[],felder:{text:`<p>Sechs Rollen, ein Projekt. Jede Rolle sieht dieselbe Lage anders – und entscheidet anderes.</p>
<p>Spielbar ist derzeit die Bauherren-PL; die übrigen fünf Rollen folgen.</p>`},gruppe:null,id:"rolle",kopf:{folgt:["gf","bauherr","ps","planung","controlling"]},kurz:"Rolle",titel:"Welche Rolle übernehmen Sie?",uhr:null},{art:"interessenwahl",bloecke:[{art:"interesse",felder:{},id:"kosten",kennungen:["kosten"],kinder:[],kopf:{titel:"Kosten und Prognosen"},liste:null},{art:"interesse",felder:{},id:"organisation",kennungen:["organisation"],kinder:[],kopf:{titel:"Rollen und Mandate"},liste:null},{art:"interesse",felder:{},id:"risiko",kennungen:["risiko"],kinder:[],kopf:{titel:"Risiken und Frühwarnungen"},liste:null},{art:"interesse",felder:{},id:"freigaben",kennungen:["freigaben"],kinder:[],kopf:{titel:"Freigaben und Nachweise"},liste:null}],felder:{text:"<p>Ihre Auswahl bestimmt, welche Vertiefungen die Geschichte zusätzlich anbietet. Sie können den Schritt auch überspringen.</p>"},gruppe:null,id:"interessen",kopf:{knopf:"Projekt übernehmen"},kurz:"Interessen",titel:"Was interessiert Sie besonders?",uhr:null}],standpunkte:[],statusStart:null,szenen:{},titel:"Übernahme",uhr:null,vergleich:null,weiter:[{wenn:null,ziel:"A3"}],welt:null,whitepaper:[]}},stationsFolge:["prolog","A3","A3-B3-vergleich","B3"],theorie:{k01:{bloecke:[{art:"kernaussage",felder:{text:'<p><q class="mvg-zitat" data-absatz="k1-p1">Arbeit kann delegiert werden; bauherrenseitige Legitimation nicht.</q></p>'},id:null,kennungen:[],kinder:[],kopf:{},liste:null},{art:"abschnitt",felder:{},id:"k1.1",kennungen:["k1.1"],kinder:[{art:"zitat",felder:{text:'<blockquote class="mvg-zitat" data-absatz="k1.1-p1"><p>Bauherren können Arbeit, Analyse, Koordination und Dokumentation delegieren. Nicht delegierbar bleibt die Legitimation von Ziel, Mandat, wesentlicher Entscheidung, Risikoannahme, Freigabe und Nachweis. MVG macht diese Verantwortung praktisch handhabbar.</p></blockquote>'},id:"k1.1-p1",kennungen:["k1.1-p1"],kinder:[],kopf:{quelle:"Whitepaper V1.2, Kap. 1.1",vollstaendig:!0},liste:null}],kopf:{titel:"Leitthese"},liste:null},{art:"abschnitt",felder:{text:"<p>Fünf Aussagen, jeweils wörtlich aus dem Whitepaper.</p>"},id:"k1.2",kennungen:["k1.2"],kinder:[{art:"karten",felder:{},id:null,kennungen:[],kinder:[{art:"karte",felder:{text:'<p><q class="mvg-zitat" data-absatz="k1.2-l1">Projektsteuerung unterstützt Kosten, Termine, Qualität, Koordination und Berichterstattung; sie ersetzt keine bauherrenseitige Entscheidung.</q></p>'},id:"1",kennungen:["1"],kinder:[],kopf:{symbol:"kompass",titel:"Projektsteuerung"},liste:null},{art:"karte",felder:{text:'<p><q class="mvg-zitat" data-absatz="k1.2-l1">MVG übersetzt Bauherrenverantwortung in Rollen, Mandate, Freigaben, Entscheidungs-IDs, Datenstandslogik, Eskalation, Betriebshandbuch und Befähigung.</q></p>'},id:"2",kennungen:["2"],kinder:[],kopf:{symbol:"wechsel",titel:"Übersetzung"},liste:null},{art:"karte",felder:{text:'<p><q class="mvg-zitat" data-absatz="k1.2-l1">Entscheidungssicherheit entsteht durch den verbindlichen Zusammenhang von Zielsystem, Mandat, Datenstand, Risiko, Freigabe und Nachweis.</q></p>'},id:"3",kennungen:["3"],kinder:[],kopf:{symbol:"schild",titel:"Entscheidungssicherheit"},liste:null},{art:"karte",felder:{text:'<p><q class="mvg-zitat" data-absatz="k1.2-l1">Befähigung ist Pflichtbestandteil, weil der Bauherr das Modell nach Übergabe selbst anwenden können muss.</q></p>'},id:"4",kennungen:["4"],kinder:[],kopf:{symbol:"person",titel:"Befähigung"},liste:null},{art:"karte",felder:{text:'<p><q class="mvg-zitat" data-absatz="k1.2-l1">LPH 0 ist ein wichtiger früher Hebel; maßgeblich ist jedoch die Entscheidungs- und Nachweisfähigkeit über den gesamten kritischen Projektverlauf.</q></p>'},id:"5",kennungen:["5"],kinder:[],kopf:{symbol:"flagge",titel:"LPH 0"},liste:null}],kopf:{},liste:null}],kopf:{titel:"Managementaussagen"},liste:null},{art:"abschnitt",felder:{text:"<p>Sechs Elemente und ihr Ergebnis, wörtlich aus der Tabelle des Kapitels.</p>"},id:"k1.3",kennungen:["k1.3"],kinder:[{art:"karten",felder:{},id:null,kennungen:[],kinder:[{art:"karte",felder:{text:'<p><q class="mvg-zitat" data-absatz="k1.3-t1">Klärt Verantwortungsfelder, nichtdelegierbaren Kern, delegierbare Vorbereitung, Rollen, Schwellen und Eskalationswege.</q></p>'},id:null,kennungen:[],kinder:[],kopf:{titel:"Bauherren-Mandats- und Verantwortungsmodell"},liste:null},{art:"karte",felder:{text:'<p><q class="mvg-zitat" data-absatz="k1.3-t1">Gibt jeder wesentlichen Bauherrenentscheidung eine eindeutige Kennung, einen Datenstand, ein Mandat, einen Freigabeweg und einen Nachverfolgungsstatus.</q></p>'},id:null,kennungen:[],kinder:[],kopf:{titel:"System der Entscheidungs-IDs"},liste:null},{art:"karte",felder:{text:'<p><q class="mvg-zitat" data-absatz="k1.3-t1">Verbindet Projektfortschritt mit Entscheidungsvorbereitung, Freigabereife, Risikoannahme und Nachweisführung.</q></p>'},id:null,kennungen:[],kinder:[],kopf:{titel:"Leistungsphasen- und Freigabemodell LPH 0–9"},liste:null},{art:"karte",felder:{text:'<p><q class="mvg-zitat" data-absatz="k1.3-t1">Sichert die Nachvollziehbarkeit von Entscheidungsfrage, Alternativen, Annahmen, Risiken, Datenstand, Empfehlung, Freigabe und Beschlusslage.</q></p>'},id:null,kennungen:[],kinder:[],kopf:{titel:"Standard für Entscheidungsvorlagen"},liste:null},{art:"karte",felder:{text:'<p><q class="mvg-zitat" data-absatz="k1.3-t1">Übergibt Routinen, Rollen, Taktung, Fristen, Eskalationswege und Betriebslogik in den Regelbetrieb.</q></p>'},id:null,kennungen:[],kinder:[],kopf:{titel:"Betriebshandbuch"},liste:null},{art:"karte",felder:{text:'<p><q class="mvg-zitat" data-absatz="k1.3-t1">Stellt sicher, dass Bauherren-Projektleitung, Auftraggeber Logik, PMO, Gremienrollen und Fachrollen das Modell selbst anwenden können.</q></p>'},id:null,kennungen:[],kinder:[],kopf:{titel:"Befähigung"},liste:null}],kopf:{},liste:null}],kopf:{titel:"Ergebnisbild"},liste:null},{art:"original",felder:{text:`<p class="mvg-original" data-absatz="k1-p1">Arbeit kann delegiert werden; bauherrenseitige Legitimation nicht. Planer, Projektsteuerer, Gutachter, Projektmanagementbüro (PMO) und Berater können analysieren, vorbereiten, koordinieren und dokumentieren. Zielpriorisierung, Mandat, wesentliche Freigabe, Risikoannahme und Nachweisfähigkeit bleiben jedoch beim Bauherrn.</p>
<p class="mvg-original" data-absatz="k1-p2">Minimum Viable Governance (MVG) bildet dafür den kleinsten funktionsfähigen Governance-Standard. Es verbindet Zielsystem, Rollen, Mandate, Freigaben, Entscheidungs-IDs, Datenstandslogik, Risiko- und Änderungssteuerung, Nachweisführung, Betriebshandbuch und Befähigung zu einem handhabbaren Führungsmodell. Der Nutzen liegt nicht in mehr Bürokratie, sondern in weniger Entscheidungsstau, klareren Eskalationswegen, belastbarer Gremienfähigkeit und einer nachvollziehbaren Nachweiskette.</p>
<p class="mvg-original" data-absatz="k1-p3">Bauherr Mentoren übernimmt dabei keine Bauherrenrolle. BM stellt Struktur, Entscheidungsreife, Mandatsklarheit und Befähigung her, damit die Bauherrenorganisation ihre Verantwortung selbst wirksam ausüben kann. Der Ansatz richtet sich an Organisationen, die komplexe Vorhaben nicht nur berichten, sondern aktiv, nachweisbar und entscheidungsfähig führen müssen.</p>
<h4 class="mvg-original-titel" data-abschnitt="k1.1">1.1 Leitthese</h4>
<p class="mvg-original" data-absatz="k1.1-p1">Bauherren können Arbeit, Analyse, Koordination und Dokumentation delegieren. Nicht delegierbar bleibt die Legitimation von Ziel, Mandat, wesentlicher Entscheidung, Risikoannahme, Freigabe und Nachweis. MVG macht diese Verantwortung praktisch handhabbar.</p>
<h4 class="mvg-original-titel" data-abschnitt="k1.2">1.2 Managementaussagen</h4>
<ul class="mvg-original" data-absatz="k1.2-l1"><li>Projektsteuerung unterstützt Kosten, Termine, Qualität, Koordination und Berichterstattung; sie ersetzt keine bauherrenseitige Entscheidung.</li><li>MVG übersetzt Bauherrenverantwortung in Rollen, Mandate, Freigaben, Entscheidungs-IDs, Datenstandslogik, Eskalation, Betriebshandbuch und Befähigung.</li><li>Entscheidungssicherheit entsteht durch den verbindlichen Zusammenhang von Zielsystem, Mandat, Datenstand, Risiko, Freigabe und Nachweis.</li><li>Befähigung ist Pflichtbestandteil, weil der Bauherr das Modell nach Übergabe selbst anwenden können muss.</li><li>LPH 0 ist ein wichtiger früher Hebel; maßgeblich ist jedoch die Entscheidungs- und Nachweisfähigkeit über den gesamten kritischen Projektverlauf.</li></ul>
<h4 class="mvg-original-titel" data-abschnitt="k1.3">1.3 Ergebnisbild</h4>
<p class="mvg-original" data-absatz="k1.3-p1">Nach Umsetzung eines MVG-Ansatzes verfügt der Bauherr nicht über eine lose Sammlung einzelner Methoden, sondern über ein belastbares Führungs- und Entscheidungsmodell. Dieses Modell zeigt, welche Entscheidungen beim Bauherrn verbleiben, welche Vorbereitungsleistungen delegierbar sind, welche Mandate und Schwellen gelten, welche Unterlagen entscheidungsreif sein müssen und wie Entscheidungen nachvollziehbar in der Nachweiskette verankert werden.</p>
<table class="mvg-original" data-absatz="k1.3-t1"><thead><tr><th>Element</th><th>Ergebnis</th></tr></thead><tbody><tr><td>Bauherren-Mandats- und Verantwortungsmodell</td><td>Klärt Verantwortungsfelder, nichtdelegierbaren Kern, delegierbare Vorbereitung, Rollen, Schwellen und Eskalationswege.</td></tr><tr><td>System der Entscheidungs-IDs</td><td>Gibt jeder wesentlichen Bauherrenentscheidung eine eindeutige Kennung, einen Datenstand, ein Mandat, einen Freigabeweg und einen Nachverfolgungsstatus.</td></tr><tr><td>Leistungsphasen- und Freigabemodell LPH 0–9</td><td>Verbindet Projektfortschritt mit Entscheidungsvorbereitung, Freigabereife, Risikoannahme und Nachweisführung.</td></tr><tr><td>Standard für Entscheidungsvorlagen</td><td>Sichert die Nachvollziehbarkeit von Entscheidungsfrage, Alternativen, Annahmen, Risiken, Datenstand, Empfehlung, Freigabe und Beschlusslage.</td></tr><tr><td>Betriebshandbuch</td><td>Übergibt Routinen, Rollen, Taktung, Fristen, Eskalationswege und Betriebslogik in den Regelbetrieb.</td></tr><tr><td>Befähigung</td><td>Stellt sicher, dass Bauherren-Projektleitung, Auftraggeber Logik, PMO, Gremienrollen und Fachrollen das Modell selbst anwenden können.</td></tr></tbody></table>`},id:"k1",kennungen:["k1"],kinder:[],kopf:{absaetze:["k1-p1","k1-p2","k1-p3","k1.1-p1","k1.2-l1","k1.3-p1","k1.3-t1"],quelle:"Whitepaper V1.2, Kap. 1, 1.1, 1.2, 1.3"},liste:null},{art:"querverweis",felder:{text:"<p>Welt A, Monat 5: Kosten +8 % – zwei Zahlen, vier Randnotizen, keine Entscheidung.</p>"},id:"A3",kennungen:["A3"],kinder:[],kopf:{text:"In der Story erlebt: A3"},liste:null},{art:"querverweis",felder:{text:"<p>Welt B, derselbe Montag: ein Datenstand, ein Mandat, eine Entscheidungsvorlage.</p>"},id:"B3",kennungen:["B3"],kinder:[],kopf:{text:"In der Story erlebt: B3"},liste:null}],deckt:[],einleitung:"<p>Das erste Kapitel fasst das Whitepaper auf einer Seite zusammen: die Leitthese, fünf Managementaussagen und das Ergebnisbild. Die Karten zeigen die Aussagen einze
