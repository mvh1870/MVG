# 8 · Schulstart (Drehbuch Abschnitt 4, Kapitel 8)
# Freigabe am Ende der Bauzeit (intern Abschluss LPH 8); sichtbar ohne Phasennummer. Offenes geht an das Gebäudemanagement.
# Mini-Aufgabe: v24:hb-5 (Abschlusskriterien, Risiko nur mit nachgewiesenem Grund schließen, Übergabe), v24:hb-1.2, v24:hb-1.4, v24:hb-1.6
nr: 8
titel: Schulstart
zeit: Juli 2028
campus: { stufe: 6, jahreszeit: sommer, licht: tag }
campus-nachher: { stufe: 7, jahreszeit: sommer, licht: tag }
bruecke: Im Juli 2028 erteilt die Bürgermeisterin die Freigabe mit Auflagen; zwei kleine Restarbeiten gehen mit Termin und Namen an das Gebäudemanagement.
thema: ergebnisbild
belege: [k9.3-p3, k6.4.4-p1, k4.5-p1, v24:hb-1, v24:hb-1.2, v24:hb-1.4, v24:hb-1.6, v24:hb-5, v24:tlb-2]
bild-szene: lupe
bild-frage: schluessel

einstieg: |
  Juli 2028. Der Kran ist fort, auf dem Schulhof wird Rasen gesät und werden junge Bäume gepflanzt, die Fenster glänzen. In drei Wochen beginnt das Schuljahr.

  Theo Lot geht mit einer langen Liste durch die Räume, Konrad Schwung prüft jede Tür, und Hanna Klingel hat die ersten Stundenpläne schon an die Wand geheftet. Vorher steht die letzte große Freigabe an: die am Ende der Bauzeit.

szene:
  - { figur: lot, text: "Fast alles fertig. Nur der Hallenboden: An zwei Stellen sind Fugen offen. Die Firma bessert bis zu den Herbstferien nach." }
  - { figur: schwung, text: "Und die Lüftung braucht im ersten Winter noch eine Feineinstellung. Das ist normal." }
  - { figur: klingel, text: "Ich will nur eins hören: Können die Kinder kommen?" }
  - { figur: faden, text: "Ich habe die Freigabe vorbereitet. Zwei Punkte sind offen, beide mit Termin und Zuständigen. Als erledigt melde ich sie nicht – sie sind es nicht. Meine Empfehlung steht in der Vorlage." }
  - { figur: grundstein, text: "Und Sie – was legen Sie mir ans Herz?" }

frage: Die Schule will einziehen, und auf der Liste stehen noch zwei Zeilen. Was empfehlen Sie der Bürgermeisterin?

antworten:
  - wertung: falle
    text: Freigabe ohne Einschränkung. Die zwei Punkte sind Kleinigkeiten – die müssen nicht extra in die Vorlage.
    balken: { geld: 0, zeit: 0, vertrauen: -2 }
    bild: projektblatt
    folge: |
      Clara Faden schüttelt den Kopf: „Offenes zeige ich als offen.“ In ihrem Bericht stehen die zwei Punkte, und die Bürgermeisterin liest ihn, bevor sie unterschreibt. „Warum sollte ich das nicht erfahren?“ Sie erteilt die Freigabe mit Auflagen; die Punkte werden erledigt – das Gespräch aber bleibt Ihnen im Gedächtnis.
  - wertung: vertretbar
    text: Freigabe. Die zwei Punkte klärt der Architekt mit den Firmen – das gehört ohnehin zu seiner Aufgabe.
    balken: { geld: 0, zeit: 0, vertrauen: 0 }
    bild: notizzettel
    folge: |
      Die Bürgermeisterin erteilt die Freigabe. Clara Faden übergibt die zwei Punkte trotzdem an das Gebäudemanagement – verschwinden lässt sie nichts. Weil die Freigabe sie aber nicht nennt, fühlt sich die Firma für den Hallenboden nicht gedrängt: Die Fugen sind erst im Frühjahr geschlossen.
  - wertung: gut
    text: "Freigabe mit Auflagen: Die Schule zieht ein, die zwei offenen Punkte gehen mit Termin und Namen ans Gebäudemanagement."
    balken: { geld: 0, zeit: 0, vertrauen: 1 }
    bild: mappe
    folge: |
      Im Lenkungskreis wird kurz beraten, dann erteilt die Bürgermeisterin die Freigabe mit Auflagen. Clara Faden übergibt alles, was noch offen ist, an das Gebäudemanagement – jeden Punkt mit Termin und Namen. Zu den Herbstferien sind die Fugen geschlossen, im Januar ist die Lüftung eingestellt, und beides ist mit Nachweis erledigt. Das Gebäudemanagement findet alles an einer Stelle – niemand muss suchen.

gut: |
  Die Freigabe erteilt der Bauherr selbst – als Freigabe, keine Freigabe oder Freigabe mit Auflagen; der Lenkungskreis berät. Was noch offen ist, wird mit Termin und Zuständigen übergeben und nie als erledigt ausgegeben: Ein Vorgang verschwindet nicht durch die Übergabe.

mini:
  art: zuordnen
  titel: Zu Recht geschlossen oder übergeben?
  aufgabe: Vor der Übergabe geht die Projektsteuerin alle Einträge noch einmal durch. Welche sind zu Recht geschlossen, welche übergibt sie an das Gebäudemanagement?
  bild: schluessel
  wahlen:
    - { id: geschlossen, titel: zu Recht geschlossen, bild: stempel }
    - { id: uebergeben, titel: übergeben, bild: mappe }
  # gemischt, damit die Lösung nicht schon in der Reihenfolge steht; der Kartentext nennt den Stand, nicht die Lösung
  posten:
    - { text: "Die Fugen im Hallenboden – die Firma hat zugesagt, bis zu den Herbstferien nachzubessern.", loesung: uebergeben, bild: kalender, erklaerung: "Zugesagt ist nicht erledigt. Der Punkt geht mit Termin und Zuständigen weiter." }
    - { text: "Das Risiko langer Lieferzeiten für die Holzelemente – alle Holzelemente sind eingebaut.", loesung: geschlossen, bild: holzstapel, erklaerung: "Die Gefahr ist entfallen – ein nachgewiesener Grund zum Schließen." }
    - { text: "Die Feineinstellung der Lüftung – vorgesehen für den ersten Winter.", loesung: uebergeben, bild: lueftung, erklaerung: "Das kommt erst noch. Wer sich darum kümmert und bis wann, wird bei der Übergabe festgehalten." }
    - { text: "Die losen Gerüstanker aus dem Februar 2027 – erneuert, die Sicherheitskoordination hat das Gerüst abgenommen.", loesung: geschlossen, bild: geruest-sturm, erklaerung: "Die Lösung ist umgesetzt und fachlich bestätigt; geschlossen wurde gleich danach." }
    - { text: "Die angekündigten Mehrkosten der Haustechnik – die Prüfung im Herbst 2026 ergab: Die Leistungen gehören zum bestehenden Vertrag.", loesung: geschlossen, bild: kostenzettel, erklaerung: "Ein Risiko wird nur mit nachgewiesenem Grund geschlossen – den gab es schon damals." }

dahinter: "Am Ende zählt, was sich nachweisen lässt: welche Entscheidung wer auf welchem Stand getroffen hat – und was noch offen ist, mit Namen und Termin."

regie:
  notiz: "Kern: Die Freigabe erteilt der Bauherr selbst, der Lenkungskreis berät; Offenes wird mit Termin und Zuständigen übergeben und nie als erledigt ausgegeben. Danach zur Bilanz: Die Balken zeigen, wie der Weg der Runde gelaufen ist."
  leitfragen:
    - Was passiert bei Ihnen mit offenen Punkten, wenn ein Projekt übergeben wird?
    - Wer erteilt bei Ihnen die Freigabe – und wer berät nur?
