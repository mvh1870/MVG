id: abb-6
quelle: bilder/image6.png
titel: Sechs Verantwortungsfelder des Bauherrn
alt: >-
  Mittig steht der „MVG-Kern“ mit „ausübbar“, „prüfbar“, „gestaltbar“, „nachweisfähig“. Ringsum im Uhrzeigersinn ab oben
  links sechs Karten mit je vier Zeilen, etwa: „Ziel“ (Zielsystem, Freigabelogik für LPH 0–2), „Mandat“
  (Mandatsmodell, Schwellen, Eskalation), „Entscheidung“ (Entscheidung ID, Reifegrad, Entscheidungsfrage),
  „Risikoannahme“ (Risiko-/Änderungs-/Maßnahmenverknüpfung, Restrisiko, Risikominderung), „Freigabe“
  (Leistungsphasen- und Freigabemodell LPH 0–9, Datenstandsbezug), „Datenstand & Nachweis“ (Beschlusslage,
  Nachweiskette, Betriebshandbuch, teils verdeckt). Dazu Haftnotizen.
