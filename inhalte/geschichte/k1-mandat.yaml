einstieg: |
  Januar 2026. Auf dem Grundstück im Süden von Lindenhall liegt Schnee, am Zaun lehnt ein Bauschild.

  Seit heute leiten Sie das Projekt für die Stadt. Der Stadtrat hat das Geld bewilligt: ein Budget von rund 58 Millionen Euro und dazu eine Reserve von 3 Millionen für Unvorhergesehenes. Ihr erster Termin findet im kleinen Baucontainer am Rand des Grundstücks statt – die Heizung brummt, auf dem Tisch stehen vier Tassen Kaffee.

# Kurzfassung (P17.5): derselbe Sachstand in kürzer – Budget und Reserve bleiben, weil das Mandat darauf aufbaut
einstieg-kurz: |
  Januar 2026. Seit heute leiten Sie das Projekt für die Stadt. Bewilligt sind rund 58 Millionen Euro und eine Reserve von 3 Millionen für Unvorhergesehenes.

