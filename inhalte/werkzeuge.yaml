wegweiser:
  titel: Vorgangs-Wegweiser
  kurz: Vom Sachverhalt zur Vorgangsart – mit wenigen Fragen.
  belege: [v24:hb-1, v24:hb-1.1, v24:hb-1.2, v24:hb-1.3, v24:hb-1.4, v24:hb-1.5, v24:hb-1.6, v24:hb-5]
  text: |
    Wenige Fragen führen von einem Sachverhalt zur passenden Art des Vorgangs – mit dem nächsten Schritt, dem, was festgehalten wird, und der typischen Verwechslung. Erfasst und bearbeitet wird in der Software des Bauherrn durch die Projektsteuerung.
  fragen:
    - { id: dringlich, frage: "Ist es dringlich – etwa weil Sicherheit gefährdet ist oder eine Möglichkeit zu handeln verloren zu gehen droht?", belege: [v24:hb-3, v24:hb-4] }
    - { id: handlung, frage: "Geht es um eine Handlung, die einen schon erfassten Vorgang klären, mindern oder beheben oder einen Beschluss umsetzen soll?", belege: [v24:hb-1, v24:hb-1.6] }
    - { id: eingetreten, frage: "Ist schon etwas Nachteiliges passiert?", belege: [v24:hb-1.4, v24:hb-1.2] }
    - { id: anpassen, frage: "Soll etwas, das bisher gilt, bewusst anders werden – Umfang, Planung, Material, Ausführung oder Termin?", belege: [v24:hb-1.5] }
    - { id: moeglich, frage: "Könnte etwas Nachteiliges eintreten, oder ist eine Größe unsicher, die Kosten, Termine oder Qualität treffen kann?", belege: [v24:hb-1.3, v24:hb-1.2, v24:hb-2] }
    - { id: arbeit, frage: "Ist es eine geplante Arbeit mit vereinbartem Ergebnis, Verantwortlichen und Termin?", belege: [v24:hb-1.1, v24:hb-1, v24:hb-1.2] }
    - { id: entscheidung, frage: "Braucht es eine Entscheidung des Bauherrn – über Ziele, wesentliche Abweichungen, Geld, das Tragen eines Risikos oder eine Freigabe?", belege: [v24:hb-1, v24:hb-3.1, v24:hb-1.3, k4.4-p1] }
  ergebnisse:
    - { art: fruehwarnung, schritt: "Quelle sichern, Prüffrage stellen, festlegen, wer bis wann prüft.", festhalten: "Woher der Hinweis kommt und seit wann, was zu klären ist, wer klärt, wann wieder darauf geschaut wird.", belege: [v24:hb-1.2, v24:hb-5] }
    - { art: risiko, schritt: "Ursache, mögliche Folgen und Zeitraum beschreiben, bewerten, Gegenmaßnahmen mit den Fachleuten entwickeln.", festhalten: "Auslöser und was daran unsicher ist, mögliche Folgen und wann sie drohen, die Bewertung mit Begründung und Stand der Zahlen, Gegenmaßnahmen und was danach bleibt.", belege: [v24:hb-1.3, v24:hb-2, v24:hb-5] }
    - { art: problem, schritt: "Klären, was geschehen ist und welche Folgen feststehen; Lösung und Zwischenmaßnahmen abstimmen.", festhalten: "Was passiert ist und was daraus schon folgt, was geklärt wurde, was vorläufig hilft, wie es gelöst wird, und der Nachweis dafür.", belege: [v24:hb-1.4, v24:hb-5] }
    - { art: aenderung, schritt: "Anlass, Antragsteller, bisherige Grundlage und Wunsch aufnehmen; Auswirkungen ermitteln lassen.", festhalten: "Warum und von wem gewünscht, was bisher gilt und was gelten soll, die geprüften Folgen, Vorlage und Beschluss mit Auflagen, Stand der Umsetzung.", belege: [v24:hb-1.5, v24:hb-5] }
    - { art: massnahme, schritt: "Bezug, Ziel, Verantwortlichen und Termin nennen; vorher klären, ob sie im Auftrag und in den Befugnissen liegt.", festhalten: "Wozu sie gehört und was sie bewirken soll, wer sie bis wann umsetzt, welche Freigabe sie braucht; danach, dass sie umgesetzt ist und ob sie wirkt.", belege: [v24:hb-1.6, v24:hb-5] }
    - { art: aufgabe, schritt: "Ergebnis, Verantwortlichen, Termin und Abhängigkeiten festlegen.", festhalten: "Was am Ende vorliegen soll, wer es bis wann liefert, wovon es abhängt.", belege: [v24:hb-1.1, v24:hb-5] }
  zusaetze:
    sofort: { titel: Sofort melden, text: "Es wird sofort über den vereinbarten Meldeweg gemeldet, die unmittelbare Reaktion wird gesichert, und noch am selben Arbeitstag wird der Vorgang festgehalten. Der Monatsbericht ersetzt das nicht.", belege: [v24:hb-4, v24:hb-3] }
    unklar: { titel: Noch nicht geklärt, text: "Was sich nicht einordnen lässt, ist noch nicht ausreichend geklärt – deshalb eine Frühwarnung.", belege: [v24:hb-1.2] }
    keinVorgang: { titel: Vermutlich kein Vorgang, text: "Ist doch eine Beeinträchtigung denkbar, wird der Hinweis als Frühwarnung festgehalten; sonst wird er mit Begründung geschlossen.", belege: [v24:hb-1, v24:hb-1.2] }
    nichtSchaetzen: { titel: Keine Wahrscheinlichkeit mehr, text: "Eine Wahrscheinlichkeit wird nicht mehr geschätzt.", belege: [v24:hb-1.4] }
    bisherGilt: { titel: Bis zur Freigabe, text: "Bis zur Freigabe gilt die bisherige Grundlage.", belege: [v24:hb-1.5] }
    entscheidung: { titel: Entscheidung vorbereiten, text: "Mindestens zwei zulässige Wege, gewichteter Vergleich, Empfehlung, Termin; den Beschluss trifft die befugte Stelle.", belege: [v24:hb-1, v24:hb-3.1] }
    bewerten: { titel: Als Nächstes bewerten, text: "Als Nächstes wird das Risiko bewertet.", belege: [v24:hb-1.3] }
    verknuepfen: { titel: Verknüpfen, text: "Zusammengehörige Einträge werden verknüpft; die Herkunft geht nicht verloren.", belege: [v24:hb-1, v24:hb-1.2] }
  verwechslungen:
    - { id: zu-frueh-risiko, art: fruehwarnung, text: "„Gleich als Risiko eintragen“ – erst klären; eine Bewertung ohne Grundlage braucht es nicht.", belege: [v24:hb-1.2, v24:hb-2] }
    - { id: bis-zum-termin, art: fruehwarnung, text: "„Das hat Zeit bis zum Monatstermin“ – ein neuer Hinweis wird spätestens bei der nächsten Wochendurchsicht festgehalten.", belege: [v24:hb-4] }
    - { id: geplant-senkt, art: risiko, text: "„Die Maßnahme ist geplant, also ist das Risiko kleiner“ – die Bewertung sinkt erst, wenn Umsetzung und Wirkung belegt sind.", belege: [v24:hb-3] }
    - { id: selten-also-egal, art: risiko, text: "„Unwahrscheinlich, also egal“ – eine schwere Folge wird trotzdem geklärt.", belege: [v24:hb-3] }
    - { id: wahrscheinlichkeit-problem, art: problem, text: "„Wie wahrscheinlich ist das?“ – es ist schon passiert; jetzt zählen Folgen und Lösung.", belege: [v24:hb-1.4] }
    - { id: eile-freigabe, art: problem, text: "„Es eilt, also ist es freigegeben“ – Dringlichkeit ersetzt keine Freigabe.", belege: [v24:hb-1.4] }
    - { id: zusage-beschluss, art: aenderung, text: "„Das wurde doch zugesagt“ – eine Zusage am Rand ist kein Beschluss; bis zur Freigabe gilt die bisherige Planung.", belege: [v24:hb-1.5, v24:hb-3.1] }
    - { id: freigabe-nachtrag, art: aenderung, text: "„Freigegeben heißt bestellt“ – die Freigabe im Projekt ist noch keine Vertragsänderung oder Bestellung.", belege: [v24:hb-1.5] }
    - { id: umgesetzt-wirksam, art: massnahme, text: "„Erledigt“ – getan heißt noch nicht, dass es hilft; das zeigt erst die Prüfung danach.", belege: [v24:hb-1.6] }
    - { id: termin-statt-grund, art: aufgabe, text: "„Neuer Termin, Thema erledigt“ – wer verschiebt, sagt auch, warum es später wird.", belege: [v24:hb-1.1] }
    - { id: jede-aufgabe-beschluss, art: aufgabe, text: "„Dafür braucht es einen Beschluss“ – eine offene Aufgabe zieht nicht von selbst eine Bewertung oder einen Beschluss nach sich.", belege: [v24:hb-1.1] }
  beispiele:
    - { id: messe, quelle: k2, titel: "Hinweis von der Messe: Holz wird knapp", text: "März 2026: Der Architekt hat auf einer Messe gehört, dass die Lieferzeiten für Holzelemente länger werden.", antworten: { dringlich: nein, handlung: nein, eingetreten: nein, anpassen: nein, moeglich: unklar, entscheidung: nein }, erwartet: { art: fruehwarnung } }
    - { id: hersteller, quelle: k3, titel: Drei Hersteller brauchen länger, text: "April 2026: Drei von vier Herstellern brauchen ein halbes Jahr statt vier Monate; ob der Holzbau später beginnt, ist offen.", antworten: { dringlich: nein, handlung: nein, eingetreten: nein, anpassen: nein, moeglich: ja, entscheidung: ja }, erwartet: { art: risiko, entscheidung: true } }
    - { id: ausschreiben, quelle: k3, titel: Holzelemente früher ausschreiben, text: "April 2026: Die Holzelemente werden auf Beschluss der Bürgermeisterin früher ausgeschrieben.", antworten: { dringlich: nein, handlung: ja, entscheidung: nein }, erwartet: { art: massnahme } }
    - { id: mensa, quelle: k4, titel: Größere Mensa gewünscht, text: "Juni 2026: Die Schulleitung wünscht eine Mensa für 450 statt 300 Essen.", antworten: { dringlich: nein, handlung: nein, eingetreten: nein, anpassen: ja, entscheidung: ja }, erwartet: { art: aenderung, entscheidung: true } }
    - { id: mehrkosten, quelle: k5, titel: Angekündigte Mehrkosten, text: "Oktober 2026: Die Haustechnikfirma kündigt Mehrkosten von gut einer Million an; die Vergabestelle prüft zuerst, ob sie berechtigt sind.", antworten: { dringlich: nein, handlung: nein, eingetreten: nein, anpassen: nein, moeglich: ja, entscheidung: nein }, erwartet: { art: risiko, entscheidung: false } }
    - { id: geruest, quelle: k6, titel: Lose Gerüstanker nach dem Sturm, text: "Februar 2027: Nach dem Sturm sind zwei Gerüstanker an der Sporthalle lose.", antworten: { dringlich: ja, handlung: nein, eingetreten: ja, entscheidung: nein }, erwartet: { art: problem, dringlich: true } }
    - { id: lueftung, quelle: k7, titel: Lüftungsanlage kommt später, text: "Mai 2027: Der Hersteller der Lüftungsanlage für die Gesamtschule liefert vier Monate später.", antworten: { dringlich: nein, handlung: nein, eingetreten: ja, entscheidung: ja }, erwartet: { art: problem, entscheidung: true } }
    - { id: haushalt, quelle: fall, titel: Kostenübersicht für den Haushalt, text: "Die Kostenübersicht für den Haushaltsansatz 2027 geht bis Freitag an die Kämmerei.", antworten: { dringlich: nein, handlung: nein, eingetreten: nein, anpassen: nein, moeglich: nein, arbeit: ja, entscheidung: nein }, erwartet: { art: aufgabe } }

risikogrenzen:
  titel: Risiko-Bewerter
  kurz: Ein Risiko mit den eigenen Grenzen des Projekts bewerten – auch wenn noch nicht alles bekannt ist.
  belege: [v24:hb-2, v24:hb-3, v24:hb-projektblatt, v24:hb-1.3]
  text: |
    Der Bauherr legt für das Projekt fest, ab welcher Wahrscheinlichkeit, welchem Betrag und wie vielen Tagen Verzug eine Stufe beginnt. Mit diesen Grenzen wird jedes Risiko gleich eingestuft. Was noch niemand beziffern kann, bleibt unbekannt – es zählt nicht als null.
  grenzen:
    wahrscheinlichkeit: [10, 30, 50, 70]       # Prozent – Beispielwerte, L-253 (E-1)
    kosten: [100000, 500000, 1500000, 3000000]  # Euro – Fall
    termin: [14, 28, 42, 70]                    # Kalendertage – Fall
  zustaende:
    fest: Bewertung fest
    vorlaeufig: vorläufige Bewertung
    offen: Bewertung offen
  warnanlaesse:
    - { id: sicherheit, titel: Sicherheit }
    - { id: genehmigung, titel: Genehmigung }
    - { id: befugnis, titel: fehlende Befugnis }
    - { id: option, titel: drohender Verlust einer Möglichkeit zu handeln }
  grenzfehler:
    anzahl: Je Reihe gehören genau vier Grenzen dazu.
    nicht-positiv: Jede Grenze ist größer als null.
    nicht-steigend: Die Grenzen steigen von links nach rechts.
    ueber-100: Eine Wahrscheinlichkeit liegt unter 100 Prozent.
  saetze:
    fehler: { text: "Dieser Wert passt nicht zu den Grenzen; die Zeile zählt wie „unbekannt“.", belege: [v24:hb-2] }
    grenze: { text: "Genau auf der Grenze – das ist noch Stufe {n}.", belege: [v24:hb-2, v24:hb-projektblatt] }
    offen: { text: "Ohne Wahrscheinlichkeit oder ohne bekannte Auswirkung ist die Einstufung offen.", belege: [v24:hb-2] }
    vorlaeufig: { text: "Eine Auswirkung ist noch unbekannt: Die Einstufung ist vorläufig, und das Unbekannte zählt nicht als null.", belege: [v24:hb-2, v24:hb-projektblatt] }
    schwereFolge: { text: "Auch ohne Nachweis wird geklärt, ob eine schwere Folge droht.", belege: [v24:hb-2] }
    spanne: { text: "Festgehalten werden die Spanne und das, was noch geprüft werden muss.", belege: [v24:hb-2] }
    warnanlass: { text: "Hier zählt nicht das Matrixfeld: Ein solcher Anlass wird unabhängig davon behandelt; ist er dringlich, wird er sofort über den vereinbarten Meldeweg gemeldet.", belege: [v24:hb-3, v24:hb-4] }
    wesentlich: { text: "Gebraucht werden belastbare Spannen für Kosten und Termin – oder die Angabe, wer welche Frage klärt.", belege: [v24:hb-3, v24:hb-1.3] }
    annahme: { text: "Ob der Bauherr ein wesentliches Risiko trägt, entscheidet die befugte Stelle; die Projektsteuerung bereitet das vor.", belege: [v24:hb-1.3, k4.4-p1] }
    annahmeBeispiel: { text: "Ob der Bauherr ein wesentliches Risiko trägt, entscheidet im Beispielprojekt die Bürgermeisterin; die Projektsteuerung bereitet das vor.", belege: [v24:hb-1.3, k4.4-p1, fall] }
    selten: { text: "Selten heißt nicht harmlos: Die schwere Folge bleibt im Blick und wird geklärt.", belege: [v24:hb-3] }
    geplant: { text: "Solange die Maßnahme nur geplant ist, bleibt das Feld, wo es ist.", belege: [v24:hb-3] }
    belegt: { text: "Erst wenn die Maßnahme umgesetzt ist und ihre Wirkung nachgewiesen, wird die Bewertung angepasst – begründet.", belege: [v24:hb-3, v24:hb-1.3] }
    prognose: { text: "Was schon in der Prognose steckt, wird dort sichtbar gemacht und hier nicht ein zweites Mal gezählt.", belege: [v24:hb-2, v24:hb-1] }
    puffer: { text: "Maßgeblich ist, um wie viele Tage sich der Zieltermin verschiebt – nicht, wie viel später eine einzelne Arbeit fertig wird.", belege: [v24:hb-2] }
    vorrangA5: { text: "Vorrangig wegen Auswirkung 5 – nach dem Produkt allein wäre es weniger.", belege: [v24:hb-2, v24:hb-3] }
    nachObenOffen: { text: "nach oben offen", belege: [v24:hb-2] }
  beispiele:
    - id: ris-009
      kennung: RIS-009
      titel: Holzbauelemente kommen zu spät
      quelle: k3
      w: { stufe: 4 }
      kosten: unbekannt
      termin: { von: 0, bis: 70 }   # „bis zu zehn Wochen“ (Story 3)
      qualitaet: { stufe: 4 }
      massnahme: geplant
      schwelle: true
      waswaere:                     # nur Annahmen, sichtbar mit „Angenommen: …“
        - { id: t70, titel: "Angenommen: Die zehn Wochen schlagen voll auf den Schulstart durch – 70 Tage", termin: { wert: 70 } }
        - { id: t71, titel: "Angenommen: ein Tag mehr – 71 Tage", termin: { wert: 71 } }
        - { id: w1, titel: "Angenommen: Wahrscheinlichkeit sehr gering", w: { stufe: 1 } }
        - { id: belegt, titel: "Angenommen: Die Maßnahme ist umgesetzt und wirkt", massnahme: belegt }
      erwartet: { feld: 16, zustand: vorlaeufig, nachObenOffen: true, prioritaet: vorrangig }
    - id: ris-014
      kennung: RIS-014
      titel: Angekündigte Mehrkosten der Haustechnikfirma
      quelle: k5
      w: { stufe: 3 }
      kosten: { von: 1000000, bis: 1200000 }
      termin: entfaellt
      qualitaet: entfaellt
      prognose: nein
      schwelle: true
      erwartet: { feld: 9, zustand: fest, nachObenOffen: false, prioritaet: gezielt }
    - id: ris-021
      kennung: RIS-021
      titel: Kampfmittelverdacht im Baufeld der Sporthalle
      quelle: matrix
      w: { stufe: 1 }
      kosten: unbekannt
      termin: unbekannt
      qualitaet: { stufe: 5 }
      warn: [sicherheit]
      erwartet: { feld: 5, zustand: vorlaeufig, nachObenOffen: false, prioritaet: vorrangig, vorrangWegenA5: true }

monatsbericht:
  titel: Monatsbericht
  kurz: Wenige Felder, eine Seite – und eine Warnung, wenn eine Ampel keine Frage hat.
  belege: [v24:hb-4, v24:as-2, k2.4-p2, v24:hb-5]
  text: |
    Der Monatsbericht fasst auf höchstens einer Seite zusammen, was sich verändert hat, was blockiert ist und welche Entscheidungen offen sind – und welche Reaktion vom Bauherrn gebraucht wird. Er verweist auf die Einträge in der Software und ersetzt sie nicht.
  ampel:
    gruen: Bericht vollständig
    gelb: Bericht mit offenen Hinweisen
    rot: Bericht noch nicht fertig
  ampeln:
    - { id: kosten, titel: Kosten }
    - { id: termine, titel: Termine }
    - { id: qualitaet, titel: Qualität }
  farben: { gruen: grün, gelb: gelb, rot: rot }
  abschnitte:                 # Reihenfolge und Höchstzahl (Bedienregel); „Leer beginnen“ belegt jeden mit „keine“ vor
    - { id: veraenderungen, titel: Wesentliche Veränderungen, max: 4 }
    - { id: blockiert, titel: Blockierte Aufgaben, max: 3 }
    - { id: massnahmen, titel: Kritische Maßnahmen, max: 3 }
    - { id: fruehwarnungen, titel: Ungeklärte Frühwarnungen, max: 3 }
    - { id: probleme, titel: Wesentliche Probleme und Änderungen, max: 4 }
  entscheidungen: { titel: Offene Entscheidungen, max: 3 }
  reaktion: Benötigte Reaktion des Bauherrn
  projekt: Schulcampus Lindenhall-Süd   # Kopf des Berichts, solange ein Beispiel zugrunde liegt (Konzept D.6)
  fuss: { text: "Die vollständigen Einträge stehen in der Software.", belege: [v24:hb-4] }
  saetze:
    ampelOhneFrage: { text: "Diese Ampel zeigt nur einen Zustand, solange keine offene Entscheidung mit ihr verknüpft ist – Frage, wer, bis wann – und keine Reaktion genannt ist, die vom Bauherrn gebraucht wird.", belege: [k2.4-p2, v24:hb-4] }
    entscheidungOhneWerBisWann: { text: "Zu jeder offenen Entscheidung gehören, wer entscheidet und bis wann.", belege: [v24:hb-5, v24:hb-3.1] }
    ohneKennung: { text: "Jeder Eintrag verweist auf seinen Vorgang in der Software – der Bericht ist keine zweite Liste.", belege: [v24:hb-4, v24:tlb-2] }
    leerStattKeine: { text: "Gibt es hier nichts, steht da „keine“ – leer und keine sind nicht dasselbe.", belege: [v24:hb-4, v24:hb-2] }
    zuViele: { text: "Hier stehen mehr Einträge, als auf die Seite passen; Einträge werden zusammengefasst.", belege: [v24:hb-4] }
    dringlich: { text: "Dringliches wird sofort gemeldet; der Bericht ersetzt diese Meldung nicht.", belege: [v24:hb-4] }
    umgesetztNichtWirksam: { text: "Umgesetzt heißt noch nicht wirksam – genannt wird, wann die Wirkung geprüft wird.", belege: [v24:hb-1.6] }
    zuLang: { text: "Der Bericht passt nicht mehr auf eine Seite; er wird gekürzt, oder Einträge werden zusammengefasst.", belege: [v24:hb-4, v24:as-2] }
  beispiele:
    - id: oktober
      quelle: k5
      titel: Monatsbericht Oktober 2026
      monat: Oktober 2026
      datenstand: Stand der Software zum Monatstermin
      lage: "Die Prognose liegt bei rund 59,4 Millionen Euro, rund eine Million über dem Budget und innerhalb der Reserve; die angekündigten Mehrkosten der Haustechnikfirma stehen als Risiko daneben."
      ampeln:
        kosten: { farbe: gelb, satz: "Rund eine Million über dem Budget, innerhalb der Reserve.", reaktion: "Die Bürgermeisterin nennt dem Stadtrat diese Zahl mit Begründung, die angekündigten Mehrkosten als Risiko daneben." }
        termine: { farbe: gruen, satz: "Die ersten Holzelemente werden montiert." }
        qualitaet: { farbe: gruen, satz: "Keine Einschränkung bekannt." }
      eintraege:
        veraenderungen: [{ text: "Zwei Kostenrechnungen abgeglichen, Unterschied: Mehrkosten", kennung: RIS-014 }, { text: Erste Holzelemente montiert, kennung: MAS-007 }]
        blockiert: keine
        massnahmen: keine
        fruehwarnungen: keine
        probleme: [{ text: "Mensa, die wachsen kann: beschlossen, Umsetzung läuft", kennung: AEN-012 }]
      entscheidungen: keine
      reaktion: "Kenntnis; Zahl für den Stadtrat wie oben. Die Vergabestelle prüft die Mehrkosten, Ergebnis in rund vier Wochen."
      erwartet: gruen
