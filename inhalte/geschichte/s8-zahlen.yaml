# 8 · Zwei Zahlen, zwei Wahrheiten (Drehbuch docs/drehbuch-v2/02-akt-2.md, Station 8; alt Kapitel 5)
# Die angekündigten Mehrkosten sind ein Risiko, keine Kosten in der Prognose; die Vergabestelle prüft die Forderung.
# Auf jedem Weg endet die Prüfung im November so, dass die Leistungen zum Vertrag gehören; das Risiko wird geschlossen.
# Station 8 erzeugt und trägt kein Echo; ein Mitglied des Finanzausschusses tritt in den Folgen auf (Echo E8 wird in Station 6 erzeugt).
# Mini-Aufgabe (pinnwand), Belege je Karte: 1 v24:hb-1 · 2 v24:hb-2 · 3 v24:hb-1.2 · 4 v24:hb-1.5 · 5 v24:hb-1, v24:hb-1.4
# Zettel und Endpunkte nach 04-rahmen.md 7.8: Karte 1 Z1→Z2 · 2 Z1→Z3 · 3 Z4→Z5, Z6 · 4 Z7→(loses Ende; Z8 hängt daneben) · 5 Z9→Z10
nr: 8
titel: Zwei Zahlen, zwei Wahrheiten
zeit: Oktober 2026
campus: { stufe: 3, jahreszeit: herbst, licht: abend }
bruecke: "Oktober: Dem Stadtrat nennt die Bürgermeisterin die erwarteten Gesamtkosten (Prognose) mit Datum; angekündigte Mehrkosten der Haustechnik (Heizung, Lüftung, Strom) stehen als Risiko daneben."
thema: verantwortung
