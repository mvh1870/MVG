vorlage:
  art: optionen
  frage: Wird die Risikoreserve für den Holzbau freigegeben?
  grund: |
    Den Einsatz der Risikoreserve gibt nur der Bauherr frei – das ist nicht delegierbar. Die Projektsteuerung bereitet die Freigabe vor; die Prüfung der Angebote liefert die Generalplanung. Nachtragsverhandlungen und rechtliche Prüfungen gehören nicht zum Auftrag der Projektsteuerung.
  stelle: Bauherr – Dr. Miriam Olbers
  termin: 24. März 2027 (vor Ablauf der Bindefrist)
  verzug: Läuft die Bindefrist ab, müsste neu ausgeschrieben werden.
  muss: Alle Optionen sind vergaberechtlich zulässig.
  optionen:
    - id: A
      titel: Reserve freigeben und beauftragen
      text: Die Reserve deckt den Mehrbetrag des Holzbaus von zusammen 0,9 Mio. €, soweit sie reicht; der Auftrag geht an das günstigste wertbare Angebot.
      punkte:
        kosten: [5, "keine Mehrkosten über die Prognose hinaus"]
        termin: [5, "kein Verzug"]
        qualitaet: [4, "wie geplant"]
        klima: [4, "Holzbau wie geplant"]
      folgen: {}
      konsequenz: Der Auftrag geht raus. Die Projektsteuerung dokumentiert die Freigabe mit Betrag und Bedingungen und führt im Datenstand, wie viel Reserve noch frei ist.
    - id: B
      titel: Neu ausschreiben
      text: Die Ausschreibung wird aufgehoben und mit geänderten Losen neu durchgeführt.
      punkte:
        kosten: [5, "rund −0,3 Mio. € erwartet, unsicher"]
        termin: [1, "rund 42 Tage Verzug"]
        qualitaet: [4, "wie geplant"]
        klima: [4, "Holzbau wie geplant"]
      folgen: { kosten: -0.3, puffer: -42, offen: 1 }
      konsequenz: Die Projektsteuerung bereitet die neue Ausschreibung mit der Generalplanung vor und führt das Terminrisiko neu im Register.
    - id: C
      titel: Beauftragen und an anderer Stelle sparen
      text: Der Auftrag geht an das günstigste wertbare Angebot. Bodenbeläge und Einbaumöbel, noch nicht vergeben, werden einfacher ausgeführt – rund 0,5 Mio. €; aus der Reserve kommt nur, was die Einsparung nicht deckt.
      punkte:
        kosten: [5, "−0,5 Mio. € im Ausbau"]
        termin: [5, "rund 7 Tage Umplanung"]
        qualitaet: [3, "einfachere Ausstattung"]
        klima: [4, "Holzbau wie geplant"]
      folgen: { kosten: -0.5, puffer: -7 }
      konsequenz: Der Auftrag geht raus. Die Projektsteuerung legt die Änderung im Ausbau an, verfolgt die Umplanung und dokumentiert die Freigabe aus der Reserve.
  empfehlung:
    option: A
    text: Die Projektsteuerung empfiehlt, die Reserve freizugeben – dafür ist sie da. Nachteil – 0,9 Mio. € der Reserve sind danach gebunden, und bis zur Fertigstellung ist noch viel offen. Was über Basis plus Reserve (61,3 Mio. €) hinausgeht, deckt die Reserve nicht; dann braucht es eine Neufestlegung der Projektbasis. C liegt dicht dahinter, nur bei Qualität und Funktion zurück – die 0,5 Mio. € Einsparung bringen nach der Skala keinen Punkt, weil auch A keine Mehrkosten über die Prognose hinaus verursacht.
folge: |
  Eine Freigabe zum Einsatz der Reserve ist kein Auftrag und keine Bestellung. Die Beauftragung läuft über den Vergabeweg; die Projektsteuerung verfolgt ihn und dokumentiert beides getrennt.
so-laeuft-es-oft: |
  Der Kostenplaner fällt aus, und mit ihm das Wissen: Welcher Stand ist der richtige? Die Reserve wird nebenbei verbraucht, ohne dass der Bauherr je ausdrücklich zugestimmt hat.
einwand:
  frage: „Die Reserve ist doch dafür da – warum muss ich das freigeben?“
  antwort: Genau deshalb. Die Reserve ist Geld des Bauherrn für Risiken und Abweichungen von der Basis. Wer sie ohne Freigabe verbraucht, nimmt Ihnen die Entscheidung, wofür sie da ist.
theorie: verantwortung
regie:
  notiz: Zwei Themen – Ausfall Holger Stein (kein Problem, weil der Kostenstand in der Software liegt) und die nicht delegierbare Reserve. Auf dem empfohlenen Weg steht die Prognose nach der Lage bei 61,1 Mio. € – 0,2 Mio. € unter Basis plus Reserve. Mit der großen Mensa und ohne Einsparpaket liegt sie darüber; der Bericht sagt dann, dass eine Neufestlegung der Projektbasis nötig wird.
  leitfragen:
    - Was passiert in Ihrem Projekt, wenn der Kostenplaner morgen ausfällt?
