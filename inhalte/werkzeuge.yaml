# Explore-Werkzeuge (P16.8, O-46; vier neue Werkzeuge P18.3/P18.4, O-59, Konzept docs/WERKZEUGE-P18.md). Belege intern, nie sichtbar (O-38). Beispielprojekt: Schulcampus Lindenhall-Süd (O-50).
einleitung: |
  Fiktiver Fall: Alle Beispiele in den Werkzeugen stammen vom Schulcampus Lindenhall-Süd. Stadt und Personen sind erfunden.
mcda:
  titel: Vergleichsrechner (MCDA)
  kurz: Drei Wege nach mehreren Gesichtspunkten vergleichen – und sehen, ab wann ein anderer Weg vorn liegt.
  vorspann:
    wozu: "Hier vergleichen Sie Wege für dieselbe Aufgabe nach mehreren Gesichtspunkten. MCDA steht für Multikriterien-Entscheidungsanalyse: ein gewichteter Vergleich, bei dem nicht jeder Gesichtspunkt gleich wichtig ist."
    eingabe: "Stellen Sie für jeden Gesichtspunkt ein Gewicht von 1 bis 5 ein (je höher, desto mehr Einfluss) und für jeden Weg Punkte von 1 bis 5 (je höher, desto günstiger für das Ziel)."
    ergebnis: "Unten steht je Weg die Gesamtpunktzahl: Punkte mal Gewicht, alles zusammengezählt. Der Weg mit den meisten Punkten liegt vorn. Darunter sehen Sie, bei welchem anderen Gewicht ein anderer Weg vorn läge. Die Rangfolge hilft bei der Entscheidung, ist aber noch kein Beschluss."
  belege: [v24:hb-3.1, v24:hb-3.2]
  text: |
    Die Projektsteuerung vergleicht mindestens zwei zulässige Wege anhand derselben gewichteten Gesichtspunkte (Kriterien). Gewichte und Punkte liegen je zwischen 1 und 5. Für jeden Gesichtspunkt wird Gewicht mal Punkte gerechnet; alles zusammengezählt ergibt die Gesamtpunktzahl des Wegs. Welche Gesichtspunkte es gibt und wie wichtig sie sind, wird vor der Bewertung mit dem Bauherrn abgestimmt.
  hinweis: |
    Die Punktzahl ersetzt nicht das fachliche Urteil. Vor dem Vergleich wird geprüft, ob ein Weg die zwingenden Anforderungen an Sicherheit, Genehmigung und Funktion erfüllt. Ein unzulässiger Weg gewinnt nicht durch Punkte.
matrix:
  titel: Risikomatrix (5 × 5 Felder)
  kurz: "Zum Nachschlagen: Wie wahrscheinlich ist ein Risiko, wie schwer wäre seine Folge – und wie dringend muss es deshalb bearbeitet werden?"
  vorspann:
    wozu: "Die Risikomatrix zeigt, wie dringend ein Risiko bearbeitet werden muss. Sie gilt nur für Risiken."
    eingabe: "Sie tragen nichts ein, sondern wählen ein Feld: Wie wahrscheinlich ist das Risiko (Stufe 1 bis 5), und wie schwer ist die schwerste Folge, die sich belegen lässt (Stufe 1 bis 5)?"
    ergebnis: "Beide Zahlen miteinander multipliziert ergeben die Zahl im Feld. Sie bestimmt, ob ein Risiko beobachtet, gezielt oder vorrangig bearbeitet wird; bei Auswirkung 5 ist es immer vorrangig. Die Zahl ist keine Geldsumme."
  belege: [v24:hb-2, v24:hb-3]
  text: |
    Die Matrix ordnet nur Risiken ein. Man schätzt, wie wahrscheinlich ein Risiko eintritt (Stufe 1 bis 5), und nimmt die schwerste Auswirkung, die sich belegen lässt (Stufe 1 bis 5). Beides multipliziert ergibt die Zahl im Feld, und die bestimmt, wie dringend das Risiko bearbeitet wird. Kosten, Termine und Qualität werden daneben eigens bewertet.
  stufen:
    - { id: beobachten, titel: Beobachten, von: 1, bis: 4, text: "Man hält fest, wer verantwortlich ist, wann das Risiko wieder geprüft wird und was eine neue Bewertung auslöst." }
    - { id: gezielt, titel: Gezielt bearbeiten, von: 5, bis: 9, text: "Die Projektsteuerung schlägt Maßnahmen vor, klärt, wer sie bis wann umsetzt, und begleitet die Umsetzung." }
    - { id: vorrangig, titel: Vorrangig bearbeiten, von: 10, bis: 25, text: "Die Projektsteuerung holt fachlichen Rat ein, unterrichtet den Bauherrn und bereitet nötige Handlungen und Entscheidungen rechtzeitig vor." }
  regel: "Auswirkung 5 ist immer vorrangig, auch wenn das Ergebnis aus Wahrscheinlichkeit mal Auswirkung klein ist. Die Zahlen sagen nur, wie dringend bearbeitet wird: Sie sind keine Geldwerte und keine Freigabe."
  sonder: Geht es um Sicherheit, Genehmigung, eine fehlende Befugnis oder darum, dass eine Möglichkeit zu handeln verloren zu gehen droht, wird das unabhängig von der Matrix behandelt, also nicht nur nach dem Feld.
  wahrscheinlichkeit: [sehr gering, gering, mittel, hoch, sehr hoch]
  qualitaet:
    - Die Abweichung ist gering; die Nutzung bleibt unberührt.
    - Es muss nachgearbeitet werden; genutzt werden kann wie vorgesehen.
    - Die Nutzung ist für eine Zeit beschränkt.
    - Eine wichtige Teilfunktion ist erheblich beeinträchtigt.
    - Eine wesentliche Funktion oder die Hauptnutzung entfällt.
  beispiele:
    - { kennung: RIS-005, titel: Baupreissteigerung Holzbau, w: 3, a: 3 }
    - { kennung: RIS-009, titel: Holzbauelemente kommen zu spät (Auswirkung auf den Schulbetrieb), w: 4, a: 4 }
    - { kennung: RIS-014, titel: Angekündigte Mehrkosten der Haustechnikfirma, w: 3, a: 3 }
    - { kennung: RIS-021, titel: Kampfmittelverdacht im Baufeld der Sporthalle, w: 1, a: 5 }
    - { kennung: RIS-022, titel: Verzögerte Möbellieferung Mensa, w: 2, a: 2 }
vorgaenge:
  titel: Vorgangsarten und ihre Übergänge
  kurz: "Zum Nachschlagen: sechs Arten von Vorgängen, und was aus einem Vorgang als Nächstes werden kann."
  vorspann:
    wozu: "Hier sehen Sie die sechs Arten von Vorgängen: Aufgabe, Frühwarnung, Risiko, Problem, Änderung und Maßnahme. Ein Vorgang ist ein Eintrag, mit dem die Projektsteuerung etwas im Projekt festhält und verfolgt."
    eingabe: "Sie tragen nichts ein, sondern wählen eine Art von Vorgang aus."
    ergebnis: "Sie sehen, was die Art bedeutet, ein Beispiel, wann sie abgeschlossen ist und was daraus werden kann. „Entscheidung vorbereiten“ ist keine siebte Art, aber ein möglicher nächster Schritt."
  belege: [v24:hb-1, v24:hb-1.1, v24:hb-1.2, v24:hb-1.3, v24:hb-1.4, v24:hb-1.5, v24:hb-1.6, v24:hb-5]
  text: |
    Die Projektsteuerung erfasst und bearbeitet die Vorgänge ihres Auftrags in der Projektsoftware des Bauherrn, also der Software, in der alle Vorgänge des Projekts stehen; der Bauherr pflegt keine eigene Liste. Nicht jeder Hinweis wird zum Risiko, und nicht jeder Vorgang durchläuft alle Arten. Zusammengehörige Einträge werden verbunden, damit man sieht, woraus ein Vorgang entstanden ist.
  arten:
    - id: aufgabe
      titel: Aufgabe
      text: "Eine geplante Arbeit: Es ist vereinbart, was am Ende vorliegen soll, wer sich kümmert und bis wann."
      beispiel: AUF-001 – Die Kostenübersicht für den Haushalt 2027 geht bis Freitag an die Finanzabteilung der Stadt (Kämmerei).
      abschluss: Das vereinbarte Ergebnis liegt vor und ist verwendbar.
      wege: [risiko, problem, entscheidung]
    - id: fruehwarnung
      titel: Frühwarnung
      text: "Ein Hinweis, dass etwas das Projekt beeinträchtigen könnte, der aber noch nicht genug geklärt ist. Man hält fest, woher der Hinweis kommt und was zu klären ist, und legt einen Termin fest, an dem man wieder nachsieht."
      beispiel: FRW-002 – der Architekt hat auf einer Messe gehört, dass die Lieferzeiten für Holzelemente länger werden; Prüffrage an die Hersteller.
      abschluss: Die Klärung ist abgeschlossen – oder der Hinweis wird mit Begründung geschlossen.
      wege: [risiko, problem, aufgabe]
    - id: risiko
      titel: Risiko
      text: "Etwas Nachteiliges könnte eintreten, oder eine wichtige Größe ist noch unsicher (zum Beispiel ein Preis oder eine Lieferzeit) – und Ziele des Projekts könnten darunter leiden. Man bewertet die möglichen Folgen, verfolgt Gegenmaßnahmen und zeigt offen, was trotzdem unsicher bleibt."
      beispiel: RIS-009 – die Lieferzeit der Holzbauelemente gefährdet Montagebeginn und Inbetriebnahme.
      abschluss: Das Ereignis ist eingetreten (dann weiter als Problem), kann nicht mehr eintreten oder seine Wirkung ist nachweislich beseitigt.
      wege: [massnahme, problem, entscheidung]
    - id: problem
      titel: Problem
      text: "Etwas Nachteiliges ist schon eingetreten. Man klärt die Folgen, organisiert eine Lösung und weist das Ergebnis der Lösung nach. Nach einer Wahrscheinlichkeit fragt man nicht mehr, denn es ist passiert."
      beispiel: PRB-002 – Brandschutzauflagen zum Holzbau aus der Baugenehmigung.
      abschluss: Die vereinbarte Lösung ist umgesetzt und fachlich bestätigt, oder jemand hat die weitere Bearbeitung ausdrücklich übernommen; offene Folgen bleiben sichtbar.
      wege: [massnahme, aenderung, risiko, entscheidung]
    - id: aenderung
      titel: Änderung
      text: "Eine bestehende Vorgabe soll bewusst geändert werden. Man vergleicht den bisherigen Stand mit der gewünschten Änderung samt ihren Auswirkungen. Bis zur Freigabe der Änderung gilt weiter die bisherige Grundlage."
      beispiel: AEN-012 – die Schulleitung wünscht eine größere Mensa.
      abschluss: Der beschlossene neue Stand ist umgesetzt; abgelehnte Anträge bleiben samt Begründung festgehalten.
      wege: [entscheidung, massnahme, risiko, problem]
    - id: massnahme
      titel: Maßnahme
      text: "Eine Handlung mit einem Ziel: Sie soll etwas klären, verbessern oder einen Beschluss umsetzen. Dass sie umgesetzt ist, heißt noch nicht, dass sie wirkt."
      beispiel: MAS-007 – vorgezogene Vergabe der Holzbauelemente.
      abschluss: Es ist belegt, ob sie umgesetzt ist und ob sie wirkt; wirkt sie nicht, wird sie angepasst.
      wege: [aufgabe, entscheidung]
  entscheidung:
    titel: Entscheidung vorbereiten
    text: Dazu gehören mindestens zwei zulässige Wege, ein gewichteter Vergleich, eine Empfehlung und ein Termin, bis zu dem entschieden sein muss. Beschlossen wird getrennt davon, und zwar von der befugten Stelle des Bauherrn (der Stelle, die für die Entscheidung zuständig ist).
takt:
  titel: Takt der Projektsteuerung
  kurz: "Wann die Projektsteuerung etwas prüft und meldet: jede Woche, jeden Monat und sofort, wenn etwas dringend ist."
  vorspann:
    wozu: "Der Takt legt fest, wann die Projektsteuerung welche Prüfung macht: jede Woche, jeden Monat und sofort, wenn etwas dringend ist."
    eingabe: "Sie tragen nichts ein. Der Monat mit seinen vier Wochen und die Stufen darunter zeigen, was wann geschieht und wer es tut."
    ergebnis: "Jede Stufe nennt, was geprüft oder gemeldet wird, wer es tut und ein Beispiel. In Ruhezeiten, die ausdrücklich vereinbart sind, gilt ein eigener Rhythmus."
  belege: [v24:hb-4]
  text: |
    Solange geplant und gebaut wird, gilt der Wochentakt. Für Zeiten, die ausdrücklich als ruhig vereinbart sind (zum Beispiel nach der Übergabe), gibt es einen eigenen Rhythmus. Die regelmäßige Durchsicht ersetzt nie eine dringende Meldung.
  stufen:
    - id: sofort
      titel: Sofort
      wer: Projektsteuerung
      text: Dringendes wird sofort auf dem vereinbarten Meldeweg gemeldet. Sobald die unmittelbare Reaktion gesichert ist (zum Beispiel eine Gefahrenstelle abgesperrt), wird noch am selben Arbeitstag alles festgehalten.
      beispiel: Zwei lose Gerüstanker an der Sporthalle nach dem Sturm – der Bauleiter sperrt sofort, die Projektsteuerung meldet über den vereinbarten Weg und dokumentiert am selben Tag.
    - id: woche
      titel: Jede Woche
      wer: Projektsteuerung
      text: Die Projektsteuerung sieht alle offenen Vorgänge kurz durch. Dabei achtet sie auf ausstehende Freigaben, überfällige Ergebnisse, fehlende Rückmeldungen, neue Informationen und die Wirkung von Maßnahmen. Genauer schaut sie hin, wenn sich etwas verändert hat oder besonders viel zu klären ist. Ein Vermerk mit Datum hält fest, dass die Durchsicht stattgefunden hat.
      beispiel: "Montag: 46 offene Vorgänge durchgesehen, bei dreien hat sich etwas verändert, eine Frühwarnung ist neu."
    - id: monat
      titel: Jeden Monat
      wer: Bauherr und Projektsteuerung
      text: "Es gibt einen Online-Termin bis 60 Minuten und eine Zusammenfassung auf höchstens einer Seite. Darin steht: was sich Wichtiges verändert hat; welche Aufgaben blockiert und welche Maßnahmen kritisch sind; welche Frühwarnungen noch offen sind; welche Probleme und Änderungen ins Gewicht fallen; welche Entscheidungen anstehen und welche Reaktion gebraucht wird."
      beispiel: Monatstermin mit der Stadt – zwei offene Entscheidungen und die Reaktion, die gebraucht wird, besprochen; der Bericht verweist auf die Einträge in der Projektsoftware.
    - id: ruhe
      titel: In Ruhezeiten
      wer: Projektsteuerung
      text: "Nur wenn es ausdrücklich so vereinbart ist: Einmal im Monat werden alle offenen Vorgänge geprüft. Neue Hinweise, die nicht eilen, werden innerhalb von fünf Arbeitstagen festgehalten. Einen Termin gibt es nur bei Bedarf; der kurze Monatsbericht kommt weiterhin."
      beispiel: In der vereinbarten Nachlaufzeit nach der Übergabe wird monatlich geprüft; der Monatsbericht kommt trotzdem.
glossar:
  titel: Glossar
  kurz: Die wichtigsten Begriffe der Minimum Viable Governance (kurz MVG) zum Nachschlagen.
  vorspann:
    wozu: "Hier schlagen Sie die Begriffe der Minimum Viable Governance (kurz MVG) nach."
    eingabe: "Sie können einen Begriff in das Suchfeld schreiben. Mehr müssen Sie nicht eintragen."
    ergebnis: "Die Liste zeigt zu jedem Begriff eine kurze Erklärung und nennt die Themen, in denen er vorkommt."

# ------------------------------------------------------------------------------------------------------------------
# Vier neue Werkzeuge (O-59, P18.3/P18.4). Regeln und Zahlen der Rechnung stehen in src/werkzeuge/, hier nur Texte und
# Beispiele. Jeder Satz mit Regelgehalt trägt `belege` (intern, nie sichtbar). Leser: alle Werkzeuge sprechen den
# Bauherrn an („Sie“), wo etwas zu tun ist (L-321, ändert L-254), und sachlich, wo etwas gilt. `erwartet` ist die
# Selbstprobe: der Übersetzer rechnet jedes Beispiel mit dem Kern nach.
vorlagencheck:
  titel: Vorlagen-Check
  kurz: Ist die Entscheidungsvorlage vollständig genug, um zu entscheiden? Prüfen Sie es Schritt für Schritt.
  vorspann:
    wozu: "Vor einer größeren Entscheidung bereitet die Projektsteuerung eine Entscheidungsvorlage vor: ein Papier, das die möglichen Wege vergleicht. Hier prüfen Sie, ob die Vorlage vollständig genug ist, damit wirklich gewählt werden kann."
    eingabe: "Wählen Sie ein Beispiel oder starten Sie ohne Beispiel. Beantworten Sie dann in fünf Schritten Fragen zur Vorlage mit Ja, Teilweise oder Nein."
    ergebnis: "Die Ampel sagt, wie weit die Vorlage ist. Grün: Sie ist entscheidungsreif. Gelb: Es fehlen Ergänzungen, aber keine der wichtigen Angaben. Rot: Eine wichtige Angabe fehlt, es gibt weniger als zwei zulässige Wege, oder als entscheidende Stelle ist die Projektsteuerung genannt. Darunter steht zu jeder Lücke, was Sie nachfordern."
  belege: [v24:hb-3, v24:hb-3.1, v24:hb-5, v24:tlb-2.1, k9.4-l1, k6.4.1-p3]
  text: |
    Eine Entscheidungsvorlage ist entscheidungsreif, wenn die befugte Stelle (wer im Projekt für die Entscheidung zuständig ist) mit ihr wirklich zwischen Wegen wählen kann. Die Projektsteuerung bereitet sie vor; Sie prüfen, ob alles darin steht, und lassen ergänzen, was fehlt.
  ampel:
    gruen: entscheidungsreif
    gelb: "noch nicht entscheidungsreif: es fehlen Ergänzungen"
    rot: "nicht vollständig: Wichtiges fehlt"
  schritte:
    - id: rahmen
      titel: Frage und Rahmen
      punkte:
        - { id: a1, muss: true, kurz: Frage als Wahl zwischen Wegen, frage: "Steht die Frage so da, dass sie mit der Wahl eines Wegs beantwortet wird?", schliessen: "Lassen Sie die Frage so fassen, dass die Antwort die Wahl eines Wegs ist.", belege: [v24:hb-3.1, k9.4-l1, k5.1-p2] }
        - { id: a2, muss: false, kurz: Warum der Bauherr entscheidet, frage: "Ist gesagt, warum der Bauherr entscheiden muss?", schliessen: "Lassen Sie in einem Satz ergänzen, warum das eine Entscheidung des Bauherrn ist, etwa weil Geld aus der Reserve gebraucht wird oder der Bauherr ein großes Risiko übernehmen müsste.", belege: [v24:hb-3.1, v24:hb-1, v24:hb-1.1] }
        - { id: a3, muss: true, kurz: Wer entscheiden darf (befugte Stelle), frage: "Ist genannt, wer entscheiden darf – und in welchem Rahmen, zum Beispiel bis zu welchem Betrag?", schliessen: "Lassen Sie die Stelle nennen, die nach dem Rahmen des Projekts entscheiden darf.", belege: [v24:hb-3.1, k9.4-l1] }
        - { id: a4, muss: true, kurz: Entscheidungstermin, frage: "Ist ein Entscheidungstermin genannt?", schliessen: "Lassen Sie das Datum nennen, bis zu dem entschieden sein muss – rechtzeitig, etwa vor dem Auftrag, der davon abhängt.", belege: [v24:hb-3.1, v24:hb-3.2, v24:va-3.5, v24:hb-5] }
        - { id: a5, muss: false, kurz: Folge einer späteren Entscheidung, frage: "Steht da, was passiert, wenn später entschieden wird?", schliessen: "Lassen Sie ergänzen, was eine spätere Entscheidung kostet oder verschiebt.", belege: [v24:hb-3.1] }
    - id: wege
      titel: Wege
      punkte:
        - { id: b1, muss: true, art: zaehlung, mindestens: 2, kurz: Mindestens zwei zulässige Wege, frage: "Gibt es mindestens zwei ernsthafte, zulässige Wege?", schliessen: "Fordern Sie weitere Wege an, bis mindestens zwei wirklich zulässig sind – auch das bisherige Vorgehen zählt, wenn es zulässig ist. Bis dahin trägt die Vorlage den Vermerk „nicht vollständig“ und nennt, was noch geklärt wird.", belege: [v24:hb-3.1, v24:hb-1.5, v24:tlb-2.1] }
        - { id: b2, muss: false, kurz: Jeder Weg beschrieben, frage: "Ist für jeden Weg beschrieben, wie man vorgeht, was er kostet, wie lange er dauert, wie sich Qualität und Nutzung ändern, welche Risiken bleiben, welche Annahmen gelten und welche Freigaben nötig sind?", schliessen: "Lassen Sie je Weg ergänzen, was er kostet, wie viel Zeit er braucht, was er für die Nutzung bedeutet, welches Risiko bleibt und welche Freigabe er braucht.", belege: [v24:hb-3.1, k9.4-l1, v24:va-3.2] }
        - { id: b3, muss: false, kurz: Zwingende Anforderungen vorab geprüft, frage: "Wurden Sicherheit, Genehmigung und Funktion vor dem Vergleich mit Punkten geprüft?", schliessen: "Lassen Sie die zwingenden Anforderungen vorab prüfen; ein Weg, der sie nicht erfüllt, kommt nicht in den Vergleich.", belege: [v24:hb-3.1] }
    - id: vergleich
      titel: Gewichteter Vergleich
      punkte:
        - { id: c1, muss: true, kurz: Gesichtspunkte und Gewichte vorher abgestimmt, frage: "Wurde vorher mit Ihnen abgestimmt, nach welchen Gesichtspunkten verglichen wird, wie wichtig jeder ist und was die Punktestufen bedeuten? Das darf auch aus einer früheren Festlegung stammen. Folgen die Gesichtspunkte aus den Zielen des Projekts?", schliessen: "Fordern Sie an, dass Gesichtspunkte und Gewichte vor der Bewertung mit Ihnen abgestimmt oder aus einer vorhandenen Festlegung übernommen werden, abgeleitet aus den Zielen des Projekts.", belege: [v24:hb-3.1] }
        - { id: c2, muss: true, kurz: Punktwerte begründet, frage: "Steht zu jeder Punktzahl ein Grund mit Nachweis? Und ist erklärt, was jede Stufe bedeutet?", schliessen: "Lassen Sie zu jedem Punktwert Grund und Nachweis ergänzen und beschreiben, was jede Stufe bedeutet.", belege: [v24:hb-3.1] }
        - { id: c3, muss: false, kurz: "Kosten, Tage und offene Fragen zusätzlich zu den Punkten", frage: "Stehen neben den Punkten auch die Kosten in Euro, die Dauer in Tagen und die offenen Fragen? Und wurde nichts, was fehlt, einfach als null gerechnet?", schliessen: "Lassen Sie Beträge und Tage neben die Punkte stellen und Fehlendes als offen markieren statt mit null.", belege: [v24:hb-3.1] }
        - { id: c4, muss: false, kurz: Andere Gewichte geprüft, frage: "Wurde ausprobiert, ob sich die Rangfolge ändert, wenn man die Gewichte etwas anders (aber noch vertretbar) setzt?", schliessen: "Lassen Sie zeigen, bei welchem Gewicht ein anderer Weg vorn läge.", belege: [v24:hb-3.1, v24:hb-3.2, v24:tlb-2.1] }
    - id: empfehlung
      titel: Empfehlung
      punkte:
        - { id: d1, muss: true, kurz: Empfehlung begründet, frage: "Ist die Empfehlung begründet, mit Nachteilen, Unsicherheiten und Voraussetzungen?", schliessen: "Lassen Sie die Empfehlung begründen und auch ihre Nachteile und Voraussetzungen nennen.", belege: [v24:hb-3.1] }
        - { id: d2, muss: false, kurz: Empfehlung trägt fachlich, frage: "Trägt die Empfehlung auch fachlich – nicht nur über die Punktzahl?", schliessen: "Lassen Sie ergänzen, warum der Weg fachlich trägt; eine hohe Punktzahl allein ist noch kein Urteil.", belege: [v24:hb-3.1] }
        - { id: d3, muss: true, kurz: Beschluss bleibt offen, frage: "Ist der Beschluss noch offen? Eine Empfehlung, Schweigen oder ein Eintrag in der Software dürfen nicht als Beschluss gelten.", schliessen: "Achten Sie darauf, dass der Beschluss offen bleibt; er wird erst festgehalten, wenn die befugte Stelle entschieden hat – mit Nachweis, Datum und Bedingungen.", belege: [v24:hb-3.1, v24:va-4.2, k9.4-l1] }
    - id: grundlagen
      titel: Grundlagen
      punkte:
        - { id: e1, muss: true, kurz: Datenstand (Stand der Zahlen) und Herkunft, frage: "Steht da, auf welchem Datum die Zahlen und Pläne beruhen und woher sie stammen?", schliessen: "Lassen Sie nennen, auf welchem Stand von Zahlen und Plänen die Vorlage beruht.", belege: [v24:hb-3.1, k9.4-l1, k4.6-p2, k5.1-p2] }
        - { id: e2, muss: false, kurz: Verweis auf den Vorgang, frage: "Verweist die Vorlage auf den Vorgang, aus dem sie entsteht?", schliessen: "Lassen Sie auf den Eintrag verweisen, aus dem die Entscheidung entsteht – etwa das Risiko, das Problem oder die Änderung.", belege: [v24:hb-3.1, v24:hb-5] }
        - { id: e3, muss: false, kurz: Vorlage liegt bei den übrigen Vorgängen, frage: "Liegt die Vorlage dort, wo alle Vorgänge stehen, oder ist eindeutig darauf verwiesen?", schliessen: "Fordern Sie an, dass die Vorlage rechtzeitig in der Projektsoftware des Bauherrn liegt oder dass dort klar auf sie verwiesen wird.", belege: [v24:hb-3.1, v24:hb-5] }
  stellen:
