id: abb-10
quelle: bilder/image10.jpeg
titel: Verknüpfungen zwischen Frühwarnung, Risiko, Entscheidung, Freigabe und Maßnahme
alt: >-
  Legende „Lebenszyklus / ‚wird zu‘“: Risiko (bewertet, wesentlich) → Entscheidungsregister (ausarbeiten) →
  Entscheidungsvorlage (reif) → Freigabe (LPH 0–9, Freigabeentscheidung); Problem (eingetreten, eskaliert),
  Änderung (erfordert) → Register; Vorlage (führt zu) → Änderung (beeinflusst) → CTC / Prognose; Vorlage
  (erzeugt), Freigabe (Auflagen) → Maßnahme. „Überwachung / Indikator“: „Schwellenwert löst Frühwarnung aus“ →
  Frühwarnung (unbewertetes Signal), CTC; Maßnahme (Risikominderung, Regelkreis schließt) → Risiko. „Bericht in
  den Managementbericht“: Freigabe → Managementbericht.
