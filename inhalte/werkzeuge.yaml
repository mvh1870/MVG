      quelle: s12
      gegenstand: geld
      stelle: buergermeisterin
      betrag: 400000
      reserve: true
      wege: [{ titel: Ersatzgerät, zustand: zulaessig }]
      antworten: { a1: teilweise, a2: teilweise, a3: ja, a4: nein, a5: nein, b2: teilweise, b3: ja, c1: nein, c2: nein, c3: nein, c4: nein, d1: teilweise, d2: nein, d3: ja, e1: teilweise, e2: nein, e3: ja }
      erwartet: rot
    - id: lueftung-voll
      titel: "Lüftungsanlage – alle drei Wege"
      lage: "Mai 2027: Dieselbe Lage. So sieht eine entscheidungsreife Vorlage aus: Sie vergleicht drei zulässige Wege – Ersatzgerät, Leihgeräte, späterer Einzug – nach vorher abgestimmten Gewichten; entscheiden muss die Bürgermeisterin bis Ende Mai."
      quelle: s12
      gegenstand: geld
      stelle: buergermeisterin
      betrag: 400000
      reserve: true
      wege: [{ titel: Ersatzgerät, zustand: zulaessig }, { titel: Leihgeräte, zustand: zulaessig }, { titel: Später einziehen, zustand: zulaessig }]
      antworten: { a1: ja, a2: ja, a3: ja, a4: ja, a5: ja, b2: ja, b3: ja, c1: ja, c2: ja, c3: ja, c4: ja, d1: ja, d2: ja, d3: ja, e1: ja, e2: ja, e3: ja }
      erwartet: gruen
    - id: mensa
