titel: "Der MVG Companion: von den Regeln von MVG zur täglichen Anwendung"
alt: >-
  Die Abbildung zeigt, wie der angekündigte MVG Companion die Regeln von MVG in die tägliche Anwendung bringen soll – für Entscheidungen,
  Freigaben, Mandate, Datenstand, Nachweis, Betriebshandbuch und Übergabe – und dabei die Entscheidung beim Bauherrn
  lässt. Links stehen die Regeln von MVG, in der Mitte der Companion als Brücke zur Anwendung; Pfeile führen zu
  Befähigung und Regelbetrieb. Fünf Plaketten nennen, was bleibt: Bauherr entscheidet, Freigabe bleibt, Rollenrechte,
  Nachweiskette, Prüfrhythmus.
