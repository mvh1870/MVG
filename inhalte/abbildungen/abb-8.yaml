titel: LPH 0 als früher Wirkungsraum
alt: >-
  In der Mitte ein Kreis mit „LPH 0“, ringsum sechs Karten, durch Pfeile mit ihm verbunden. Oben links „Zielsystem“:
  Capex, Termin, Qualität, ESG, LCC, Schieberegler, „Kompromisse“. Oben rechts „RACI“: Matrix R, A, C, I für drei
  Rollen, dazu „Mandate“ und „Freigaben“. Links „Governance“: Pyramide mit Lenkungsebene, Projektebene, Fachebene,
  darunter Rhythmus und Standardagenda. Rechts „Freigabe“: Tor, „Entscheidungsreife“, Prüfliste. Unten links
  „Risikoregister“: Liste, „Änderungssteuerung“ und „Frühwarnung“ mit Rundumlicht. Unten rechts „KPI-System“:
  Diagramme und „Nachweisführung“.
