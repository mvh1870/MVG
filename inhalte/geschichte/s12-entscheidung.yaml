# 12 · Die große Entscheidung (Drehbuch v2, Akt III, Station 12; alt k7) – der einzige gewichtete Vergleich der Story (O-52)
# Problem (aus der Frühwarnung der Station 11) → Entscheidungsvorlage; mehr als 100.000 Euro aus der Reserve → Bürgermeisterin, Lenkungskreis berät.
# Gewichte vorab abgestimmt, abgeleitet aus der Zielpriorität aus Station 1; alle drei Wege zulässig (Fachplanung bestätigt Leihgeräte).
# Rechnung abgestimmt: A 49 · B 45 · C 45; Klima „wichtig“ → A 55, B 49, C 55; Schulstart „wichtig“ → C vorn;
# Geld „sehr wichtig“ → C vorn; Gute Luft „weniger wichtig“ → B vorn (tests/geschichte.test.ts).
# Rückschlag unabhängig von der Antwort: der bestätigte Lieferverzug. Neu: Muss-Filter vor dem Vergleich („Nachweis fehlt“ ist nicht
# „Anforderung nicht erfüllt“; der vierte Vorschlag ist der Fall „Anforderung nachweislich nicht erfüllt“), Echos E4 und E7, Auflage im Beschluss.
# Belege (intern): v24:hb-3.1, v24:va-3.2, v24:tlb-2.1 (mindestens zwei zulässige Wege, keine Scheinoption); v24:hb-3.1, v24:va-3.3, k4.1-p2
# (Zwingendes vor dem Punktevergleich); v24:va-3.4 (Klärungsbedarf offenlegen); v24:hb-1.2, v24:hb-1.4 (Frühwarnung wird Problem).
