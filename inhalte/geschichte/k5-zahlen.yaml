# 5 · Zwei Zahlen, zwei Wahrheiten (Drehbuch Abschnitt 4, Kapitel 5)
# Die angekündigten Mehrkosten sind ein Risiko, keine Kosten in der Prognose; die Vergabestelle prüft die Forderung.
nr: 5
titel: Zwei Zahlen, zwei Wahrheiten
zeit: Oktober 2026
campus: { stufe: 3, jahreszeit: herbst, licht: abend }
bruecke: "Im Herbst nennen Kämmerei und Architekt verschiedene Zahlen; die Bürgermeisterin nennt dem Stadtrat eine begründete Zahl, die angekündigten Mehrkosten als Risiko daneben. Die Forderung erweist sich als unberechtigt: Die Leistungen gehören zum bestehenden Vertrag."
thema: verantwortung
belege: [v24:hb-2, v24:hb-3, v24:hb-5, v24:tlb-3, v24:hb-1.5, k4.6-p1, k4.6-p2, k2.4-p2]
bild-szene: zahlenzettel
bild-frage: rednerpult

einstieg: |
  Oktober 2026. Der Kran hebt die ersten Holzelemente an die Gesamtschule, die Linden leuchten gelb. Nächste Woche will die Bürgermeisterin dem Stadtrat sagen, wo das Projekt beim Geld steht. Auf ihrem Schreibtisch liegen zwei Papiere, beide mit einer Zahl unten rechts – und die Zahlen sind nicht dieselben.

szene:
  - { figur: grundstein, text: "Die Kämmerei sagt, wir liegen eine Million über dem Budget. Der Architekt sagt zwei. Was stimmt denn nun?" }
  - { figur: schwung, text: "Meine Zahl. Die Haustechnikfirma hat Mehrkosten angekündigt, gut eine Million. Die habe ich schon drin. Ich rechne lieber zu viel als zu wenig." }
  - { figur: grundstein, text: "Und warum steht davon nichts in der Rechnung der Kämmerei?" }
  - { figur: faden, text: "Ich habe beide Rechnungen angefordert und Zeile für Zeile verglichen. Der Unterschied ist genau diese Ankündigung. Angekündigt heißt aber nicht berechtigt – die Vergabestelle prüft das gerade." }
  - { figur: grundstein, text: "Ich brauche eine Zahl, die ich im Stadtrat vertreten kann. Nicht zwei." }
  - { figur: faden, text: "Beide Zahlen liegen innerhalb der Reserve. Aber welche Sie nennen, sollten Sie wissen – nicht raten." }

frage: Beide Zahlen haben einen Grund. Nur eine kann in den Stadtrat. Welche Zahl geben Sie der Bürgermeisterin?

antworten:
  - wertung: vertretbar
    text: Die höhere Zahl des Architekten. Lieber vorsichtig.
    balken: { geld: -1, zeit: -1, vertrauen: 0 }
    bild: kostenzettel
    folge: |
      Der Stadtrat erschrickt über zwei Millionen und verlangt eine Liste, wo man sparen könnte; die Planung wartet vier Wochen auf die Antwort. Dann ist die Prüfung fertig: Die Mehrleistungen gehören zum bestehenden Vertrag, die Zahl sinkt wieder. Nur hat die Firma gemerkt, dass ihre Forderung schon eingerechnet war – und sie verhandelt jetzt bei jeder Kleinigkeit härter.
  - wertung: falle
    text: "Die Mitte: anderthalb Millionen. Dann liegt keiner ganz daneben."
    balken: { geld: -1, zeit: 0, vertrauen: -2 }
    bild: lupe
    folge: |
      Anderthalb Millionen stehen in keiner Rechnung. Als ein Stadtrat fragt, woher die Zahl kommt, bleibt nur die Antwort: aus der Mitte. Clara Faden legt danach beide Rechnungen nebeneinander und zeigt den Unterschied. Die Prüfung endet wie erwartet – die Mehrleistungen gehören zum bestehenden Vertrag –, aber die Firma verhandelt jetzt härter, denn halb eingerechnet war ihre Forderung ja schon.
  - wertung: gut
    text: "Eine Zahl mit Stand und Begründung: eine Million über dem Budget – und daneben die angekündigten Mehrkosten als Risiko, mit ihrer Spanne."
    balken: { geld: 1, zeit: 0, vertrauen: 2 }
    bild: waage
    folge: |
      Die Bürgermeisterin nennt im Stadtrat eine Zahl und einen Satz dazu: was drin ist, was nicht und was gerade geprüft wird. Zum ersten Mal fragt niemand nach einer zweiten Zahl. Vier Wochen später ist die Prüfung fertig: Die Mehrleistungen gehören zum bestehenden Vertrag der Haustechnikfirma. Clara Faden schließt das Risiko – mit Begründung. Die Bürgermeisterin sagt nach der Sitzung nur: „So möchte ich das jedes Mal.“

gut: |
  Es gibt einen maßgeblichen Stand der Zahlen, und jede Zahl darin hat ein Datum und eine Begründung. Unterschiedliche Einschätzungen werden nebeneinander erklärt, nicht gemittelt; was noch unsicher ist, steht als Risiko mit seiner Spanne daneben und wird nicht doppelt gezählt.

dahinter: Eine Entscheidung ist nur so gut wie die Zahlen, auf denen sie steht – deshalb sorgt der Bauherr dafür, dass es einen belastbaren Stand gibt, auch wenn er ihn nicht selbst pflegt.

regie:
  notiz: "Kern: Es gibt einen maßgeblichen Stand der Zahlen, jede Zahl mit Datum und Begründung; unterschiedliche Einschätzungen werden erklärt, nicht gemittelt, Unsicheres steht als Risiko mit Spanne daneben."
  leitfragen:
    - Welche Zahl würde Ihre Bürgermeisterin, Ihr Vorstand oder Ihre Geschäftsführung heute nennen – und woher käme sie?
    - Wie gehen Sie mit zwei Zahlen um, die nicht zusammenpassen?
