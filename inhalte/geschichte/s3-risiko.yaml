# 3 · Wie gefährlich ist das? (Drehbuch Abschnitt 4, Kapitel 3)
# Die Frühwarnung aus 2 ist geklärt und wird Risiko; Wahrscheinlichkeit hoch, höchste belegte Auswirkung Stufe 4 → vorrangig.
# Gegenmaßnahme über 100.000 Euro aus der Reserve und „Abwarten“ (Annahme eines wesentlichen Risikos) → Bürgermeisterin.
