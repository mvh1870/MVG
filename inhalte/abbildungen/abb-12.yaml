id: abb-12
quelle: bilder/image12.jpeg
titel: MVG-Reifegradanalyse mit Bewertungsmatrix und 30/60/90-Tage-Plan
alt: >-
  Oben „MVG-Reifegradanalyse“; Pfeile führen zu fünf nummerierten Kästen (Governance & Organisation, Risiko &
  Änderungssteuerung, Ressourcen & Rollenfähigkeit, Informationsmanagement & Entscheidungsreife, QA/QM &
  Qualitätssteuerung), je mit Symbol und einer Liste „Nachweise“, etwa Risikoregister, Frühwarnungsregister,
  Rollenprofile, Prüfstatus. Darunter führt die „Bewertungsmatrix“ (Farbraster) mit einem Pfeil zum
  „30/60/90-Tage-Plan“, einer steigenden Linie über die Stufen 30, 60 und 90 Tage.
