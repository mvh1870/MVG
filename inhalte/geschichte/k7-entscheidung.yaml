# 7 · Die große Entscheidung (Drehbuch Abschnitt 4, Kapitel 7) – der einzige gewichtete Vergleich der Story (O-52)
# Problem → Entscheidungsvorlage; mehr als 100.000 Euro aus der Reserve → Bürgermeisterin, Lenkungskreis berät.
# Gewichte vorab abgestimmt, abgeleitet aus der Zielpriorität aus 1; alle drei Wege zulässig (Fachplanung bestätigt Leihgeräte).
# Rechnung abgestimmt: A 49 · B 45 · C 45; Klima „wichtig“ → A 55, B 49, C 55; Schulstart „wichtig“ → C vorn;
# Geld „sehr wichtig“ → C vorn; Gute Luft „weniger wichtig“ → B vorn (tests/geschichte-regeln.test.ts).
