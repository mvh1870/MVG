titel: Die Verantwortungspyramide – Arbeitsebene, Mandatsebene und Letztverantwortung
alt: 'Pyramide mit Aufwärtspfeilen, Spitze „Bauherr legitimiert“. Oben „Letztverantwortung“: Ziel, Grundsatzentscheidung, Freigabe, Risikoannahme, Nachweis, Beschlusslage; „bleibt beim Bauherrn“. Mitte „Mandatsebene“: Befugnisse, Freigabegrenzen, Zeichnungsrechte, Eskalation, Gremienbezug; „begrenzt übertragbar“. Unten „Arbeitsebene“: Analyse, Planung, Koordination, Dokumentation, Auswirkungsbewertung, Inputs. Sockel „MVG“: Inputs, Rollen, Freigaben, Entscheidungs-IDs, Datenstände. Seitlich je eine Tafel „Dritte“ mit vier Personen und „Dritte bereiten vor“; Pfeil zur Arbeitsebene, Linie zum Sockel.'
