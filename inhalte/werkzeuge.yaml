      lage: "Juni 2026: Die Schulleitung wünscht eine größere Mensa. Die Vorlage vergleicht die größere Mensa mit einer Mensa, die später wachsen kann; als Termin steht nur „bevor die Fundamente gegossen werden“."
      quelle: s5
