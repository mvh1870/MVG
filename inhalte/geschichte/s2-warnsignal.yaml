# 2 · Ein erstes Warnsignal (Drehbuch Abschnitt 4, Kapitel 2)
# Mini-Aufgabe: v24:hb-1 (Tabelle der Sachverhalte), v24:hb-1.1 bis v24:hb-1.6
nr: 2
titel: Ein erstes Warnsignal
zeit: März 2026
campus: { stufe: 0, jahreszeit: fruehling, licht: tag }
bruecke: "Im März erwähnt der Architekt beiläufig, Holz könnte knapp werden. Die Projektsteuerin hält das als Frühwarnung fest, also als noch ungeklärten Hinweis: Was ist zu prüfen (die Prüffrage), wer fragt nach, bis wann?"
thema: arbeitsweise
werkzeuge: [{ id: wegweiser, beispiel: messe }]
belege: [v24:hb-1, v24:hb-1.1, v24:hb-1.2, v24:hb-1.3, v24:hb-1.4, v24:hb-1.5, v24:hb-1.6, v24:hb-2, v24:hb-4, v24:tlb-2, v24:tlb-3]
bild-szene: holzstapel
bild-frage: notizzettel

einstieg: |
  März 2026. Der Schnee ist weg, der Bauzaun steht, und an der Baustraße blühen die ersten Krokusse. Im Büro des Architekten wird jetzt die Ausführung geplant – Wand für Wand, Holzbauteil für Holzbauteil.

  Clara Faden führt über alles, was zu klären oder zu erledigen ist, ein gemeinsames Verzeichnis: Jede Aufgabe, jeder Hinweis, jedes Risiko ist dort ein Eintrag, ein Vorgang. Jede Woche geht sie alle offenen Vorgänge durch. Heute sitzt sie mit dem Architekten und dem Bauleiter im Container, um die nächsten Wochen abzustimmen.

szene:
  - { figur: schwung, text: "Übrigens, nur am Rande: Ein Holzbauer hat erzählt, dass die Lieferzeiten für Holzelemente gerade länger werden." }
  - { figur: faden, text: "Wie viel länger? Und bei welchen Herstellern?" }
  - { figur: schwung, text: "Weiß ich nicht genau. Das war nur ein Gespräch auf einer Messe. Das pendelt sich ein, glauben Sie mir." }
  - { figur: lot, text: "Holz kommt, wenn es kommt. Ich hab noch keinen Bau erlebt, wo's nicht irgendwann kam." }
  - { figur: lot, text: "Und überhaupt: Ich bau, ich schreib nicht. Listen sind Ihr Job." }
  # R76: die letzte Zeile nennt das Problem, nicht die Lösung – sonst verriete sie die gute Antwort; „Frühwarnung“ erklärt die Folge
  - { figur: faden, text: "Kann sein. Aber wenn das Holz diesmal nicht kommt, sollten wir es früh wissen." }

frage: Noch ist nichts passiert, und niemand weiß, ob überhaupt etwas passieren wird. Alle schauen Sie an. Was sagen Sie?

antworten:
  - wertung: gut
    text: "Halten wir es als Frühwarnung fest: ein Hinweis, der geprüft wird – wer fragt bis wann nach?"
    balken: { geld: 0, zeit: 1, vertrauen: 1 }
    bild: kalender
    folge: |
      „So einen Hinweis halte ich als Frühwarnung fest“, sagt Clara Faden und schreibt drei Zeilen: Hinweis des Architekten aus einem Gespräch auf einer Messe. Prüffrage: Wie lang sind die Lieferzeiten bei den Herstellern, die für uns infrage kommen? Konrad Schwung fragt bis Ende des Monats nach.

      Mehr braucht es noch nicht – in zwei Wochen gibt es eine Antwort. Theo Lot zuckt mit den Schultern: „Papierkram.“ Clara Faden lächelt nur.
  - wertung: falle
    text: Das hat Zeit bis zur Besprechung im nächsten Monat. Bis dahin weiß der Architekt sicher Genaueres.
    balken: { geld: 0, zeit: -1, vertrauen: -1 }
    bild: stoppuhr
    folge: |
      Clara Faden hält den Hinweis trotzdem vollständig fest – mit der Frage, die zu prüfen ist, und dem Auftrag an den Architekten, bis Ende des Monats nachzufragen.

      Aber Konrad Schwung hat Ihren Satz gehört: Es hat ja Zeit. Der Monat vergeht ohne Nachfrage. Erst als Clara Faden bei ihrer Wochendurchsicht die offene Nachfrage als überfällig meldet, fragt er bei den Herstellern nach – und die Antwort kommt später als nötig.
  - wertung: vertretbar
    text: Tragen wir es gleich als Risiko ein – lieber zu früh als zu spät.
    balken: { geld: 0, zeit: 1, vertrauen: 0 }
    bild: lupe
    folge: |
      Clara Faden trägt ein Risiko ein – aber ohne Zahlen für Wahrscheinlichkeit und Schaden: „Zahlen ohne Grundlage schreibe ich nicht hin.“ Daneben steht: Bewertung vorläufig, Antwort der Hersteller abwarten.

      Weil das Risiko schon im nächsten Bericht an die Stadt steht, fragt die Finanzabteilung nach, bevor jemand weiß, ob da überhaupt etwas ist. Immerhin fragt der Architekt bis Ende des Monats bei den Herstellern nach.

gut: |
  Ein unklarer Hinweis wird als Frühwarnung festgehalten – gleich, spätestens bei der nächsten Wochendurchsicht. Dazu gehören seine Herkunft, eine klare Prüffrage (Was genau ist zu klären?), ein Name (Wer fragt nach?) und ein Termin. Bewertet wird erst, wenn die Antwort da ist; bis dahin bleibt der Hinweis offen und wird jede Woche angeschaut.

mini:
  art: zuordnen
  titel: Was ist was?
  aufgabe: "Auf einer Baustelle passiert vieles gleichzeitig. Ordnen Sie jedem Satz die passende Art zu: Frühwarnung, Risiko, Problem, Änderung, Maßnahme oder Aufgabe. Die Kurzerklärungen darüber helfen."
  bild: notizzettel
  # heisst: Legende über den Karten, wörtlich aus den Erklärungen unten (R75; Belege v24:hb-1.1 bis hb-1.6)
  wahlen:
    # R76: der Unterschied steht in der Legende – ungeklärt (Frühwarnung) oder geklärt und möglich (Risiko); v24:hb-1.1, hb-1.2
    - { id: fruehwarnung, titel: Frühwarnung, heisst: "ein Hinweis, bei dem noch nicht geklärt ist, ob etwas dran ist" }
    - { id: risiko, titel: Risiko, heisst: "Es ist geklärt, dass etwas Nachteiliges eintreten kann – passiert ist es aber noch nicht" }
    - { id: problem, titel: Problem, heisst: "etwas Nachteiliges ist schon passiert" }
    - { id: aenderung, titel: Änderung, heisst: "etwas, das bisher gilt, soll bewusst anders werden" }
    - { id: massnahme, titel: Maßnahme, heisst: "eine gezielte Handlung, die einen Zustand verbessert, zum Beispiel ein Problem behebt" }
    - { id: aufgabe, titel: Aufgabe, heisst: "eine geplante Arbeit mit Ergebnis, Namen und Termin" }
  # Reihenfolge der Sätze bewusst gemischt (R73): nicht in der Reihenfolge der Knöpfe, damit sich die Lösung nicht durch die Stellung verrät
  posten:
    - { text: "Eine Pumpe wird aufgestellt und die Baugrube abgesperrt, bis sie wieder trocken ist.", bild: absperrband, loesung: massnahme, erklaerung: "Eine gezielte Handlung, die einen Zustand verbessert, zum Beispiel ein Problem behebt. Ob sie wirkt, wird nachgeprüft." }
    - { text: "Die Schule wünscht sich eine größere Mensa.", bild: mensateller, loesung: aenderung, erklaerung: "Etwas, das bisher gilt, soll bewusst anders werden. Das braucht eine Entscheidung." }
    - { text: "Ein Hersteller erwähnt nebenbei am Telefon, Holz werde vielleicht knapp. Genaues weiß er nicht.", bild: telefon, loesung: fruehwarnung, erklaerung: "Ein Hinweis, bei dem noch nicht geklärt ist, ob etwas dran ist. Erst einmal wird das geprüft." }
    - { text: "Der Architekt schätzt bis Freitag die Kosten für den Fahrradkeller.", bild: kostenzettel, loesung: aufgabe, erklaerung: "Eine geplante Arbeit mit Ergebnis, Namen und Termin." }
    - { text: "Nach dem Starkregen steht die Baugrube unter Wasser.", bild: warnschild, loesung: problem, erklaerung: "Das ist schon passiert. Jetzt geht es um die Folgen und die Lösung, nicht mehr um die Wahrscheinlichkeit." }
    - { text: "Drei Hersteller bestätigen schriftlich ein halbes Jahr Lieferzeit für die Holzelemente. Ob der Holzbau dadurch später beginnt, ist noch offen.", bild: lieferwagen, loesung: risiko, erklaerung: "Es ist geklärt, dass etwas Nachteiliges eintreten kann – passiert ist es aber noch nicht. Das wird bewertet." }

dahinter: "Nicht jeder Hinweis wird zum Risiko. Aber jeder wird geklärt, bis feststeht, was daraus wird: ein Risiko, ein Problem oder eine Aufgabe – oder nichts davon, und dann wird er mit Begründung geschlossen."

regie:
  notiz: "Kern: Ein unklarer Hinweis ist eine Frühwarnung – Herkunft, Prüffrage, Name und Termin; bewertet wird erst, wenn die Antwort da ist. Die Mini-Aufgabe gemeinsam lösen: erst die Runde raten lassen, dann je Satz die Zuordnung setzen oder am Ende auflösen."
  leitfragen:
    - Wo landen bei Ihnen Hinweise, die „nur am Rande“ fallen?
    - Wer fragt bei Ihnen nach – und bis wann?
