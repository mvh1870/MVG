  - { figur: schwung, text: "Drei von vier Herstellern liefern jetzt erst nach einem halben Jahr statt nach vier Monaten. Vielleicht wird es ja wieder besser." }
  - { figur: faden, text: "Ich habe die Verzögerung als Risiko bewertet. Wie wahrscheinlich ist sie? Hoch. Wie schlimm, wenn sie eintritt? Dann fangen die Holzbauer bis zu zehn Wochen später an, und der Schulstart wackelt." }
  - { figur: lot, kurzfassung: false, text: "Zehn Wochen. Die holt keiner wieder auf, ich auch nicht." }
  - { figur: schwung, kurzfassung: false, text: "Wir könnten auch einfach hoffen. Das hat schon oft geklappt." }
  - { figur: faden, kurzfassung: false, text: "Hoffen ist keine Entscheidung. Abwarten kann eine sein – aber dann muss die Bürgermeisterin ausdrücklich entscheiden, dass die Stadt das Risiko trägt." }
