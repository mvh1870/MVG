titel: MVG als Bauherren-Führungsmodell
alt: 'Fünf Spalten mit Pfeilen dazwischen: „Zielsystem“ (Zielsystem, Prioritäten, Datenstand, Dokumentierte Optionen), „Rollen & Mandate“ (Rollen, Verantwortung, Mandate, Mandatskarte), „Freigaben & Files“ (Freigabe, Entscheidungsvorlagen, Auswirkungsbewertung, Nachverfolgung), „Steuerungslogik“ (KPIs, Managementberichte, Datenstand, Nachverfolgung), „Betriebshandbuch & Aktive Führung“ (Ablauf Input – Entscheidung – Umsetzung, Governance-Routinen, Aktive Entscheidungsführung). Eine Linie verbindet sie mit der Leiste Minimum first, Auswirkungsbewertung, Entscheidungsreife, Evidenz, Auditierbarkeit.'
