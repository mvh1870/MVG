id: abb-13
quelle: bilder/image13.jpeg
titel: Sequenziertes Vorgehen von der Einrichtung bis zum Regelbetrieb
alt: >-
  Sechs Spalten mit Pfeilen: „Einrichtung“ (verantwortliche Rolle, Umfang klären, Datenzugang, Beteiligte),
  „Diagnose“ (Governance-Lücken, Bewertungsmatrix, Entscheidungsliste), „Konzeption“ (Zielsystem, Mandatsmodell,
  Freigabe-Set, Entscheidungs-IDs, Datenstandslogik), „Pilotierung“ (echte Entscheidungen, Kalibrierung,
  Prüfung), „Befähigung“ (Rollen, Training, Routinen), „Übergabe“ (Betriebshandbuch, Prüfrhythmus,
  Betriebsstart). Pfeil und gestrichelte Linie führen zu „Regelbetrieb“ (Abnahmefähig, Betriebsstart).
