id: s7
nr: 7
titel: Vergabe Holzbau und die Reserve
kurztitel: Vergabe
datum: März 2027
monat: 15
lph: 7
kurzfassung: false
# Rechnung (inhalte/fall.md, „Kosten und Reserve“): Mehrbetrag 0,9 Mio. € gegen den Kostenansatz Holzbau; 0,6 davon stehen
# seit s5 in der Prognose (kenntlich in RIS-005, nicht doppelt gezählt, v24:hb-2) – die Lage bringt nur die neuen 0,3.
# Freigabe der Reserve nicht delegierbar (k3.2-t1). Option C spart in noch nicht vergebenen Leistungen.
# Bei s3 = A hat der Bauherr die 0,6 Mio. € für den Elementzuschlag schon im Juli 2026 freigegeben (Bericht s6); hier stehen nur
# die neuen 0,3 zur Freigabe. Optionen und Empfehlung sind deshalb wegneutral gefasst („Mehrbetrag von zusammen 0,9 Mio. €“).
# Holger Stein ist Kostenplaner der Generalplanung; die Projektsteuerung fordert den Kostenstand an und plausibilisiert ihn (v24:tlb-3, v24:tlb-5).
belege: [v24:hb-1.3, v24:hb-1.4, v24:hb-1.6, v24:hb-2, v24:hb-3.1, v24:hb-5, v24:tlb-3, v24:tlb-5, k3.2-t1]
lage: |
  März 2027, Mitwirkung bei der Vergabe. Der Holzbau liegt 0,9 Mio. € über dem ursprünglichen Kostenansatz. 0,6 Mio. € davon stehen seit Mai 2026 als Marktpreise in der Prognose, neu sind 0,3 Mio. €. Das Preisrisiko ist eingetreten.

  Und Holger Stein, der Kostenplaner der Generalplanung, fällt für Wochen aus. In vielen Projekten hieße das: Der Kostenstand liegt auf seinem Rechner. Hier übernimmt eine Kollegin aus seinem Büro – der Datenstand, auf den sich Register und Vorlagen beziehen, liegt in der Software der GML.
lage-folgen: { kosten: 0.3 }
# Vertagte Entscheidungen, die dieser Bericht als erledigt meldet: Lieferzeit (s3 = B) und Brandschutz (s6 = K).
# Über Basis plus Reserve liegt die Prognose nach der Lage genau auf den Wegen s4 = A und s5 != A (nachgerechnet, tests/geschichte.test.ts);
# die Berichtszeilen dazu prüfen den Status (kosten>61.3). Bei s5 = B wird damit die Neufestlegung der Projektbasis nötig – eine offene
# Entscheidung des Bauherrn (offen +1, als Wahlbedingung, weil lage-folgen-bedingt keine Statusbedingung kennt); s8 baut sie ab, wo die
# Prognose wieder darunter liegt. Bei s5 = C zählt die Neufestlegung schon seit Mai 2026.
lage-folgen-bedingt:
  - { wenn: "s3=B", folgen: { offen: -1 } }
  - { wenn: "s6=K", folgen: { offen: -1 } }
  - { wenn: "s4=A & s5=B", folgen: { offen: 1 } }
bericht:
  titel: Monatsbericht · März 2027
  zeilen:
    - text: Submission Holzbau am 2. März – günstigstes wertbares Angebot 0,9 Mio. € über dem Kostenansatz, davon 0,6 Mio. € schon in der Prognose; geführt als Problem PRB-007.
      wenn: s3!=A
    - text: Submission Montage und Ausbau Holzbau am 2. März – 0,3 Mio. € über dem Ansatz. Die Holzbauelemente sind seit Juli 2026 vergeben (MAS-007), mit 0,6 Mio. € aus der Reserve, die der Bauherr damals freigegeben hat. Zusammen liegt der Holzbau 0,9 Mio. € über dem Kostenansatz; geführt als Problem PRB-007. Zur Freigabe stehen die neuen 0,3 Mio. €.
      wenn: s3=A
    - text: RIS-009 eingetreten – weitergeführt als Problem PRB-008. Lieferzeit im Angebot 21 Wochen, Montagebeginn rund 35 Tage später; im Terminpuffer seit März 2026 berücksichtigt. Die im März 2026 vertagte Entscheidung ist damit erledigt.
      wenn: s3=B
    - text: Holzbau für Gesamt- und Grundschule; mit der Sporthalle in Stahlbeton passt die Lieferzeit zum Montagebeginn – RIS-009 geschlossen.
      wenn: s3=C
    - Freigaben zum Abschluss von LPH 5 (Dezember 2026) und LPH 6 (Februar 2027) vom Bauherrn erteilt.
    - RIS-014 geschlossen – die GML hat geprüft, die angekündigten Mehrleistungen gehören zum Planungsvertrag; kein Nachtrag.
    - Holger Stein vertreten ab 8. März – der Kostenstand liegt in der Software der GML, keine Übergabelücke.
    - text: Brandschutz – die Behörde hat die geänderten Pläne bestätigt; PRB-002 geschlossen.
      wenn: s6=A
    - text: Brandschutz – die Behörde hat die Lösung mit Gutachten im August 2026 abgelehnt; die Auflage ist umgesetzt wie vorläufig geplant (MAS-011), die 0,4 Mio. € standen schon in der Prognose; PRB-002 geschlossen, die vertagte Entscheidung erledigt.
      wenn: s6=K
    - text: Risikoreserve – seit Mai 2026 für die bekannten Mehrkosten vorgesehen; freigegeben hat der Bauherr bisher die Mehrkosten aus den Beschlüssen des Änderungsgremiums.
      wenn: s5=B & s3!=A
    - text: Risikoreserve – seit Mai 2026 für die bekannten Mehrkosten vorgesehen; freigegeben hat der Bauherr bisher die Mehrkosten aus den Beschlüssen des Änderungsgremiums und die 0,6 Mio. € für den Elementzuschlag.
      wenn: s5=B & s3=A
    - text: Einsparpaket aus dem Mai 2026 umgesetzt – 1,5 Mio. € weniger für Ausstattung und Außenanlagen.
      wenn: s5=A
    - text: Neufestlegung der Projektbasis – der Bauherr hat sie im Lenkungskreis zurückgestellt, bis die Hauptvergaben abgeschlossen sind; es gilt die bisherige Basis. Die Entscheidung bleibt offen.
      wenn: s5=C & kosten<=61.3
    - text: Mit dem neuen Mehrbetrag liegt die Prognose über Basis plus Reserve (61,3 Mio. €) – die Reserve reicht nicht mehr. Nötig wird eine Neufestlegung der Projektbasis; die Projektsteuerung bereitet die Vorlage für den Lenkungskreis vor, der Beschluss des Bauherrn steht noch aus.
      wenn: s5=B & kosten>61.3
    - text: Mit dem neuen Mehrbetrag liegt die Prognose über Basis plus Reserve (61,3 Mio. €) – die Reserve reicht nicht mehr. Die zurückgestellte Neufestlegung der Projektbasis wird jetzt nötig; die Projektsteuerung schreibt die vorliegende Vorlage mit dem Vergabeergebnis fort und legt sie dem Lenkungskreis erneut vor. Die Entscheidung bleibt offen.
      wenn: s5=C & kosten>61.3
    - text: Terminpuffer überschritten – die Inbetriebnahme zum Schuljahr 2028/29 ist nach heutigem Stand gefährdet, damit auch die Förderfrist.
      wenn: puffer<0
    - Der Einsatz der Risikoreserve braucht die Freigabe des Bauherrn.
  reaktion: Wie soll der Bauherr über die Reserve für den Holzbau entscheiden? Ihre Empfehlung geht an Dr. Olbers.
