titel: Was andere übernehmen können, was MVG hilft zu ordnen und was beim Bauherrn bleibt
alt: >-
  Die Abbildung zeigt, dass Arbeit an andere geht, MVG sie ordnet und die Entscheidungen beim Bauherrn bleiben. Drei
  Spalten mit zwei Pfeilen nach rechts: Links die Arbeit, die andere übernehmen können (Planer, Projektsteuerer, PMO,
  Gutachter, Berater; Analyse, Vorbereitung, Koordination, Dokumentation). In der Mitte MVG mit zehn Kacheln, von
  Zielsystem bis Befähigung. Rechts in Grün der Bauherr mit sieben Kacheln: Ziel, Mandat, Entscheidung, Freigabe,
  Risikoannahme, Datenstand, Nachweis.
