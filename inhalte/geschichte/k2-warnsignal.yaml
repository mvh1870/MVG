  titel: Was ist was?
  aufgabe: "Auf einer Baustelle passiert vieles gleichzeitig. Ordnen Sie jedem Satz zu, was er ist: Frühwarnung, Risiko, Problem, Änderung, Maßnahme oder Aufgabe."
  bild: notizzettel
  # heisst: Legende über den Karten, wörtlich aus den Erklärungen unten (R75; Belege v24:hb-1.1 bis hb-1.6)
