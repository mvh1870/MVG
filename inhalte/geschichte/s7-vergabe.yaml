vorlage:
  art: optionen
  frage: Wird die Risikoreserve für den Holzbau freigegeben?
  grund: |
    Die Freigabe des Einsatzes der Risikoreserve ist nicht delegierbar – sie liegt beim Bauherrn. Die Projektsteuerung bereitet sie vor; die Prüfung der Angebote liefert die Generalplanung. Verhandlungen über Nachträge und rechtliche Prüfungen gehören nicht zum Auftrag der Projektsteuerung.
  stelle: Bauherr – Dr. Miriam Olbers
  termin: 24. März 2027 (vor Ablauf der Bindefrist)
  verzug: Läuft die Bindefrist ab, müsste neu ausgeschrieben werden.
  muss: Alle Optionen sind vergaberechtlich zulässig.
  optionen:
    - id: A
      titel: Reserve freigeben und beauftragen
      text: 0,9 Mio. € aus der Risikoreserve; der Auftrag geht an das günstigste wertbare Angebot.
      punkte:
        kosten: [3, "Reserve sinkt um 0,9 Mio. €"]
        termin: [5, "kein Verzug"]
        qualitaet: [4, "wie geplant"]
        klima: [4, "Holzbau wie geplant"]
      folgen: {}
      konsequenz: Der Auftrag geht raus. Die Projektsteuerung dokumentiert die Freigabe mit Betrag und Bedingungen und führt die Restreserve im Datenstand.
    - id: B
      titel: Neu ausschreiben
      text: Die Ausschreibung wird aufgehoben und mit geänderten Losen neu durchgeführt.
      punkte:
        kosten: [4, "rund −0,3 Mio. € erwartet, unsicher"]
        termin: [1, "rund 42 Tage Verzug"]
        qualitaet: [4, "wie geplant"]
        klima: [4, "Holzbau wie geplant"]
      folgen: { kosten: -0.3, puffer: -42, offen: 1 }
      konsequenz: Die Projektsteuerung bereitet die neue Ausschreibung mit der Generalplanung vor und führt das Terminrisiko neu im Register.
    - id: C
      titel: Leistung reduzieren
      text: Die Sporthalle wird in Stahlbeton ausgeführt.
      punkte:
        kosten: [4, "rund −0,4 Mio. €"]
        termin: [3, "rund 14 Tage Umplanung"]
        qualitaet: [3, "Änderung der Planung"]
        klima: [1, "weniger Holz als im Klimaziel"]
      folgen: { kosten: -0.4, puffer: -14 }
      konsequenz: Die Projektsteuerung legt die Änderung an; der Holzbau wird für die Sporthalle neu vergeben.
  empfehlung:
    option: A
    text: Die Projektsteuerung empfiehlt, die Reserve freizugeben. Dafür ist sie da. Nachteil – die Restreserve schrumpft auf rund 2 Mio. €, und bis zur Fertigstellung ist noch viel offen.
folge: |
  Eine Freigabe zum Einsatz der Reserve ist kein Auftrag und keine Bestellung. Die Beauftragung läuft über den Vergabeweg; die Projektsteuerung verfolgt ihn und dokumentiert beides getrennt.
so-laeuft-es-oft: |
  Der Kostenplaner fällt aus, und mit ihm das Wissen: Welche Datei ist die richtige? Die Reserve wird nebenbei verbraucht, ohne dass der Bauherr je ausdrücklich zugestimmt hat.
einwand:
  frage: „Die Reserve ist doch dafür da – warum muss ich das freigeben?“
  antwort: Genau deshalb. Die Reserve ist Geld des Bauherrn für unbekannte Risiken. Wer sie ohne Freigabe verbraucht, nimmt Ihnen die Entscheidung, wofür sie da ist.
theorie: verantwortung
regie:
  notiz: Zwei Themen – Ausfall Holger Stein (kein Problem, weil alles in der Software liegt) und die nicht delegierbare Reserve.
  leitfragen:
    - Was passiert in Ihrem Projekt, wenn der Kostenplaner morgen ausfällt?
