titel: Vom Entscheidungsdruck über Grauzonen zur diffusen Verantwortung
alt: >-
  Kaskade von oben nach unten. Von drei Karten „Volatile Märkte – Kippende Annahmen“, „ESG & LCC – Späte
  Zielkonflikte“ und „Schlüsselrollen – Wissensverlust“ führen Pfeile ins Band „Entscheidungsdruck“, von dort ein
  Pfeil zum Feld „Fehlende Architektur“ mit den Symbolen Entscheidung, Freigabe, Dokumentation und Gremium.
  Gestrichelte Pfeile führen zu fünf Karten: „Rollen ohne Mandat“, „Risiken nicht entscheidungsreif“, „Changes ohne
  Schwellen“, „Parallele Datenstände“, „Gremien ohne Entscheidungsreife“. Alle außer der vierten Karte münden ins
  Band „Diffuse Verantwortung und Steuerbarkeit“.
