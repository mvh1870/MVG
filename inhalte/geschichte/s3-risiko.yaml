# R76: gekürzt, um die Ergänzung „oder abwarten“ in der Kurzfassung auszugleichen (Lesezeit ≤ 10,4 Minuten)
frage: "Die Projektsteuerin hat bewertet. Was machen Sie damit?"

antworten:
  - wertung: vertretbar
    text: Sie sagen der Bürgermeisterin sofort in zwei Sätzen Bescheid. Die Vorlage mit allen Wegen kommt erst in einem Monat in den regulären Lenkungskreis.
    balken: { geld: -1, zeit: -1, vertrauen: -1 }
    bild: kalender
    folge: |
      Die Bürgermeisterin weiß Bescheid und wartet auf die Vorlage. Einen Monat später ist die Lage dieselbe, nur die Zeit ist knapper. Sie entscheidet im Lenkungskreis wie empfohlen: früher ausschreiben, das Geld kommt aus der Reserve.

      Dann fragt sie: „Warum nicht gleich mit der Entscheidungsvorlage? Ein Monat ist bei so etwas viel.“ Die Holzelemente werden ausgeschrieben – einen Monat später, als es möglich gewesen wäre.
  - wertung: falle
    text: Sie warten mit der Meldung, bis der vierte Hersteller geantwortet hat – mit einer bestätigten Lieferzeit überzeugen Sie die Bürgermeisterin eher.
    balken: { geld: -2, zeit: -2, vertrauen: -2 }
    bild: telefon
    folge: |
      Clara Faden schüttelt freundlich den Kopf: „Ein vorrangiges Risiko melde ich sofort – nicht erst, wenn alles bestätigt ist.“ Sie setzt das Risiko auf die Tagesordnung des Lenkungskreises, und die Bürgermeisterin ruft an, bevor Sie es ihr erklären konnten: „Sie wollten damit warten? Was weiß ich sonst noch nicht?“

      Die Vorlage aber fehlt noch, weil Sie die Bestätigung abwarten wollten. Sie liegt erst sechs Wochen später auf dem Tisch. Dann entscheidet die Bürgermeisterin: früher ausschreiben, aus der Reserve – nur kostet es jetzt mehr, weil die Ausschreibung eilt.
  - wertung: gut
    text: "Sie sagen der Bürgermeisterin sofort Bescheid; die Vorlage – früher ausschreiben oder abwarten – liegt ihr diese Woche vor."
    balken: { geld: -1, zeit: 2, vertrauen: 1 }
    bild: stempel
    folge: |
      Die Bürgermeisterin liest die Vorlage am Abend: zwei Wege, nach vorher vereinbarten Gesichtspunkten verglichen, jeweils mit Kosten, Zeit und dem Risiko, das trotzdem bleibt, dazu die Empfehlung, früher auszuschreiben.

      Im Lenkungskreis wird kurz beraten, dann entscheidet sie: früher ausschreiben, das Geld kommt aus der Reserve. „Abwarten hieße, ich trage das Risiko. Das will ich nicht.“ Zwei Wochen später sind die Holzelemente ausgeschrieben, und Theo Lot streicht im Kalender ein dickes Fragezeichen durch.
    folge-kurz: |
      Die Bürgermeisterin liest die Vorlage am Abend: zwei Wege, nach vorher vereinbarten Gesichtspunkten verglichen, jeweils mit Kosten, Zeit und dem Risiko, das trotzdem bleibt, dazu die Empfehlung, früher auszuschreiben.

      Im Lenkungskreis wird kurz beraten, dann entscheidet sie: früher ausschreiben, das Geld kommt aus der Reserve. „Abwarten hieße, ich trage das Risiko. Das will ich nicht.“ Zwei Wochen später sind die Holzelemente ausgeschrieben.

gut: |
  Ein Risiko wird danach eingestuft, wie wahrscheinlich es ist und wie schwer seine schlimmste nachweisbare Folge wäre. Ist beides hoch, ist das Risiko vorrangig: Es wird zuerst bearbeitet, und die Bürgermeisterin erfährt es sofort, nicht erst im nächsten Bericht.

  Ob die Stadt ein großes Risiko trägt oder Geld aus der Reserve dagegen einsetzt, entscheidet die Bürgermeisterin – nicht der Architekt, nicht die Projektsteuerin und auch nicht Sie.

gut-kurz: |
  Ein Risiko wird nach Wahrscheinlichkeit und Schwere der schlimmsten nachweisbaren Folge eingestuft. Ist beides hoch, ist es vorrangig, wird zuerst bearbeitet und der Bürgermeisterin sofort gemeldet. Ob die Stadt ein großes Risiko trägt oder Geld aus der Reserve dagegen einsetzt, entscheidet die Bürgermeisterin – nicht der Architekt, nicht die Projektsteuerin und auch nicht Sie.

dahinter: "Die Bewertung macht aus einer Sorge eine Rangfolge: Was vorrangig ist, wird zuerst bearbeitet – und wer ein Risiko in Kauf nimmt, muss das ausdrücklich entscheiden."

regie:
  notiz: "Kern: Was vorrangig ist, erfährt der Bauherr umgehend, nicht erst im nächsten Bericht; ob die Stadt ein großes Risiko trägt oder Reserve einsetzt, entscheidet die Bürgermeisterin selbst."
  leitfragen:
    - Wann erfährt bei Ihnen der Bauherr von einem vorrangigen Risiko – sofort oder im nächsten Bericht?
    - Wer entscheidet bei Ihnen, ob ein großes Risiko getragen wird?
