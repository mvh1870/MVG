# Rahmen der Story (P17.5, Drehbuch docs/DREHBUCH.md Abschnitte 1–3, 6): Auftakt, Figuren, Balken, Bilanz,
# Kärtchen „Wer entscheidet was“ und Ende. Format: docs/INHALTSFORMAT.md Abschnitt 3.
# Belege des Mandats (intern): k3.2-t1, k4.2-p1, k4.2-p3, k9.3-p3, v24:hb-1, v24:hb-projektblatt, v24:va-4.1

titel: Ein Schulcampus für Lindenhall

auftakt:
  campus: { stufe: 0, jahreszeit: winter, licht: morgen }
  text: |
    Ein fiktiver Fall: Die Stadt Lindenhall baut im Süden der Stadt eine Gesamtschule, eine Grundschule und eine Sporthalle. Sie leiten das Projekt für die Stadt. Im Sommer 2028 sollen die Kinder einziehen.

    Es ist kein echtes Projekt, aber es könnte eines sein: Die Fragen, die hier auftauchen, stellen sich auf vielen Baustellen.

    Unterwegs müssen Sie sich achtmal entscheiden. Ihre Antworten bewegen drei Balken: Geld, Zeit und Vertrauen. Am Ende sehen Sie, wie Ihr Projekt ausgegangen ist.
  vorstellung: "Diese fünf Menschen begleiten Sie:"
  los: Los geht's
  kurz: Kurzfassung (etwa 10 Minuten)

sie:
  steckbrief: Sie leiten das Projekt für die Stadt. Sie pflegen keine Listen – Sie entscheiden, was in Ihrem Rahmen liegt, und bringen alles andere rechtzeitig zur Bürgermeisterin.

figuren:
  - id: grundstein
    name: Gisela Grundstein
    rolle: Bürgermeisterin
    akzent: violett
    steckbrief: "Sie entscheidet für die Stadt die großen Dinge: was zuerst kommt, jede Freigabe, jeden Griff in die Reserve. Der Lenkungskreis berät sie – entscheiden tut sie."
  - id: faden
    name: Clara Faden
    rolle: Projektsteuerin
    akzent: lagune
    steckbrief: "Sie hält alle Fäden zusammen: Sie erfasst und pflegt jeden Vorgang, prüft jede Woche alles Offene und bereitet jede Entscheidung vor – mit mindestens zwei Wegen und einer Empfehlung. Entscheiden darf sie nicht."
  - id: schwung
    name: Konrad Schwung
    rolle: Architekt
    akzent: blau
    steckbrief: Er plant den Campus von der ersten Linie bis zur letzten Fuge. Er findet für alles eine Lösung – manchmal schneller, als ihm lieb sein sollte.
  - id: klingel
    name: Hanna Klingel
    rolle: Schulleiterin
    akzent: orange
    steckbrief: Sie weiß, was die Kinder brauchen – und sie will viel davon. Jeder Wunsch hat einen guten Grund; nicht jeder passt ins Budget.
  - id: lot
    name: Theo Lot
    rolle: Bauleiter
    akzent: sonne
    steckbrief: Er ist jeden Tag auf der Baustelle und kennt jede Schraube. Schreiben findet er lästig – bauen nicht.

# Start intern: Geld 9, Zeit 6, Vertrauen 4 (L-225); Wirkung je Antwort −2 … +2, begrenzt auf 0–10
balken:
  geld:
    titel: Geld
    text: Wie viel vom Budget und von der Reserve noch für Unvorhergesehenes übrig ist.
    start: 9
    mehr: mehr übrig
    weniger: weniger übrig
    bilanz:
      hoch: Die Reserve wurde dort eingesetzt, wo sie gebraucht wurde – jedes Mal von der Bürgermeisterin entschieden –, und ein guter Teil ist übrig.
      mittel: Ein großer Teil der Reserve ist verbraucht; manches wurde teurer, weil es spät entschieden wurde.
      niedrig: Die Reserve ist fast aufgebraucht – Eile, Umwege und eine halb eingerechnete Forderung haben sie aufgezehrt.
  zeit:
    titel: Zeit
    text: Wie viel Luft bis zum Schulstart im Sommer 2028 bleibt.
    start: 6
    mehr: mehr Luft
    weniger: weniger Luft
    bilanz:
      hoch: Der Puffer hat gehalten; das Projekt hatte bis zum Schluss Luft.
      mittel: Der Puffer ist dünn geworden, aber er hat gereicht.
      niedrig: Der Puffer ist aufgebraucht; die Sporthalle öffnet erst nach den Herbstferien.
  vertrauen:
    titel: Vertrauen
    text: Wie sehr sich Bürgermeisterin, Schule und Stadtrat auf Ihre Vorlagen verlassen.
    start: 4
    mehr: gestiegen
    weniger: gesunken
    bilanz:
      hoch: Bürgermeisterin, Schule und Stadtrat haben sich auf Ihre Vorlagen verlassen können.
      mittel: Man vertraut Ihnen – fragt aber gern noch einmal nach.
      niedrig: Die Bürgermeisterin lässt sich inzwischen jede Zahl zweimal zeigen.

# Prüfreihenfolge fest in src/geschichte/engine.ts (bilanzTyp): Vertrauen niedrig · Zeit niedrig · ruhig · alle anderen
bilanz:
  nicht-getragen:
    titel: Gebaut, aber nicht getragen
    text: "Die Gebäude stehen, doch das Vertrauen hat gelitten: Zu oft hat die Bürgermeisterin Dinge zu spät oder auf Umwegen erfahren. Ein Projekt braucht nicht nur Holz und Beton, sondern Entscheidungen, auf die sich alle verlassen können."
  letzte-meter:
    titel: Auf den letzten Metern
    text: Die Schule hat geöffnet, aber der Puffer war am Ende aufgebraucht. Abwarten fühlt sich vorsichtig an – auf einer Baustelle kostet es fast immer Zeit.
  ruhig:
    titel: Ruhig ins Ziel
    text: Die Kinder sind pünktlich eingezogen, und jede große Entscheidung lag dort, wo sie hingehört. Sie haben früh gefragt, vollständig vorgelegt und nichts versteckt – so bleibt ein Projekt steuerbar, auch wenn es stürmt.
  umwege:
    titel: Geschafft – mit Umwegen
    text: Der Campus steht, die Kinder sind da – aber manches hat länger gedauert oder mehr gekostet als nötig. Wo eine Frage später als möglich an die richtige Stelle kam, hat das Projekt dafür bezahlt.

mandat:
  titel: Wer entscheidet was
  zeilen:
    - { wer: Sie, text: "Entscheidungen bis 100.000 Euro, wenn das Budget sie ohne Reserve trägt." }
    - { wer: Bürgermeisterin, text: "alles darüber · jeder Griff in die Reserve · ob die Stadt ein großes Risiko trägt · jede Freigabe am Ende eines großen Planungs- oder Bauabschnitts (Fachleute sagen: Leistungsphase) · was zuerst kommt: der Schulstart, dann das Geld." }
    - { wer: Lenkungskreis, text: "berät die Bürgermeisterin." }
    - { wer: Projektsteuerin, text: "bereitet alles vor, pflegt alle Vorgänge, empfiehlt – entscheidet nie." }

ende:
  zeit: Ende August 2028
  campus: { stufe: 8, jahreszeit: sommer, licht: morgen }
  einstieg: |
    Ende August 2028, halb acht am Morgen. Der erste Schulbus hält an der neuen Haltestelle, die Sonne steht noch tief über den Linden. Kinder mit Schultüten und viel zu großen Ranzen laufen über den Schulhof, die Eltern hinterher. Am gemeinsamen Haupteingang des Campus hängen Luftballons, und neben der Tür stehen die fünf, die diesen Campus zweieinhalb Jahre lang begleitet haben – und Sie.
  szene:
    - { figur: klingel, zusatz: läutet ihre Glocke, text: "Guten Morgen! Willkommen in eurer Schule!" }
    - { figur: lot, text: "Steht alles drin, was wir hier gemacht haben. Hätte ich vor zwei Jahren nicht gedacht, dass ich das mal gut finde." }
    - { figur: schwung, text: "Und beim nächsten Mal sag ich's gleich, wenn was klemmt. Ehrenwort." }
    - { figur: faden, text: "Alles Offene ist übergeben, mit Namen und Termin. Verschwunden ist nichts." }
    - { figur: grundstein, text: "Wissen Sie, was das Beste war? Ich wusste jedes Mal, worüber ich entscheide." }
  zeit-niedrig: Nur die Sporthalle bleibt noch zu – sie wird erst nach den Herbstferien fertig. Bis dahin turnen die Kinder in der alten Halle.
  vertrauen-niedrig: { figur: grundstein, text: "Beim nächsten Projekt reden wir früher miteinander. Versprochen?" }
