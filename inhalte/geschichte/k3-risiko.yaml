einstieg: |
  April 2026. Die Bagger sind da, die Baugrube wird jeden Tag tiefer, und die Linden am Rand treiben aus. Die Antwort der Hersteller liegt auf dem Tisch: eine Mappe mit drei Schreiben, daneben ein Kalender, auf dem jemand den Sommer 2028 dick eingekreist hat.

einstieg-kurz: |
  April 2026. Auf dem Tisch liegt die Antwort der Hersteller auf die Prüffrage.

szene:
  - { figur: schwung, text: "Drei von vier Herstellern brauchen jetzt ein halbes Jahr statt vier Monate. Vielleicht wird es ja wieder besser." }
  - { figur: faden, text: "Ich habe es als Risiko bewertet. Wie wahrscheinlich ist es? Hoch. Wie schlimm, wenn es so kommt? Dann fangen die Holzbauer bis zu zehn Wochen später an, und der Schulstart wackelt." }
  - { figur: lot, kurzfassung: false, text: "Zehn Wochen. Die holt keiner rein, ich auch nicht." }
  - { figur: schwung, text: "Wir könnten auch einfach hoffen. Hat schon oft geklappt." }
  - { figur: faden, text: "Hoffen ist kein Weg. Abwarten schon – aber dann muss die Bürgermeisterin entscheiden, dass die Stadt das Risiko trägt." }
  - { figur: faden, text: "Hoch und schwer zusammen heißt: vorrangig bearbeiten. Es gibt einen Ausweg – die Holzelemente in einem eigenen Paket früher ausschreiben. Das kostet rund 150.000 Euro." }
  - { figur: klingel, text: "Bitte sagen Sie mir nicht, dass meine Schule im Sommer 2028 noch in Containern sitzt." }

frage: "Die Projektsteuerin hat bewertet, was sich bewerten lässt. Was jetzt geschieht, liegt bei Ihnen: Was machen Sie mit dieser Einschätzung?"

antworten:
  - wertung: vertretbar
    text: Sie sagen der Bürgermeisterin sofort in zwei Sätzen Bescheid. Die Vorlage kommt in einem Monat in den regulären Lenkungskreis.
    balken: { geld: -1, zeit: -1, vertrauen: -1 }
    bild: kalender
    folge: |
      Die Bürgermeisterin weiß Bescheid und wartet auf die Vorlage. Einen Monat später ist die Lage dieselbe, nur die Zeit ist knapper. Sie entscheidet im Lenkungskreis wie empfohlen: früher ausschreiben, das Geld kommt aus der Reserve.

      Dann fragt sie: „Warum nicht gleich mit Vorlage? Ein Monat ist bei so etwas viel.“ Die Holzelemente werden ausgeschrieben – einen Monat später, als es möglich gewesen wäre.
  - wertung: falle
    text: Sie warten mit der Meldung, bis ein zweiter Holzbauer die Einschätzung bestätigt – vielleicht entspannt sich die Lage.
    balken: { geld: -2, zeit: -2, vertrauen: -2 }
    bild: telefon
    folge: |
      Clara Faden schüttelt freundlich den Kopf: „Was vorrangig ist, melde ich gleich – nicht erst, wenn es bestätigt ist.“ Sie setzt das Risiko auf die Tagesordnung des Lenkungskreises, und die Bürgermeisterin ruft an, bevor Sie es ihr erklären konnten: „Sie wollten damit warten? Was weiß ich sonst noch nicht?“

      Die Vorlage aber fehlt noch, weil Sie die Bestätigung abwarten wollten. Sie liegt erst sechs Wochen später auf dem Tisch. Dann entscheidet die Bürgermeisterin: früher ausschreiben, aus der Reserve – nur kostet es jetzt mehr, weil die Ausschreibung eilt.
  - wertung: gut
    text: "Sie sagen der Bürgermeisterin sofort Bescheid; die Vorlage – früher ausschreiben oder abwarten – liegt ihr diese Woche vor."
    balken: { geld: -1, zeit: 2, vertrauen: 1 }
    bild: stempel
    folge: |
      Die Bürgermeisterin liest die Vorlage am Abend: zwei Wege, nach den abgestimmten Gesichtspunkten verglichen, jeweils mit Kosten, Zeit und dem, was an Risiko übrig bleibt, dazu die Empfehlung, früher auszuschreiben.

      Im Lenkungskreis wird kurz beraten, dann entscheidet sie: früher ausschreiben, das Geld kommt aus der Reserve. „Abwarten hieße, ich trage das Risiko. Das will ich nicht.“ Zwei Wochen später sind die Holzelemente ausgeschrieben, und Theo Lot streicht im Kalender ein dickes Fragezeichen durch.

gut: |
  Ein Risiko wird danach eingestuft, wie wahrscheinlich es ist und wie schwer die schlimmste belegte Folge wiegt; was vorrangig ist, erfährt der Bauherr umgehend, nicht erst im nächsten Bericht. Ob die Stadt ein großes Risiko trägt oder Geld aus der Reserve dagegen einsetzt, entscheidet die Bürgermeisterin – nicht der Architekt, nicht die Projektsteuerin und auch nicht Sie.

dahinter: "Die Bewertung macht aus einer Sorge eine Rangfolge: Was vorrangig ist, wird zuerst bearbeitet – und wer ein Risiko tragen will, muss das ausdrücklich entscheiden."

regie:
  notiz: "Kern: Was vorrangig ist, erfährt der Bauherr umgehend, nicht erst im nächsten Bericht; ob die Stadt ein großes Risiko trägt oder Reserve einsetzt, entscheidet die Bürgermeisterin selbst."
  leitfragen:
    - Wann erfährt bei Ihnen der Bauherr von einem vorrangigen Risiko – sofort oder im nächsten Bericht?
    - Wer entscheidet bei Ihnen, ob ein großes Risiko getragen wird?
