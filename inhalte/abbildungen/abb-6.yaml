id: abb-6
quelle: bilder/image6.png
titel: Sechs Verantwortungsfelder des Bauherrn
alt: >-
  Die Abbildung zeigt die sechs Verantwortungsfelder des Bauherrn rund um den Kern von MVG. Jedes Feld nennt vier
  Stichworte, zum Beispiel beim Feld Ziel: Zielsystem, Abwägungsregeln, Freigabelogik. Die Felder: Ziel, Mandat,
  Entscheidung, Risikoannahme, Freigabe sowie Datenstand und Nachweis. Dazu kommen Haftnotizen.
