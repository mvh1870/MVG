abweichungen:
  # P16.4 (O-36, O-38): Abweichungen gemessen am Thema „Arbeitsweise“ in der Fassung nach V2.4. Interne Bezüge zu V2.4
  # (nur hier, nie sichtbar): Wege der Vorgänge v24:hb-1.2, v24:hb-1.3, v24:hb-1 (Abs. 6); Maßnahme und Wirkung v24:hb-1.6,
  # v24:hb-3; Problem v24:hb-1.4; Änderung v24:hb-1.5; Monatsbericht v24:hb-4; Fachbeiträge v24:hb-1 (Abs. 1).
  # Die Felder „beleg“ nennen die nächstliegenden V1.2-Absätze (das Schema verlangt Absatz-IDs).
  - text: 'Im Bild führt aus der Frühwarnung nur die Kante „wird zu, bestätigt“ zum Risiko. Nach dem Text wird eine Frühwarnung nach ihrer Klärung als Risiko bewertet, als Problem bearbeitet, als Aufgabe weitergeführt oder begründet geschlossen; die Herkunft bleibt verknüpft.'
    beleg: k6.4.3-p2
  - text: 'Ein gestrichelter Pfeil „Indicator“ führt vom Risiko zurück zur Frühwarnung; der Text schließt diese Richtung aus. Eine überschrittene Schwelle ist ein neuer Hinweis und wird als neue Frühwarnung geklärt; ändern sich die Grundlagen eines bestehenden Risikos, wird seine Bewertung begründet fortgeschrieben.'
    beleg: k6.4.3-p2
  - text: 'Vom Band „Schwellenwert löst Frühwarnung aus“ zeigt ein gestrichelter Pfeil in „CTC / Prognose“ hinein; im Text ist die überschrittene Schwelle der Ausgangspunkt, aus dem eine neue Frühwarnung entsteht.'
    beleg: k6.4.3-p2
  - text: 'Aufgaben kommen im Bild nicht vor. Nach dem Text ist die Aufgabe eine eigene Vorgangsart; auch aus ihr kann Entscheidungsbedarf entstehen, und Aufgaben, Probleme und Änderungen werden auch ohne Risikoeintrag bearbeitet.'
    beleg: k6.4.3-p2
  - text: 'Vom Problem führt nur „eskaliert“ ins Entscheidungsregister, und vom Risiko führt keine Kante zum Problem. Nach dem Text wird aus einem eingetretenen Risiko ein Problem; beim Problem werden Folgen geklärt, die Lösung organisiert und nachgewiesen und gegebenenfalls eine Entscheidung vorbereitet.'
    beleg: k6.4.4-t1
  - text: 'Die Rückkante von der Maßnahme zum Risiko heißt „Risikominderung (Regelkreis schließt)“. Nach dem Text senkt eine nur geplante Maßnahme die Bewertung nicht; erst die belegte Wirkung zählt, und umgesetzt ist noch nicht wirksam.'
    beleg: k6.4.4-t1
  - text: 'Den „Managementbericht“ erreicht im Bild nur die gestrichelte Berichtskante aus der Freigabe. Der Text nennt den Monatsbericht: höchstens eine Seite über alle Vorgangsarten, aus demselben Informationsstand wie die Software, ohne zweite Liste.'
    beleg: k6.4.3-p1
  - text: 'Die Maßnahme trägt den Zusatz „Maßnahme mit Frist“ und entsteht im Bild neben den „Auflagen“ der Freigabe auch direkt aus der Entscheidungsvorlage („erzeugt“). Nach dem Text folgt eine Maßnahme aus einer Entscheidung dem Beschluss der befugten Stelle, nicht der Vorlage; sie wird mit Verantwortlichem und Frist verfolgt, bis die Wirkung belegt ist.'
    beleg: k6.4.3-p2
  - text: 'Von der Entscheidungsvorlage führt eine Lebenszyklus-Kante „führt zu“ zur Änderung; der Text nennt nur die Gegenrichtung – aus Änderungen kann Entscheidungsbedarf entstehen. Eine Änderung wird gegen den geltenden Stand aufbereitet; bis zur Freigabe gilt die bisherige Grundlage.'
    beleg: k6.4.3-p2 k6.4.4-t1
  - text: 'Die Zusätze an den Knoten weichen vom Text ab: „schwaches Signal“ (Text: noch ungeklärter Hinweis), „bewertet (P-A)“ (mögliches Ereignis, bewertet nach Wahrscheinlichkeit und Auswirkung), „akutes Problem“ (eingetretener Zustand) und „Änderungsantrag“ (bewusste Anpassung einer geltenden Vorgabe).'
    beleg: k6.4.4-t1
  - text: 'Aus der Entscheidungsvorlage führt im Bild nur „reif“ zur „Freigabe (LPH 0–9)“. Nach dem Text entscheidet die befugte Stelle nach ihrem Mandat – Bauherren-PL, Änderungsgremium oder Bauherr im Lenkungskreis. Die Freigabe am Abschluss einer Leistungsphase ist nur einer dieser Beschlüsse und wird vom Bauherrn selbst erteilt.'
    beleg: k6.4.5-p1 k13-t1
  - text: 'Der Knoten heißt „CTC / Prognose – Kostenprognose“; der Text führt Kostenprognose und Restkosten (CTC) als Fachbeiträge, die die Projektsteuerung bei den zuständigen Stellen anfordert.'
    beleg: k6.4.2-t1 k13-t1
  - text: 'Der Knoten „Entscheidungsvorlage“ ist im Bild als „Entscheidung-svorlage“ falsch getrennt.'
    beleg: k6.4.4-t1 k13-t1
