id: abb-8
quelle: bilder/image8.jpeg
titel: LPH 0 als früher Wirkungsraum
alt: >-
  In der Mitte ein Kreis mit „LPH0“, ringsum sechs Karten, durch Pfeile mit ihm verbunden. Oben links „Zielsystem“:
  Capex, Termin, Qualität, ESG, LCC, Schieberegler, „Kompromisse“. Oben rechts „RACI“: Matrix R, A, C, I für drei
  Rollen, dazu „Mandate“ und „Freigaben“. Links „Governance“: Pyramide mit Lenkungsebene, Projektebene, Fachebene,
  darunter Rhythmus und Standardagenda. Rechts „Freigabe“: Tor, „Entscheidungsreife“, Prüfliste. Unten links
  „Risikoregister“: Liste, „Änderungssteuerung“ und „Frühwarnung“ mit Rundumlicht. Unten rechts „KPI-System“:
  Diagramme und „Nachweisführung“.
angeglichen: []
abweichungen:
  - text: 'Im Kreis steht „LPH0“; der Text schreibt LPH 0.'
    beleg: k5.4-p1
  - text: 'Die sechs Karten heißen Zielsystem, RACI, Governance, Freigabe, Risikoregister und KPI-System; der Text nennt als das, was in LPH 0 früh angelegt werden kann, Zielsystem, Mandatslogik, Leistungsphasen- und Freigabemodell, Datenstandslogik und erste Entscheidungsstandards. Governance, Risikoregister und KPI-System nennt er dort nicht; Datenstandslogik und erste Entscheidungsstandards fehlen im Bild.'
    beleg: k5.4-p1
  - text: 'Die Karte „Zielsystem“ zeigt Capex, Termin, Qualität, ESG, LCC und „Kompromisse“; der Text nennt Zielsystem und Abwägungsregeln, die festlegen, was Vorrang hat, wenn Kosten, Termine, Qualität, ESG, LCC, Risiko und Nutzwert kollidieren. Im Bild steht Capex statt Kosten, Risiko und Nutzwert fehlen, und statt Abwägungsregeln steht „Kompromisse“.'
    beleg: k5.2-t1
  - text: 'Die Karte „RACI“ zeigt eine Rollenmatrix mit „Mandate“ und „Freigaben“. RACI ist im Text die Rollen- und Zuständigkeitsmatrix; als das, was in LPH 0 früh angelegt werden kann, nennt er aber die Mandatslogik, und sein Baustein „Rollen und Mandate“ übersetzt Rollen in Befugnisse, Schwellen, Stellvertretungen, Freigaben und Eskalationswege. Befugnisse, Schwellen, Stellvertretungen und Eskalationswege stehen nicht im Bild.'
    beleg: k5.4-p1 k5.2-t1 k13-t1
  - text: 'In der RACI-Matrix der Karte ist „A“ in zwei der drei Zeilen gesetzt und „I“ in keiner, sodass zwei Rollen letztverantwortlich erscheinen; der Text versteht RACI als Matrix mit ausführungsverantwortlichen, letztverantwortlichen, konsultierten und informierten Rollen, und das Modell macht sichtbar, wann die Entscheidung an die letztverantwortliche Bauherrenrolle zurückfallen muss.'
    beleg: k13-t1 k9.2-p2
  - text: 'Die Karte „Freigabe“ zeigt ein Tor, „Entscheidungsreife“ und eine Prüfliste; auf der Karte selbst steht keine Leistungsphase. Der Text spricht vom Leistungsphasen- und Freigabemodell und versteht die Freigabe als Entscheidung des Bauherrn am Abschluss einer Leistungsphase. Die Freigabe verbindet bei ihm Freigabereife, Mandat, Datenstand und Nachweis; Entscheidungsreife bestimmt er allgemein für Entscheidungen auf der zuständigen Mandatsebene. Für LPH 0 lautet die Freigabefrage: „Sind Bedarf, Zielbild und Auftrag geklärt – gibt es eine legitimierte Grundlage für den Planungsstart?“'
    beleg: k5.4-p1 k13-t1 k9.3-t1
  - text: 'Die Karte „Governance“ zeigt eine dreistufige Pyramide mit Lenkungsebene, Projektebene und Fachebene sowie Rhythmus und Standardagenda; Lenkungsebene, Fachebene und Standardagenda sind keine Begriffe des Texts, er spricht vom Lenkungskreis. Die drei Ebenen, die der Text unterscheidet, heißen Arbeitsebene, Mandatsebene und Letztverantwortung. Beim frühen Wirkungsraum LPH 0 nennt er unter den Ursachen späterer Kosten-, Termin-, Qualitäts- und Freigaberisiken, dass Gremienlogik und Projektlogik auseinanderlaufen.'
    beleg: k3.3-p1 k3.3-t1 k6.4.5-p1 k5.4-p2
  - text: 'In der Karte „Risikoregister“ stehen „Änderungssteuerung“ und „Frühwarnung“ (mit Rundumlicht); der Text trennt die Register: Frühwarnung als unbewertetes Signal, Risikoregister als bewertetes mögliches Ereignis, Änderungsregister als gewollte Änderung. Risiken, Änderungen, Maßnahmen und Entscheidungen verbindet er über die Risiko-/Änderungs-/Maßnahmenverknüpfung.'
    beleg: k6.4.4-t1 k13-t1 k5.2-t1
  - text: 'Die Karte „KPI-System“ zeigt Diagramme und „Nachweisführung“; „KPI-System“ ist kein Begriff des Texts. Er spricht von Leistungskennzahlen (KPI), die der verdichteten Beurteilung von Leistung und Steuerungsbedarf dienen, und verbindet sie nirgends mit der Nachweisführung; diese nennt er unter anderem beim Leistungsphasen- und Freigabemodell, und die Datenstands- und Nachweislogik ist bei ihm ein eigener Baustein.'
    beleg: k13-t1 k1.3-t1 k5.2-t1
