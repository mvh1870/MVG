# 13 · Beschluss und Nachweis (Drehbuch v2, Akt III, Station 13) – neu
# Rückblick in der Haushaltsberatung; das Entscheidungsbuch ist voll: wer wann auf welchem Stand entschieden hat – und was nicht beschlossen wurde.
# Kleiner Rückschlag unabhängig von der Antwort: Die schriftliche Bestätigung der Brandschutzbehörde fehlt am Morgen noch im Buch und trifft nachmittags ein.
# Lernziel: Schweigen ist kein Beschluss; ein Beschluss wird getrennt festgehalten, mit Quelle, Datum und Bedingungen. Kein Geld-Plus.
# Die Presse ist Kulisse: Der „Lindenbote“ kommt nur im Echo vor (ein Ratsmitglied liest ihn); keine Regel zur Außenkommunikation (L-273).
# Erzählbrücke 12 → 14: der Einstieg sagt, dass die Wochendurchsicht läuft und die Bürgermeisterin nur gefragt wird, wenn ihre Grenzen es verlangen.
# Belege (intern):
#  - Beschluss getrennt dokumentiert (Quelle, Datum, Inhalt, Bedingungen); Schweigen, Empfehlung, Softwarestatus sind kein Beschluss: v24:hb-3.1 (letzter Absatz), v24:va-3.5, v24:va-4.2
#  - Bei ausbleibender Entscheidung: Folgen und neuer Klärungstermin: v24:hb-3.1, v24:va-3.5
#  - Nachweisfähigkeit und Beschlusslage gehören zur Letztverantwortung des Bauherrn: k3.3-t1, k4.3-p2, k4.6-p1, k4.6-p2, k9.4-l1
#  - Zusage im Flur ist kein Beschluss; bis zur Freigabe gilt die bisherige Grundlage; abgelehnte Anträge bleiben nachvollziehbar: v24:hb-1.5, k4.3-p2
#  - Wirkung einer Maßnahme wird belegt, nicht angenommen; Problem mit fachlicher Bestätigung schließen: v24:hb-1.4, v24:hb-1.6, v24:hb-3
#  - Das Buch führt die Projektsteuerin; die Projektleitung legt vor, die Projektsteuerung bereitet vor: v24:hb-3.1, v24:va-3.5, v24:tlb-2, k9.3-p3 (V2.4 gilt, O-36)
#  - Wochendurchsicht; die Bürgermeisterin nur bei Überschreitung ihrer Grenzen: v24:hb-4 Abs. 2, k4.2-p2, v24:hb-projektblatt
#  - Fugen im Hallenboden: offener Punkt, mit Frist und Namen übergeben (Ausblick auf 14): v24:hb-5 Abs. 6
nr: 13
titel: Beschluss und Nachweis
zeit: November 2027
# Zwischenbild: alle drei Gebäude außen fertig, Lichter in den Fenstern, nasses Laub, Handwerkercontainer, Außenanlagen ausgesteckt; Nebel dämpft das Abendlicht
